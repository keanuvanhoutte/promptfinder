<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --surface-2:#F6F8F9; --ink:#15202A; --muted:#5A6874; --line:#D5DDE2;
  --accent:#0B7A83; --accent-ink:#FFFFFF; --accent-soft:#DCEFF0;
  --code-bg:#121B23; --code-ink:#DCE7EF; --code-dim:#7C8C99;
  --warn:#9A5B00; --warn-soft:#FBEFD9; --bad:#B3261E; --good:#1E7A46;
  --shadow:0 1px 2px rgba(16,32,44,.06),0 4px 14px rgba(16,32,44,.06);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1419; --surface:#151F27; --surface-2:#1A262F; --ink:#E4ECF1; --muted:#90A0AC; --line:#26343F;
    --accent:#3BBFC8; --accent-ink:#06282B; --accent-soft:#12343A;
    --code-bg:#0A1116; --code-ink:#DCE7EF; --code-dim:#6F8190;
    --warn:#F0B35A; --warn-soft:#3A2B12; --bad:#FF8A80; --good:#6FD39A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1419; --surface:#151F27; --surface-2:#1A262F; --ink:#E4ECF1; --muted:#90A0AC; --line:#26343F;
  --accent:#3BBFC8; --accent-ink:#06282B; --accent-soft:#12343A;
  --code-bg:#0A1116; --code-ink:#DCE7EF; --code-dim:#6F8190;
  --warn:#F0B35A; --warn-soft:#3A2B12; --bad:#FF8A80; --good:#6FD39A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}

/* ---------- Top: brand + tabs ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;gap:12px;padding:10px 16px 0;max-width:1100px;margin:0 auto}
.brand{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.brand .caret{color:var(--accent)}
.brand .logo{width:26px;height:26px;flex:0 0 auto;margin-right:2px}
.brandrow .spacer{flex:1}
.storage{font-size:12px;color:var(--muted)}
.claudest{font-size:12px;color:var(--muted);white-space:nowrap}
.claudest.st-granted{color:var(--good)}
.claudest.st-prompt,.claudest.st-denied{color:var(--warn)}
@media (max-width:520px){.storage{display:none}}
.iconbtn{border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;font-size:13px}
.iconbtn:hover{background:var(--surface);border-color:var(--line);color:var(--ink)}
.tabs{display:flex;align-items:flex-end;gap:2px;padding:8px 16px 0;max-width:1100px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 14px 10px;border:1px solid transparent;border-bottom:none;border-radius:10px 10px 0 0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;position:relative;top:1px;white-space:nowrap}
.tab:hover{background:color-mix(in srgb,var(--surface) 60%,transparent);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink)}
.tab .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent));flex:0 0 auto}
.tab .count{font-size:11px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.tab.add{color:var(--muted);font-weight:500;padding-inline:12px}
.subtabs{display:flex;align-items:center;gap:6px;padding:8px 16px;max-width:1100px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs[hidden]{display:none!important}
.subbar{background:var(--surface);border-top:1px solid var(--line)}
.stab{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.stab:hover{color:var(--ink);border-color:var(--c,var(--accent))}
.stab[aria-selected="true"]{background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);border-color:var(--c,var(--accent));color:var(--ink)}
.stab .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent))}
.stab .count{font-size:11px;font-weight:500;color:var(--muted)}
.stab.add{border-style:dashed;font-weight:500}
.stab.dragging,.tab.dragging{opacity:.4}
.stab.dropbefore{box-shadow:-3px 0 0 var(--accent)}
.tab.nohit,.stab.nohit{opacity:.45}
.subhint{font-size:12px;color:var(--muted);white-space:nowrap;margin-left:4px}

/* ---------- Main ---------- */
main{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
.searchwrap{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.search{flex:1 1 320px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 8px 0 16px;box-shadow:var(--shadow);min-height:48px}
.search:focus-within{border-color:var(--accent)}
.search svg{flex:0 0 auto;color:var(--muted)}
.search input{flex:1;min-width:0;border:none;background:transparent;outline:none;font-size:16px;padding:12px 0}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{border:none;background:transparent;color:var(--muted);padding:6px 8px;border-radius:999px}
.searchopts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);user-select:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Drop zone */
.drop{border:1.5px dashed var(--line);border-radius:14px;background:var(--surface-2);padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .txt{flex:1 1 260px;min-width:0}
.drop .txt b{display:block;font-size:14px}
.drop .txt span{font-size:13px;color:var(--muted)}
.kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:none;background:transparent;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* Review */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.panel-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{font-size:15px;margin:0;flex:1 1 auto}
.panel-b{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.qlist{gap:14px}
.job{display:flex;flex-direction:column;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.job:last-child{border-bottom:none;padding-bottom:0}
.jhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.jthumb{height:56px;width:auto;max-width:120px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:0 0 auto}
.jthumb.ph{width:80px;display:grid;place-items:center;font-size:11px;color:var(--muted);background:var(--surface-2)}
.jinfo{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:3px}
.jacts{display:flex;gap:6px;flex-wrap:wrap}
.chip{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:1px 8px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.s-bezig{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.s-klaar{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chip.s-fout{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.jthumb.deck{width:56px;display:grid;place-items:center;background:#C4502A;color:#fff;font-family:var(--mono);font-weight:700;font-size:11px;border:none}
.jtitle{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.jname{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.rows{display:flex;flex-direction:column;gap:10px}
.rrow.dupe{background:transparent;border-style:dashed}
.rrow.dupe.off{opacity:.85}
.exs{display:flex;flex-direction:column;gap:6px}
.alts{display:flex;flex-direction:column;gap:6px;border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.alt{display:flex;flex-direction:column;gap:2px}
.alt .cmd{margin:0}
.exlabel{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.ex{border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 8px 8px 0;padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.excmd{display:flex;gap:6px;font-family:var(--mono);font-size:12.5px;min-width:0}
.excmd .ps{color:var(--muted)}
.excmd code{white-space:pre-wrap;word-break:break-word;font-family:inherit}
.exout{margin:0;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:pre-wrap;word-break:break-word;max-height:9em;overflow:auto}
.exnote{margin:0;font-size:13.5px}
.exmeta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.linkbtn{border:none;background:none;padding:0;color:var(--accent);font-weight:600;font-size:12px;text-decoration:underline;text-underline-offset:2px}
.linkbtn.danger{color:var(--bad)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px}
.compare>div{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);min-width:0}
@media (max-width:600px){.compare{grid-template-columns:1fr}}
.thumbs img{height:64px;width:auto;border-radius:6px;border:1px solid var(--line)}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.notice{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--ink)}
.notice b{color:var(--warn)}
.rrow{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.rrow.off{opacity:.55}
.rrow input[type=checkbox]{width:18px;height:18px;margin-top:10px;accent-color:var(--accent)}
.rfields{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
.rfields .full{grid-column:1/-1}
@media (max-width:600px){.rfields{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:7px 9px;font-size:14px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:60px}
.field .mono,.field input.mono{font-family:var(--mono);font-size:13px}
.tagline{font-size:12px;color:var(--muted)}
.tagline.dup{color:var(--warn);font-weight:600}

/* Library */
.libhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.libhead h1{font-size:20px;margin:0;text-wrap:balance}
.libhead .hint{color:var(--muted);font-size:13px;flex:1 1 200px}
.group{display:flex;flex-direction:column;gap:8px}
.group{margin-top:10px}
.group h3{margin:0;padding-bottom:6px;border-bottom:1px solid var(--line);font-size:17px;letter-spacing:-.005em;color:var(--ink);font-weight:700;display:flex;gap:10px;align-items:baseline}
.group h3 .n{font-size:13px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
@media (max-width:420px){.cards{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.top1{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.term{font-family:var(--mono);font-weight:700;font-size:16px;color:var(--accent);overflow-wrap:anywhere}
.tab.dragging{opacity:.4}
.tab.dropbefore{box-shadow:inset 3px 0 0 var(--accent)}
.cmd{display:flex;align-items:flex-start;gap:8px;background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:9px 10px;font-family:var(--mono);font-size:13px;min-width:0}
.cmd .ps{color:var(--code-dim);flex:0 0 auto;user-select:none}
.cmd code{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;font-family:inherit}
.cmd .copy{flex:0 0 auto;border:1px solid #2C3A45;background:transparent;color:var(--code-ink);border-radius:6px;font-size:11px;padding:2px 7px;font-family:var(--sans);font-weight:600}
.cmd .copy:hover{background:#22303B}
.card .title{font-weight:700;font-size:14px}
.card .expl{font-size:14px;color:var(--ink);margin:0}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:11px;border-radius:999px;padding:1px 8px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-weight:600}
.pill.sample{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pill.tabp{display:inline-flex;align-items:center;gap:5px}
.pill.tabp i{width:7px;height:7px;border-radius:50%;background:var(--c)}
details.parts summary{font-size:12px;color:var(--accent);cursor:pointer;font-weight:600}
.partlist{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin-top:6px;font-size:13px}
.partlist code{font-family:var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:12px;white-space:nowrap;max-width:40vw;overflow:hidden;text-overflow:ellipsis;justify-self:start}
.cardfoot{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-top:auto}
mark{background:color-mix(in srgb,var(--accent) 28%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;background:var(--surface-2)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.smart{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(8,14,18,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .panel-b{gap:10px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;background:var(--c)}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.menu{position:absolute;right:16px;top:44px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;min-width:220px;z-index:40}
.menu button{border:none;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;font-size:14px}
.menu button:hover{background:var(--surface-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

function makeLocalStore(){
  let data = lsGet("pf.data", null);
  if(!data){ data={tabs:{},prompts:{}}; DEFAULT_TABS.forEach(t=>{const {id,...r}=t;data.tabs[id]={...r,createdAt:Date.now()}}); }
  if(!data.queue) data.queue={};
  lsSet("pf.data",data);
  const emit=()=>{ for(const c of ["tabs","prompts","queue"]) state[c]=Object.entries(data[c]).map(([id,v])=>({id,...v})); state.loaded=true; renderAll(); onQueueChanged(); };
  return {
    kind:"local",
    start(){emit()},
    async set(col,id,obj){data[col][id]=obj;lsSet("pf.data",data);emit()},
    async update(col,id,obj){ if(!data[col][id]) throw {code:"invalid_argument"}; data[col][id]={...data[col][id],...obj};lsSet("pf.data",data);emit()},
    async del(col,id){delete data[col][id];lsSet("pf.data",data);emit()},
    async acquire(){ return {acquired:true}; },
  };
}
function makeDbStore(db){
  let got=0, seeded=false;
  const done=()=>{ if(got>=3){state.loaded=true;} renderAll(); };
  return {
    kind:"db",
    start(){
      db.collection("tabs").onSnapshot(s=>{
        state.tabs=s.docs.map(d=>({id:d.id,...d.data()})); got|=1;
        if(!s.metadata.fromCache && s.empty && !seeded){ seeded=true; DEFAULT_TABS.forEach(t=>{const {id,...r}=t; db.doc("tabs/"+id).set({...r,createdAt:Date.now()}).catch(()=>{});}); }
        done();
      }, e=>storageError(e));
      db.collection("prompts").onSnapshot(s=>{ state.prompts=s.docs.map(d=>({id:d.id,...d.data()})); got|=2; done(); }, e=>storageError(e));
      db.collection("queue").onSnapshot(s=>{ state.queue=s.docs.map(d=>({id:d.id,...d.data()})); renderQueue(); renderDropCount(); onQueueChanged(); }, e=>storageError(e));
      got|=0;
    },
    async set(col,id,obj){ return db.doc(col+"/"+id).set(obj); },
    async update(col,id,obj){ return db.doc(col+"/"+id).update(obj); },
    async del(col,id){ return db.doc(col+"/"+id).delete(); },
    async acquire(col,id,opts){ return db.doc(col+"/"+id).acquire(opts); },
  };
}
function storageError(e){ $("#storage").textContent="Opslag niet bereikbaar"; console.warn(e); }

/* ---------- Zoeken ---------- */
/* Zoeken gebeurt op het commando zelf (+ alternatieven, titel, uitleg), niet op de voorbeelden. <, > en / tellen niet mee: "em" vindt <em></em>. */
const bare = s => norm(s).replace(/[<>\/]/g," ").replace(/\s+/g," ").trim();
function tokens(q){ return bare(q).split(/[^a-z0-9_.\-!~+]+/).filter(Boolean); }
function scorePrompt(p, toks, rawq){
  if(!toks.length) return 0;
  const cmds=[p.command,...(p.alts||[]).map(a=>a.command)].map(bare), cmd=cmds.join(" | "), title=norm(p.title), ex=norm(p.explanation), grp=norm(p.group), parts=norm((p.parts||[]).map(x=>x.t+" "+x.m).join(" "));
  let s=0; const nq=bare(rawq);
  const firsts=cmds.map(c=>c.split(/[\s(;:,=]+/)[0]);
  if(cmds.some(c=>c===nq)) s+=100; else if(firsts.includes(nq)) s+=80; else if(cmds.some(c=>c.startsWith(nq))) s+=50; else if(cmd.includes(nq)) s+=30;
  for(const t of toks){
    const stem = t.length>=7 ? t.slice(0,t.length-2) : t;
    let hit=false;
    if(firsts.includes(t)) {s+=30;hit=true}
    else if(cmd.includes(t)) {s+=14;hit=true}
    if(t.length<2){ if(!hit) s-=8; continue; }
    if(title.includes(stem)) {s+=10;hit=true}
    if(ex.includes(stem)) {s+=6;hit=true}
    if(grp.includes(stem)) {s+=4;hit=true}
    if(parts.includes(stem)) {s+=4;hit=true}
    if(!hit) s-=8;
  }
  return s;
}
function searchResults(){
  const toks=tokens(state.q); const act=activeTab();
  const ids=searchTabIds();
  const pool=state.prompts.filter(p=>!ids||ids.has(p.tab));
  return pool.map(p=>({p,s:scorePrompt(p,toks,state.q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.p);
}
function hl(text){
  const toks=tokens(state.q).filter(t=>t.length>1); let h=esc(text);
  if(!toks.length) return h;
  const pats=toks.map(t=>(t.length>=7?t.slice(0,t.length-2):t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).map(t=>esc(t));
  try{ return h.replace(new RegExp("("+pats.join("|")+")","gi"),"<mark>$1</mark>"); }catch{ return h; }
}

  if(!state.loaded){ el.innerHTML=`<div class="status"><span class="spin"></span>Je prompts worden geladen…</div>`; return; }
  if(!act){ el.innerHTML=`<div class="empty"><b>Nog geen tabs</b>Maak een eerste tab aan, bv. “Linux”.<br><br><button class="btn primary" data-act="new-tab">+ Tab toevoegen</button></div>`; return; }
  $("#smartBtn").hidden = !(state.q && state.sample);
  if(state.q){
    const res=searchResults();
    el.innerHTML = `<div class="libhead"><h1>${res.length} resultaat${res.length===1?"":"en"}</h1><span class="hint">voor “${esc(state.q)}” in ${esc(searchScopeName())} · Enter kopieert het bovenste</span></div>`
      + (res.length? `<div class="cards" style="margin-top:10px">${res.slice(0,60).map((p,i)=>cardHTML(p,i===0)).join("")}</div>`
        : `<div class="empty" style="margin-top:10px"><b>Niets gevonden</b>${state.sample?"Probeer andere woorden, of laat Claude op betekenis zoeken met <em>Slim zoeken</em>.":"Probeer andere woorden of zet “in alle tabs” aan."}</div>`);
    return;
  }
  const list=state.prompts.filter(p=>p.tab===act.id);
  const groups=new Map();
  if(act.kind==="concept"){ // begrippen: in de volgorde waarin ze werden toegevoegd (van basis naar specifiek)
    const first={}; list.forEach(p=>{ const g=p.group||"Overig"; first[g]=Math.min(first[g]??Infinity,p.createdAt||0); });
    list.sort((a,b)=>(first[a.group||"Overig"]-first[b.group||"Overig"])||((a.createdAt||0)-(b.createdAt||0)));
  } else list.sort((a,b)=>String(a.group||"~").localeCompare(String(b.group||"~"))||String(a.command).localeCompare(String(b.command)));
  list.forEach(p=>{const g=p.group||"Overig"; if(!groups.has(g))groups.set(g,[]); groups.get(g).push(p)});
  el.innerHTML = `<div class="libhead"><h1>${esc(act.name)}</h1><span class="hint">${esc(act.hint||"")}</span><button class="btn small" data-act="add-manual">+ Prompt</button></div>`
    + (list.length? [...groups].map(([g,ps])=>`<div class="group"><h3>${esc(g)} <span class="n">${ps.length}</span></h3><div class="cards">${ps.map(p=>cardHTML(p)).join("")}</div></div>`).join("")
      : `<div class="empty" style="margin-top:10px"><b>Nog niets in ${esc(act.name)}</b>Plak een screenshot hierboven, of voeg een prompt handmatig toe.</div>`);
}

function openModal({title, body, ok="Opslaan", danger=null, onOk, onDanger, onOpen}){
  const root=$("#modalRoot");
  root.innerHTML=`<div class="scrim" data-close><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="panel-h"><h2 id="mt">${esc(title)}</h2><button class="iconbtn" data-close aria-label="Sluiten">✕</button></div><div class="panel-b">${body}</div><div class="modal-f">${danger?`<button class="btn ghost danger" id="mDanger" style="margin-right:auto">${esc(danger)}</button>`:""}<button class="btn ghost" data-close>${ok?"Annuleren":"Sluiten"}</button>${ok?`<button class="btn primary" id="mOk">${esc(ok)}</button>`:""}</div></div></div>`;
  root.querySelectorAll("[data-close]").forEach(n=>n.addEventListener("click",e=>{if(e.target===n)closeModal()}));
  if(ok) $("#mOk").onclick=async()=>{ const r=await onOk?.(); if(r!==false) closeModal(); };
  if(danger){ let armed=false; $("#mDanger").onclick=async()=>{ if(!armed){armed=true;$("#mDanger").textContent="Klik nogmaals om te bevestigen";return;} await onDanger?.(); closeModal(); }; }
  onOpen?.();
  const first=root.querySelector("input,textarea,select"); if(first&&!onOpen) first.focus();
}
function closeModal(){ $("#modalRoot").innerHTML=""; }
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&$("#modalRoot").innerHTML) closeModal(); });

/* ---------- Lokale uitleg ---------- */
function splitArgs(s){ const out=[]; const re=/"[^"]*"|'[^']*'|\S+/g; let m; while((m=re.exec(s))) out.push(m[0]); return out; }
function localExplain(command, kind){
  const cmd=String(command||"").trim(); if(!cmd) return {known:false};
  // gebruik eerst je eigen bibliotheek
  const own=state.prompts.find(p=>normCmd(p.command)===normCmd(cmd)&&p.explanation);
  if(own) return {known:true,title:own.title,explanation:own.explanation,group:own.group,parts:own.parts||[],fromLib:true};
  const k = kind || guessKind(cmd);
  if(k==="html") return explainHTML(cmd);
  if(k==="pymol") return explainPymol(cmd);
  if(k==="linux") return explainLinux(cmd);
  return {known:false,parts:[]};
}
function guessKind(cmd){
  if(/^\s*</.test(cmd)) return "html";
  const first=cmd.trim().split(/[\s,]+/)[0].toLowerCase();
  if(DICT_INDEX.linux.has(first)) return "linux";
  if(DICT_INDEX.pymol.has(first)) return "pymol";
  return "";
}
function explainLinux(cmd){
  const segs=cmd.split(/\s*(\|\||&&|\||;)\s*/); const parts=[]; const titles=[]; const expls=[]; let group=""; let known=false;
  const ops={"|":"pipe: stuur de uitvoer door naar het volgende commando","&&":"voer het volgende alleen uit als dit lukte","||":"voer het volgende uit als dit mislukte",";":"voer daarna het volgende uit"};
  for(const seg of segs){
    if(ops[seg]){ parts.push({t:seg,m:ops[seg]}); continue; }
    const a=splitArgs(seg); if(!a.length) continue;
    let i=0; if(a[0]==="sudo"){ parts.push({t:"sudo",m:"voer uit als beheerder"}); i=1; }
    const c=a[i]; const e=DICT_INDEX.linux.get((c||"").toLowerCase());
    if(e){ known=true; titles.push(e.title); expls.push(e.expl); if(!group) group=e.group; parts.push({t:c,m:e.title.toLowerCase()}); }
    else if(c) parts.push({t:c,m:"commando (niet in de ingebouwde bibliotheek)"});
    if(c==="cd"&&a.length===i+1) parts.push({t:"(geen map)",m:"cd zonder map brengt je terug naar je thuismap (~)"});
    for(const arg of a.slice(i+1)){
      if(e?.flags[arg]){ parts.push({t:arg,m:e.flags[arg]}); continue; }
      if(/^-[A-Za-z]{2,}$/.test(arg) && e){ for(const ch of arg.slice(1)){ const f=e.flags["-"+ch]; parts.push({t:"-"+ch,m:f||"optie"}); } continue; }
      if(/^--?\w/.test(arg)){ parts.push({t:arg,m:"optie"}); continue; }
      if(arg==="~") parts.push({t:arg,m:"je thuismap"});
      else if(arg==="..") parts.push({t:arg,m:"de bovenliggende map"});
      else if(arg===".") parts.push({t:arg,m:"de huidige map"});
      else if(arg===">"||arg===">>") parts.push({t:arg,m:arg===">"?"schrijf uitvoer naar bestand (overschrijft)":"voeg uitvoer toe aan einde van bestand"});
      else if(/[*?\[]/.test(arg)&&!/^["']/.test(arg)) parts.push({t:arg,m:globMeaning(arg)});
      else if(/[\/.~]/.test(arg)) parts.push({t:arg,m:"pad of bestandsnaam"});
      else if(/^["'].*["']$/.test(arg)) parts.push({t:arg,m:"tekst / zoekpatroon"});
      else if(/^\d+$/.test(arg)) parts.push({t:arg,m:"getal"});
      else parts.push({t:arg,m:"argument"});
    }
  }
  return {known,title:titles.join(" → "),explanation:expls.join(" Daarna: "),group:titles.length>1?"Combinaties":group,parts};
}
/* Uitleg van jokertekens (wildcards / globbing) */
function globMeaning(arg){
  const bits=[];
  if(arg.includes("*")) bits.push("* = nul of meer willekeurige tekens");
  if(arg.includes("?")) bits.push("? = precies één willekeurig teken");
  const br=arg.match(/\[(!|\^)?([^\]]+)\]/);
  if(br) bits.push(br[1]?`[${br[1]}${br[2]}] = één teken dat GEEN ${br[2].split("").join(" of ")} is`:`[${br[2]}] = één teken uit: ${br[2].split("").join(", ")}`);
  return "patroon met jokertekens: "+bits.join("; ");
}
function explainPymol(cmd){
  const m=cmd.trim().match(/^([\w.]+)\s*,?\s*(.*)$/); if(!m) return {known:false,parts:[]};
  const e=DICT_INDEX.pymol.get(m[1].toLowerCase()); const parts=[{t:m[1],m:e?e.title.toLowerCase():"commando (niet in de ingebouwde bibliotheek)"}];
  const args=m[2].split(",").map(s=>s.trim()).filter(Boolean);
  args.forEach((a,idx)=>{
    const kv=a.match(/^(\w+)\s*=\s*(.+)$/);
    if(kv){ parts.push({t:a,m:(e?.flags[kv[1]]||kv[1])+" = "+kv[2]}); return; }
    const words=a.split(/\s+/); const known=words.map(w=>PYMOL_WORDS[w.toLowerCase()]).filter(Boolean);
    if(known.length) parts.push({t:a,m:known.join(", ")});
    else if(/^\d\w{3}$/.test(a)&&(m[1]==="fetch")) parts.push({t:a,m:"PDB-code van de structuur"});
    else parts.push({t:a,m: idx===0&&m[1]==="color"?"kleurnaam": idx===0&&m[1]==="select"?"naam van je selectie":"argument"});
  });
  return {known:!!e,title:e?.title||"",explanation:e?.expl||"",group:e?.group||"",parts};
}
function explainHTML(cmd){
  const m=cmd.match(/<\s*(!doctype|\/?[a-zA-Z][a-zA-Z0-9]*)/i); if(!m) return {known:false,parts:[]};
  const tag=m[1].replace("/","").toLowerCase(); const e=DICT_INDEX.html.get(tag);
  const parts=[{t:`<${tag}>`,m:e?e.title.toLowerCase():"tag (niet in de ingebouwde bibliotheek)"}];
  const re=/([a-zA-Z-]+)\s*=\s*("[^"]*"|'[^']*'|\S+)/g; let a;
  while((a=re.exec(cmd))) parts.push({t:`${a[1]}=${a[2]}`,m:HTML_ATTRS[a[1].toLowerCase()]||"attribuut"});
  return {known:!!e,title:e?.title||"",explanation:e?.expl||"",group:e?.group||"",parts};
}

/* ---------- Lokale OCR (Tesseract in de browser) ---------- */
let ocrWorker=null;
function loadScript(src,cors){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; if(cors) s.crossOrigin="anonymous"; s.onload=res; s.onerror=()=>rej(new Error("script")); document.head.appendChild(s); }); }
let ocrStep="";
function seedOcrCache(raw){ return new Promise((res,rej)=>{ const r=indexedDB.open("keyval-store"); r.onupgradeneeded=()=>r.result.createObjectStore("keyval");
  r.onsuccess=()=>{ const d=r.result; if(!d.objectStoreNames.contains("keyval")){ d.close(); rej(new Error("cache-opslag ontbreekt")); return; } const tx=d.transaction("keyval","readwrite"); tx.objectStore("keyval").put(raw,"./eng.traineddata"); tx.oncomplete=()=>{d.close();res();}; tx.onerror=()=>rej(tx.error); };
  r.onerror=()=>rej(r.error); }); }
async function getOcr(onStatus){
  if(ocrWorker) return ocrWorker;
  ocrStep="script laden";
  onStatus("Tekstherkenning laden (eerste keer ± 5 MB)…");
  if(!window.Tesseract) await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js",true);
  ocrStep="taalbestand laden"; onStatus("Taalbestand laden…");
  const b64=await (await fetch("eng-traineddata.gz.b64.txt")).text();
  const gz=Uint8Array.from(atob(b64.trim()),c=>c.charCodeAt(0));
  const data=new Uint8Array(await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
  /* De herkenner mag in deze weergave niets van internet ophalen; daarom zetten we het taalbestand
     zelf in zijn cache (IndexedDB) en laten we hem alleen daaruit lezen. Rechtstreeks meegeven faalt. */
  ocrStep="taalbestand klaarzetten"; await seedOcrCache(data);
  ocrStep="herkenner starten";
  ocrWorker = await Tesseract.createWorker("eng",1,{cacheMethod:"readOnly",logger:m=>{ if(m.status==="recognizing text") onStatus(`Tekst herkennen… ${Math.round(m.progress*100)}%`); }});
  await ocrWorker.setParameters({preserve_interword_spaces:"1"});
  ocrStep="";
  return ocrWorker;
}
/* Test of de lokale tekstherkenning in deze weergave werkt (menu ⋯ → Tekstherkenning testen) */
async function ocrSelfTest(){
  openModal({title:"Tekstherkenning testen",ok:null,body:`<p id="ocrT" class="tagline">Bezig…</p>`});
  const say=t=>{ const n=$("#ocrT"); if(n) n.textContent=t; };
  const t0=Date.now();
  try{
    const c=document.createElement("canvas"); c.width=600; c.height=90; const g=c.getContext("2d");
    g.fillStyle="#fff"; g.fillRect(0,0,600,90); g.fillStyle="#000"; g.font="28px monospace"; g.fillText("ls -la /home",20,55);
    const w=await getOcr(say); say("Tekst herkennen…");
    const r=await w.recognize(c); const txt=(r?.data?.text||"").trim();
    say(`Werkt. Herkend: “${txt}” (verwacht: “ls -la /home”) · ${((Date.now()-t0)/1000).toFixed(1)} s`);
  }catch(e){ console.warn("ocr test",ocrStep,e); say(`Werkt niet in deze weergave. Stap: ${ocrStep||"?"} · fout: ${String(e?.message||e?.type||e||"onbekend").slice(0,200)}`); }
}
async function preprocess(file){
  const bmp=await createImageBitmap(file);
  const scale = bmp.width<1400 ? 2 : 1;
  const c=document.createElement("canvas"); c.width=bmp.width*scale; c.height=bmp.height*scale;
  const g=c.getContext("2d"); g.imageSmoothingQuality="high"; g.drawImage(bmp,0,0,c.width,c.height);
  const img=g.getImageData(0,0,c.width,c.height); const d=img.data; let sum=0;

/* Typische OCR-verwarringen bij het eerste woord van een commando (l↔I, c↔e) */
const OCR_FIX={"is":"ls","1s":"ls","|s":"ls","we":"wc","ed":"cd","ecd":"cd","grap":"grep","rnkdir":"mkdir","rn":"rm","rnv":"mv","cp.":"cp","pwa":"pwd"};
function fixOcrLinux(seg){
  const m=seg.match(/^(\s*)(\S+)(.*)$/); if(!m) return seg;
  let [,sp,first,rest]=m; const low=first.toLowerCase();
  if(!DICT_INDEX.linux.has(low) && OCR_FIX[low]) first=OCR_FIX[low];
  if(first==="wc"||first==="ls") rest=rest.replace(/\s-1(\s|$)/g," -l$1");
  return sp+first+rest;
}
/* Haal commando's uit herkende tekst. */
function extractFromText(text, fallbackKind){
  const out=[]; const seen=new Set();
  const push=(command,kind)=>{ command=command.replace(/\s+/g," ").trim();
    if(/\^C$/.test(command)) { last=null; return; } // afgebroken met Ctrl+C: niet uitgevoerd
    if(kind==="linux") command=command.split(/(\s*(?:\|\||&&|\||;)\s*)/).map(fixOcrLinux).join(""); if(command.length<2) return;
    if(kind==="linux"){ const f0=command.split(/\s+/)[0].toLowerCase(); if(command.split(/\s+/).length===1 && f0.length<=2 && !DICT_INDEX.linux.has(f0)) return; } // cursorblok of ruis
    const k=normCmd(command); if(seen.has(k)) { last=null; return; } seen.add(k); last={command,kind}; out.push(last); };
  let last=null;
  const addOut=l=>{ if(!last||/^\s*(?:[\w.-]+@[\w.-]+\S*\s*)?[$#§]\s*\S{0,2}\s*$/.test(l)) return; const a=(last.outLines||=[]); if(a.length<6) a.push(l.trim().slice(0,120)); };
  for(let raw of String(text).split(/\r?\n/)){
    const line=raw.replace(/[“”]/g,"\"").replace(/[‘’]/g,"'").trimEnd(); if(!line.trim()) continue;
    let m;
    // foutmelding direct na een commando? (bv. "wc: 'x': No such file or directory")
    if(last && /no such file|not found|permission denied|cannot access|invalid option|missing operand|syntax error/i.test(line)){ last.error=line.trim(); addOut(line); continue; }
    if((m=line.match(/PyMOL\s*>\s*(.+)$/i))){ push(m[1],"pymol"); continue; }
    // terminalprompt: user@host:~/pad$ cmd   of  ~$ cmd  of  $ cmd  (OCR leest $ soms als S of §)
    if((m=line.match(/^(?:\([\w.-]+\)\s*)?[\w.-]+@[\w.-]+(?::[^\s$#]*)?\s*[$#§S]\s+(.+)$/)) || (m=line.match(/^\s*(?:~[^\s]*\s*)?[$#§]\s+(.+)$/))){ push(m[1],"linux"); continue; }
    // HTML-tags
    if(/<\s*(!doctype|[a-zA-Z][a-zA-Z0-9]*)\b[^>]*>/i.test(line)){
      const tagRe=/<\s*(!doctype|[a-zA-Z][a-zA-Z0-9]*)\b[^>]*>/gi; let t;
      while((t=tagRe.exec(line))){ const name=t[1].toLowerCase(); if(seen.has("tag:"+name)) continue; seen.add("tag:"+name);
        const full=line.trim(); push(full.length<=120?full:t[0],"html"); }
      continue;
    }
    // regels die met een gekend commando beginnen
    const first=line.trim().split(/[\s,]+/)[0].toLowerCase();
    if(fallbackKind && DICT_INDEX[fallbackKind]?.has(first)) { push(line,fallbackKind); continue; }
    if(DICT_INDEX.pymol.has(first) && /,/.test(line) && !DICT_INDEX.linux.has(first)) { push(line,"pymol"); continue; }
    addOut(line); // anders: uitvoer van het vorige commando
  }
  out.forEach(o=>{ if(o.outLines) o.output=o.outLines.join("\n"); delete o.outLines; });
  return out;
}

/* ---------- PowerPoint (.pptx) lezen: zelf uitpakken, geen externe bibliotheek ---------- */
async function unzip(buf){
  const u8=new Uint8Array(buf), dv=new DataView(buf), dec=new TextDecoder();
  let e=-1; for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){ if(dv.getUint32(i,true)===0x06054b50){e=i;break;} }
  if(e<0) throw {code:"pptx"};
  const n=dv.getUint16(e+10,true); let off=dv.getUint32(e+16,true); const files=new Map();
  for(let k=0;k<n;k++){
    if(dv.getUint32(off,true)!==0x02014b50) throw {code:"pptx"};
    const method=dv.getUint16(off+10,true), csize=dv.getUint32(off+20,true), nlen=dv.getUint16(off+28,true), xlen=dv.getUint16(off+30,true), clen=dv.getUint16(off+32,true), loff=dv.getUint32(off+42,true);
    files.set(dec.decode(u8.subarray(off+46,off+46+nlen)),{method,csize,loff}); off+=46+nlen+xlen+clen;
  }
  const read=async name=>{ const f=files.get(name); if(!f) return null;
    const start=f.loff+30+dv.getUint16(f.loff+26,true)+dv.getUint16(f.loff+28,true); const data=u8.subarray(start,start+f.csize);
    if(f.method===0) return data.slice();
    if(f.method===8) return new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
    return null; };
  return {names:[...files.keys()], read, text:async n=>{ const b=await read(n); return b?dec.decode(b):null; }};
}
function resolvePath(base,target){ if(target.startsWith("/")) return target.slice(1); const parts=base.split("/"); parts.pop(); for(const s of target.split("/")){ if(s==="..") parts.pop(); else if(s&&s!==".") parts.push(s); } return parts.join("/"); }
async function readRels(z,p){
  const i=p.lastIndexOf("/"); const t=await z.text(p.slice(0,i)+"/_rels/"+p.slice(i+1)+".rels"); const m=new Map(); if(!t) return m;
  const d=new DOMParser().parseFromString(t,"application/xml");
  for(const r of d.getElementsByTagName("Relationship")) m.set(r.getAttribute("Id"),{type:r.getAttribute("Type")||"",target:resolvePath(p,r.getAttribute("Target")||""),external:r.getAttribute("TargetMode")==="External"});
  return m;
}
const MONO=/consol|courier|mono|menlo|lucida console|source code|fira code|jetbrains|inconsolata/i;
function slideText(xml){
  const d=new DOMParser().parseFromString(xml,"application/xml"); const lines=[];
  for(const p of d.getElementsByTagNameNS("*","p")){
    if(!(p.namespaceURI||"").includes("drawingml")) continue;
    let txt="", mono=false;
    for(const node of p.childNodes){
      if(node.localName==="r"||node.localName==="fld"){ const t=node.getElementsByTagNameNS("*","t")[0]; txt+=t?t.textContent:""; const lat=node.getElementsByTagNameNS("*","latin")[0]; if(lat&&MONO.test(lat.getAttribute("typeface")||"")) mono=true; }
      else if(node.localName==="br") txt+="\n";
    }
    if(txt.trim()) lines.push((mono?"[code] ":"")+txt.trim());
  }
  return lines.join("\n");
}
const MIME={png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp"};
async function parsePptx(file){
  const z=await unzip(await file.arrayBuffer());
  const pres="ppt/presentation.xml"; const px=await z.text(pres); if(!px) throw {code:"pptx"};
  const rels=await readRels(z,pres); const d=new DOMParser().parseFromString(px,"application/xml");
  const RNS="http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  let paths=[...d.getElementsByTagNameNS("*","sldId")].map(e=>rels.get(e.getAttributeNS(RNS,"id")||e.getAttribute("r:id"))?.target).filter(Boolean);
  if(!paths.length) paths=z.names.filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>+a.match(/(\d+)\.xml/)[1]-+b.match(/(\d+)\.xml/)[1]);
  const slides=[]; const use=new Map();
  for(let i=0;i<paths.length;i++){
    const x=await z.text(paths[i]); if(!x) continue;
    const r=await readRels(z,paths[i]); let text=slideText(x);
    const nr=[...r.values()].find(v=>v.type.endsWith("/notesSlide"));
    if(nr){ const nx=await z.text(nr.target); if(nx){ const nt=slideText(nx).split("\n").filter(l=>!/^\s*\d+\s*$/.test(l)).join("\n"); if(nt.trim()) text+="\n[notities] "+nt; } }
    const imgs=[...new Set([...r.values()].filter(v=>v.type.endsWith("/image")&&!v.external&&/\.(png|jpe?g|gif|webp)$/i.test(v.target)).map(v=>v.target))];
    imgs.forEach(t=>use.set(t,(use.get(t)||0)+1));
    slides.push({n:i+1,text,imgs});
  }

  const maxUse=Math.max(3,Math.ceil(slides.length*0.3)); const images=new Map();
  for(const [t,c] of use){ if(c>maxUse||images.size>=60) continue; const b=await z.read(t); if(!b||b.length<12000) continue; images.set(t,new Blob([b],{type:MIME[t.split(".").pop().toLowerCase()]||"image/png"})); }

}
const CHUNK_TEXT=9000, CHUNK_SLIDES=8;
function buildChunks(deck,maxImgs){
  const chunks=[]; let cur=null;
  for(const s of deck.slides){
    const imgs=s.imgs.slice(0,maxImgs);
    if(!cur || cur.slides.length>=CHUNK_SLIDES || cur.len+s.text.length>CHUNK_TEXT || cur.imgs.length+imgs.length>maxImgs){ cur={slides:[],imgs:[],len:0}; chunks.push(cur); }
    cur.slides.push(s); cur.imgs.push(...imgs); cur.len+=s.text.length;
  }
  return chunks.filter(c=>c.slides.some(s=>s.text.trim()||s.imgs.length));

/* ---------- Wachtrij ---------- */
const uploads=[];            // bestanden die nog opgeslagen/ingelezen worden (tijdelijk)

let pumping=false, abortCtl=null, currentJob=null, skipTimer=null;

async function onFiles(files){
  files=[...files];

    const u={id,name:f.name||(deck?"presentatie":"screenshot"),status:"upload",type:deck?"deck":"shot",note:deck?"Presentatie wordt gelezen…":"Screenshot wordt bewaard…"}; uploads.push(u); return u; });

        if(!deck.slides.length) throw {code:"pptx"};

        const json=new Blob([JSON.stringify(data)],{type:"application/json"});

        await state.store.set("queue",u.id,{type:"shot",status:"wachtend",tab,name:u.name,blob:null,pos:pos++,createdAt:now,updatedAt:now,items:[],error:""});

      }

let qTimer=null;
function onQueueChanged(){ clearTimeout(qTimer); qTimer=setTimeout(pump,300); }
const posOf=j=>j.pos??j.createdAt;

async function pump(){
  if(pumping||!state.store||!state.loaded) return; pumping=true;
  try{
    for(;;){
      const cand=state.queue.filter(j=>(j.status==="wachtend"||j.status==="bezig") && !doneIds.has(j.id) && !skipIds.has(j.id) && reachable(j));
      // een job die al 'bezig' stond (bv. pc uitgevallen) eerst afwerken, daarna de wachtrij in jouw volgorde
      const job=cand.sort((a,b)=>(a.status==="bezig"?0:1)-(b.status==="bezig"?0:1)||posOf(a)-posOf(b))[0];
      if(!job) break;
      let lease; try{ lease=await withTimeout(state.store.acquire("queue",job.id,{holder:HOLDER,ttlMs:120000}),8000,"timeout"); }catch(e){ lease={acquired:e?.code==="timeout"}; }
      if(!lease.acquired){ skipIds.add(job.id); clearTimeout(skipTimer); skipTimer=setTimeout(()=>{skipIds.clear();pump();},125000); continue; }
      await runJob(job);
    }
  } finally { pumping=false; }
}
function setRt(id,text){ rt[id]={...(rt[id]||{}),text}; const n=document.querySelector(`[data-job="${id}"] .jstatus`); if(n) n.innerHTML=`<span class="spin"></span>${esc(text)}`; }
async function runJob(job){
  currentJob=job.id; abortCtl=new AbortController(); const t0=Date.now();
  delete edits[job.id];
  rt[job.id]={text:"Bezig…",mine:true,t0};
  try{ await withTimeout(state.store.update("queue",job.id,{status:"bezig",startedAt:t0,updatedAt:t0,error:""}),10000,"timeout"); }catch(e){ if(e?.code==="timeout") {} else { doneIds.add(job.id); currentJob=null; return; } } // intussen verwijderd
  renderQueue();
  const renew=setInterval(()=>state.store.acquire("queue",job.id,{holder:HOLDER,ttlMs:120000}).catch(()=>{}),50000);
  const clock=setInterval(()=>{ const r=rt[job.id]; if(!r) return; const sec=Math.round((Date.now()-r.t0)/1000);
    let extra=""; if(r.phase==="claude"&&!r.streaming&&sec>20&&!state.sampleOk) extra=" · Staat er een toestemmingsvenster open? Klik op Toestaan.";
    if(sec>180) extra=" · Dit duurt ongewoon lang. Je kan stoppen en opnieuw proberen.";
    const n=document.querySelector(`[data-job="${job.id}"] .jstatus`); if(n) n.innerHTML=`<span class="spin"></span>${esc(r.text)} <span class="tagline">${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}${esc(extra)}</span>`; },1000);
  let finished=true;

              : e?.code==="both" ? `Claude lukte niet (${e.claude}) en de lokale herkenning ook niet${e.local?` (${e.local})`:""}. Probeer later opnieuw.`

const CLAUDE_UNAVAILABLE=new Set(["no_claude","not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed","images_unavailable"]);
async function runShot(job){

    catch(e){ if(e?.code==="cancelled") throw e; reason=sampleErr(e).split(".")[0]; }
  } else reason="Claude is niet beschikbaar in deze weergave";

    setRt(job.id, state.sample&&!state.sampleImages ? "Tekst uit de screenshot lezen…" : "Claude lukte niet; lokale herkenning wordt gebruikt…");
    try{ res=await analyzeLocal(blob,job);
      /* Claude kan hier geen afbeeldingen bekijken, maar wel tekst: laat Claude de herkende tekst uitleggen */
      if(state.sample&&res.ocrText&&res.ocrText.trim().length>2){
        try{ rt[job.id].phase="claude"; const items=await analyzeOcrClaude(res.ocrText,job); res={items,ocrText:res.ocrText}; used="claude-tekst"; reason=""; state.sampleOk=true; renderClaudeStatus(); }
        catch(e){ if(e?.code==="cancelled") throw e; reason=sampleErr(e).split(".")[0]; }

async function loadDeck(job){

/* Eén stuk (± 8 dia's) per beurt; daarna terug in de wachtrij, zodat jouw volgorde telt en een onderbreking weinig verloren laat gaan. */
async function runDeckStep(job){
  const deck=await loadDeck(job);
  const maxImgs=job.chunkImgs || (state.sampleImages ? Math.min(4, state.maxImages||4) : 0);
  const chunks=buildChunks(deck,maxImgs);
  const cache=deckCache[job.id]||{};
  const progress=Math.max(job.progress||0, cache.progress||0);
  let items=(cache.progress||0)>(job.progress||0) ? cache.items : (job.items||[]);
  if(progress>=chunks.length){ await state.store.update("queue",job.id,{status:"klaar",updatedAt:Date.now()}); return true; }
  const ch=chunks[progress]; const from=ch.slides[0].n, to=ch.slides[ch.slides.length-1].n;
  let found, used=job.used||"claude", reason=job.reason||"";
  if(state.sample&&used!=="local"){
    try{ rt[job.id].phase="claude"; setRt(job.id,`Claude leest dia ${from}–${to} van ${deck.slides.length}…`); found=await analyzeDeckClaude(ch,deck,job); state.sampleOk=true; renderClaudeStatus(); }
    catch(e){ if(e?.code==="cancelled"||!CLAUDE_UNAVAILABLE.has(e?.code)) throw e; used="local"; reason=sampleErr(e).split(".")[0]; }
  } else if(used!=="local"){ used="local"; reason="Claude is niet beschikbaar in deze weergave"; }

    ${j.status==="klaar"&&newTabs.length?`<div class="notice">Claude stelt ${newTabs.length===1?"een nieuwe tab":"nieuwe tabs"} voor: ${newTabs.map(n=>`<button class="btn small" data-act="mk-tab" data-job="${j.id}" data-name="${esc(n)}">+ ${esc(n)}</button>`).join(" ")} <span class="tagline">Tot dan staan die items in de huidige tab.</span></div>`:""}
    ${j.status==="klaar"?`<div class="rows">${items.map(rowHTML).join("")}</div>`:""}
    ${j.status==="klaar"&&!items.length&&j.ocrText?`<details><summary class="tagline">Toon herkende tekst</summary><pre class="mono" style="white-space:pre-wrap;font-size:12px">${esc(j.ocrText)}</pre></details>`:""}
  </div>`;
}
/* Volgorde op het scherm = volgorde van verwerken: bezig, dan jouw wachtrij, dan mislukt, dan klaar. */
function orderedJobs(){
  const rank={bezig:0,wachtend:1,upload:2,fout:3,klaar:4};
  return [...state.queue.map(j=>({...j})), ...uploads.map(u=>({...u,createdAt:Date.now()}))]
    .sort((a,b)=>rank[a.status]-rank[b.status] || (a.status==="klaar"?a.createdAt-b.createdAt:posOf(a)-posOf(b)));
}
function renderQueue(){
  const el=$("#queue"); if(!el) return;
  const jobs=orderedJobs();
  if(!jobs.length){ el.hidden=true; el.innerHTML=""; renderDropCount(); return; }
  el.hidden=false;
  if(!el.querySelector(".qlist")) el.innerHTML=`<div class="panel"><div class="panel-h"><h2>Wachtrij</h2><span class="tagline" id="qCounts"></span><button class="btn small primary" id="saveAll" data-act="save-all" hidden>Alles opslaan</button></div><div class="panel-b qlist"></div></div>`;
  const c={}; jobs.forEach(j=>c[j.status]=(c[j.status]||0)+1);
  $("#qCounts").textContent=[c.bezig&&`${c.bezig} bezig`,c.wachtend&&`${c.wachtend} wachtend`,c.upload&&`${c.upload} inlezen`,c.klaar&&`${c.klaar} te controleren`,c.fout&&`${c.fout} mislukt`].filter(Boolean).join(" · ");
  $("#saveAll").hidden=(state.queue.filter(j=>j.status==="klaar"&&itemsOf(j).length).length<2);
  const list=el.querySelector(".qlist"); const want=new Set();
  const orderable=orderableJobs(); let place=0;
  jobs.forEach((j,idx)=>{
    const oi=orderable.findIndex(x=>x.id===j.id); const busyDeck=orderable.find(x=>x.status==="bezig");
    const ctx=j.status==="wachtend"?{place:++place,oi,on:orderable.length,beforeDeck:!!busyDeck&&posOf(j)<posOf(busyDeck)}:{};
    want.add(j.id); const sig=jobSig(j,ctx); let node=list.querySelector(`:scope > [data-job="${j.id}"]`);
    if(!node||node.dataset.sig!==sig){ const tmp=document.createElement("div"); tmp.innerHTML=jobHTML(j,ctx); const nn=tmp.firstElementChild; nn.dataset.sig=sig; if(node) node.replaceWith(nn); else list.appendChild(nn); node=nn; }
    if(list.children[idx]!==node) list.insertBefore(node,list.children[idx]||null);
  });
  [...list.children].forEach(n=>{ if(!want.has(n.dataset.job)) n.remove(); });
  list.querySelectorAll(".jthumb.ph").forEach(async ph=>{ const id=ph.closest(".job").dataset.job; const j=state.queue.find(x=>x.id===id); if(!j||j.blob?.kind!=="idb"||!reachable(j)) return;
    const b=await idbGet(j.blob.id).catch(()=>null); if(b&&ph.isConnected){ const u=URL.createObjectURL(b); thumbURLs.set(id,u); const img=document.createElement("img"); img.className="jthumb"; img.src=u; img.alt="screenshot"; ph.replaceWith(img); } });
  renderDropCount();
}
function renderDropCount(){ const n=state.queue.filter(j=>j.status==="wachtend"||j.status==="bezig").length+uploads.length; const el=$("#dropCount"); if(el){ el.hidden=!n; el.textContent=`${n} in wachtrij`; } }
/* Verplaatsbaar: wachtende items én een presentatie die bezig is (die gaat na zijn huidige stuk verder volgens deze volgorde). */
const orderableJobs=()=>state.queue.filter(j=>j.status==="wachtend"||(j.status==="bezig"&&j.type==="deck")).sort((a,b)=>posOf(a)-posOf(b));
async function moveJob(id,dir){
  const waiting=orderableJobs(); const i=waiting.findIndex(j=>j.id===id); const k=i+dir;
  if(i<0||k<0||k>=waiting.length) return;
  const a=waiting[i], b=waiting[k]; let pa=posOf(a), pb=posOf(b); if(pa===pb) pb+=dir;
  // lokaal meteen tonen, daarna bewaren
  state.queue=state.queue.map(j=>j.id===a.id?{...j,pos:pb}:j.id===b.id?{...j,pos:pa}:j); renderQueue();
  await Promise.all([state.store.update("queue",a.id,{pos:pb}),state.store.update("queue",b.id,{pos:pa})]).catch(()=>toast("Volgorde bewaren mislukt."));
}
const saveTimers={};
function persistEdits(id){ clearTimeout(saveTimers[id]); saveTimers[id]=setTimeout(()=>{ if(edits[id]) state.store.update("queue",id,{items:edits[id],updatedAt:Date.now()}).catch(()=>{}); },700); }
function makeExample(it,j){
  const x={command:String(it.command).trim(),output:it.output||"",note:it.note||"",source:j.type==="deck"?"les":"screenshot",date:Date.now()};
  if(j.type==="deck"){ x.sourceName=j.name; if(it.slide) x.slide=it.slide; } else if(j.blob) x.img=j.blob;
  return x;
}
const MAX_EX=12;
function addExample(list,x){ const k=normCmd(x.command)+"|"+(x.output||"").trim(); const l=(list||[]).filter(e=>normCmd(e.command)+"|"+(e.output||"").trim()!==k); l.push(x); return l.slice(-MAX_EX); }
async function saveJob(id,quiet){
  const j=state.queue.find(x=>x.id===id); if(!j) return {added:0,examples:0,updated:0};
  const r={added:0,examples:0,updated:0,failed:0}; const createdNow=new Map(); let usedImg=false;
  const source=j.type==="deck"?"les":"screenshot";
  for(const it of itemsOf(j)){
    const cmd=String(it.command||"").trim(); if(!cmd) continue;
    const gen=String(it.general||"").trim(); const key=normCmd(gen||cmd);
    const exact=findExisting(cmd)||createdNow.get(normCmd(cmd))||createdNow.get(key)||(gen?findExisting(gen):undefined);
    const rel=exact||relOf(it);
    const ex=makeExample(it,j);
    if(rel && !(it.act==="nieuw"&&!exact)){
      if(it.act==="niets") continue;
      const upd={uses:(rel.uses||1)+1,lastSeen:Date.now(),examples:addExample(rel.examples,ex),updatedAt:Date.now()};
      if(it.alt&&!exact&&normCmd(rel.command)!==normCmd(cmd)&&!(rel.alts||[]).some(a=>normCmd(a.command)===normCmd(cmd))){ upd.alts=[...(rel.alts||[]),{command:cmd,note:(it.title||it.note||"").trim()}]; }
      if(it.act==="vervang"&&exact) Object.assign(upd,{title:(it.title||"").trim(),explanation:(it.explanation||"").trim(),parts:it.parts||[]});
      try{ await state.store.update("prompts",rel.id,upd); rel.examples=upd.examples; rel.uses=upd.uses; if(upd.alts) rel.alts=upd.alts; it.act==="vervang"?r.updated++:r.examples++; if(ex.img) usedImg=true; }catch{ r.failed++; }
      continue;
    }
    if(!rel && !it.on) continue;
    const pid=uid("p_");
    const obj={command:gen||cmd,tab:it.tab||activeTab()?.id,group:(it.group||"").trim(),title:(it.title||"").trim(),explanation:(it.explanation||"").trim(),parts:it.parts||[],source,uses:1,createdAt:Date.now(),updatedAt:Date.now(),...(j.used==="local"?{quality:"lokaal"}:{}),
      examples:(gen||source==="screenshot"||it.output||it.note)?[ex]:[],
      ...(j.type==="deck"?{sourceName:j.name,slide:it.slide||null}:{})};
    if(await write("prompts",pid,obj)){ r.added++; { const o={id:pid,...obj}; createdNow.set(normCmd(cmd),o); createdNow.set(key,o); } if(obj.examples.length&&ex.img) usedImg=true; } else r.failed++;
  }
  if(!r.failed){ clearTimeout(saveTimers[id]); delete edits[id]; await remove("queue",id); dropBlob(j,usedImg); }
  if(!quiet) toast(saveMsg(r));
  return r;
}
const saveMsg=r=>[`${r.added} nieuw opgeslagen`, r.examples&&`${r.examples} als voorbeeld toegevoegd`, r.updated&&`${r.updated} uitleg vervangen`, r.failed&&`${r.failed} mislukt`].filter(Boolean).join(" · ")+".";

async function smartSearch(){
  if(!state.sample||!state.q.trim()) return;
  const act=activeTab(); const sids=searchTabIds(); const pool=state.prompts.filter(p=>!sids||sids.has(p.tab)).slice(0,600);
  const list=pool.map(p=>`${p.id} | ${tabById(p.tab)?.name||""} | ${p.command} | ${p.title||""}`.slice(0,160)).join("\n");
  const ctl=new AbortController(); state.smart={busy:true,q:state.q,ctl}; renderSmart();

    const r=await state.sample.json(`Een beginnende student bio-informatica zoekt in zijn eigen lijst met commando's naar: "${state.q}"
Gezocht in: ${state.allTabs?"alle tabs":searchScopeName()+" ("+(activeSection()?.tabs||[act]).map(t=>t.name+(t.hint?": "+t.hint:"")).join("; ")+")"}
Zijn opgeslagen commando's (id | tab | commando | titel):
${list||"(leeg)"}
Antwoord met ALLEEN JSON: {"ids":["ids van de best passende, beste eerst, max 6"],"tip":"optioneel: 1 korte Nederlandse zin","suggestie":null}
Als GEEN enkel opgeslagen commando de vraag beantwoordt, vul "suggestie" in: {"command":"het juiste commando","title":"max 6 woorden","explanation":"1-2 eenvoudige zinnen","group":"korte groepsnaam"}.`,{modelTier:"quick",signal:ctl.signal});

function renderSmart(){
  const el=$("#smart"); const S=state.smart;

  el.hidden=false;
  if(S.busy){ el.innerHTML=`<div class="smart"><div class="status"><span class="spin"></span>Claude zoekt op betekenis…</div></div>`; return; }

    ${S.sug?`<span>Staat nog niet in je lijst. Voorstel van Claude:</span><div class="card"><div class="cmd"><code>${esc(S.sug.command)}</code></div><div class="title">${esc(S.sug.title||"")}</div><p class="expl">${esc(S.sug.explanation||"")}</p><div class="cardfoot"><button class="btn small primary" data-act="add-sug">Toevoegen aan ${esc(state.allTabs?"lijst":activeTab().name)}</button></div></div>`:""}</div>`;

/* Back-up: alle tabs en prompts als één JSON-bestand (zelfde formaat als de back-up op GitHub) */
function backupData(){ const strip=({id,...r})=>({id,...r}); return {app:"PromptFinder",version:1,exportedAt:new Date().toISOString(),tabs:state.tabs.map(strip),prompts:state.prompts.map(strip)}; }

async function restoreBackup(file){
  let data; try{ data=JSON.parse(await file.text()); }catch{ toast("Dit is geen geldig back-upbestand."); return; }
  if(data?.app!=="PromptFinder"||!Array.isArray(data.prompts)||!Array.isArray(data.tabs)){ toast("Dit is geen PromptFinder-back-up."); return; }

    async onOk(){ let n=0,f=0; for(const [col,list] of [["tabs",data.tabs],["prompts",data.prompts]]) for(const d of list){ if(!d||!d.id) continue; const {id,...r}=d;
        let ok=false; for(let t=0;t<3&&!ok;t++){ try{ await state.store.set(col,String(id),r); ok=true; }catch{ await new Promise(r=>setTimeout(r,1200)); } } ok?n++:f++; }

}
function exportText(){

async function handleAct(act, node){
  const id=node.dataset.id;

    case "copy-alt": { const p=state.prompts.find(x=>x.id===id); const a=p?.alts?.[+node.dataset.i]; if(a) copyText(a.command); break; }
    case "edit": editPrompt(state.prompts.find(x=>x.id===id)); break;
    case "del": { if(node.dataset.armed){ await remove("prompts",id); } else { node.dataset.armed="1"; node.textContent="Zeker?"; setTimeout(()=>{ if(node.isConnected){ delete node.dataset.armed; node.textContent="Verwijderen"; } },3000); } break; }

        async onOk(){ let n=0; for(const p of list){ if((p.examples||[]).some(e=>e.source==="screenshot")) continue;

    el.addEventListener("dragstart",e=>{ const t=e.target.closest(`[${attr}]`); if(!t) return; dragId=t.getAttribute(attr); e.dataTransfer.effectAllowed="move"; try{ e.dataTransfer.setData("text/plain",dragId); }catch{} t.classList.add("dragging"); });
    el.addEventListener("dragover",e=>{ if(!dragId) return; e.preventDefault(); e.stopPropagation(); el.querySelectorAll(".dropbefore").forEach(n=>n.classList.remove("dropbefore")); const t=e.target.closest(`[${attr}]`); if(t&&t.getAttribute(attr)!==dragId) t.classList.add("dropbefore"); });
    el.addEventListener("drop",e=>{ if(!dragId) return; e.preventDefault(); e.stopPropagation(); const t=e.target.closest(`[${attr}]`); const ids=getOrder().filter(x=>x!==dragId);
      let at=t?ids.indexOf(t.getAttribute(attr)):ids.length; if(at<0) at=ids.length; ids.splice(at,0,dragId); dragId=null; save(ids); });
    el.addEventListener("dragend",()=>{ dragId=null; el.querySelectorAll(".dragging,.dropbefore").forEach(n=>n.classList.remove("dragging","dropbefore")); });
  }
  dragZone($("#tabs"),"data-sec",()=>sections().map(g=>g.name),names=>{ const secs=sections(); saveSectionOrder(names.map(n=>secs.find(g=>g.name===n)).filter(Boolean)); });
  dragZone($("#subtabs"),"data-tab",()=>activeSection()?.tabs.map(t=>t.id)||[],ids=>{ const cur=activeSection(); if(!cur) return; saveSectionOrder(sections().map(g=>g.name===cur.name?{...g,tabs:ids.map(tabById).filter(Boolean)}:g)); });
  const q=$("#q");
  q.addEventListener("input",()=>{ const had=state.loc; state.q=q.value; $("#qClear").hidden=!q.value; if(!q.value.trim()&&had) moveTo(had); renderTabs(); renderLib(); renderSmart(); });
  q.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const r=searchResults(); if(r[0]) copyText(r[0].command); } });
  $("#qClear").onclick=()=>{ const had=state.loc; q.value=""; state.q=""; $("#qClear").hidden=true; state.smart=null; if(had) moveTo(had); renderTabs(); renderLib(); renderSmart(); q.focus(); };
  $("#allTabs").onchange=e=>{ state.allTabs=e.target.checked; renderTabs(); renderLib(); };
  $("#smartBtn").onclick=smartSearch;
  document.addEventListener("keydown",e=>{ if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); q.focus(); } });
  $("#file").onchange=e=>{ onFiles(e.target.files); e.target.value=""; };
  $("#restoreFile").onchange=e=>{ const f=e.target.files[0]; e.target.value=""; if(f) restoreBackup(f); };
  document.addEventListener("paste",e=>{ const fs=[...(e.clipboardData?.items||[])].filter(i=>i.kind==="file").map(i=>i.getAsFile()).filter(f=>f&&(f.type.startsWith("image/")||isPptx(f))); if(fs.length){ e.preventDefault(); onFiles(fs); } });
  const drop=$("#drop");
  ["dragenter","dragover"].forEach(ev=>document.addEventListener(ev,e=>{ if([...(e.dataTransfer?.types||[])].includes("Files")){ e.preventDefault(); drop.classList.add("over"); } }));
  ["dragleave","drop"].forEach(ev=>document.addEventListener(ev,e=>{ if(ev==="drop"){ e.preventDefault(); if(e.dataTransfer?.files?.length) onFiles(e.dataTransfer.files); } if(ev==="drop"||!e.relatedTarget) drop.classList.remove("over"); }));
  // velden in de wachtrij: bewerkingen onthouden (ook online)
  const q2=$("#queue");
  const onField=e=>{ const row=e.target.closest(".rrow"); const f=e.target.dataset.f; const jn=e.target.closest(".job"); if(!row||!f||!jn) return;
    const id=jn.dataset.job; const j=state.queue.find(x=>x.id===id); if(!j) return;
    const items=edits[id]||(edits[id]=itemsOf(j).map(x=>({...x}))); const it=items[+row.dataset.i];
    if(f==="on"){ it.on=e.target.checked; row.classList.toggle("off",!it.on); }
    else if(f==="act"){ it.act=e.target.value; row.classList.toggle("off",it.act==="niets"); }
    else it[f]=e.target.value;
    const ctxPlace={}; jn.dataset.sig=jobSig(j,ctxPlace); persistEdits(id); };
  q2.addEventListener("input",onField); q2.addEventListener("change",onField);
}
boot();
</script>
