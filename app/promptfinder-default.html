waarde","t":"yes"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":8,"createdAt":1790250000370,"id":"les_0371"},{"command":"echo $ANSWER","tab":"linux","group":"Omgeving & variabelen","title":"Waarde van variabele tonen","explanation":"Toont de waarde van de variabele ANSWER. Het $-teken vóór de naam haalt de inhoud van de variabele op. Met Tab kun je variabelenamen aanvullen ($ANS + Tab).","parts":[{"m":"haal de waarde van de variabele op","t":"$"},{"m":"naam van de variabele","t":"ANSWER"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":8,"createdAt":1790250000371,"id":"les_0372"},{"command":"export ANSWER=yes","tab":"linux","group":"Omgeving & variabelen","title":"Variabele doorgeven aan subshells","explanation":"Maakt de variabele en exporteert ze, zodat ze ook bekend is in subshells en scripts die je vanuit deze shell start.","parts":[{"m":"geef de variabele door aan subshells","t":"export"},{"m":"de variabele en haar waarde","t":"ANSWER=yes"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":9,"createdAt":1790250000372,"id":"les_0373"},{"command":"date +%A","tab":"linux","group":"Omgeving & variabelen","title":"Dag van de week tonen","explanation":"Toont de naam van de huidige dag van de week (bv. Monday). Met +% bepaal je hoe date de datum weergeeft.","parts":[{"m":"toon datum en tijd","t":"date"},{"m":"formaat: volledige naam van de weekdag","t":"+%A"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":14,"createdAt":1790250000379,"id":"les_0380"},{"command":"sudo dnf install info","tab":"linux","group":"Pakketten & software","title":"Programma info installeren","explanation":"Installeert het programma info met de pakketbeheerder dnf van Fedora, als het nog niet op je systeem staat.","parts":[{"m":"voer uit als beheerder","t":"sudo"},{"m":"pakketbeheerder van Fedora","t":"dnf"},{"m":"installeer pakket","t":"install"},{"m":"naam van het pakket","t":"info"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":31,"createdAt":1790250000055,"id":"les_0056"},{"command":"sudo dnf install xterm","tab":"linux","group":"Pakketten & software","title":"Het programma xterm installeren","explanation":"Installeert xterm, een eenvoudige terminal die heel weinig geheugen gebruikt (minder dan 1 MB RAM). Je moet je wachtwoord ingeven omdat installeren beheerdersrechten vraagt.","parts":[{"m":"voer uit als beheerder","t":"sudo"},{"m":"installeer een pakket met de pakketbeheerder","t":"dnf install"},{"m":"naam van het pakket","t":"xterm"}],"sourceName":"Chapter 4 - Processes.pptx","slide":11,"createdAt":1790250000139,"id":"les_0140"},{"command":"sudo dnf install pakket","tab":"linux","group":"Pakketten & software","title":"Software installeren met dnf","explanation":"Installeert een programma met dnf, de pakketbeheerder voor RPM-pakketten (Fedora). Je kan een pakketnaam geven of een gedownload .rpm-bestand. sudo is nodig omdat je als beheerder installeert.","parts":[{"m":"als beheerder","t":"sudo"},{"m":"pakketbeheerder","t":"dnf"},{"m":"installeer","t":"install"},{"m":"pakketnaam of pad naar een .rpm-bestand","t":"pakket"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":33,"createdAt":1790250000247,"id":"les_0248"},{"command":"dnf list","tab":"linux","group":"Pakketten & software","title":"Beschikbare pakketten oplijsten","explanation":"Toont alle beschikbare (en geïnstalleerde) programma's/pakketten.","parts":[{"m":"pakketbeheerder","t":"dnf"},{"m":"toon pakketten","t":"list"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":33,"createdAt":1790250000248,"id":"les_0249"},{"command":"dnf search patroon","tab":"linux","group":"Pakketten & software","title":"Pakket zoeken","explanation":"Zoekt pakketten waarvan naam of beschrijving het patroon bevat, bv. dnf search perl.","parts":[{"m":"pakketbeheerder","t":"dnf"},{"m":"zoek","t":"search"},{"m":"zoekwoord","t":"patroon"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":33,"createdAt":1790250000249,"id":"les_0250"},{"command":"sudo dnf upgrade","tab":"linux","group":"Pakketten & software","title":"Alle pakketten bijwerken","explanation":"Werkt alle geïnstalleerde pakketten bij naar de nieuwste versie.","parts":[{"m":"als beheerder","t":"sudo"},{"m":"pakketbeheerder","t":"dnf"},{"m":"werk alles bij","t":"upgrade"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":33,"createdAt":1790250000250,"id":"les_0251"},{"command":"which programma","tab":"linux","group":"Pakketten & software","title":"Controleren of programma geïnstalleerd is","explanation":"Toont het volledige pad van een programma (bv. /usr/bin/gedit). Krijg je niets, dan staat het niet in je PATH of is het niet geïnstalleerd.","parts":[{"m":"zoek het programma in de mappen van PATH","t":"which"},{"m":"naam van het programma","t":"programma"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":35,"createdAt":1790250000251,"id":"les_0252"},{"command":"ln -s programma /usr/bin/programma","tab":"linux","group":"Pakketten & software","title":"Programma beschikbaar maken voor iedereen","explanation":"Maakt in /usr/bin een symbolische link (snelkoppeling) naar het programma, zodat elke gebruiker het kan starten door de naam te typen. Geef als eerste argument het volledige pad naar het programma; in /usr/bin schrijven vraagt meestal sudo.","parts":[{"m":"maak een link","t":"ln"},{"m":"symbolische link (snelkoppeling)","t":"-s"},{"m":"pad naar het echte programma","t":"programma"},{"m":"plaats en naam van de link","t":"/usr/bin/programma"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":35,"createdAt":1790250000252,"id":"les_0253"},{"command":"./configure","tab":"linux","group":"Pakketten & software","title":"Broncode voorbereiden voor compileren","explanation":"Eerste stap bij installeren vanaf broncode (na tar -xzvf): het script controleert je systeem en bereidt het compileren voor. Lees eerst het INSTALL- of README-bestand.","parts":[{"m":"voer uit vanuit de huidige map","t":"./"},{"m":"configuratiescript bij de broncode","t":"configure"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":36,"createdAt":1790250000254,"id":"les_0255"},{"command":"make","tab":"linux","group":"Pakketten & software","title":"Broncode compileren","explanation":"Compileert de broncode tot een uitvoerbaar programma, volgens de instructies in het Makefile.","parts":[{"m":"bouw (compileer) het programma","t":"make"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":36,"createdAt":1790250000255,"id":"les_0256"},{"command":"sudo make install","tab":"linux","group":"Pakketten & software","title":"Gecompileerd programma installeren","explanation":"Laatste stap: kopieert het gecompileerde programma naar de systeemmappen. Vraagt beheerdersrechten.","parts":[{"m":"als beheerder","t":"sudo"},{"m":"installeer het gebouwde programma","t":"make install"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":36,"createdAt":1790250000256,"id":"les_0257"},{"command":"git clone URL","tab":"linux","group":"Pakketten & software","title":"Broncode van project downloaden","explanation":"Downloadt (kloont) de volledige broncode van een project, bv. een bio-informaticatool, naar je computer. Dit is de eerste stap van de klassieke, minst reproduceerbare manier om software te installeren.","parts":[{"m":"maak een kopie van een online code-opslagplaats","t":"git clone"},{"m":"adres van de opslagplaats","t":"URL"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":5,"createdAt":1790250000299,"id":"les_0300"},{"command":"hisat2 --version","tab":"linux","group":"Pakketten & software","title":"Versie van een tool tonen","explanation":"Toont welke versie van de tool (hier hisat2) geïnstalleerd is. Zo controleer je of de installatie gelukt is en welke versie je gebruikt, belangrijk voor reproduceerbaarheid.","parts":[{"m":"een tool voor het mappen van sequenties","t":"hisat2"},{"m":"toon het versienummer","t":"--version"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":5,"createdAt":1790250000300,"id":"les_0301"},{"command":"which seqtk","tab":"linux","group":"Pakketten & software","title":"Locatie van een programma zoeken","explanation":"Toont in welke map het uitvoerbare bestand seqtk staat. Als je de conda-omgeving deactiveert, vindt which het programma niet meer, omdat het enkel in die omgeving geïnstalleerd is.","parts":[{"m":"zoek het programma in de mappen van PATH","t":"which"},{"m":"naam van het programma","t":"seqtk"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":14,"createdAt":1790250000316,"id":"les_0317"},{"command":"sudo dnf -y install dnf-plugins-core","tab":"linux","group":"Pakketten & software","title":"Plugins voor dnf installeren","explanation":"Installeert extra plugins voor de pakketbeheerder dnf, waaronder config-manager, nodig om de Docker-repository toe te voegen.","parts":[{"m":"installeer een pakket als root","t":"sudo dnf install"},{"m":"antwoord automatisch ja","t":"-y"},{"m":"pakket met dnf-plugins","t":"dnf-plugins-core"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":21,"createdAt":1790250000323,"id":"les_0324"},{"command":"sudo dnf-3 config-manager --add-repo https://download.docker.com/linux/fedora/docker-ce.repo","tab":"linux","group":"Pakketten & software","title":"Docker-repository toevoegen","explanation":"Voegt de officiële softwarebron van Docker toe aan dnf, zodat je daarna Docker kunt installeren.","parts":[{"m":"dnf-plugin om softwarebronnen te beheren","t":"config-manager"},{"m":"voeg een softwarebron (repository) toe","t":"--add-repo"},{"m":"adres van de Docker-repository","t":"https://…docker-ce.repo"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":21,"createdAt":1790250000324,"id":"les_0325"},{"command":"sudo dnf install docker-ce docker-ce-cli containerd.io","tab":"linux","group":"Pakketten & software","title":"Docker Engine installeren","explanation":"Installeert de Docker Engine, het docker-commando en containerd. Tijdens de installatie aanvaard je de GPG-sleutel.","parts":[{"m":"de Docker Engine","t":"docker-ce"},{"m":"het docker-commando","t":"docker-ce-cli"},{"m":"onderdeel dat de containers draait","t":"containerd.io"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":21,"createdAt":1790250000325,"id":"les_0326"},{"command":"sudo dnf install docker-compose","tab":"linux","group":"Pakketten & software","title":"Docker compose installeren","explanation":"Installeert Docker compose op Fedora.","parts":[{"m":"het Docker compose-pakket","t":"docker-compose"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":38,"createdAt":1790250000354,"id":"les_0355"},{"command":"fastqc WT*.fq.gz","tab":"linux","group":"Pakketten & software","title":"Kwaliteitscontrole van fastq-bestanden","explanation":"Voert een kwaliteitscontrole uit op alle bestanden die met WT beginnen en op .fq.gz eindigen. Per bestand maakt fastqc een html-rapport dat je in je browser opent. Werkt na conda install fastqc of in een container.","parts":[{"m":"tool voor kwaliteitscontrole van sequentiedata","t":"fastqc"},{"m":"alle gecomprimeerde fastq-bestanden die met WT beginnen","t":"WT*.fq.gz"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":44,"createdAt":1790250000362,"id":"les_0363"},{"command":"sudo dnf install firefox php","tab":"linux","group":"Pakketten & software","title":"Firefox en PHP installeren","explanation":"Installeert de webbrowser Firefox en de programmeertaal PHP op Fedora met de pakketbeheerder dnf. Je hebt sudo nodig omdat software installeren beheerdersrechten vraagt.","parts":[{"m":"voer uit als beheerder (root)","t":"sudo"},{"m":"pakketbeheerder van Fedora","t":"dnf"},{"m":"installeer de volgende pakketten","t":"install"},{"m":"pakket: de webbrowser Firefox","t":"firefox"},{"m":"pakket: de programmeertaal PHP","t":"php"}],"sourceName":"1. Introduction.pptx","slide":8,"createdAt":1790250000410,"id":"les_0411"},{"command":"sudo dnf install code-1.81.1-1691620770.el7.x86_64.rpm","tab":"linux","group":"Pakketten & software","title":"VS Code installeren uit .rpm-bestand","explanation":"Installeert Visual Studio Code vanuit een gedownload .rpm-bestand in de huidige map. dnf toont eerst een overzicht en vraagt dan bevestiging: typ y om door te gaan of n om te stoppen.","parts":[{"m":"voer uit als beheerder (vraagt je wachtwoord)","t":"sudo"},{"m":"installeer met de pakketbeheerder van Fedora","t":"dnf install"},{"m":"het gedownloade installatiebestand (pakket) van VS Code","t":"code-1.81.1-1691620770.el7.x86_64.rpm"}],"examples":[{"command":"sudo dnf install code-1.81.1-1691620770.el7.x86_64.rpm","note":"dnf vraagt bevestiging voor de installatie; standaard is N (nee), dus je moet zelf y typen.","output":"Install 1 Package\nTotal size: 130 M\nInstalled size: 362 M\nIs this ok [y/N]:","slide":14,"source":"les","sourceName":"1. Introduction.pptx"}],"sourceName":"1. Introduction.pptx","slide":14,"createdAt":1790250000413,"id":"les_0414"},{"command":"code","tab":"linux","group":"Pakketten & software","title":"Visual Studio Code openen","explanation":"Start de teksteditor Visual Studio Code vanuit de terminal. Handig om te testen of de installatie gelukt is.","parts":[{"m":"opdracht die VS Code opstart","t":"code"}],"sourceName":"1. Introduction.pptx","slide":16,"createdAt":1790250000415,"id":"les_0416"},{"command":"sudo dnf install pymol","tab":"linux","group":"Pakketten & software","title":"Open-source PyMOL installeren (Fedora)","explanation":"Installeert de open-source versie van PyMOL op Fedora Linux via de pakketbeheerder dnf. De officiële versie van Schrödinger (pymol.org) vraagt een licentie; studenten kunnen een gratis academische licentie van 1 jaar krijgen.","parts":[{"m":"voer uit met beheerdersrechten","t":"sudo"},{"m":"pakketbeheerder van Fedora","t":"dnf"},{"m":"installeer een pakket","t":"install"},{"m":"naam van het pakket","t":"pymol"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":16,"createdAt":1790250000657,"id":"les_0658"},{"command":"pip install --user pyqt5","tab":"linux","group":"Pakketten & software","title":"PyQt5 installeren als PyMOL crasht","explanation":"Installeert het Python-pakket PyQt5 (grafische bibliotheek) alleen voor jouw gebruiker. Mogelijke oplossing als PyMOL 3.1 op Fedora 42 crasht.","parts":[{"m":"pakketbeheerder van Python","t":"pip"},{"m":"installeer een pakket","t":"install"},{"m":"installeer enkel voor de huidige gebruiker, zonder sudo","t":"--user"},{"m":"naam van het Python-pakket","t":"pyqt5"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":16,"createdAt":1790250000658,"id":"les_0659"},{"command":"python -m pip install --upgrade pip","tab":"linux","group":"Pakketten & software","title":"pip zelf bijwerken (Windows)","explanation":"Werkt pip, de pakketbeheerder van Python, bij naar de nieuwste versie. Eerste stap bij het installeren van PyMOL 3.1 op Windows.","parts":[{"m":"start de module pip via Python","t":"python -m pip"},{"m":"installeer een pakket","t":"install"},{"m":"werk bij naar de nieuwste versie","t":"--upgrade"},{"m":"het pakket dat bijgewerkt wordt","t":"pip"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":16,"createdAt":1790250000659,"id":"les_0660"},{"command":"pip install pmw","tab":"linux","group":"Pakketten & software","title":"Pmw installeren voor PyMOL (Windows)","explanation":"Installeert het Python-pakket Pmw (Python megawidgets), dat PyMOL nodig heeft voor zijn grafische vensters. Tweede stap bij het installeren van PyMOL 3.1 op Windows.","parts":[{"m":"installeer een Python-pakket","t":"pip install"},{"m":"naam van het pakket","t":"pmw"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":16,"createdAt":1790250000660,"id":"les_0661"},{"command":"xterm","tab":"linux","group":"Processen","title":"Lichte terminal openen","explanation":"Opent een nieuw, eenvoudig terminalvenster. Zonder & bezet het je huidige terminal tot je het sluit; met xterm & blijft je terminal bruikbaar.","parts":[{"m":"programma: kleine terminal","t":"xterm"}],"sourceName":"Chapter 4 - Processes.pptx","slide":11,"createdAt":1790250000140,"id":"les_0141"},{"command":"commando &","tab":"linux","group":"Processen","title":"Commando op de achtergrond starten","explanation":"Met een & achter een commando start je het op de achtergrond, zodat je terminal vrij blijft. De shell toont het jobnummer tussen haakjes en de PID.","parts":[{"m":"het programma dat je wil starten, bv. xterm of gedit","t":"commando"},{"m":"voer uit op de achtergrond","t":"&"}],"examples":[{"command":"commando &","note":"xterm krijgt jobnummer 1 en PID 9167.","output":"[guest@fedora ~]$ xterm &\n[1] 9167","slide":12,"source":"les","sourceName":"Chapter 4 - Processes.pptx"}],"sourceName":"Chapter 4 - Processes.pptx","slide":12,"createdAt":1790250000141,"id":"les_0142"},{"command":"jobs","tab":"linux","group":"Processen","title":"Jobs in huidige shell tonen","explanation":"Toont de jobs die in je huidige shell draaien of gepauzeerd zijn, met hun jobnummer en status. Dat jobnummer gebruik je bij fg, bg en kill.","parts":[{"m":"lijst van jobs in deze shell","t":"jobs"}],"examples":[{"command":"jobs","note":"","output":"[1]- Running xterm &\n[2]+ Running firefox &","slide":13,"source":"les","sourceName":"Chapter 4 - Processes.pptx"}],"sourceName":"Chapter 4 - Processes.pptx","slide":13,"createdAt":1790250000142,"id":"les_0143"},{"command":"bg %nr","tab":"linux","group":"Processen","title":"Gepauzeerde job op achtergrond hervatten","explanation":"Laat een job die je met Ctrl + Z gepauzeerd hebt verder lopen op de achtergrond. Het jobnummer vind je met jobs.","parts":[{"m":"background: hervat op de achtergrond","t":"bg"},{"m":"jobnummer uit jobs, bv. %1","t":"%nr"}],"sourceName":"Chapter 4 - Processes.pptx","slide":13,"createdAt":1790250000143,"id":"les_0144"},{"command":"fg %nr","tab":"linux","group":"Processen","title":"Job naar de voorgrond halen","explanation":"Haalt een achtergrondjob (of gepauzeerde job) terug naar de voorgrond, zodat hij de terminal weer gebruikt.","parts":[{"m":"foreground: breng naar de voorgrond","t":"fg"},{"m":"jobnummer uit jobs, bv. %2","t":"%nr"}],"sourceName":"Chapter 4 - Processes.pptx","slide":13,"createdAt":1790250000144,"id":"les_0145"},{"command":"kill %nr","tab":"linux","group":"Processen","title":"Achtergrondjob stoppen","explanation":"Stopt een job via zijn jobnummer; het is als Ctrl + C, maar dan voor een job op de achtergrond. In plaats van %nr kan je ook de PID gebruiken.","parts":[{"m":"stuur een stopsignaal","t":"kill"},{"m":"jobnummer uit jobs, bv. %1","t":"%nr"}],"sourceName":"Chapter 4 - Processes.pptx","slide":13,"createdAt":1790250000145,"id":"les_0146"},{"command":"ps","tab":"linux","group":"Processen","title":"Je lopende processen tonen","explanation":"Toont informatie over de processen die je in je huidige terminal draait. Kolommen: PID (procesnummer), TTY (terminal, pts = pseudo-terminal), TIME (gebruikte processortijd) en CMD (commandonaam). ps heeft meer dan 80 opties.","parts":[{"m":"process status: toon processen","t":"ps"}],"sourceName":"Chapter 4 - Processes.pptx","slide":14,"createdAt":1790250000146,"id":"les_0147"},{"command":"w","tab":"linux","group":"Processen","title":"Aangemelde gebruikers en hun activiteit","explanation":"Toont wie aangemeld is en wat ze doen. De eerste lijn is dezelfde als uptime. Kolommen: USER en TTY (wie, waar), LOGIN@ en IDLE (sinds wanneer, hoe lang niets gedaan), JCPU en PCPU (processortijd), WHAT (huidig proces).","parts":[{"m":"toon aangemelde gebruikers en hun activiteit","t":"w"}],"examples":[{"command":"w","note":"","output":"16:35:20 up 7:10, 2 users, load average: 0.00, 0.02, 0.03\nUSER TTY LOGIN@ IDLE JCPU PCPU WHAT\nguest pts/1 16:29 5:54 0.03s 0.03s bash","slide":15,"source":"les","sourceName":"Chapter 4 - Processes.pptx"}],"sourceName":"Chapter 4 - Processes.pptx","slide":15,"createdAt":1790250000147,"id":"les_0148"},{"command":"top","tab":"linux","group":"Processen","title":"Processen live bekijken","explanation":"Toont een live overzicht van het systeem, ook batchprocessen. Bovenaan staan de processen die het meeste processortijd gebruiken; het scherm ververst om de paar seconden. Je ziet ook Tasks (aantal processen), Cpu(s) (belasting), Mem (geheugen) en Swap. Stoppen met q.","parts":[{"m":"table of processes: live procesoverzicht","t":"top"}],"examples":[{"command":"top","note":"","output":"top - 16:53:03 up 7:27, 2 users, load average: 0.07, 0.03, 0.00\nTasks: 241 total, 1 running, 240 sleeping, 0 stopped, 0 zombie","slide":16,"source":"les","sourceName":"Chapter 4 - Processes.pptx"}],"sourceName":"Chapter 4 - Processes.pptx","slide":16,"createdAt":1790250000148,"id":"les_0149"},{"command":"uptime","tab":"linux","group":"Processen","title":"Hoe lang systeem draait en belasting","explanation":"Toont de huidige tijd, hoe lang het systeem al aanstaat, het aantal aangemelde gebruikers en de gemiddelde belasting (load average) van de laatste 1, 5 en 15 minuten. Dit is ook de eerste lijn van w en top.","parts":[{"m":"toon looptijd en systeembelasting","t":"uptime"}],"sourceName":"Chapter 4 - Processes.pptx","slide":18,"createdAt":1790250000149,"id":"les_0150"},{"command":"htop","tab":"linux","group":"Processen","title":"Interactieve procesviewer","explanation":"Een interactieve, overzichtelijkere variant van top. Bovenaan zie je per processor/kern een balk met de belasting. Bij 1 kern betekent load 1 = 100 %, bij 4 kernen load 4 = 100 %.","parts":[{"m":"interactief procesoverzicht","t":"htop"}],"sourceName":"Chapter 4 - Processes.pptx","slide":19,"createdAt":1790250000150,"id":"les_0151"},{"command":"echo $?","tab":"linux","group":"Processen","title":"Exitstatus van vorig commando tonen","explanation":"Toont de exitstatus van het laatst uitgevoerde commando. 0 betekent: normaal beëindigd. Bij grep: 0 = gevonden, 1 = niet gevonden, 2 = fout (bv. bestand bestaat niet of onbekende optie).","parts":[{"m":"druk af","t":"echo"},{"m":"variabele met de exitstatus van het vorige commando","t":"$?"}],"examples":[{"command":"echo $?","note":"grep vindt het bestand niet, dus de exitstatus is 2.","output":"[guest@fedora ~]$ grep jasper /etc/jasper\ngrep: /etc/jasper: No such file or directory\n[guest@fedora ~]$ echo $?\n2","slide":21,"source":"les","sourceName":"Chapter 4 - Processes.pptx"}],"sourceName":"Chapter 4 - Processes.pptx","slide":21,"createdAt":1790250000152,"id":"les_0153"},{"command":"ps -ef","tab":"linux","group":"Processen","title":"Alle processen met details tonen","explanation":"Toont alle processen van het hele systeem in volledige vorm, met o.a. gebruiker, PID en PID van het ouderproces. Handig om de PID van een proces op te zoeken, bv. om het te stoppen.","parts":[{"m":"toon processen","t":"ps"},{"m":"every: alle processen","t":"-e"},{"m":"full: volledige, uitgebreide lijst","t":"-f"}],"sourceName":"Chapter 4 - Processes.pptx","slide":22,"createdAt":1790250000154,"id":"les_0155"},{"command":"kill [-signaal] PID","tab":"linux","group":"Processen","title":"Proces stoppen via PID","explanation":"Stuurt een signaal naar het proces met die PID. Zonder signaal wordt SIGTERM (15) gestuurd: het proces stopt netjes. De PID zoek je op met ps -ef.","parts":[{"m":"stuur een signaal naar een proces","t":"kill"},{"m":"optioneel: welk signaal, bv. -15 (SIGTERM), -9 (SIGKILL), -2 (SIGINT), -1 (SIGHUP)","t":"-signaal"},{"m":"procesnummer","t":"PID"}],"sourceName":"Chapter 4 - Processes.pptx","slide":22,"createdAt":1790250000155,"id":"les_0156"},{"command":"kill -9 PID","tab":"linux","group":"Processen","title":"Proces geforceerd stoppen","explanation":"Stuurt SIGKILL (9): het proces wordt meteen gestopt en kan dit signaal niet negeren. Gebruik dit pas als een gewone kill (SIGTERM) niet werkt.","parts":[{"m":"stuur een signaal","t":"kill"},{"m":"SIGKILL: stop onvoorwaardelijk","t":"-9"},{"m":"procesnummer","t":"PID"}],"sourceName":"Chapter 4 - Processes.pptx","slide":22,"createdAt":1790250000156,"id":"les_0157"},{"command":"kill -l","tab":"linux","group":"Processen","title":"Alle signalen oplijsten","explanation":"Toont de lijst van alle signalen die je met kill kan sturen, met hun nummer.","parts":[{"m":"stuur signalen","t":"kill"},{"m":"list: toon mogelijke signalen","t":"-l"}],"sourceName":"Chapter 4 - Processes.pptx","slide":22,"createdAt":1790250000157,"id":"les_0158"},{"command":"xkill","tab":"linux","group":"Processen","title":"Grafisch programma sluiten","explanation":"Na dit commando verandert je muiswijzer; klik op een venster om dat grafische programma te beëindigen.","parts":[{"m":"stop een grafisch programma door erop te klikken","t":"xkill"}],"sourceName":"Chapter 4 - Processes.pptx","slide":22,"createdAt":1790250000158,"id":"les_0159"},{"command":"timeout [opties] seconden commando","tab":"linux","group":"Processen","title":"Tijdslimiet instellen voor commando","explanation":"Voert een commando uit, maar stopt het automatisch na het opgegeven aantal seconden. Voorbeeld: timeout 5 sleep 60 stopt sleep al na 5 seconden.","parts":[{"m":"voer uit met tijdslimiet","t":"timeout"},{"m":"maximale looptijd, bv. 5","t":"seconden"},{"m":"het commando dat je start, bv. sleep 60","t":"commando"}],"sourceName":"Chapter 4 - Processes.pptx","slide":24,"createdAt":1790250000159,"id":"les_0160"},{"command":"time commando","tab":"linux","group":"Processen","title":"Uitvoeringstijd van commando meten","explanation":"Werkt als een chronometer: voert het commando uit en toont daarna hoe lang het duurde. Handig om lange processen te meten, bv. time find /usr.","parts":[{"m":"meet de uitvoeringstijd","t":"time"},{"m":"het te meten commando, bv. find /usr","t":"commando"}],"sourceName":"Chapter 4 - Processes.pptx","slide":25,"createdAt":1790250000160,"id":"les_0161"},{"command":"nice [-n niveau] [commando]","tab":"linux","group":"Processen","title":"Commando starten met andere prioriteit","explanation":"Start een commando met een aangepaste prioriteit (nice-waarde) van -20 (hoogste) tot +19 (laagste). Zonder nice is de waarde 0; met nice zonder -n wordt het 10. Een negatieve waarde vraagt rootrechten.","parts":[{"m":"start met aangepaste prioriteit","t":"nice"},{"m":"nice-waarde van -20 tot 19","t":"-n niveau"},{"m":"het te starten commando","t":"commando"}],"sourceName":"Chapter 4 - Processes.pptx","slide":26,"createdAt":1790250000162,"id":"les_0163"},{"command":"renice [-n] prioriteit IDs","tab":"linux","group":"Processen","title":"Prioriteit van lopend proces aanpassen","explanation":"Verandert de prioriteit van een proces dat al draait. Je geeft de nieuwe nice-waarde en de PID('s). Met -u gebruiker pas je alle processen van die gebruiker aan, bv. renice +1 987 -u root.","parts":[{"m":"wijzig prioriteit van lopend proces","t":"renice"},{"m":"nieuwe nice-waarde (-20 tot 19)","t":"-n prioriteit"},{"m":"PID('s) van de processen","t":"IDs"}],"sourceName":"Chapter 4 - Processes.pptx","slide":26,"createdAt":1790250000163,"id":"les_0164"},{"command":"r (in top)","tab":"linux","group":"Processen","title":"Prioriteit wijzigen binnen top","explanation":"In top druk je r om de prioriteit van een proces te veranderen. Je geeft de PID in + Enter, en daarna de nieuwe nice-waarde (-20 tot 19) + Enter.","parts":[{"m":"renice: wijzig prioriteit","t":"r"},{"m":"nummer van het proces","t":"PID"},{"m":"-20 (hoogste) tot 19 (laagste prioriteit)","t":"nice-waarde"}],"sourceName":"Chapter 4 - Processes.pptx","slide":27,"createdAt":1790250000164,"id":"les_0165"},{"command":"sleep seconden","tab":"linux","group":"Processen","title":"Een tijd wachten","explanation":"sleep doet niets anders dan wachten, standaard in seconden. Handig om een commando later te laten starten.","parts":[{"m":"wacht","t":"sleep"},{"m":"hoe lang, bv. 60","t":"seconden"}],"sourceName":"Chapter 4 - Processes.pptx","slide":29,"createdAt":1790250000165,"id":"les_0166"},{"command":"(sleep 10; echo -e \"\\a Time for a break!\") &","tab":"linux","group":"Processen","title":"Herinnering na 10 seconden","explanation":"Wacht op de achtergrond 10 seconden en toont dan een bericht met een piepgeluid. De haakjes groeperen de twee commando's zodat ze samen op de achtergrond draaien.","parts":[{"m":"groepeer commando's","t":"( … )"},{"m":"wacht 10 seconden","t":"sleep 10"},{"m":"voer daarna het volgende commando uit","t":";"},{"m":"druk tekst af en interpreteer escapetekens","t":"echo -e"},{"m":"escapeteken: piepgeluid (bel)","t":"\\a"},{"m":"op de achtergrond","t":"&"}],"examples":[{"command":"(sleep 10; echo -e \"\\a Time for a break!\") &","note":"","output":"[1] 41699\n[guest@fedora ~]$ Time for a break!","slide":29,"source":"les","sourceName":"Chapter 4 - Processes.pptx"}],"sourceName":"Chapter 4 - Processes.pptx","slide":29,"createdAt":1790250000166,"id":"les_0167"},{"command":"watch [opties] commando","tab":"linux","group":"Processen","title":"Commando telkens opnieuw uitvoeren","explanation":"Voert een commando steeds opnieuw uit, standaard om de 2 seconden, en toont het resultaat schermvullend. Het blijft lopen tot je Ctrl + C drukt. Voorbeeld: watch date.","parts":[{"m":"herhaal periodiek","t":"watch"},{"m":"bv. -n seconden voor een ander interval","t":"opties"},{"m":"het te herhalen commando, bv. date","t":"commando"}],"sourceName":"Chapter 4 - Processes.pptx","slide":30,"createdAt":1790250000167,"id":"les_0168"},{"command":"at tijd","tab":"linux","group":"Processen","title":"Taak eenmalig inplannen","explanation":"Opent een at>-prompt waar je commando's typt die één keer op het gekozen tijdstip uitgevoerd worden. Sluit de prompt met Ctrl + D. Tijd bv. 19:30 of now + 2 minutes. (Pakket 'at' nodig.)","parts":[{"m":"plan een eenmalige taak","t":"at"},{"m":"wanneer, bv. now + 2 minutes of 19:30","t":"tijd"},{"m":"sluit de at>-prompt (<EOT>)","t":"Ctrl + D"}],"examples":[{"command":"at tijd","note":"Na 2 minuten wordt het bestand test.txt aangemaakt.","output":"[guest@fedora Documents]$ at now + 2 minutes\nat> touch /home/guest/Documents/test.txt\nat> <EOT>\njob 7 at Mon Sep 27 16:14:00 2021","slide":31,"source":"les","sourceName":"Chapter 4 - Processes.pptx"}],"sourceName":"Chapter 4 - Processes.pptx","slide":31,"createdAt":1790250000168,"id":"les_0169"},{"command":"atq","tab":"linux","group":"Processen","title":"Geplande at-taken tonen","explanation":"Toont de wachtrij (queue) met alle taken die met at gepland zijn, met hun jobnummer en tijdstip.","parts":[{"m":"at queue: lijst van at-taken","t":"atq"}],"examples":[{"command":"atq","note":"","output":"6 Tue Sep 26 19:30:00 2023 a guest","slide":32,"source":"les","sourceName":"Chapter 4 - Processes.pptx"}],"sourceName":"Chapter 4 - Processes.pptx","slide":32,"createdAt":1790250000169,"id":"les_0170"},{"command":"atrm jobnummer","tab":"linux","group":"Processen","title":"Geplande at-taak verwijderen","explanation":"Verwijdert een geplande at-taak uit de wachtrij. Het jobnummer vind je met atq, bv. atrm 6.","parts":[{"m":"at remove: verwijder at-taak","t":"atrm"},{"m":"nummer uit atq","t":"jobnummer"}],"sourceName":"Chapter 4 - Processes.pptx","slide":32,"createdAt":1790250000170,"id":"les_0171"},{"command":"crontab -e","tab":"linux","group":"Processen","title":"Herhalende taken bewerken","explanation":"Opent je crontab (lijst van herhalende taken) in een editor (die in $VISUAL of $EDITOR, vaak nano). Elke regel is één taak. Sluit nano met Ctrl + X, bevestig met Y en Enter. Zet een # vooraan een regel om die taak uit te schakelen. (Pakket 'cronie' nodig.)","parts":[{"m":"beheer geplande, herhalende taken","t":"crontab"},{"m":"edit: bewerk je crontab","t":"-e"}],"examples":[{"command":"crontab -e","note":"","output":"no crontab for guest - using an empty one\ncrontab: installing new crontab","slide":34,"source":"les","sourceName":"Chapter 4 - Processes.pptx"}],"sourceName":"Chapter 4 - Processes.pptx","slide":34,"createdAt":1790250000172,"id":"les_0173"},{"command":"crontab -l","tab":"linux","group":"Processen","title":"Geplande cron-taken tonen","explanation":"Toont (list) alle taken in je crontab.","parts":[{"m":"beheer geplande taken","t":"crontab"},{"m":"list: toon je crontab","t":"-l"}],"sourceName":"Chapter 4 - Processes.pptx","slide":36,"createdAt":1790250000173,"id":"les_0174"},{"command":"min uur dag maand weekdag commando","tab":"linux","group":"Processen","title":"Opbouw van een crontab-regel","explanation":"Elke regel in een crontab begint met vijf tijdvelden, gevolgd door het commando. * betekent 'elke', 1-5 is een reeks, 1,3,5 een opsomming. Bv. */5 * * * * touch /var/tmp/test maakt elke 5 minuten een bestand.","parts":[{"m":"minuut na het uur (0-59)","t":"min"},{"m":"uur van de dag (0-23)","t":"uur"},{"m":"dag van de maand (1-31)","t":"dag"},{"m":"maand (1-12)","t":"maand"},{"m":"dag van de week (0-7; 0 en 7 = zondag)","t":"weekdag"},{"m":"elke waarde","t":"*"},{"m":"reeks (1-5) of opsomming (1,3,5)","t":"-  en  ,"},{"m":"wat uitgevoerd wordt","t":"commando"}],"sourceName":"Chapter 4 - Processes.pptx","slide":36,"createdAt":1790250000174,"id":"les_0175"},{"command":"sudo systemctl start docker","tab":"linux","group":"Processen","title":"Docker Engine starten","explanation":"Start de Docker-service (daemon), zodat je containers kunt gebruiken.","parts":[{"m":"beheer systeemservices","t":"systemctl"},{"m":"start de service nu","t":"start"},{"m":"de Docker-service","t":"docker"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":22,"createdAt":1790250000326,"id":"les_0327"},{"command":"sudo systemctl enable docker","tab":"linux","group":"Processen","title":"Docker automatisch laten opstarten","explanation":"Zorgt dat de Docker Engine bij elke herstart van de computer automatisch start.","parts":[{"m":"start de service automatisch bij het opstarten","t":"enable"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":23,"createdAt":1790250000329,"id":"les_0330"},{"command":"chmod +x script.sh","tab":"linux","group":"Rechten & gebruikers","title":"Maak script uitvoerbaar","explanation":"Geeft een script uitvoerrechten, zodat je het daarna kan starten met ./script.sh.","parts":[{"m":"wijzig rechten","t":"chmod"},{"m":"voeg uitvoerrecht toe","t":"+x"},{"m":"het script","t":"script.sh"}],"createdAt":1790233200000,"id":"ex_chmod"},{"command":"sudo commando","tab":"linux","group":"Rechten & gebruikers","title":"Commando uitvoeren als beheerder","explanation":"Zet sudo voor een commando om het uit te voeren met rechten van de superuser (root), bv. om software te installeren. Je moet dan je wachtwoord ingeven.","parts":[{"m":"superuser do: voer uit als root","t":"sudo"},{"m":"het commando dat beheerdersrechten nodig heeft","t":"commando"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":8,"createdAt":1790250000014,"id":"les_0015"},{"command":"umask","tab":"linux","group":"Rechten & gebruikers","title":"Standaardrechten nieuwe bestanden","explanation":"Toont het gebruikersmasker: een waarde die afgetrokken wordt van de standaardrechten van nieuwe bestanden en mappen. Zo zijn nieuwe, zelfgemaakte bestanden standaard niet uitvoerbaar, wat helpt tegen virussen. Met umask gevolgd door een getal wijzig je het masker.","parts":[{"m":"toon of wijzig het gebruikersmasker","t":"umask"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":45,"createdAt":1790250000115,"id":"les_0116"},{"command":"chmod [ugoa][-+=][rwx...] file","tab":"linux","group":"Rechten & gebruikers","title":"Rechten wijzigen met letters","explanation":"Wijzigt de toegangsrechten van een bestand of map. Je kiest voor wie (u, g, o, a), wat je doet (- afnemen, + geven, = instellen) en welk recht (r, w, x).","parts":[{"m":"user / group / others / all","t":"u / g / o / a"},{"m":"afnemen / toevoegen / precies instellen","t":"- / + / ="},{"m":"lezen / schrijven / uitvoeren","t":"r / w / x"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":47,"createdAt":1790250000116,"id":"les_0117"},{"command":"chmod a-x mydir","tab":"linux","group":"Rechten & gebruikers","title":"Uitvoerrecht op map afnemen","explanation":"Neemt bij iedereen het x-recht af van de map mydir. Daarna kan niemand nog met cd in die map.","parts":[{"m":"all: iedereen","t":"a"},{"m":"neem uitvoerrecht af","t":"-x"},{"m":"de map","t":"mydir"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":47,"createdAt":1790250000117,"id":"les_0118"},{"command":"ls -ld mydir","tab":"linux","group":"Rechten & gebruikers","title":"Rechten van map zelf tonen","explanation":"Toont de eigenschappen (rechten) van de map zelf in plaats van haar inhoud.","parts":[{"m":"lange lijst","t":"-l"},{"m":"toon de map zelf, niet de inhoud","t":"-d"},{"m":"de map","t":"mydir"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":47,"createdAt":1790250000118,"id":"les_0119"},{"command":"chmod 400 file","tab":"linux","group":"Rechten & gebruikers","title":"Bestand beschermen tegen overschrijven","explanation":"Enkel de eigenaar mag lezen (r--------). Beschermt tegen per ongeluk overschrijven.","parts":[{"m":"eigenaar: r","t":"4"},{"m":"groep: niets","t":"0"},{"m":"anderen: niets","t":"0"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":48,"createdAt":1790250000119,"id":"les_0120"},{"command":"chmod 500 directory","tab":"linux","group":"Rechten & gebruikers","title":"Map beschermen tegen wijzigingen","explanation":"Eigenaar mag lezen en binnengaan (r-x), niet schrijven. Zo verwijder, hernoem of verplaats je niet per ongeluk bestanden in die map.","parts":[{"m":"eigenaar: r-x","t":"5"},{"m":"groep: niets","t":"0"},{"m":"anderen: niets","t":"0"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":48,"createdAt":1790250000120,"id":"les_0121"},{"command":"chmod 600 file","tab":"linux","group":"Rechten & gebruikers","title":"Privébestand voor eigenaar","explanation":"Enkel de eigenaar mag lezen en schrijven (rw-------); anderen hebben geen toegang.","parts":[{"m":"eigenaar: rw-","t":"6"},{"m":"groep: niets","t":"0"},{"m":"anderen: niets","t":"0"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":48,"createdAt":1790250000121,"id":"les_0122"},{"command":"chmod 644 file","tab":"linux","group":"Rechten & gebruikers","title":"Openbaar leesbaar bestand","explanation":"Iedereen mag lezen, maar enkel de eigenaar mag wijzigen (rw-r--r--).","parts":[{"m":"eigenaar: rw-","t":"6"},{"m":"groep: r--","t":"4"},{"m":"anderen: r--","t":"4"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":48,"createdAt":1790250000122,"id":"les_0123"},{"command":"chmod 660 file","tab":"linux","group":"Rechten & gebruikers","title":"Bestand voor eigen groep","explanation":"Eigenaar en groep mogen lezen en wijzigen (rw-rw----); anderen hebben geen toegang.","parts":[{"m":"eigenaar: rw-","t":"6"},{"m":"groep: rw-","t":"6"},{"m":"anderen: niets","t":"0"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":48,"createdAt":1790250000123,"id":"les_0124"},{"command":"chmod 700 file","tab":"linux","group":"Rechten & gebruikers","title":"Alle rechten enkel voor eigenaar","explanation":"Enkel de eigenaar mag lezen, schrijven en uitvoeren (rwx------).","parts":[{"m":"eigenaar: rwx","t":"7"},{"m":"groep: niets","t":"0"},{"m":"anderen: niets","t":"0"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":48,"createdAt":1790250000124,"id":"les_0125"},{"command":"chmod 755 file","tab":"linux","group":"Rechten & gebruikers","title":"Uitvoerbaar voor iedereen","explanation":"Iedereen mag lezen en uitvoeren, enkel de eigenaar mag wijzigen (rwxr-xr-x). Typisch voor programma's en scripts.","parts":[{"m":"eigenaar: rwx","t":"7"},{"m":"groep: r-x","t":"5"},{"m":"anderen: r-x","t":"5"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":48,"createdAt":1790250000125,"id":"les_0126"},{"command":"chmod 770 file","tab":"linux","group":"Rechten & gebruikers","title":"Alle rechten voor groep","explanation":"Eigenaar en groep hebben alle rechten (rwxrwx---); anderen niets. Standaard binnen een groep.","parts":[{"m":"eigenaar: rwx","t":"7"},{"m":"groep: rwx","t":"7"},{"m":"anderen: niets","t":"0"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":48,"createdAt":1790250000126,"id":"les_0127"},{"command":"chmod 777 file","tab":"linux","group":"Rechten & gebruikers","title":"Alle rechten voor iedereen","explanation":"Iedereen mag lezen, schrijven en uitvoeren (rwxrwxrwx). Onveilig, dus zelden gebruiken.","parts":[{"m":"eigenaar: rwx","t":"7"},{"m":"groep: rwx","t":"7"},{"m":"anderen: rwx","t":"7"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":48,"createdAt":1790250000127,"id":"les_0128"},{"command":"chown [options] user_spec files","tab":"linux","group":"Rechten & gebruikers","title":"Eigenaar van bestand wijzigen","explanation":"Stelt in wie de eigenaar is van bestanden of mappen. Meestal heb je daarvoor sudo nodig.","parts":[{"m":"change owner","t":"chown"},{"m":"nieuwe eigenaar","t":"user_spec"},{"m":"bestanden of mappen","t":"files"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":49,"createdAt":1790250000128,"id":"les_0129"},{"command":"chgrp [options] group_spec files","tab":"linux","group":"Rechten & gebruikers","title":"Groep van bestand wijzigen","explanation":"Stelt in tot welke groep bestanden of mappen behoren.","parts":[{"m":"change group","t":"chgrp"},{"m":"nieuwe groep","t":"group_spec"},{"m":"bestanden of mappen","t":"files"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":49,"createdAt":1790250000129,"id":"les_0130"},{"command":"sudo usermod -aG docker guest","tab":"linux","group":"Rechten & gebruikers","title":"Gebruiker aan groep toevoegen","explanation":"Voegt gebruiker guest toe aan de groep docker, zodat die docker kan gebruiken zonder sudo. Dit werkt pas na opnieuw inloggen.","parts":[{"m":"wijzig een gebruikersaccount","t":"usermod"},{"m":"voeg (append) toe aan groep docker, zonder andere groepen te verwijderen","t":"-aG docker"},{"m":"de gebruiker","t":"guest"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":23,"createdAt":1790250000328,"id":"les_0329"},{"command":"VBoxManage startvm \"rnaseq\" --type headless","tab":"linux","group":"Reproduceerbaar werken","title":"Virtuele machine zonder venster starten","explanation":"Start de VirtualBox virtuele machine met de naam rnaseq op de achtergrond, zonder grafisch venster. Daarna kun je met ssh inloggen en de analyse in de VM uitvoeren.","parts":[{"m":"commandoregelprogramma van VirtualBox","t":"VBoxManage"},{"m":"start de VM met naam rnaseq","t":"startvm \"rnaseq\""},{"m":"zonder scherm/venster","t":"--type headless"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":8,"createdAt":1790250000302,"id":"les_0303"},{"command":"conda init","tab":"linux","group":"Reproduceerbaar werken","title":"Conda in de shell activeren","explanation":"Stelt je shell zo in dat conda na het opstarten van een nieuwe terminal beschikbaar is. Dit doe je één keer na het installeren van Miniconda.","parts":[{"m":"initialiseer conda voor je shell","t":"conda init"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":11,"createdAt":1790250000307,"id":"les_0308"},{"command":"conda config --add channels bioconda","tab":"linux","group":"Reproduceerbaar werken","title":"Kanaal toevoegen aan conda","explanation":"Voegt het kanaal bioconda toe aan de lijst waar conda pakketten zoekt. In de les voeg je na elkaar defaults, bioconda en conda-forge toe; het laatst toegevoegde kanaal krijgt de hoogste prioriteit. De volgorde staat in ~/.condarc.","parts":[{"m":"wijzig de instellingen van conda","t":"conda config"},{"m":"voeg een kanaal toe","t":"--add channels"},{"m":"kanaal met bio-informaticasoftware","t":"bioconda"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":12,"createdAt":1790250000308,"id":"les_0309"},{"command":"conda config --set channel_priority strict","tab":"linux","group":"Reproduceerbaar werken","title":"Strikte kanaalvolgorde instellen","explanation":"Zorgt dat conda de volgorde van de kanalen strikt volgt: een pakket wordt uit het kanaal met de hoogste prioriteit gehaald.","parts":[{"m":"stel een instelling in","t":"--set"},{"m":"volg de kanaalvolgorde strikt","t":"channel_priority strict"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":12,"createdAt":1790250000309,"id":"les_0310"},{"command":"conda create --yes --name env_name","tab":"linux","group":"Reproduceerbaar werken","title":"Nieuwe conda-omgeving maken","explanation":"Maakt een nieuwe, lege conda-omgeving met de opgegeven naam, bv. my_tool.","parts":[{"m":"maak een nieuwe omgeving","t":"conda create"},{"m":"vraag geen bevestiging","t":"--yes"},{"m":"naam van de omgeving","t":"--name env_name"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":13,"createdAt":1790250000310,"id":"les_0311"},{"command":"conda activate env_name","tab":"linux","group":"Reproduceerbaar werken","title":"Conda-omgeving activeren","explanation":"Activeert de omgeving: vanaf nu gebruik je de tools die in die omgeving geïnstalleerd zijn. De naam van de omgeving verschijnt in je prompt. Met --stack activeer je een omgeving bovenop een andere.","parts":[{"m":"schakel een omgeving in","t":"conda activate"},{"m":"naam van de omgeving","t":"env_name"},{"m":"activeer bovenop de huidige omgeving","t":"--stack"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":13,"createdAt":1790250000311,"id":"les_0312"},{"command":"conda deactivate","tab":"linux","group":"Reproduceerbaar werken","title":"Conda-omgeving verlaten","explanation":"Schakelt de actieve conda-omgeving uit, zodat je terug in de vorige omgeving zit.","parts":[{"m":"schakel de huidige omgeving uit","t":"conda deactivate"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":13,"createdAt":1790250000312,"id":"les_0313"},{"command":"conda env list","tab":"linux","group":"Reproduceerbaar werken","title":"Alle conda-omgevingen tonen","explanation":"Toont een lijst van alle conda-omgevingen op het systeem; de actieve omgeving is gemarkeerd met een *.","parts":[{"m":"lijst van omgevingen","t":"conda env list"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":13,"createdAt":1790250000313,"id":"les_0314"},{"command":"conda install --yes seqtk=1.3","tab":"linux","group":"Reproduceerbaar werken","title":"Pakket installeren in omgeving","explanation":"Installeert het pakket seqtk (een tool om FASTA- of FASTQ-sequenties te verwerken) in versie 1.3 in de actieve omgeving. Zonder =versie krijg je de nieuwste versie.","parts":[{"m":"installeer een pakket","t":"conda install"},{"m":"vraag geen bevestiging","t":"--yes"},{"m":"naam van het pakket","t":"seqtk"},{"m":"gewenste versie (optioneel)","t":"=1.3"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":14,"createdAt":1790250000314,"id":"les_0315"},{"command":"conda list","tab":"linux","group":"Reproduceerbaar werken","title":"Geïnstalleerde pakketten tonen","explanation":"Toont alle pakketten in de actieve omgeving, met hun versie en het kanaal waaruit ze komen.","parts":[{"m":"lijst van geïnstalleerde pakketten","t":"conda list"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":14,"createdAt":1790250000315,"id":"les_0316"},{"command":"conda env export > my_tool.yaml","tab":"linux","group":"Reproduceerbaar werken","title":"Omgeving exporteren naar bestand","explanation":"Schrijft een beschrijving van de actieve omgeving (pakketten en versies) naar een yaml-bestand. Zo kun je je omgeving delen, bv. bij een publicatie.","parts":[{"m":"beschrijf de actieve omgeving","t":"conda env export"},{"m":"bewaar in het yaml-bestand","t":"> my_tool.yaml"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":15,"createdAt":1790250000317,"id":"les_0318"},{"command":"conda env create -n <env-name> --file <environment.yaml>","tab":"linux","group":"Reproduceerbaar werken","title":"Omgeving maken uit yaml-bestand","explanation":"Maakt op een ander systeem een nieuwe omgeving met exact de pakketten en versies uit het yaml-bestand.","parts":[{"m":"maak een omgeving","t":"conda env create"},{"m":"naam van de nieuwe omgeving","t":"-n <env-name>"},{"m":"het geëxporteerde yaml-bestand","t":"--file <environment.yaml>"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":15,"createdAt":1790250000318,"id":"les_0319"},{"command":"conda env update --file <environment.yaml>","tab":"linux","group":"Reproduceerbaar werken","title":"Bestaande omgeving bijwerken","explanation":"Installeert de pakketten uit het yaml-bestand in een bestaande omgeving.","parts":[{"m":"werk een omgeving bij","t":"conda env update"},{"m":"het yaml-bestand","t":"--file <environment.yaml>"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":15,"createdAt":1790250000319,"id":"les_0320"},{"command":"chroot map","tab":"linux","group":"Reproduceerbaar werken","title":"Programma opsluiten in een map","explanation":"Start een shell (of commando) waarbij de opgegeven map als root-map (/) geldt. Het programma kan niet buiten die map, zoals in een gevangenis (jail). Dit is een eenvoudige voorloper van containers; meestal zijn rootrechten nodig.","parts":[{"m":"change root: verander de root-map","t":"chroot"},{"m":"de map die de nieuwe / wordt","t":"map"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":17,"createdAt":1790250000321,"id":"les_0322"},{"command":"sudo docker run hello-world","tab":"linux","group":"Reproduceerbaar werken","title":"Docker-installatie testen","explanation":"Start een container van het testimage hello-world. Als het image nog niet lokaal staat, wordt het eerst gedownload. De boodschap bevestigt dat Docker werkt.","parts":[{"m":"start een container van een image","t":"docker run"},{"m":"klein testimage","t":"hello-world"}],"examples":[{"command":"sudo docker run hello-world","note":"","output":"Unable to find image 'hello-world:latest' locally\nlatest: Pulling from library/hello-world\nStatus: Downloaded newer image for hello-world:latest\nHello from Docker!\nThis message shows that your installation appears to be working correctly.","slide":22,"source":"les","sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":22,"createdAt":1790250000327,"id":"les_0328"},{"command":"docker pull ubuntu","tab":"linux","group":"Reproduceerbaar werken","title":"Image downloaden uit registry","explanation":"Downloadt het ubuntu-basisimage van Docker Hub naar je computer.","parts":[{"m":"download een image","t":"docker pull"},{"m":"naam van het image","t":"ubuntu"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":24,"createdAt":1790250000331,"id":"les_0332"},{"command":"docker pull biocontainers/fastqc:v0.11.9_cv8","tab":"linux","group":"Reproduceerbaar werken","title":"Specifieke imageversie downloaden","explanation":"Downloadt het fastqc-image van BioContainers in een vaste versie. Het deel na de dubbele punt is de tag (versie); zo gebruik je altijd exact dezelfde tool.","parts":[{"m":"naam van het image","t":"biocontainers/fastqc"},{"m":"tag: de versie","t":":v0.11.9_cv8"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":24,"createdAt":1790250000332,"id":"les_0333"},{"command":"docker images","tab":"linux","group":"Reproduceerbaar werken","title":"Lokale images oplijsten","explanation":"Toont alle images die lokaal op je computer staan, met hun naam, tag, IMAGE ID, ouderdom en grootte.","parts":[{"m":"lijst van lokale images","t":"docker images"}],"examples":[{"command":"docker images","note":"","output":"REPOSITORY TAG IMAGE ID CREATED SIZE\nubuntu latest 597ce1600cf4 7 days ago 72.8MB\nbiocontainers/fastqc v0.11.9_cv8 7b8f85bb68da 6 months ago 839MB","slide":25,"source":"les","sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":25,"createdAt":1790250000333,"id":"les_0334"},{"command":"docker rmi -f IMAGE_ID","tab":"linux","group":"Reproduceerbaar werken","title":"Image verwijderen","explanation":"Verwijdert een image van je computer. Met -f forceer je het verwijderen, ook als er nog een (gestopte) container van dat image bestaat. Het IMAGE_ID vind je met docker images.","parts":[{"m":"remove image","t":"docker rmi"},{"m":"forceer (optioneel)","t":"-f"},{"m":"ID van het image","t":"IMAGE_ID"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":25,"createdAt":1790250000334,"id":"les_0335"},{"command":"docker run ubuntu /bin/ls","tab":"linux","group":"Reproduceerbaar werken","title":"Commando in container uitvoeren","explanation":"Start een container van het ubuntu-image en voert er ls in uit; je ziet de inhoud van de root-map (/) van de container. De uitvoer gaat naar stdout en daarna stopt de container. Dit is een container op de voorgrond.","parts":[{"m":"start een nieuwe container","t":"docker run"},{"m":"het image","t":"ubuntu"},{"m":"het commando dat in de container draait","t":"/bin/ls"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":26,"createdAt":1790250000335,"id":"les_0336"},{"command":"docker run --rm --name","tab":"linux","group":"Reproduceerbaar werken","title":"Container benoemen en opruimen","explanation":"Nuttige opties bij docker run: --name geeft de container een eigen naam, zodat je hem later makkelijk kunt aanspreken. --rm verwijdert de container automatisch zodra hij stopt.","parts":[{"m":"geef de container een naam","t":"--name naam"},{"m":"verwijder de container na afloop","t":"--rm"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":27,"createdAt":1790250000336,"id":"les_0337"},{"command":"docker run -v /path/in/host/:/path/in/container/","tab":"linux","group":"Reproduceerbaar werken","title":"Hostmap in container koppelen","explanation":"Koppelt (bind mount) een map van je eigen computer aan een map in de container, bv. -v ~/data/:/data. Zo kan de container, die anders volledig afgeschermd is, je bestanden lezen en resultaten wegschrijven.","parts":[{"m":"volume: koppel een map","t":"-v"},{"m":"map op je eigen computer","t":"/path/in/host/"},{"m":"map in de container","t":"/path/in/container/"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":27,"createdAt":1790250000337,"id":"les_0338"},{"command":"docker run --rm -u=\"$(id -u):$(id -g)\" -v ~/fastq/:/data -w=\"/data\" biocontainers/fastqc:v0.11.9_cv8 /bin/bash -c \"fastqc WT*.fq.gz\"","tab":"linux","group":"Reproduceerbaar werken","title":"FastQC draaien in een container","explanation":"Voert fastqc uit op de fastq-bestanden in ~/fastq met het fastqc-image. De map wordt gekoppeld aan /data en /data is de werkmap; door je eigen gebruikers- en groeps-ID te gebruiken zijn de resultaatbestanden van jou. De html-resultaten open je daarna in je browser.","parts":[{"m":"verwijder de container na afloop","t":"--rm"},{"m":"gebruik je eigen gebruikers- en groeps-ID van de host","t":"-u=\"$(id -u):$(id -g)\""},{"m":"koppel ~/fastq aan /data in de container","t":"-v ~/fastq/:/data"},{"m":"werkmap in de container","t":"-w=\"/data\""},{"m":"het image","t":"biocontainers/fastqc:v0.11.9_cv8"},{"m":"laat bash het fastqc-commando uitvoeren (bash vult het jokerteken * in)","t":"/bin/bash -c \"fastqc WT*.fq.gz\""}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":28,"createdAt":1790250000338,"id":"les_0339"},{"command":"docker run --detach ubuntu sleep 100","tab":"linux","group":"Reproduceerbaar werken","title":"Container op achtergrond starten","explanation":"Start de container losgekoppeld (detached) op de achtergrond, als een daemon. Handig voor lange processen; je terminal blijft vrij. Je krijgt enkel het container-ID te zien.","parts":[{"m":"draai op de achtergrond (ook -d)","t":"--detach"},{"m":"commando dat 100 seconden wacht","t":"sleep 100"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":29,"createdAt":1790250000339,"id":"les_0340"},{"command":"docker run -it ubuntu /bin/bash","tab":"linux","group":"Reproduceerbaar werken","title":"Interactief in container werken","explanation":"Start een container en opent er een bash-shell in, zodat je zelf commando's in de container kunt typen. Met exit verlaat je de container.","parts":[{"m":"interactief: houd de invoer open","t":"-i"},{"m":"geef een terminal","t":"-t"},{"m":"start een bash-shell","t":"/bin/bash"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":29,"createdAt":1790250000340,"id":"les_0341"},{"command":"docker ps","tab":"linux","group":"Reproduceerbaar werken","title":"Draaiende containers tonen","explanation":"Toont de containers die op dit moment draaien, met onder andere hun CONTAINER ID en naam. Met docker ps -a zie je alle containers, ook de gestopte.","parts":[{"m":"lijst van draaiende containers","t":"docker ps"},{"m":"toon alle containers, ook gestopte","t":"-a"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":30,"createdAt":1790250000341,"id":"les_0342"},{"command":"docker stop CONTAINER_ID","tab":"linux","group":"Reproduceerbaar werken","title":"Draaiende container stoppen","explanation":"Stopt een container die draait. Je kunt het container-ID (via docker ps) of de naam gebruiken, bv. docker stop webserver.","parts":[{"m":"stop een container","t":"docker stop"},{"m":"ID of naam van de container","t":"CONTAINER_ID"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":30,"createdAt":1790250000342,"id":"les_0343"},{"command":"docker exec CONTAINER_ID command","tab":"linux","group":"Reproduceerbaar werken","title":"Commando in draaiende container","explanation":"Voert een nieuw commando uit in een container die al draait, bv. docker exec webserver curl localhost:80.","parts":[{"m":"voer uit in een bestaande container","t":"docker exec"},{"m":"ID of naam van de container","t":"CONTAINER_ID"},{"m":"het uit te voeren commando","t":"command"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":30,"createdAt":1790250000343,"id":"les_0344"},{"command":"docker rm -f CONTAINER_ID","tab":"linux","group":"Reproduceerbaar werken","title":"Container verwijderen","explanation":"Verwijdert een (gestopte) container. Met -f verwijder je ook een container die nog draait.","parts":[{"m":"verwijder een container","t":"docker rm"},{"m":"forceer, ook als hij nog draait (optioneel)","t":"-f"},{"m":"ID van de container (te vinden met docker ps -a)","t":"CONTAINER_ID"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":31,"createdAt":1790250000344,"id":"les_0345"},{"command":"docker system prune","tab":"linux","group":"Reproduceerbaar werken","title":"Alles van Docker opruimen","explanation":"Verwijdert in één keer alle gestopte containers, ongebruikte netwerken en ongebruikte (dangling) images en build-cache. Docker vraagt eerst om bevestiging.","parts":[{"m":"ruim ongebruikte Docker-onderdelen op","t":"docker system prune"}],"examples":[{"command":"docker system prune","note":"","output":"WARNING! This will remove:\n- all stopped containers\n- all networks not used by at least one container\n- all dangling images\n- all dangling build cache\nAre you sure you want to continue? [y/N]","slide":31,"source":"les","sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":31,"createdAt":1790250000345,"id":"les_0346"},{"command":"docker run --rm --detach --name webserver nginx","tab":"linux","group":"Reproduceerbaar werken","title":"Webserver-container starten","explanation":"Start een nginx-webserver in een container op de achtergrond met de naam webserver. Omdat de container afgeschermd is, kun je hem van op je eigen systeem niet bereiken; binnen de container wel (docker exec webserver curl localhost:80).","parts":[{"m":"verwijder na stoppen","t":"--rm"},{"m":"op de achtergrond","t":"--detach"},{"m":"naam van de container","t":"--name webserver"},{"m":"image van de nginx-webserver","t":"nginx"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":32,"createdAt":1790250000347,"id":"les_0348"},{"command":"docker run --detach --name webserver --publish 80:80 nginx","tab":"linux","group":"Reproduceerbaar werken","title":"Containerpoort openzetten naar host","explanation":"Start de webserver en koppelt poort 80 van je computer aan poort 80 in de container, zodat curl localhost:80 op je eigen systeem nu wel werkt. Met -p 8080:80 is de server op de host via poort 8080 bereikbaar, terwijl hij in de container op poort 80 blijft.","parts":[{"m":"poort host:poort container (kort: -p)","t":"--publish 80:80"},{"m":"hostpoort 8080 wijst naar containerpoort 80","t":"-p 8080:80"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":33,"createdAt":1790250000349,"id":"les_0350"},{"command":"FROM ubuntu:18.04","tab":"linux","group":"Reproduceerbaar werken","title":"Basis-image kiezen in Dockerfile","explanation":"Eerste instructie in een Dockerfile: het parent-image waarop je nieuwe image gebouwd wordt (de basislaag).","parts":[{"m":"kies het parent-image","t":"FROM"},{"m":"image en versie (tag)","t":"ubuntu:18.04"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":35,"createdAt":1790250000351,"id":"les_0352"},{"command":"RUN apt install -y wget","tab":"linux","group":"Reproduceerbaar werken","title":"Commando uitvoeren in Dockerfile","explanation":"Instructie in een Dockerfile die tijdens het bouwen een commando uitvoert (als root), hier wget installeren. Elke regel in de Dockerfile vormt een nieuwe laag in het image.","parts":[{"m":"voer dit commando uit bij het bouwen","t":"RUN"},{"m":"installeer wget zonder bevestiging te vragen","t":"apt install -y wget"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":35,"createdAt":1790250000352,"id":"les_0353"},{"command":"docker compose up","tab":"linux","group":"Reproduceerbaar werken","title":"Compose-containers bouwen en starten","explanation":"Leest het bestand docker-compose.yml in de huidige map en bouwt en start alle containers die erin beschreven staan.","parts":[{"m":"Docker compose-commando","t":"docker compose"},{"m":"bouw en start de containers","t":"up"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":38,"createdAt":1790250000355,"id":"les_0356"},{"command":"docker compose down","tab":"linux","group":"Reproduceerbaar werken","title":"Compose-containers stoppen en verwijderen","explanation":"Stopt de containers van het compose-bestand in de huidige map en verwijdert ze, samen met de bijhorende netwerken (en eventueel images en volumes).","parts":[{"m":"stop en ruim op","t":"down"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":39,"createdAt":1790250000356,"id":"les_0357"},{"command":"docker compose ps","tab":"linux","group":"Reproduceerbaar werken","title":"Compose-containers oplijsten","explanation":"Toont de draaiende containers van Docker compose.","parts":[{"m":"lijst van containers","t":"ps"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":39,"createdAt":1790250000357,"id":"les_0358"},{"command":"docker compose exec","tab":"linux","group":"Reproduceerbaar werken","title":"Commando in compose-container","explanation":"Voert een commando uit in een draaiende container van Docker compose, zoals docker exec, bv. docker compose exec dienstnaam bash.","parts":[{"m":"voer een commando uit in een container","t":"exec"},{"m":"naam van de dienst en het commando","t":"…"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":39,"createdAt":1790250000358,"id":"les_0359"},{"command":"podman run ubuntu /bin/ls","tab":"linux","group":"Reproduceerbaar werken","title":"Container draaien met Podman","explanation":"Doet hetzelfde als docker run ubuntu /bin/ls, maar met Podman: bijna alle docker-commando's werken door docker te vervangen door podman.","parts":[{"m":"start een container met Podman","t":"podman run"},{"m":"het image","t":"ubuntu"},{"m":"het commando in de container","t":"/bin/ls"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":41,"createdAt":1790250000360,"id":"les_0361"},{"command":"read VARIABELE","tab":"linux","group":"Scripts","title":"Invoer van gebruiker inlezen","explanation":"Wacht tot de gebruiker iets typt en Enter drukt, en bewaart dat in een variabele. Met $VARIABELE gebruik je het daarna.","parts":[{"m":"lees een regel invoer","t":"read"},{"m":"naam waarin de invoer bewaard wordt, bv. NAME","t":"VARIABELE"}],"examples":[{"command":"read VARIABELE","note":"De naam jasper wordt in NAME bewaard en daarna afgedrukt.","output":"[guest@fedora ~]$ read NAME\njasper\n[guest@fedora ~]$ echo Welcome $NAME\nWelcome jasper","slide":24,"source":"les","sourceName":"Chapter 5 - Input and output.pptx"}],"sourceName":"Chapter 5 - Input and output.pptx","slide":24,"createdAt":1790250000194,"id":"les_0195"},{"command":"bash script_name","tab":"linux","group":"Scripts","title":"Script uitvoeren met bash","explanation":"Voert een shellscript uit met bash, ook als het nog niet uitvoerbaar gemaakt is. Zo start je bv. het Miniconda-installatiescript.","parts":[{"m":"de shell die het script uitvoert","t":"bash"},{"m":"naam van het script","t":"script_name"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":11,"createdAt":1790250000306,"id":"les_0307"},{"command":"#!/bin/bash","tab":"linux","group":"Scripts","title":"Shebang: bash leest het script","explanation":"De eerste regel van een script, de shebang (hash bang #!). Erachter staat het pad naar het programma dat het script moet uitvoeren, meestal bash.","parts":[{"m":"shebang: markeert het begin van een script","t":"#!"},{"m":"pad naar de shell die het script leest","t":"/bin/bash"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":5,"createdAt":1790250000363,"id":"les_0364"},{"command":"# commentaar","tab":"linux","group":"Scripts","title":"Commentaar in een script","explanation":"Alles na een # op een regel is commentaar: bash voert het niet uit. Je gebruikt het om uitleg bij je script te schrijven.","parts":[{"m":"begin van commentaar","t":"#"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":5,"createdAt":1790250000364,"id":"les_0365"},{"command":"chmod 755 script_name.sh","tab":"linux","group":"Scripts","title":"Script uitvoerbaar maken (cijfers)","explanation":"Geeft de eigenaar lees-, schrijf- en uitvoerrechten (rwx) en de groep en anderen lees- en uitvoerrechten (r-x). Zo wordt het script uitvoerbaar.","parts":[{"m":"wijzig rechten","t":"chmod"},{"m":"eigenaar: rwx (4+2+1)","t":"7"},{"m":"groep: r-x (4+1)","t":"5"},{"m":"anderen: r-x (4+1)","t":"5"},{"m":"het script","t":"script_name.sh"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":6,"createdAt":1790250000366,"id":"les_0367"},{"command":"chmod a+x script_name.sh","tab":"linux","group":"Scripts","title":"Uitvoerrecht voor iedereen geven","explanation":"Voegt het uitvoerrecht (x) toe voor alle gebruikers: eigenaar, groep en anderen.","parts":[{"m":"all: iedereen","t":"a"},{"m":"voeg uitvoerrecht toe","t":"+x"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":6,"createdAt":1790250000367,"id":"les_0368"},{"command":"./script_name.sh","tab":"linux","group":"Scripts","title":"Script in huidige map uitvoeren","explanation":"Voert het script uit dat in de huidige map staat. Met ./ zeg je expliciet dat het script in deze map staat, want de huidige map zit meestal niet in PATH.","parts":[{"m":"de huidige map","t":"./"},{"m":"naam van het (uitvoerbare) script","t":"script_name.sh"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":6,"createdAt":1790250000368,"id":"les_0369"},{"command":"$0","tab":"linux","group":"Scripts","title":"Naam van het script","explanation":"Binnen een script bevat $0 de naam van het script zelf, zoals je het opgestart hebt.","parts":[{"m":"naam van het script","t":"$0"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":11,"createdAt":1790250000374,"id":"les_0375"},{"command":"$1, $2, …","tab":"linux","group":"Scripts","title":"Argumenten van het script","explanation":"Positionele parameters: $1 is het eerste argument dat je na de scriptnaam typt, $2 het tweede, enzovoort. Bij ./script_name.sh parameter1 parameter2 is $1 gelijk aan parameter1.","parts":[{"m":"eerste argument","t":"$1"},{"m":"tweede argument","t":"$2"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":11,"createdAt":1790250000375,"id":"les_0376"},{"command":"\\$VALUE","tab":"linux","group":"Scripts","title":"Backslash: teken niet interpreteren","explanation":"Een backslash zorgt dat het volgende teken niet geïnterpreteerd wordt. echo \\$VALUE toont dus letterlijk $VALUE in plaats van de waarde van de variabele.","parts":[{"m":"het volgende teken letterlijk nemen","t":"\\"},{"m":"wordt letterlijk getoond","t":"$VALUE"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":12,"createdAt":1790250000376,"id":"les_0377"},{"command":"'$VALUE'","tab":"linux","group":"Scripts","title":"Enkele aanhalingstekens: alles letterlijk","explanation":"Tussen enkele aanhalingstekens wordt niets geïnterpreteerd. echo '$VALUE' toont letterlijk $VALUE.","parts":[{"m":"alle tekst ertussen letterlijk nemen","t":"' '"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":12,"createdAt":1790250000377,"id":"les_0378"},{"command":"\"$VALUE\"","tab":"linux","group":"Scripts","title":"Dubbele aanhalingstekens rond variabele","explanation":"Tussen dubbele aanhalingstekens wordt tekst letterlijk genomen, behalve $, ` en !. Een variabele wordt dus wel vervangen door haar waarde. Zet variabelen tussen dubbele aanhalingstekens als ze spaties kunnen bevatten: dan wordt de waarde als één geheel gezien in plaats van als losse woorden.","parts":[{"m":"letterlijk, behalve $, ` en !","t":"\" \""},{"m":"wordt vervangen door de waarde","t":"$VALUE"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":13,"createdAt":1790250000378,"id":"les_0379"},{"command":"$(commando)","tab":"linux","group":"Scripts","title":"Uitvoer van commando gebruiken","explanation":"Commandosubstitutie: het commando wordt uitgevoerd en de uitvoer komt op die plaats in de opdracht. Zo geef je een variabele een waarde die een commando berekent, bv. TODAY=$(date +%A). Dit is de aangeraden manier.","parts":[{"m":"voer het commando uit en gebruik de uitvoer","t":"$( )"},{"m":"het uit te voeren commando","t":"commando"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":14,"createdAt":1790250000380,"id":"les_0381"},{"command":"`commando`","tab":"linux","group":"Scripts","title":"Oude vorm van commandosubstitutie","explanation":"Backticks (`) doen hetzelfde als $(commando): de uitvoer van het commando wordt ingevuld. Verwar ze niet met enkele aanhalingstekens ('), die alles letterlijk laten. $( ) is de voorkeur.","parts":[{"m":"backticks: voer het commando ertussen uit","t":"` `"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":14,"createdAt":1790250000381,"id":"les_0382"},{"command":"TODAY=$(date +%A)","tab":"linux","group":"Scripts","title":"Uitvoer in variabele bewaren","explanation":"Bewaart de dag van de week in de variabele TODAY; echo $TODAY toont bv. Monday. Let op: TODAY='date +%A' (enkele aanhalingstekens) bewaart gewoon de tekst date +%A, terwijl backticks (`date +%A`) wel het commando uitvoeren.","parts":[{"m":"variabele TODAY krijgt een waarde","t":"TODAY="},{"m":"de uitvoer van date +%A","t":"$(date +%A)"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":15,"createdAt":1790250000382,"id":"les_0383"},{"command":"${VARIABLE:-word}","tab":"linux","group":"Scripts","title":"Standaardwaarde als variabele leeg is","explanation":"Geeft de waarde van VARIABLE terug; als die niet bestaat (of leeg is), wordt word gebruikt. De variabele zelf verandert niet.","parts":[{"m":"de te controleren variabele","t":"VARIABLE"},{"m":"gebruik anders deze waarde","t":":-"},{"m":"de standaardwaarde","t":"word"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":18,"createdAt":1790250000383,"id":"les_0384"},{"command":"${VARIABLE:=word}","tab":"linux","group":"Scripts","title":"Variabele standaardwaarde toekennen","explanation":"Als VARIABLE niet bestaat (of leeg is), krijgt ze de waarde word en wordt die teruggegeven. Daarna heeft de variabele die waarde echt.","parts":[{"m":"ken deze waarde toe als de variabele nog niet bestaat","t":":="},{"m":"de standaardwaarde","t":"word"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":18,"createdAt":1790250000384,"id":"les_0385"},{"command":"${VARIABLE:?error_message}","tab":"linux","group":"Scripts","title":"Stoppen als variabele ontbreekt","explanation":"Als VARIABLE niet bestaat (of leeg is), stopt het script en verschijnt de foutmelding. Handig om te controleren of een verplicht argument opgegeven is, bv. ${1:?geef een bestandsnaam}.","parts":[{"m":"stop met foutmelding als de variabele ontbreekt","t":":?"},{"m":"de foutmelding","t":"error_message"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":18,"createdAt":1790250000385,"id":"les_0386"},{"command":"${VAR#/*/}","tab":"linux","group":"Scripts","title":"Kortste match links weghalen","explanation":"Verwijdert vanaf het begin (links) het kortste stuk tekst dat op het patroon /*/ past. Met VAR=/one/two/three/four/ geeft echo ${VAR#/*/} het resultaat two/three/four/.","parts":[{"m":"verwijder van links, kortste match","t":"#"},{"m":"patroon: een / tot de volgende /","t":"/*/"}],"examples":[{"command":"${VAR#/*/}","note":"","output":"two/three/four/","slide":19,"source":"les","sourceName":"Chapter 9 - Shell scripting - student.pptx"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":19,"createdAt":1790250000386,"id":"les_0387"},{"command":"${VAR##/*/}","tab":"linux","group":"Scripts","title":"Langste match links weghalen","explanation":"Verwijdert vanaf het begin het langste stuk dat op het patroon past. Met VAR=/one/two/three/four/ past het patroon /*/ op de hele tekst, dus het resultaat is leeg. Bij een pad zonder / op het einde houd je zo enkel de bestandsnaam over.","parts":[{"m":"verwijder van links, langste match","t":"##"},{"m":"patroon: van de eerste tot de laatste /","t":"/*/"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":19,"createdAt":1790250000387,"id":"les_0388"},{"command":"${VAR%.*}","tab":"linux","group":"Scripts","title":"Kortste match rechts weghalen","explanation":"Verwijdert vanaf het einde (rechts) het kortste stuk dat op het patroon .* past. Met VAR=/usr/bin/info.hallo.tk is het resultaat /usr/bin/info.hallo. Handig om een extensie te verwijderen.","parts":[{"m":"verwijder van rechts, kortste match","t":"%"},{"m":"patroon: een punt gevolgd door eender wat","t":".*"}],"examples":[{"command":"${VAR%.*}","note":"","output":"/usr/bin/info.hallo","slide":20,"source":"les","sourceName":"Chapter 9 - Shell scripting - student.pptx"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":20,"createdAt":1790250000388,"id":"les_0389"},{"command":"${VAR%%.*}","tab":"linux","group":"Scripts","title":"Langste match rechts weghalen","explanation":"Verwijdert vanaf het einde het langste stuk dat op .* past, dus alles vanaf de eerste punt. Met VAR=/usr/bin/info.hallo.tk is het resultaat /usr/bin/info.","parts":[{"m":"verwijder van rechts, langste match","t":"%%"},{"m":"patroon: een punt gevolgd door eender wat","t":".*"}],"examples":[{"command":"${VAR%%.*}","note":"","output":"/usr/bin/info","slide":20,"source":"les","sourceName":"Chapter 9 - Shell scripting - student.pptx"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":20,"createdAt":1790250000389,"id":"les_0390"},{"command":"${VAR/one/four}","tab":"linux","group":"Scripts","title":"Eerste match vervangen","explanation":"Vervangt de eerste keer dat one voorkomt door four. Met VAR=/one/two/three/two/one/ is het resultaat /four/two/three/two/one/.","parts":[{"m":"vervang de eerste match","t":"/"},{"m":"te zoeken tekst","t":"one"},{"m":"vervangtekst","t":"four"}],"examples":[{"command":"${VAR/one/four}","note":"","output":"/four/two/three/two/one/","slide":21,"source":"les","sourceName":"Chapter 9 - Shell scripting - student.pptx"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":21,"createdAt":1790250000390,"id":"les_0391"},{"command":"${VAR//one/four}","tab":"linux","group":"Scripts","title":"Alle matches vervangen","explanation":"Vervangt elke keer dat one voorkomt door four. Met VAR=/one/two/three/two/one/ is het resultaat /four/two/three/two/four/.","parts":[{"m":"vervang alle matches","t":"//"},{"m":"te zoeken tekst","t":"one"},{"m":"vervangtekst","t":"four"}],"examples":[{"command":"${VAR//one/four}","note":"","output":"/four/two/three/two/four/","slide":21,"source":"les","sourceName":"Chapter 9 - Shell scripting - student.pptx"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":21,"createdAt":1790250000391,"id":"les_0392"},{"command":"COUNTER=$((COUNTER+1))","tab":"linux","group":"Scripts","title":"Rekenen met variabelen","explanation":"Berekent de som tussen $(( )) en bewaart het resultaat: hier wordt COUNTER met 1 verhoogd. Mogelijke bewerkingen: + (optellen), - (aftrekken), * (vermenigvuldigen), / (delen, enkel gehele getallen) en % (modulo = rest na deling).","parts":[{"m":"voer de berekening uit","t":"$(( ))"},{"m":"de berekening","t":"COUNTER+1"},{"m":"optellen, aftrekken, vermenigvuldigen, delen, rest (modulo)","t":"+ - * / %"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":24,"createdAt":1790250000393,"id":"les_0394"},{"command":"test -f /etc/passwd","tab":"linux","group":"Scripts","title":"Testen of iets een bestand is","explanation":"test controleert een voorwaarde en geeft een exitstatus terug: 0 als het klopt, 1 als het niet klopt. -f test of het pad een gewoon bestand is. Alle mogelijke tests vind je met man test.","parts":[{"m":"controleer een voorwaarde","t":"test"},{"m":"is het een (gewoon) bestand?","t":"-f"},{"m":"het te testen pad","t":"/etc/passwd"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":25,"createdAt":1790250000394,"id":"les_0395"},{"command":"[ string1 = string2 ]","tab":"linux","group":"Scripts","title":"Korte schrijfwijze van test","expla
