"id":"les_0237"},{"command":"gzip bestand","tab":"linux","group":"Archieven & compressie","title":"Bestand comprimeren met gzip","explanation":"Comprimeert een bestand tot bestand.gz zodat het minder ruimte inneemt. Let op: het originele bestand wordt verwijderd.","parts":[{"m":"GNU zip: comprimeer","t":"gzip"},{"m":"het te comprimeren bestand","t":"bestand"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":27,"createdAt":1790250000238,"id":"les_0239"},{"command":"bzip2 bestand","tab":"linux","group":"Archieven & compressie","title":"Bestand comprimeren met bzip2","explanation":"Alternatieve compressiemethode; maakt bestand.bz2. Ook hier wordt het originele bestand verwijderd.","parts":[{"m":"comprimeer met bzip2","t":"bzip2"},{"m":"het te comprimeren bestand","t":"bestand"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":27,"createdAt":1790250000239,"id":"les_0240"},{"command":"zcat / zless / zgrep","tab":"linux","group":"Archieven & compressie","title":"Gzip-bestand lezen zonder uitpakken","explanation":"Werken zoals cat, less en grep, maar dan rechtstreeks op .gz-bestanden, zonder ze eerst te decomprimeren. Bv. zgrep Desktop file.gz.","parts":[{"m":"toon inhoud van .gz","t":"zcat"},{"m":"blader door .gz","t":"zless"},{"m":"zoek in .gz","t":"zgrep"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":28,"createdAt":1790250000240,"id":"les_0241"},{"command":"bzcat / bzless / bzgrep","tab":"linux","group":"Archieven & compressie","title":"Bzip2-bestand lezen zonder uitpakken","explanation":"Zoals cat, less en grep, maar voor .bz2-bestanden.","parts":[{"m":"toon inhoud van .bz2","t":"bzcat"},{"m":"blader door .bz2","t":"bzless"},{"m":"zoek in .bz2","t":"bzgrep"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":28,"createdAt":1790250000241,"id":"les_0242"},{"command":"zipgrep patroon bestand.zip","tab":"linux","group":"Archieven & compressie","title":"Zoeken in zip-bestand","explanation":"Zoekt zoals grep in de bestanden binnen een .zip-bestand, zonder het uit te pakken. (De dia noemt ook zipless voor .zip-bestanden.)","parts":[{"m":"grep voor .zip-bestanden","t":"zipgrep"},{"m":"wat je zoekt","t":"patroon"},{"m":"het zip-bestand","t":"bestand.zip"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":28,"createdAt":1790250000242,"id":"les_0243"},{"command":"gunzip bestand.gz","tab":"linux","group":"Archieven & compressie","title":"gzip-bestand decomprimeren","explanation":"Zet een .gz-bestand terug om naar het originele bestand. Het gecomprimeerde bestand wordt daarbij verwijderd.","parts":[{"m":"decomprimeer gzip","t":"gunzip"},{"m":"gecomprimeerd bestand","t":"bestand.gz"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":29,"createdAt":1790250000243,"id":"les_0244"},{"command":"bunzip2 bestand.bz2","tab":"linux","group":"Archieven & compressie","title":"bzip2-bestand decomprimeren","explanation":"Zet een .bz2-bestand terug om naar het originele bestand. Het gecomprimeerde bestand wordt verwijderd.","parts":[{"m":"decomprimeer bzip2","t":"bunzip2"},{"m":"gecomprimeerd bestand","t":"bestand.bz2"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":29,"createdAt":1790250000244,"id":"les_0245"},{"command":"tar -czvf archief.tar.gz map","tab":"linux","group":"Archieven & compressie","title":"Gecomprimeerd archief maken","explanation":"Maakt in één stap een archief én comprimeert het met gzip (optie -z). Zo krijg je een .tar.gz-bestand.","parts":[{"m":"maak archief","t":"-c"},{"m":"gebruik gzip-compressie","t":"-z"},{"m":"toon wat er gebeurt","t":"-v"},{"m":"naam van het archief","t":"-f archief.tar.gz"},{"m":"wat erin moet","t":"map"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":30,"createdAt":1790250000245,"id":"les_0246"},{"command":"tar -xzvf bestand.tar.gz","tab":"linux","group":"Archieven & compressie","title":"Gecomprimeerd archief uitpakken","explanation":"Pakt een .tar.gz-archief in één stap uit en decomprimeert het. Wordt bv. gebruikt voor broncode van software.","parts":[{"m":"pak uit","t":"-x"},{"m":"decomprimeer met gzip","t":"-z"},{"m":"toon wat er gebeurt","t":"-v"},{"m":"naam van het archief","t":"-f bestand.tar.gz"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":36,"createdAt":1790250000253,"id":"les_0254"},{"command":"mkdir -p data/ruw","tab":"linux","group":"Bestanden & mappen","title":"Maak mappen aan","explanation":"Maakt de map 'data' en daarin 'ruw' aan in één keer. Bestaan ze al, dan krijg je geen foutmelding.","parts":[{"m":"maak een map","t":"mkdir"},{"m":"maak ook tussenliggende mappen; geen fout als ze al bestaan","t":"-p"},{"m":"pad van de nieuwe map","t":"data/ruw"}],"createdAt":1790233200000,"id":"ex_mkdir"},{"command":"touch [option(s)] file(s)","tab":"linux","group":"Bestanden & mappen","title":"Leeg bestand aanmaken","explanation":"Maakt snel een nieuw, leeg tekstbestand aan (0 kB). Bestaat het bestand al, dan wordt enkel de datum van laatste wijziging aangepast.","parts":[{"m":"maak bestand aan","t":"touch"},{"m":"naam van één of meer bestanden","t":"file(s)"}],"examples":[{"command":"touch [option(s)] file(s)","note":"touch file1 file2 maakt twee lege bestanden aan.","output":"","slide":13,"source":"les","sourceName":"Chapter 3 - Organizing files.pptx"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":13,"createdAt":1790250000076,"id":"les_0077"},{"command":"cp ./source file ./destination file","tab":"linux","group":"Bestanden & mappen","title":"Bestand kopiëren","explanation":"Maakt een exacte kopie van een bestand. Let op: bestaat het doelbestand al, dan wordt het zonder waarschuwing overschreven! Zonder pad werkt cp in de huidige map.","parts":[{"m":"copy: kopieer","t":"cp"},{"m":"bronbestand","t":"./source file"},{"m":"naam/pad van de kopie","t":"./destination file"}],"examples":[{"command":"cp ./source file ./destination file","note":"cp file1 file3 maakt een kopie van file1 met de naam file3.","output":"","slide":14,"source":"les","sourceName":"Chapter 3 - Organizing files.pptx"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":14,"createdAt":1790250000078,"id":"les_0079"},{"command":"cp file3 ~/Downloads","tab":"linux","group":"Bestanden & mappen","title":"Kopiëren naar map, zelfde naam","explanation":"Geef je als doel enkel een map (zonder bestandsnaam), dan krijgt de kopie dezelfde naam als het origineel.","parts":[{"m":"kopieer","t":"cp"},{"m":"bronbestand","t":"file3"},{"m":"doelmap; naam blijft file3","t":"~/Downloads"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":15,"createdAt":1790250000080,"id":"les_0081"},{"command":"cp file{1,2} ~/Downloads","tab":"linux","group":"Bestanden & mappen","title":"Meerdere bestanden tegelijk kopiëren","explanation":"Kopieert file1 en file2 samen naar ~/Downloads. Bij meerdere bronbestanden moet het laatste argument een map zijn. De accolades worden uitgebreid tot file1 file2.","parts":[{"m":"kopieer","t":"cp"},{"m":"wordt file1 file2","t":"file{1,2}"},{"m":"laatste argument = doelmap","t":"~/Downloads"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":16,"createdAt":1790250000081,"id":"les_0082"},{"command":"mv file3 P00687.fasta","tab":"linux","group":"Bestanden & mappen","title":"Bestand hernoemen","explanation":"mv verplaatst en/of hernoemt bestanden. Blijft het bestand in dezelfde map, dan krijgt het gewoon een nieuwe naam.","parts":[{"m":"move: verplaats/hernoem","t":"mv"},{"m":"huidige naam","t":"file3"},{"m":"nieuwe naam","t":"P00687.fasta"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":17,"createdAt":1790250000082,"id":"les_0083"},{"command":"mv ~/Documents/P00687.fasta .","tab":"linux","group":"Bestanden & mappen","title":"Bestand naar huidige map verplaatsen","explanation":"Verplaatst het bestand uit ~/Documents naar de map waarin je nu bent (.).","parts":[{"m":"verplaats","t":"mv"},{"m":"bestand dat verplaatst wordt","t":"~/Documents/P00687.fasta"},{"m":"doel: huidige map","t":"."}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":17,"createdAt":1790250000083,"id":"les_0084"},{"command":"rm file(s)","tab":"linux","group":"Bestanden & mappen","title":"Bestanden verwijderen","explanation":"Verwijdert één of meer bestanden. Let op: er is geen prullenbak, het bestand is echt weg.","parts":[{"m":"remove: verwijder","t":"rm"},{"m":"één of meer bestanden","t":"file(s)"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":18,"createdAt":1790250000084,"id":"les_0085"},{"command":"rm ~/Documents/file? ~/Downloads/file?","tab":"linux","group":"Bestanden & mappen","title":"Bestanden met jokerteken verwijderen","explanation":"Verwijdert in ~/Documents en ~/Downloads alle bestanden met 'file' + precies één teken, zoals file1, file2 en file3.","parts":[{"m":"verwijder","t":"rm"},{"m":"file gevolgd door één willekeurig teken","t":"file?"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":18,"createdAt":1790250000085,"id":"les_0086"},{"command":"ln target linkname","tab":"linux","group":"Bestanden & mappen","title":"Hardlink maken","explanation":"Maakt een hardlink: een tweede naam (linkname) voor dezelfde data als target.","parts":[{"m":"link: maak een link","t":"ln"},{"m":"bestaand bestand","t":"target"},{"m":"naam van de nieuwe link","t":"linkname"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":27,"createdAt":1790250000098,"id":"les_0099"},{"command":"ln -s file1 link_to_file1","tab":"linux","group":"Bestanden & mappen","title":"Symbolische link maken","explanation":"Maakt een symbolische link link_to_file1 die naar file1 wijst. Met ls -l zie je de link als link_to_file1 -> file1.","parts":[{"m":"maak een link","t":"ln"},{"m":"symbolic: symbolische link","t":"-s"},{"m":"doel (target)","t":"file1"},{"m":"naam van de link","t":"link_to_file1"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":27,"createdAt":1790250000099,"id":"les_0100"},{"command":"basename /home/guest/file.txt","tab":"linux","group":"Bestanden & mappen","title":"Bestandsnaam uit pad halen","explanation":"Haalt uit een volledig pad enkel de bestandsnaam.","parts":[{"m":"geef laatste deel van pad","t":"basename"},{"m":"absoluut pad","t":"/home/guest/file.txt"}],"examples":[{"command":"basename /home/guest/file.txt","note":"","output":"file.txt","slide":29,"source":"les","sourceName":"Chapter 3 - Organizing files.pptx"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":29,"createdAt":1790250000100,"id":"les_0101"},{"command":"dirname /home/guest/file.txt","tab":"linux","group":"Bestanden & mappen","title":"Mappad uit pad halen","explanation":"Haalt uit een volledig pad enkel de map waarin het bestand staat.","parts":[{"m":"geef mapdeel van pad","t":"dirname"},{"m":"absoluut pad","t":"/home/guest/file.txt"}],"examples":[{"command":"dirname /home/guest/file.txt","note":"","output":"/home/guest","slide":29,"source":"les","sourceName":"Chapter 3 - Organizing files.pptx"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":29,"createdAt":1790250000101,"id":"les_0102"},{"command":"mkdir directory(ies)","tab":"linux","group":"Bestanden & mappen","title":"Nieuwe map aanmaken","explanation":"Maakt één of meer nieuwe mappen; relatieve en absolute paden kunnen. Bv. mkdir folder1 folder2.","parts":[{"m":"make directory","t":"mkdir"},{"m":"naam van één of meer mappen","t":"directory(ies)"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":30,"createdAt":1790250000102,"id":"les_0103"},{"command":"rmdir directory(ies)","tab":"linux","group":"Bestanden & mappen","title":"Lege map verwijderen","explanation":"Verwijdert één of meer mappen, maar enkel als ze leeg zijn. Bv. rmdir folder* verwijdert alle lege mappen die met folder beginnen.","parts":[{"m":"remove directory","t":"rmdir"},{"m":"lege map(pen)","t":"directory(ies)"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":30,"createdAt":1790250000103,"id":"les_0104"},{"command":"head -n 20 sequentie.fasta","tab":"linux","group":"Bestanden bekijken","title":"Toon de eerste 20 regels","explanation":"Toont de eerste 20 regels van een FASTA-bestand, handig om snel te zien hoe het bestand eruitziet zonder alles te openen.","parts":[{"m":"toon begin van bestand","t":"head"},{"m":"aantal regels: 20","t":"-n 20"},{"m":"het bestand","t":"sequentie.fasta"}],"createdAt":1790233200000,"id":"ex_head"},{"command":"echo \"thx mate :)\"","tab":"linux","group":"Bestanden bekijken","title":"Print tekst op het scherm","explanation":"Schrijft de tekst tussen aanhalingstekens gewoon terug naar het scherm. De aanhalingstekens zorgen dat spaties en tekens zoals :) als één stuk tekst gezien worden.","parts":[{"m":"print tekst","t":"echo"},{"m":"de tekst die geprint wordt","t":"\"thx mate :)\""}],"createdAt":1790240000000,"id":"s2_echo"},{"command":"ls -a","tab":"linux","group":"Bestanden bekijken","title":"Ook verborgen bestanden tonen","explanation":"Toont alle bestanden, ook de verborgen bestanden (namen die met een punt beginnen, zoals .bashrc, en ook . en ..).","parts":[{"m":"toon inhoud van map","t":"ls"},{"m":"all: ook verborgen bestanden","t":"-a"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":9,"createdAt":1790250000015,"id":"les_0016"},{"command":"ls -al","tab":"linux","group":"Bestanden bekijken","title":"Opties -a en -l combineren","explanation":"Toont alle bestanden (ook verborgen) als lange lijst met eigenschappen. Opties met één letter mag je combineren: ls -a -l, ls -al en ls -la doen hetzelfde.","parts":[{"m":"toon inhoud van map","t":"ls"},{"m":"ook verborgen bestanden","t":"-a"},{"m":"lange lijst met eigenschappen","t":"-l"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":9,"createdAt":1790250000016,"id":"les_0017"},{"command":"ls /etc","tab":"linux","group":"Bestanden bekijken","title":"Inhoud van een andere map tonen","explanation":"Toont de inhoud van de map /etc zonder dat je er naartoe gaat. Het argument /etc is het pad waarop het commando werkt; /etc bevat de configuratiebestanden.","parts":[{"m":"toon inhoud van map","t":"ls"},{"m":"argument: absoluut pad naar configuratiemap","t":"/etc"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":11,"createdAt":1790250000019,"id":"les_0020"},{"command":"ls -F","tab":"linux","group":"Bestanden bekijken","title":"Bestandstype met teken aanduiden","explanation":"Zet achter elke naam een teken dat het bestandstype toont: / map, * uitvoerbaar bestand, @ link, = socket, | named pipe. Gewone bestanden krijgen geen teken.","parts":[{"m":"toon inhoud van map","t":"ls"},{"m":"classify: teken achter naam volgens type","t":"-F"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":12,"createdAt":1790250000020,"id":"les_0021"},{"command":"ls -l","tab":"linux","group":"Bestanden bekijken","title":"Lijst met eigenschappen tonen","explanation":"Toont de inhoud als lange lijst met eigenschappen: bestandstype en rechten, aantal hardlinks, eigenaar, groep, grootte, datum en naam. Het eerste teken toont het type: - gewoon bestand, d map, l link, s socket, p named pipe, b block device, c character device.","parts":[{"m":"toon inhoud van map","t":"ls"},{"m":"long: lange lijst met eigenschappen","t":"-l"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":14,"createdAt":1790250000021,"id":"les_0022"},{"command":"wc","tab":"linux","group":"Bestanden bekijken","title":"Regels, woorden en tekens tellen","explanation":"wc (word count) telt in een bestand het aantal regels, woorden en bytes (tekens), in die volgorde. Algemene vorm: wc [opties] [bestanden].","parts":[{"m":"word count","t":"wc"},{"m":"het bestand dat geteld wordt","t":"file.txt"}],"examples":[{"command":"wc","note":"wc file.txt toont 20 regels, 166 woorden en 924 tekens.","output":"20 166 924 file.txt","slide":16,"source":"les","sourceName":"Chapter 2 - The terminal.pptx"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":16,"createdAt":1790250000025,"id":"les_0026"},{"command":"wc -l","tab":"linux","group":"Bestanden bekijken","title":"Aantal regels tellen","explanation":"Toont enkel het aantal regels van een bestand.","parts":[{"m":"word count","t":"wc"},{"m":"lines: tel enkel regels","t":"-l"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":16,"createdAt":1790250000026,"id":"les_0027"},{"command":"wc -w","tab":"linux","group":"Bestanden bekijken","title":"Aantal woorden tellen","explanation":"Toont enkel het aantal woorden van een bestand. Combineren kan: wc -lw of wc -wl toont regels en woorden.","parts":[{"m":"word count","t":"wc"},{"m":"words: tel enkel woorden","t":"-w"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":16,"createdAt":1790250000027,"id":"les_0028"},{"command":"tree -FL 1 /","tab":"linux","group":"Bestanden bekijken","title":"Mappenstructuur als boom tonen","explanation":"Toont de inhoud van de root / als boomstructuur, hier maar 1 niveau diep, met een teken achter elke naam volgens het type.","parts":[{"m":"toon mappen als boom","t":"tree"},{"m":"teken achter naam volgens type (/ = map)","t":"-F"},{"m":"maximaal 1 niveau diep","t":"-L 1"},{"m":"start bij de root","t":"/"}],"examples":[{"command":"tree -FL 1 /","note":"","output":"20 directories, 0 files","slide":10,"source":"les","sourceName":"Chapter 3 - Organizing files.pptx"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":10,"createdAt":1790250000075,"id":"les_0076"},{"command":"ls -alF","tab":"linux","group":"Bestanden bekijken","title":"Alles tonen met details en type","explanation":"Combineert drie opties: alle bestanden (ook verborgen), als lange lijst, met een teken achter de naam volgens het type.","parts":[{"m":"ook verborgen bestanden","t":"-a"},{"m":"lange lijst met eigenschappen","t":"-l"},{"m":"teken volgens type (/ map, * uitvoerbaar, @ link)","t":"-F"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":13,"createdAt":1790250000077,"id":"les_0078"},{"command":"file [file(s)]","tab":"linux","group":"Bestanden bekijken","title":"Bestandstype achterhalen","explanation":"Toont wat voor soort bestand iets is (bv. map, tekst, PNG-afbeelding, programma), soms met extra info zoals de grootte. Handig omdat Linux geen extensies nodig heeft.","parts":[{"m":"bepaal het type","t":"file"},{"m":"één of meer bestanden, bv. /etc/profile","t":"[file(s)]"}],"examples":[{"command":"file [file(s)]","note":"file Desktop meldt dat Desktop een map (directory) is.","output":"","slide":19,"source":"les","sourceName":"Chapter 3 - Organizing files.pptx"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":19,"createdAt":1790250000086,"id":"les_0087"},{"command":"cat file(s)","tab":"linux","group":"Bestanden bekijken","title":"Inhoud van tekstbestand tonen","explanation":"Toont de volledige inhoud van één of meer tekstbestanden in de terminal, bv. cat /etc/fedora-release.","parts":[{"m":"toon (concatenate) inhoud","t":"cat"},{"m":"één of meer tekstbestanden","t":"file(s)"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":20,"createdAt":1790250000087,"id":"les_0088"},{"command":"less file(s)","tab":"linux","group":"Bestanden bekijken","title":"Bestand pagina per pagina lezen","explanation":"Toont de inhoud van een bestand scherm per scherm, zodat je door lange bestanden kan bladeren. Stop met q.","parts":[{"m":"toon per pagina","t":"less"},{"m":"het bestand","t":"file(s)"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":20,"createdAt":1790250000088,"id":"les_0089"},{"command":"nl file(s)","tab":"linux","group":"Bestanden bekijken","title":"Inhoud met regelnummers tonen","explanation":"Toont de inhoud van een tekstbestand met een regelnummer vóór elke regel.","parts":[{"m":"number lines: nummer de regels","t":"nl"},{"m":"het bestand","t":"file(s)"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":20,"createdAt":1790250000089,"id":"les_0090"},{"command":"head file","tab":"linux","group":"Bestanden bekijken","title":"Eerste 10 regels tonen","explanation":"Toont de eerste 10 regels van een bestand, bv. head /usr/share/doc/zip/WHATSNEW. Meer opties vind je met man head.","parts":[{"m":"toon begin van bestand","t":"head"},{"m":"het bestand","t":"file"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":21,"createdAt":1790250000090,"id":"les_0091"},{"command":"tail file","tab":"linux","group":"Bestanden bekijken","title":"Laatste 10 regels tonen","explanation":"Toont de laatste 10 regels van een bestand. Handig voor logbestanden zoals /var/log/boot.log, waar nieuwe info onderaan komt.","parts":[{"m":"toon einde van bestand","t":"tail"},{"m":"het bestand","t":"file"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":22,"createdAt":1790250000091,"id":"les_0092"},{"command":"tail -f file","tab":"linux","group":"Bestanden bekijken","title":"Einde van bestand live volgen","explanation":"Toont de laatste regels en blijft nieuwe regels tonen zodra ze toegevoegd worden (live). Stop met Ctrl + C.","parts":[{"m":"toon einde van bestand","t":"tail"},{"m":"follow: blijf volgen","t":"-f"},{"m":"bv. een logbestand","t":"file"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":22,"createdAt":1790250000092,"id":"les_0093"},{"command":"strings file","tab":"linux","group":"Bestanden bekijken","title":"Leesbare tekst uit binair bestand","explanation":"Toont enkel de leesbare tekens uit een bestand. Nuttig bij binaire bestanden (programma's) zoals /usr/bin/who, waar cat vooral onleesbare tekens toont.","parts":[{"m":"toon leesbare tekenreeksen","t":"strings"},{"m":"bv. /usr/bin/who","t":"file"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":23,"createdAt":1790250000093,"id":"les_0094"},{"command":"ls -i","tab":"linux","group":"Bestanden bekijken","title":"Inodenummers tonen","explanation":"Toont vóór elke bestandsnaam het inodenummer. Bestanden met hetzelfde inodenummer zijn hardlinks naar dezelfde data.","parts":[{"m":"toon inhoud","t":"ls"},{"m":"toon inodenummer","t":"-i"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":26,"createdAt":1790250000096,"id":"les_0097"},{"command":"stat object","tab":"linux","group":"Bestanden bekijken","title":"Gedetailleerde bestandsinfo tonen","explanation":"Toont alle details van een bestand of map: grootte, inodenummer, aantal links, rechten, eigenaar en datums.","parts":[{"m":"toon status/details","t":"stat"},{"m":"bestand of map","t":"object"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":26,"createdAt":1790250000097,"id":"les_0098"},{"command":"/zoekterm (in man)","tab":"linux","group":"Bestanden bekijken","title":"Zoeken in een manpage","explanation":"In een manpage (bv. man man) typ je / gevolgd door een zoekterm en Enter om ernaar te zoeken, bv. /exit status. Met n spring je naar de volgende treffer.","parts":[{"m":"start zoeken","t":"/"},{"m":"tekst die je zoekt, bv. exit status","t":"zoekterm"},{"m":"next: volgende treffer","t":"n"}],"sourceName":"Chapter 4 - Processes.pptx","slide":20,"createdAt":1790250000151,"id":"les_0152"},{"command":"wc bestand","tab":"linux","group":"Bestanden bekijken","title":"Regels, woorden en tekens tellen","explanation":"Telt het aantal regels, woorden en tekens in een bestand. De les gebruikt het als voorbeeld: de invoer is de tekst in het bestand, de uitvoer zijn de getallen.","parts":[{"m":"word count: tel regels, woorden, tekens","t":"wc"},{"m":"het bestand dat geteld wordt","t":"bestand"}],"sourceName":"Chapter 5 - Input and output.pptx","slide":4,"createdAt":1790250000175,"id":"les_0176"},{"command":"v (in less)","tab":"linux","group":"Bestanden bekijken","title":"Bestand openen in editor","explanation":"Terwijl je een bestand bekijkt met less, open je het met v in de standaard teksteditor (ingesteld via $VISUAL of $EDITOR).","parts":[{"m":"open het bestand in de editor","t":"v"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":5,"createdAt":1790250000198,"id":"les_0199"},{"command":"cat -n /etc/profile","tab":"linux","group":"Bestanden bekijken","title":"Bestand tonen met regelnummers","explanation":"Toont de inhoud van /etc/profile met een regelnummer voor elke regel.","parts":[{"m":"toon inhoud","t":"cat"},{"m":"nummer de regels","t":"-n"},{"m":"het bestand","t":"/etc/profile"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":8,"createdAt":1790250000203,"id":"les_0204"},{"command":"head -n 5 snp151*","tab":"linux","group":"Bestanden bekijken","title":"Eerste 5 regels van bestanden","explanation":"Toont de eerste 5 regels van elk bestand waarvan de naam met snp151 begint. Bij meerdere bestanden zet head telkens de bestandsnaam erboven. Handig om snel te zien hoe een tabel eruitziet.","parts":[{"m":"toon het begin van een bestand","t":"head"},{"m":"aantal regels: 5","t":"-n 5"},{"m":"alle bestanden die met snp151 beginnen (jokerteken *)","t":"snp151*"}],"examples":[{"command":"head -n 5 snp151*","note":"Van beide SNP-bestanden verschijnen de kopregel en de eerste regels, telkens onder de bestandsnaam.","output":"==> snp151annotation.txt <==\nname class valid func alleles alleleFreqs\nrs745593600 insertion by-cluster,by-frequency,by-1000genomes unknown -,A,AAC, 0.979633,0.001997,0.018371\n==> snp151position.txt <==\nchrom chromStart chromEnd name strand\nchrY 10020 10020 rs745593600 +","slide":8,"source":"les","sourceName":"Chapter 7 - Tables and text file manipulation.pptx"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":8,"createdAt":1790250000257,"id":"les_0258"},{"command":"head -n 1 snp151annotation.txt > HEADER","tab":"linux","group":"Bestanden bekijken","title":"Kopregel apart bewaren","explanation":"Schrijft enkel de eerste regel (de kopregel) naar het bestand HEADER. sort sorteert de kopregel anders gewoon mee; daarom haal je hem eerst apart.","parts":[{"m":"enkel de eerste regel","t":"head -n 1"},{"m":"schrijf de uitvoer naar het bestand HEADER","t":"> HEADER"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":17,"createdAt":1790250000271,"id":"les_0272"},{"command":"tail -n +2 snp151annotation.txt > DATA","tab":"linux","group":"Bestanden bekijken","title":"Alles behalve de kopregel","explanation":"Toont alle regels vanaf regel 2, dus de tabel zonder kopregel, en bewaart ze in DATA. Na het sorteren zet je kopregel en data terug samen met bv. cat HEADER DATA_gesorteerd > nieuw_bestand.","parts":[{"m":"toon het einde van een bestand","t":"tail"},{"m":"begin bij regel 2 tot het einde","t":"-n +2"},{"m":"schrijf naar het bestand DATA","t":"> DATA"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":17,"createdAt":1790250000272,"id":"les_0273"},{"command":"ll","tab":"linux","group":"Bestanden bekijken","title":"Inhoud van map uitgebreid tonen","explanation":"Toont de inhoud van de huidige map in lange vorm (rechten, eigenaar, grootte, datum). Op Fedora is ll een snelkoppeling (alias) voor ls -l.","parts":[{"m":"alias voor ls -l: lijst met details","t":"ll"}],"examples":[{"command":"ll","note":"In de map Downloads staat één groot bestand: het installatiebestand van VS Code.","output":"[guest@fedora Downloads]$ ll\ntotal 133388\n-rw-r--r--. 1 guest guest 136586090 Aug 30 10:17","slide":13,"source":"les","sourceName":"1. Introduction.pptx"}],"sourceName":"1. Introduction.pptx","slide":13,"createdAt":1790250000412,"id":"les_0413"},{"command":"ls -l > ile.txt","tab":"linux","group":"Doorsturen (redirect)","title":"Bewaar maplijst in een bestand","explanation":"Maakt een gedetailleerde lijst van de huidige map en schrijft die niet naar het scherm maar in het bestand ile.txt. Bestaat ile.txt al, dan wordt het overschreven.","parts":[{"m":"toon inhoud van een map","t":"ls"},{"m":"lange weergave met rechten, eigenaar, grootte en datum","t":"-l"},{"m":"stuur de uitvoer naar een bestand (overschrijft)","t":">"},{"m":"het bestand waarin de uitvoer terechtkomt","t":"ile.txt"}],"createdAt":1790240000000,"id":"s1_ls_redirect"},{"command":"ls --version","tab":"linux","group":"Hulp & documentatie","title":"Versie van ls tonen","explanation":"Toont welke versie van het programma ls geïnstalleerd is. Opties met twee streepjes zijn voluit geschreven, leesbare opties.","parts":[{"m":"het programma","t":"ls"},{"m":"toon versie-informatie","t":"--version"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":10,"createdAt":1790250000017,"id":"les_0018"},{"command":"ls --help","tab":"linux","group":"Hulp & documentatie","title":"Korte gebruiksuitleg van commando","explanation":"Toont hoe je het commando gebruikt en welke opties er zijn. --help werkt bij bijna elk commando, bv. wc --help.","parts":[{"m":"het programma","t":"ls"},{"m":"toon gebruik en opties","t":"--help"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":10,"createdAt":1790250000018,"id":"les_0019"},{"command":"man commando","tab":"linux","group":"Hulp & documentatie","title":"Handleiding van commando openen","explanation":"Opent de man page (handleiding) van een commando met naam, syntax (SYNOPSIS), beschrijving, opties en voorbeelden. Bv. man ls, of man man voor uitleg over man zelf.","parts":[{"m":"manual: open de handleiding","t":"man"},{"m":"het commando waarover je uitleg wil, bv. ls","t":"commando"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":25,"createdAt":1790250000051,"id":"les_0052"},{"command":"h / q / f / b / /woord","tab":"linux","group":"Hulp & documentatie","title":"Navigeren in een man page","explanation":"Toetsen binnen een man page: h toont alle navigatietoetsen, q sluit de man page, f gaat één pagina vooruit, b één pagina terug. Met /woord zoek je een woord in de tekst.","parts":[{"m":"help: toon alle toetsen","t":"h"},{"m":"quit: sluit","t":"q"},{"m":"forward: 1 pagina vooruit","t":"f"},{"m":"back: 1 pagina terug","t":"b"},{"m":"zoek woord in de tekst","t":"/woord"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":26,"createdAt":1790250000052,"id":"les_0053"},{"command":"info commando","tab":"linux","group":"Hulp & documentatie","title":"Uitgebreide hulpdocumentatie openen","explanation":"Opent de info-documentatie van een commando, vaak uitgebreider dan de man page. Bv. info ls of info info. Is info niet beschikbaar, gebruik dan man.","parts":[{"m":"open help-documentatie","t":"info"},{"m":"het commando, bv. ls","t":"commando"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":31,"createdAt":1790250000054,"id":"les_0055"},{"command":"whatis ls","tab":"linux","group":"Hulp & documentatie","title":"Korte omschrijving van commando","explanation":"Toont één regel uitleg over een commando, overgenomen uit de man page (met het sectienummer tussen haakjes).","parts":[{"m":"geef korte omschrijving","t":"whatis"},{"m":"het commando","t":"ls"}],"examples":[{"command":"whatis ls","note":"","output":"ls (1) - list directory contents","slide":32,"source":"les","sourceName":"Chapter 2 - The terminal.pptx"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":32,"createdAt":1790250000056,"id":"les_0057"},{"command":"apropos browser","tab":"linux","group":"Hulp & documentatie","title":"Commando zoeken op trefwoord","explanation":"Zoekt in de korte omschrijvingen van alle man pages naar een woord. Handig als je niet weet welk commando je nodig hebt.","parts":[{"m":"zoek commando's op trefwoord","t":"apropos"},{"m":"het trefwoord","t":"browser"}],"examples":[{"command":"apropos browser","note":"","output":"firefox (1) - a Web browser for X11 derived from the Mozilla br...\ngit-web--browse (1) - Git helper script to launch a web browser","slide":32,"source":"les","sourceName":"Chapter 2 - The terminal.pptx"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":32,"createdAt":1790250000057,"id":"les_0058"},{"command":"ls /usr/share/doc","tab":"linux","group":"Hulp & documentatie","title":"Documentatie van programma's bekijken","explanation":"Toont de map /usr/share/doc, waarin geïnstalleerde programma's (bv. gedit) extra documentatie bewaren.","parts":[{"m":"toon inhoud van map","t":"ls"},{"m":"map met documentatie","t":"/usr/share/doc"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":33,"createdAt":1790250000058,"id":"les_0059"},{"command":"ls -l > file.txt","tab":"linux","group":"In- en uitvoer","title":"Uitvoer naar bestand schrijven","explanation":"Het teken > stuurt de uitvoer van een commando naar een bestand in plaats van naar het scherm. Bestaat het bestand al, dan wordt de inhoud overschreven.","parts":[{"m":"commando waarvan je de uitvoer bewaart","t":"ls -l"},{"m":"stuur uitvoer naar bestand (overschrijven)","t":">"},{"m":"doelbestand","t":"file.txt"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":16,"createdAt":1790250000028,"id":"les_0029"},{"command":"ls -l >> file.txt","tab":"linux","group":"In- en uitvoer","title":"Uitvoer aan bestand toevoegen","explanation":"Het teken >> voegt de uitvoer van een commando toe aan het einde van een bestand, zonder de bestaande inhoud te wissen.","parts":[{"m":"commando waarvan je de uitvoer bewaart","t":"ls -l"},{"m":"voeg uitvoer toe achteraan het bestand","t":">>"},{"m":"doelbestand","t":"file.txt"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":16,"createdAt":1790250000029,"id":"les_0030"},{"command":"echo","tab":"linux","group":"In- en uitvoer","title":"Tekst op het scherm tonen","explanation":"Toont (herhaalt) de tekst die je erachter typt. Handig om iets te testen of om de waarde van een variabele te bekijken.","parts":[{"m":"druk tekst af","t":"echo"},{"m":"de tekst die getoond wordt","t":"\"thx mate :)\""}],"examples":[{"command":"echo","note":"echo \"thx mate :)\" toont gewoon de tekst.","output":"thx mate :)","slide":21,"source":"les","sourceName":"Chapter 2 - The terminal.pptx"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":21,"createdAt":1790250000035,"id":"les_0036"},{"command":"commando > bestand","tab":"linux","group":"In- en uitvoer","title":"Uitvoer naar bestand schrijven","explanation":"Schrijft de uitvoer van een commando naar een bestand in plaats van naar het scherm. Bestaat het bestand niet, dan wordt het gemaakt; bestaat het wel, dan wordt het overschreven.","parts":[{"m":"commando waarvan je de uitvoer wil bewaren","t":"commando"},{"m":"stuur uitvoer naar bestand (overschrijven)","t":">"},{"m":"doelbestand","t":"bestand"}],"examples":[{"command":"commando > bestand","note":"De datum komt niet op het scherm maar in date.txt.","output":"[guest@fedora ~]$ date > date.txt\n[guest@fedora ~]$ cat date.txt\nThu 30 Sep 14:43:08 CEST 2021","slide":7,"source":"les","sourceName":"Chapter 5 - Input and output.pptx"}],"sourceName":"Chapter 5 - Input and output.pptx","slide":7,"createdAt":1790250000176,"id":"les_0177"},{"command":"cat bestand1 bestand2 > nieuwbestand","tab":"linux","group":"In- en uitvoer","title":"Bestanden samenvoegen in één bestand","explanation":"cat toont de bestanden na elkaar; met > wordt die samengevoegde inhoud in een nieuw bestand bewaard. Voorbeeld: cat date.txt my_home_today.txt > my_home_20210930.","parts":[{"m":"toon inhoud van bestanden na elkaar","t":"cat"},{"m":"de bestanden die je samenvoegt","t":"bestand1 bestand2"},{"m":"schrijf naar bestand","t":">"},{"m":"resultaat","t":"nieuwbestand"}],"sourceName":"Chapter 5 - Input and output.pptx","slide":7,"createdAt":1790250000177,"id":"les_0178"},{"command":"set -o noclobber","tab":"linux","group":"In- en uitvoer","title":"Overschrijven met > verbieden","explanation":"Zet de shelloptie noclobber aan: > geeft dan een foutmelding in plaats van een bestaand bestand te overschrijven. Standaard staat ze uit. Terug uitzetten met set +o noclobber.","parts":[{"m":"stel shelloptie in","t":"set"},{"m":"zet optie aan","t":"-o"},{"m":"optie: bestaande bestanden niet overschrijven","t":"noclobber"}],"sourceName":"Chapter 5 - Input and output.pptx","slide":8,"createdAt":1790250000178,"id":"les_0179"},{"command":"> bestand","tab":"linux","group":"In- en uitvoer","title":"Bestand leegmaken","explanation":"Zonder commando ervoor maakt > een bestaand bestand leeg (truncating): de inhoud verdwijnt, het bestand blijft bestaan met grootte 0.","parts":[{"m":"omleiding zonder uitvoer: maakt het bestand leeg","t":">"},{"m":"het bestand dat je leegmaakt","t":"bestand"}],"examples":[{"command":"> bestand","note":"Het bestand gaat van 1153 naar 0 bytes.","output":"-rw-rw-r--. 1 guest guest 1153 Sep 30 14:44 my_home_20210930\n[guest@fedora ~]$ > my_home_20210930\n-rw-rw-r--. 1 guest guest 0 Sep 30 14:48 my_home_20210930","slide":9,"source":"les","sourceName":"Chapter 5 - Input and output.pptx"}],"sourceName":"Chapter 5 - Input and output.pptx","slide":9,"createdAt":1790250000180,"id":"les_0181"},{"command":"commando >> bestand","tab":"linux","group":"In- en uitvoer","title":"Uitvoer achteraan bestand toevoegen","explanation":"Voegt de uitvoer van een commando toe aan het einde van een bestand, zonder de bestaande inhoud te overschrijven. Bestaat het bestand niet, dan wordt het gemaakt.","parts":[{"m":"commando waarvan je de uitvoer toevoegt","t":"commando"},{"m":"append: voeg toe aan het einde","t":">>"},{"m":"doelbestand","t":"bestand"}],"sourceName":"Chapter 5 - Input and output.pptx","slide":10,"createdAt":1790250000181,"id":"les_0182"},{"command":"date > date_`date +%y%m%d`","tab":"linux","group":"In- en uitvoer","title":"Bestandsnaam met datum van vandaag","explanation":"De backticks voeren eerst date +%y%m%d uit (bv. 210930); die uitvoer wordt in de bestandsnaam geplakt. Zo krijg je een bestand zoals date_210930. Daarna kan je met ls -l >> date_`date +%y%m%d` iets toevoegen.","parts":[{"m":"backticks: voer het commando binnenin uit en gebruik de uitvoer","t":"`...`"},{"m":"datum als jaar-maand-dag met 2 cijfers per deel","t":"date +%y%m%d"},{"m":"jaar, maand, dag","t":"%y %m %d"}],"sourceName":"Chapter 5 - Input and output.pptx","slide":10,"createdAt":1790250000182,"id":"les_0183"},{"command":"commando < bestand","tab":"linux","group":"In- en uitvoer","title":"Bestand als invoer gebruiken","explanation":"Gebruikt een bestand als invoer (stdin) voor een commando, in plaats van het toetsenbord. Vaak samen met grep, bv. grep pts/0 < processen.txt om enkel de regels met pts/0 te tonen.","parts":[{"m":"commando dat invoer leest, bv. grep pts/0","t":"commando"},{"m":"neem invoer uit bestand","t":"<"},{"m":"bronbestand","t":"bestand"}],"sourceName":"Chapter 5 - Input and output.pptx","slide":12,"createdAt":1790250000183,"id":"les_0184"},{"command":"commando 2> bestand","tab":"linux","group":"In- en uitvoer","title":"Enkel foutmeldingen naar bestand","explanation":"Stuurt alleen de foutmeldingen (stderr, nummer 2) naar een bestand; de gewone uitvoer blijft op het scherm. Bv. grep guest /etc/* 2> error.","parts":[{"m":"bv. grep guest /etc/*","t":"commando"},{"m":"stuur stderr (foutmeldingen) naar bestand","t":"2>"},{"m":"bestand voor de fouten","t":"bestand"}],"sourceName":"Chapter 5 - Input and output.pptx","slide":14,"createdAt":1790250000185,"id":"les_0186"},{"command":"commando > bestand 2>&1","tab":"linux","group":"In- en uitvoer","title":"Uitvoer én fouten naar bestand","explanation":"Stuurt zowel de gewone uitvoer als de foutmeldingen naar hetzelfde bestand. Zet 2>&1 achteraan. Handig bij geplande taken (cron) om fouten in een logbestand te bewaren, bv. */5 * * * * touch /var/tmp/test > /var/tmp/cron.log 2>&1.","parts":[{"m":"stuur stdout naar bestand","t":">"},{"m":"stuur stderr (2) naar dezelfde plaats als stdout (1)","t":"2>&1"},{"m":"bv. een logbestand","t":"bestand"}],"sourceName":"Chapter 5 - Input and output.pptx","slide":16,"createdAt":1790250000186,"id":"les_0187"},{"command":"commando1 | commando2","tab":"linux","group":"In- en uitvoer","title":"Uitvoer doorgeven aan volgend commando","explanation":"De pipe | geeft de uitvoer van het eerste commando als invoer aan het tweede. Vaak gebruikt om met grep in de uitvoer van ps of ls te zoeken, bv. ps -ef | grep firefox.","parts":[{"m":"levert de uitvoer, bv. ps -ef","t":"commando1"},{"m":"pipe: stuur uitvoer door","t":"|"},{"m":"verwerkt die uitvoer, bv. grep firefox","t":"commando2"}],"sourceName":"Chapter 5 - Input and output.pptx","slide":18,"createdAt":1790250000187,"id":"les_0188"},{"command":"ls -l /etc | grep cron | grep -v crontab","tab":"linux","group":"In- en uitvoer","title":"Meerdere pipes na elkaar","explanation":"Je kan meerdere pipes koppelen. Hier: toon de inhoud van /etc, houd enkel regels met 'cron' en laat daarvan de regels met 'crontab' weg.","parts":[{"m":"lijst van /etc in lange vorm","t":"ls -l /etc"},{"m":"houd regels met cron","t":"grep cron"},{"m":"-v: toon regels die crontab NIET bevatten","t":"grep -v crontab"}],"sourceName":"Chapter 5 - Input and output.pptx","slide":19,"createdAt":1790250000188,"id":"les_0189"},{"command":"who | sort | awk '{print $1}'","tab":"linux","group":"In- en uitvoer","title":"Gesorteerde lijst van gebruikersnamen","explanation":"Toont wie aangemeld is, sorteert die lijst en drukt met awk enkel de eerste kolom (de gebruikersnaam) af.","parts":[{"m":"toon aangemelde gebruikers","t":"who"},{"m":"sorteer alfabetisch","t":"sort"},{"m":"druk alleen kolom 1 van elke regel af","t":"awk '{print $1}'"}],"sourceName":"Chapter 5 - Input and output.pptx","slide":19,"createdAt":1790250000189,"id":"les_0190"},{"command":"commando | tee bestand","tab":"linux","group":"In- en uitvoer","title":"Uitvoer tonen én bewaren","explanation":"tee kopieert de uitvoer: je ziet ze in de terminal én ze wordt in een bestand geschreven. Met > of >> kan dat niet, want dan zie je niets op het scherm. Met tee -a voeg je toe in plaats van te overschrijven (zoals >>).","parts":[{"m":"pipe","t":"|"},{"m":"schrijf naar scherm én bestand","t":"tee"},{"m":"append: voeg toe aan bestand","t":"-a"},{"m":"doelbestand","t":"bestand"}],"examples":[{"command":"commando | tee bestand","note":"","output":"[guest@fedora ~]$ who | tee file\nguest tty2 2021-09-30 13:44 (tty2)\nroot tty3 2021-09-30 16:23","slide":20,"source":"les","sourceName":"Chapter 5 - Input and output.pptx"}],"sourceName":"Chapter 5 - Input and output.pptx","slide":20,"createdAt":1790250000190,"id":"les_0191"},{"command":"cat files_to_remove.txt | xargs rm","tab":"linux","group":"In- en uitvoer","title":"Regels omzetten tot argumenten","explanation":"xargs leest regels tekst van de invoer en geeft ze als argumenten aan een commando. Hier worden alle bestandsnamen uit files_to_remove.txt aan rm gegeven, dus al die bestanden worden verwijderd.","parts":[{"m":"toon de lijst met bestandsnamen","t":"cat files_to_remove.txt"},{"m":"pipe","t":"|"},{"m":"maak van de invoerregels argumenten","t":"xargs"},{"m":"commando dat uitgevoerd wordt: verwijder","t":"rm"}],"sourceName":"Chapter 5 - Input and output.pptx","slide":21,"createdAt":1790250000191,"id":"les_0192"},{"command":"echo wc -l myfile | bash","tab":"linux","group":"In- en uitvoer","title":"Tekst als commando laten uitvoeren","explanation":"echo maakt de tekst 'wc -l myfile'; via de pipe krijgt bash die tekst en voert hem uit als commando. Zo kan je commando's als tekst opbouwen en daarna uitvoeren.","parts":[{"m":"maakt enkel de tekst van het commando","t":"echo wc -l myfile"},{"m":"pipe","t":"|"},{"m":"voert de ontvangen tekst uit als commando","t":"bash"}],"sourceName":"Chapter 5 - Input and output.pptx","slide":22,"createdAt":1790250000192,"id":"les_0193"},{"command":"echo [argumenten]","tab":"linux","group":"In- en uitvoer","title":"Tekst op het scherm tonen","explanation":"Drukt de argumenten af op de standaarduitvoer. Handig in scripts om iets te vragen vóór read of om waarden te tonen. Opties: -n (geen nieuwe regel op het einde), -e (escapetekens zoals \\n of \\a interpreteren).","parts":[{"m":"druk af","t":"echo"},{"m":"zonder nieuwe regel op het einde","t":"-n"},{"m":"interpreteer escapetekens","t":"-e"},{"m":"de tekst of variabelen, bv. Welcome $NAME","t":"argumenten"}],"examples":[{"command":"echo [argumenten]","note":"","output":"[guest@fedora ~]$ echo Enter your name\nEnter your name","slide":24,"source":"les","sourceName":"Chapter 5 - Input and output.pptx"}],"sourceName":"Chapter 5 - Input and output.pptx","slide":24,"createdAt":1790250000193,"id":"les_0194"},{"command":"printf \"FORMAT\" [ARGUMENTEN]","tab":"linux","group":"In- en uitvoer","title":"Opgemaakte tekst afdrukken","explanation":"Uitgebreide echo: drukt tekst af volgens een opmaakstring. Plaatshouders zoals %s (tekst) en %d (geheel getal) worden vervangen door de argumenten. \\n zet een nieuwe regel. Bv. printf \"A %s team counts %d players.\\n\" soccer 11 geeft: A soccer team counts 11 players.","parts":[{"m":"print formatted","t":"printf"},{"m":"plaats voor een tekst (string)","t":"%s"},{"m":"plaats voor een geheel getal","t":"%d"},{"m":"nieuwe regel","t":"\\n"},{"m":"waarden die de plaatshouders invullen","t":"ARGUMENTEN"}],"sourceName":"Chapter 5 - Input and output.pptx","slide":25,"createdAt":1790250000195,"id":"les_0196"},{"command":"clear","tab":"linux","group":"In- en uitvoer","title":"Terminalscherm leegmaken","explanation":"Maakt het terminalvenster leeg zodat je met een proper scherm verder werkt.","parts":[{"m":"wis het scherm","t":"clear"}],"sourceName":"Chapter 5 - Input and output.pptx","slide":26,"createdAt":1790250000196,"id":"les_0197"},{"command":"echo \"Hello world!\"","tab":"linux","group":"In- en uitvoer","title":"Tekst op het scherm tonen","explanation":"Toont de tekst op het scherm (stdout). In een script gebruik je echo om uitvoer of berichten te geven.","parts":[{"m":"druk tekst af","t":"echo"},{"m":"de tekst","t":"\"Hello world!\""}],"examples":[{"command":"echo \"Hello world!\"","note":"","output":"Hello world!","slide":5,"source":"les","sourceName":"Chapter 9 - Shell scripting - student.pptx"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":5,"createdAt":1790250000365,"id":"les_0366"},{"command":"read TEXT","tab":"linux","group":"In- en uitvoer","title":"Invoer van gebruiker vragen","explanation":"Wacht tot de gebruiker tekst typt en op Enter drukt, en bewaart die tekst in de variabele TEXT. Zo vraag je in een script interactief een waarde op.","parts":[{"m":"lees een regel van de invoer (toetsenbord)","t":"read"},{"m":"variabele waarin de invoer komt","t":"TEXT"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":10,"createdAt":1790250000373,"id":"les_0374"},{"command":"seq 1 100","tab":"linux","group":"In- en uitvoer","title":"Reeks getallen maken","explanation":"Toont de getallen van 1 tot en met 100, elk op een aparte regel. Handig in een for-lus: for i in $(seq 1 100).","parts":[{"m":"maak een reeks getallen","t":"seq"},{"m":"startgetal","t":"1"},{"m":"eindgetal","t":"100"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":32,"createdAt":1790250000406,"id":"les_0407"},{"command":"ls [!MV]*","tab":"linux","group":"Jokertekens (wildcards)","title":"Toon alles behalve wat met M of V begint","explanation":"Toont alle bestanden en mappen waarvan de naam NIET met een hoofdletter M of V begint (dus zonder Music en Videos). Omdat het ook mappen zijn, toont ls van elke map de inhoud eronder.","parts":[{"m":"toon inhoud van een map","t":"ls"},{"m":"één teken dat GEEN M en GEEN V is","t":"[!MV]"},{"m":"daarna om het even wat","t":"*"}],"createdAt":1790240000000,"id":"s2_ls_bracket"},{"command":"wc ?ile.txt","tab":"linux","group":"Jokertekens (wildcards)","title":"Tel in bestanden die op 'ile.txt' eindigen","explanation":"Telt regels, woorden en bytes van elk bestand waarvan de naam bestaat uit precies één willekeurig teken + 'ile.txt'. Bij jou vond het file.txt (20 regels, 166 woorden, 924 bytes). ile.txt zelf valt erbuiten, want ? moet precies één teken zijn.","parts":[{"m":"tel regels, woorden en bytes","t":"wc"},{"m":"precies één willekeurig teken","t":"?"},{"m":"de rest van de bestandsnaam moet exact dit zijn","t":"ile.txt"}],"createdAt":1790240000000,"id":"s1_wc_q"},{"command":"wc *ile.txt","tab":"linux","group":"Jokertekens (wildcards)","title":"Tel in alle bestanden op 'ile.txt'","explanation":"Telt regels, woorden en bytes van elk bestand dat eindigt op 'ile.txt', met om het even wat (ook niets) ervoor. Daarom vond het zowel file.txt als ile.txt, plus een totaalregel.","parts":[{"m":"tel regels, woorden en bytes","t":"wc"},{"m":"nul of meer willekeurige tekens","t":"*"},{"m":"de naam moet hierop eindigen","t":"ile.txt"}],"createdAt":1790240000000,"id":"s1_wc_star"},{"command":"*","tab":"linux","group":"Jokertekens (wildcards)","title":"Nul of meer willekeurige tekens","explanation":"Het jokerteken * staat voor nul of meer willekeurige tekens. Bash vervangt het eerst door alle passende namen en geeft pas daarna het commando door: ls D* wordt ls Desktop Documents Downloads.","parts":[{"m":"nul of meer tekens","t":"*"},{"m":"alles wat met hoofdletter D begint","t":"D*"}],"examples":[{"command":"*","note":"wc *ile.txt telt zowel file.txt als ile.txt.","output":"20 166 924 file.txt\n11 92 522 ile.txt\n31 258 1446 total","slide":20,"source":"les","sourceName":"Chapter 2 - The terminal.pptx"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":20,"createdAt":1790250000031,"id":"les_0032"},{"command":"?","tab":"linux","group":"Jokertekens (wildcards)","title":"Precies één willekeurig teken","explanation":"Het jokerteken ? staat voor precies één willekeurig teken. wc ?ile.txt past op file.txt, maar niet op ile.txt (daar staat geen teken voor 'ile').","parts":[{"m":"precies één teken","t":"?"}],"examples":[{"command":"?","note":"wc ?ile.txt telt enkel file.txt.","output":"20 166 924 file.txt","slide":21,"source":"les","sourceName":"Chapter 2 - The terminal.pptx"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":21,"createdAt":1790250000032,"id":"les_0033"},{"command":"[set]","tab":"linux","group":"Jokertekens (wildcards)","title":"Eén teken uit een reeks","explanation":"Staat voor precies één teken dat in de reeks tussen de haakjes staat. ls [VM]* toont alles dat met V of M begint (Videos, Music); ls [A-Z]* alles dat met een hoofdletter begint.","parts":[{"m":"één teken: V of M","t":"[VM]"},{"m":"één teken van A tot Z","t":"[A-Z]"},{"m":"rest van de naam","t":"*"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":21,"createdAt":1790250000033,"id":"les_0034"},{"command":"[!set]","tab":"linux","group":"Jokertekens (wildcards)","title":"Eén teken níet uit reeks","explanation":"Staat voor precies één teken dat NIET in de reeks staat; [^set] doet hetzelfde. ls [!MV]* toont alles behalve wat met M of V begint.","parts":[{"m":"één teken, maar niet M of V","t":"[!MV]"},{"m":"zelfde betekenis","t":"[^MV]"},{"m":"rest van de naam","t":"*"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":21,"createdAt":1790250000034,"id":"les_0035"},{"command":"echo curly bra{cket,ce}s","tab":"linux","group":"Jokertekens (wildcards)","title":"Accolades uitbreiden tot meerdere woorden","explanation":"Bash breidt een uitdrukking met accolades uit tot meerdere argumenten: elk stuk tussen { } gescheiden door komma's geeft een apart woord. Zo maak je snel meerdere gelijkaardige namen.","parts":[{"m":"druk tekst af","t":"echo"},{"m":"wordt brackets en braces","t":"bra{cket,ce}s"}],"examples":[{"command":"echo curly bra{cket,ce}s","note":"","output":"curly brackets braces","slide":22,"source":"les","sourceName":"Chapter 2 - The terminal.pptx"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":22,"createdAt":1790250000037,"id":"les_0038"},{"command":"echo curly bra\\*","tab":"linux","group":"Jokertekens (wildcards)","title":"Speciaal teken letterlijk gebruiken","explanation":"Een backslash \\ vóór een speciaal teken zorgt dat Bash het niet interpreteert (escapen). Zo wordt * niet als jokerteken gebruikt maar gewoon als sterretje getoond.","parts":[{"m":"interpreteer het volgende teken niet","t":"\\"},{"m":"een gewoon sterretje","t":"\\*"}],"examples":[{"command":"echo curly bra\\*","note":"echo Desk\\* toont letterlijk Desk*.","output":"Desk*","slide":22,"source":"les","sourceName":"Chapter 2 - The terminal.pptx"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":22,"createdAt":1790250000038,"id":"les_0039"},{"command":"ls -la","tab":"linux","group":"Navigatie","title":"Toon alle bestanden in detail","explanation":"Toont alle bestanden in de huidige map, ook verborgen bestanden, met rechten, eigenaar, grootte en datum.","parts":[{"m":"toon inhoud van een map","t":"ls"},{"m":"lange weergave","t":"-l"},{"m":"ook verborgen bestanden","t":"-a"}],"createdAt":1790233200000,"id":"ex_ls"},{"command":"cd ~/projecten","tab":"linux","group":"Navigatie","title":"Ga naar de map projecten","explanation":"Wisselt naar de map 'projecten' in je thuismap. ~ is een afkorting voor je thuismap.","parts":[{"m":"wissel van map","t":"cd"},{"m":"de map projecten in je thuismap","t":"~/projecten"}],"createdAt":1790233200000,"id":"ex_cd"},{"command":"ls","tab":"linux","group":"Navigatie","title":"Toon inhoud van de map","explanation":"Toont de bestanden en mappen in de map waarin je nu staat. Mappen verschijnen meestal in het blauw.","parts":[{"m":"list: toon inhoud van een map","t":"ls"}],"createdAt":1790240000000,"id":"s1_ls"},{"command":"cd","tab":"linux","group":"Navigatie","title":"Terug naar je thuismap","explanation":"cd zonder map erachter brengt je altijd terug naar je thuismap (~). Je zag de prompt veranderen van ~/Documents naar ~.","parts":[{"m":"wissel van map","t":"cd"},{"m":"zonder map ga je naar je thuismap","t":"(geen map)"}],"createdAt":1790240000000,"id":"s2_cd"},{"command":"pwd","tab":"linux","group":"Navigatie","title":"Huidige map tonen","explanation":"Toont het volledige (absolute) pad van de map waarin je nu werkt (present working directory). pwd is ingebouwd in Bash.","parts":[{"m":"print working directory","t":"pwd"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":15,"createdAt":1790250000022,"id":"les_0023"},{"command":".","tab":"linux","group":"Navigatie","title":"Huidige map","explanation":"Een punt staat voor de map waarin je nu bent. Je gebruikt het in relatieve paden, bv. scp ... . om iets naar de huidige map te kopiëren.","parts":[{"m":"huidige map (present working directory)","t":"."}],"sourceName":"Chapter 2 - The terminal.pptx","slide":15,"createdAt":1790250000023,"id":"les_0024"},{"command":"..","tab":"linux","group":"Navigatie","title":"Bovenliggende map","explanation":"Twee punten staan voor de map één niveau hoger (parent directory). ../.. is twee niveaus hoger, bv. ls ../.. toont de inhoud van de map twee niveaus hoger.","parts":[{"m":"bovenliggende map","t":".."},{"m":"map twee niveaus hoger","t":"../.."}],"sourceName":"Chapter 2 - The terminal.pptx","slide":15,"createdAt":1790250000024,"id":"les_0025"},{"command":"cd /usr/share/vim","tab":"linux","group":"Navigatie","title":"Naar map via absoluut pad","explanation":"Gaat naar de map /usr/share/vim. Omdat het pad met / begint, is het een absoluut pad: het vertrekt vanaf de root, waar je ook bent.","parts":[{"m":"change directory: ga naar map","t":"cd"},{"m":"absoluut pad (begint met /)","t":"/usr/share/vim"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":7,"createdAt":1790250000068,"id":"les_0069"},{"command":"cd vim91","tab":"linux","group":"Navigatie","title":"Naar submap via relatief pad","explanation":"Gaat naar de map vim91 die in de huidige map staat. Dit is een relatief pad: het hangt af van waar je nu bent.","parts":[{"m":"ga naar map","t":"cd"},{"m":"relatief pad: submap van huidige map","t":"vim91"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":7,"createdAt":1790250000069,"id":"les_0070"},{"command":"cd ../../systemd","tab":"linux","group":"Navigatie","title":"Twee niveaus hoger, dan submap","explanation":"Gaat twee mappen omhoog (../..) en daar naar de map systemd. Vanuit /usr/share/vim/vim91 kom je zo in /usr/share/systemd.","parts":[{"m":"ga naar map","t":"cd"},{"m":"twee niveaus hoger","t":"../.."},{"m":"submap daar","t":"systemd"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":7,"createdAt":1790250000070,"id":"les_0071"},{"command":"cd /","tab":"linux","group":"Navigatie","title":"Naar de root-map gaan","explanation":"Gaat naar de root /, het beginpunt van het hele bestandssysteem.","parts":[{"m":"ga naar map","t":"cd"},{"m":"root-map","t":"/"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":7,"createdAt":1790250000071,"id":"les_0072"},{"command":"cd ~user","tab":"linux","group":"Navigatie","title":"Naar thuismap van andere gebruiker","explanation":"Gaat naar de thuismap van een bepaalde gebruiker; de shell vervangt ~user door bv. /home/user.","parts":[{"m":"ga naar map","t":"cd"},{"m":"thuismap van gebruiker user","t":"~user"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":8,"createdAt":1790250000072,"id":"les_0073"},{"command":"cd Downloads","tab":"linux","group":"Navigatie","title":"Naar de map Downloads gaan","explanation":"Verandert je huidige map naar de map Downloads in je thuismap. Zo kan je daarna met het gedownloade installatiebestand werken.","parts":[{"m":"change directory: ga naar een andere map","t":"cd"},{"m":"relatief pad naar de map Downloads","t":"Downloads"}],"sourceName":"1. Introduction.pptx","slide":12,"createdAt":1790250000411,"id":"les_0412"},{"command":"ssh [user@]hostname","tab":"linux","group":"Netwerk & op afstand","title":"Verbinden met een externe server","explanation":"Maakt een beveiligde verbinding (Secure Shell) met een andere Linux-computer, zodat je die via de terminal kan bedienen. Sluit de verbinding met exit of Ctrl + D.","parts":[{"m":"secure shell: veilige verbinding op afstand","t":"ssh"},{"m":"optioneel: gebruikersnaam op de server","t":"user@"},{"m":"IP-adres of naam van de server","t":"hostname"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":35,"createdAt":1790250000059,"id":"les_0060"},{"command":"ssh guest@172.19.8.101","tab":"linux","group":"Netwerk & op afstand","title":"Inloggen op Howest BIT-server","explanation":"Logt in als gebruiker guest op de server met IP-adres 172.19.8.101. Daarna geef je je wachtwoord in.","parts":[{"m":"veilige verbinding op afstand","t":"ssh"},{"m":"gebruikersnaam","t":"guest"},{"m":"IP-adres van de server","t":"172.19.8.101"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":36,"createdAt":1790250000060,"id":"les_0061"},{"command":"scp [source] [destination]","tab":"linux","group":"Netwerk & op afstand","title":"Bestand kopiëren over SSH","explanation":"Kopieert bestanden tussen je eigen computer en een server via SSH (Secure Copy Protocol). Eerst geef je aan welk bestand (bron), dan waar het naartoe moet (doel).","parts":[{"m":"secure copy: kopieer over SSH","t":"scp"},{"m":"bronbestand","t":"[source]"},{"m":"doel (map of bestand)","t":"[destination]"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":37,"createdAt":1790250000062,"id":"les_0063"},{"command":"scp /path/to/file username@IP:/path/to/destination","tab":"linux","group":"Netwerk & op afstand","title":"Bestand naar server kopiëren","explanation":"Kopieert een bestand van je eigen computer naar een map op de server.","parts":[{"m":"lokaal bronbestand","t":"/path/to/file"},{"m":"gebruiker en IP-adres van de server","t":"username@IP"},{"m":"doelmap op de server","t":":/path/to/destination"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":38,"createdAt":1790250000063,"id":"les_0064"},{"command":"scp username@IP:/path/to/file /path/to/destination","tab":"linux","group":"Netwerk & op afstand","title":"Bestand van server kopiëren","explanation":"Kopieert een bestand van de server naar een map op je eigen computer. Als doel mag je ook . gebruiken (de huidige map).","parts":[{"m":"gebruiker en IP-adres van de server","t":"username@IP"},{"m":"bronbestand op de server","t":":/path/to/file"},{"m":"lokale doelmap","t":"/path/to/destination"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":38,"createdAt":1790250000064,"id":"les_0065"},{"command":"scp guest@172.19.8.101:/home/guest/welcome.txt .","tab":"linux","group":"Netwerk & op afstand","title":"welcome.txt van server ophalen","explanation":"Kopieert het bestand welcome.txt van de Howest BIT-server naar de huidige map op je eigen computer. Je moet eerst het wachtwoord ingeven.","parts":[{"m":"gebruiker en server","t":"guest@172.19.8.101"},{"m":"bestand op de server","t":":/home/guest/welcome.txt"},{"m":"doel: huidige map","t":"."}],"examples":[{"command":"scp guest@172.19.8.101:/home/guest/welcome.txt .","note":"","output":"guest@172.19.8.101's password:\nwelcome.txt 100% 75 6.7KB/s 00:00","slide":39,"source":"les","sourceName":"Chapter 2 - The terminal.pptx"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":39,"createdAt":1790250000065,"id":"les_0066"},{"command":"wget www.uniprot.org/uniprot/P00687.fasta","tab":"linux","group":"Netwerk & op afstand","title":"Bestand downloaden van internet","explanation":"Downloadt een bestand van een webadres naar de huidige map, hier een FASTA-sequentie van UniProt.","parts":[{"m":"download van het web","t":"wget"},{"m":"adres (URL) van het bestand","t":"www.uniprot.org/uniprot/P00687.fasta"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":14,"createdAt":1790250000079,"id":"les_0080"},{"command":"wget URL","tab":"linux","group":"Netwerk & op afstand","title":"Bestand downloaden van internet","explanation":"Downloadt het bestand op het opgegeven webadres naar de huidige map. In de les gebruik je dit om het Miniconda-installatiescript te downloaden.","parts":[{"m":"download een bestand via het web","t":"wget"},{"m":"webadres van het bestand","t":"URL"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":11,"createdAt":1790250000305,"id":"les_0306"},{"command":"curl localhost:80","tab":"linux","group":"Netwerk & op afstand","title":"Webpagina opvragen in terminal","explanation":"Vraagt de webpagina op poort 80 van je eigen computer (localhost) op en toont de inhoud in de terminal. Zo test je of een webserver bereikbaar is.","parts":[{"m":"haal gegevens op via een URL","t":"curl"},{"m":"je eigen computer","t":"localhost"},{"m":"poortnummer","t":":80"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":32,"createdAt":1790250000348,"id":"les_0349"},{"command":"efetch -db protein -id NP_000509 -format fasta","tab":"linux","group":"Netwerk & op afstand","title":"Sequentie ophalen uit NCBI","explanation":"Commando uit het conda-pakket entrez-direct (EDirect). Het downloadt de eiwitsequentie met identifier NP_000509 uit de NCBI-databank in FASTA-formaat.","parts":[{"m":"haal records op uit NCBI","t":"efetch"},{"m":"databank: protein","t":"-db protein"},{"m":"sequentie-identifier","t":"-id NP_000509"},{"m":"downloadformaat FASTA","t":"-format fasta"}],"sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":42,"createdAt":1790250000361,"id":"les_0362"},{"command":"date","tab":"linux","group":"Omgeving & variabelen","title":"Huidige datum en tijd tonen","explanation":"Toont de huidige datum en tijd van het systeem.","parts":[{"m":"toon datum en tijd","t":"date"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":21,"createdAt":1790250000036,"id":"les_0037"},{"command":"$HOME","tab":"linux","group":"Omgeving & variabelen","title":"Variabele met pad naar thuismap","explanation":"De variabele HOME bevat het pad naar je thuismap (bv. /home/guest). Je bekijkt ze met echo $HOME.","parts":[{"m":"haal de waarde van de variabele op","t":"$"},{"m":"naam van de variabele","t":"HOME"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":8,"createdAt":1790250000073,"id":"les_0074"},{"command":"echo $VARIABLE","tab":"linux","group":"Omgeving & variabelen","title":"Inhoud van variabele tonen","explanation":"Toont de waarde van een variabele. Zet een $ voor de naam.","parts":[{"m":"toon tekst","t":"echo"},{"m":"waarde van de variabele","t":"$VARIABLE"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":38,"createdAt":1790250000109,"id":"les_0110"},{"command":"echo $PATH","tab":"linux","group":"Omgeving & variabelen","title":"Zoekpad voor programma's tonen","explanation":"Toont de mappen waarin de shell programma's zoekt, gescheiden door een dubbelpunt ':'. Programma's in die mappen kan je vanuit elke map starten.","parts":[{"m":"toon tekst","t":"echo"},{"m":"lijst met programmamappen","t":"$PATH"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":38,"createdAt":1790250000110,"id":"les_0111"},{"command":"set -o","tab":"linux","group":"Omgeving & variabelen","title":"Status van shellopties tonen","explanation":"Toont alle shellopties en of ze aan (on) of uit (off) staan, bv. om te controleren of noclobber actief is.","parts":[{"m":"shellinstellingen","t":"set"},{"m":"zonder optienaam: toon alle opties","t":"-o"}],"sourceName":"Chapter 5 - Input and output.pptx","slide":8,"createdAt":1790250000179,"id":"les_0180"},{"command":"EDITOR=`which gedit`; VISUAL=`which gedit`; export EDITOR VISUAL","tab":"linux","group":"Omgeving & variabelen","title":"gedit als standaardeditor instellen","explanation":"Stelt gedit in als standaard teksteditor, bv. voor crontab -e of v in less. which gedit geeft het volledige pad van gedit, dat in EDITOR en VISUAL komt; export maakt ze beschikbaar voor andere programma's. Zet dit in ~/.bashrc om het blijvend te maken.","parts":[{"m":"variabele met de standaardeditor","t":"EDITOR=…"},{"m":"variabele met de (visuele) standaardeditor","t":"VISUAL=…"},{"m":"backticks: vul het pad van gedit in","t":"`which gedit`"},{"m":"scheidt commando's op één regel","t":";"},{"m":"maak de variabelen beschikbaar voor andere programma's","t":"export EDITOR VISUAL"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":5,"createdAt":1790250000197,"id":"les_0198"},{"command":"~/.bashrc","tab":"linux","group":"Omgeving & variabelen","title":"Persoonlijk configuratiebestand van bash","explanation":"Verborgen bestand in je thuismap dat bash inleest bij elke nieuwe shell. Hier zet je je eigen aliassen, functies en export-regels zodat ze blijvend zijn. Ook ~/.bash_profile is zo'n persoonlijk bestand.","parts":[{"m":"je thuismap","t":"~"},{"m":"configuratiebestand van bash (verborgen door de punt)","t":".bashrc"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":7,"createdAt":1790250000200,"id":"les_0201"},{"command":"source .bashrc","tab":"linux","group":"Omgeving & variabelen","title":"Configuratie opnieuw inlezen","explanation":"Leest .bashrc opnieuw in in je huidige shell, zodat nieuwe instellingen (bv. een alias) meteen werken zonder een nieuwe shell te openen.","parts":[{"m":"voer het bestand uit in de huidige shell","t":"source"},{"m":"het configuratiebestand (in je thuismap)","t":".bashrc"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":7,"createdAt":1790250000201,"id":"les_0202"},{"command":"/etc/profile","tab":"linux","group":"Omgeving & variabelen","title":"Systeembrede configuratie van de shell","explanation":"Het eerste bestand dat de shell bij het aanmelden leest; bevat instellingen en omgevingsvariabelen voor alle gebruikers. Ook de bestanden in /etc/profile.d/ horen daarbij. Bekijken met cat -n /etc/profile.","parts":[{"m":"systeembreed configuratiebestand","t":"/etc/profile"},{"m":"extra systeembrede configuratiebestanden","t":"/etc/profile.d/*"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":8,"createdAt":1790250000202,"id":"les_0203"},{"command":"echo $VARIABELE","tab":"linux","group":"Omgeving & variabelen","title":"Inhoud van variabele tonen","explanation":"Toont de waarde van een variabele. Bij het opvragen zet je een $ voor de naam, bv. echo $PATH of echo $OSTYPE.","parts":[{"m":"druk af","t":"echo"},{"m":"haal de waarde van de variabele op","t":"$"},{"m":"naam, bv. PATH","t":"VARIABELE"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":11,"createdAt":1790250000205,"id":"les_0206"},{"command":"printenv","tab":"linux","group":"Omgeving & variabelen","title":"Alle omgevingsvariabelen tonen","explanation":"Toont een lijst van alle omgevingsvariabelen met hun waarde, bv. HOME en USERNAME. Een gewone variabele die je niet geëxporteerd hebt, staat er niet bij.","parts":[{"m":"print environment: toon omgevingsvariabelen","t":"printenv"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":11,"createdAt":1790250000206,"id":"les_0207"},{"command":"export VARIABELE","tab":"linux","group":"Omgeving & variabelen","title":"Variabele doorgeven aan andere programma's","explanation":"Maakt van een variabele een omgevingsvariabele, zodat ook subshells en andere programma's ze kennen. Zonder export ben je ze kwijt in een nieuwe shell. Blijvend maken? Zet de export in ~/.bashrc.","parts":[{"m":"maak beschikbaar voor kindprocessen","t":"export"},{"m":"naam van de variabele (zonder $)","t":"VARIABELE"}],"examples":[{"command":"export VARIABELE","note":"Vóór export is UNAME leeg in de subshell; na export toont de subshell guest.","output":"[guest@fedora ~]$ UNAME=guest\n[guest@fedora ~]$ bash\n[guest@fedora ~]$ echo $UNAME\n\n[guest@fedora ~]$ exit\n[guest@fedora ~]$ export UNAME","slide":12,"source":"les","sourceName":"Chapter 6 - The work environment.pptx"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":12,"createdAt":1790250000207,"id":"les_0208"},{"command":"VARIABELE=waarde","tab":"linux","group":"Omgeving & variabelen","title":"Variabele een waarde geven","explanation":"Maakt een variabele en geeft ze een waarde. Geen $ en geen spaties rond het =-teken. De naam mag niet met een cijfer beginnen. Zonder export bestaat ze enkel in je huidige shell.","parts":[{"m":"naam van de variabele, bv. UNAME","t":"VARIABELE"},{"m":"ken toe (zonder spaties)","t":"="},{"m":"inhoud, bv. guest","t":"waarde"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":13,"createdAt":1790250000209,"id":"les_0210"},{"command":"bash","tab":"linux","group":"Omgeving & variabelen","title":"Subshell starten","explanation":"Start een nieuwe bash-shell binnen je huidige shell (een subshell). Handig om te testen welke variabelen of aliassen doorgegeven worden. Terugkeren doe je met exit.","parts":[{"m":"start een nieuwe shell","t":"bash"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":13,"createdAt":1790250000210,"id":"les_0211"},{"command":"export PATH=$PATH:/home/guest/Scripts","tab":"linux","group":"Omgeving & variabelen","title":"Scriptsmap toevoegen aan PATH","explanation":"Voegt de map Scripts achteraan toe aan PATH, zodat je scripts in die map overal kan starten door enkel hun naam te typen. $PATH behoudt de bestaande mappen; : scheidt de mappen.","parts":[{"m":"maak beschikbaar voor andere programma's","t":"export"},{"m":"geef PATH een nieuwe waarde","t":"PATH="},{"m":"de huidige inhoud van PATH","t":"$PATH"},{"m":"scheidingsteken tussen mappen","t":":"},{"m":"de map die erbij komt","t":"/home/guest/Scripts"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":14,"createdAt":1790250000211,"id":"les_0212"},{"command":"unset VARIABELE","tab":"linux","group":"Omgeving & variabelen","title":"Variabele verwijderen","explanation":"Verwijdert een variabele volledig, bv. unset PINGU. Daarna is ze leeg bij echo en verdwijnt ze uit printenv.","parts":[{"m":"verwijder variabele","t":"unset"},{"m":"naam (zonder $)","t":"VARIABELE"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":15,"createdAt":1790250000212,"id":"les_0213"},{"command":"set","tab":"linux","group":"Omgeving & variabelen","title":"Alle shellvariabelen tonen","explanation":"Toont alle variabelen van de shell: omgevingsvariabelen, systeemvariabelen én variabelen die enkel in deze shell bestaan (bv. HISTFILE, OSTYPE). Die laatste zie je niet met printenv.","parts":[{"m":"zonder opties: toon alle variabelen","t":"set"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":16,"createdAt":1790250000213,"id":"les_0214"},{"command":"$HISTFILE","tab":"linux","group":"Omgeving & variabelen","title":"Bestand met commandogeschiedenis","explanation":"Pad naar het bestand waarin je commandogeschiedenis bewaard wordt (meestal ~/.bash_history). Deze variabele zie je met set, niet met printenv. Bekijken met echo $HISTFILE.","sourceName":"Chapter 6 - The work environment.pptx","slide":16,"createdAt":1790250000214,"id":"les_0215"},{"command":"set -o optie / set +o optie","tab":"linux","group":"Omgeving & variabelen","title":"Shelloptie aan- of uitzetten","explanation":"set -o zet een shelloptie aan, set +o zet ze uit. Bv. set -o noclobber voorkomt dat > bestaande bestanden overschrijft.","parts":[{"m":"shellinstellingen","t":"set"},{"m":"optie aanzetten","t":"-o"},{"m":"optie uitzetten","t":"+o"},{"m":"naam van de optie, bv. noclobber","t":"optie"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":17,"createdAt":1790250000215,"id":"les_0216"},{"command":"$EDITOR / $VISUAL","tab":"linux","group":"Omgeving & variabelen","title":"Standaard teksteditor","explanation":"Bepalen welke editor programma's openen, bv. bij crontab -e. Bekijken met echo $EDITOR.","sourceName":"Chapter 6 - The work environment.pptx","slide":19,"createdAt":1790250000216,"id":"les_0217"},{"command":"$HISTSIZE","tab":"linux","group":"Omgeving & variabelen","title":"Aantal bewaarde commando's","explanation":"Hoeveel commando's de shell in de geschiedenis (history) bewaart. Bekijken met echo $HISTSIZE.","sourceName":"Chapter 6 - The work environment.pptx","slide":19,"createdAt":1790250000217,"id":"les_0218"},{"command":"$HOSTNAME","tab":"linux","group":"Omgeving & variabelen","title":"Naam van de computer","explanation":"Naam van de machine waarop je werkt. Bekijken met echo $HOSTNAME.","sourceName":"Chapter 6 - The work environment.pptx","slide":19,"createdAt":1790250000218,"id":"les_0219"},{"command":"$USERNAME","tab":"linux","group":"Omgeving & variabelen","title":"Je gebruikersnaam","explanation":"Bevat de naam van de aangemelde gebruiker. Bekijken met echo $USERNAME.","sourceName":"Chapter 6 - The work environment.pptx","slide":19,"createdAt":1790250000219,"id":"les_0220"},{"command":"$LANG","tab":"linux","group":"Omgeving & variabelen","title":"Voorkeurstaal","explanation":"Taal- en landinstelling van het systeem, bv. en_US.UTF-8. Bekijken met echo $LANG.","sourceName":"Chapter 6 - The work environment.pptx","slide":19,"createdAt":1790250000220,"id":"les_0221"},{"command":"$DISPLAY","tab":"linux","group":"Omgeving & variabelen","title":"Scherm van grafische omgeving","explanation":"Wordt door de grafische omgeving gebruikt om te weten op welk scherm vensters getoond worden. Bekijken met echo $DISPLAY.","sourceName":"Chapter 6 - The work environment.pptx","slide":19,"createdAt":1790250000221,"id":"les_0222"},{"command":"$MAIL","tab":"linux","group":"Omgeving & variabelen","title":"Map met binnenkomende mail","explanation":"Locatie waar binnenkomende mail van de gebruiker bewaard wordt. Bekijken met echo $MAIL.","sourceName":"Chapter 6 - The work environment.pptx","slide":19,"createdAt":1790250000222,"id":"les_0223"},{"command":"$PATH","tab":"linux","group":"Omgeving & variabelen","title":"Mappen waar commando's gezocht worden","explanation":"Lijst van mappen, gescheiden door :, waarin de shell zoekt naar het programma dat je typt. Niet zomaar overschrijven; wel iets toevoegen. Bekijken met echo $PATH.","sourceName":"Chapter 6 - The work environment.pptx","slide":20,"createdAt":1790250000223,"id":"les_0224"},{"command":"$PS1 / $PS2","tab":"linux","group":"Omgeving & variabelen","title":"Opmaak van de prompt","explanation":"PS1 is de gewone prompt (bv. [guest@fedora ~]$); PS2 is de tweede prompt die verschijnt als een commando over meerdere regels loopt. Aanpassen geeft een persoonlijke prompt. Bekijken met echo $PS1.","sourceName":"Chapter 6 - The work environment.pptx","slide":20,"createdAt":1790250000224,"id":"les_0225"},{"command":"$PWD","tab":"linux","group":"Omgeving & variabelen","title":"Naam huidige map","explanation":"Bevat het pad van de map waarin je nu werkt. Bekijken met echo $PWD.","sourceName":"Chapter 6 - The work environment.pptx","slide":20,"createdAt":1790250000225,"id":"les_0226"},{"command":"$SHELL","tab":"linux","group":"Omgeving & variabelen","title":"Pad van de huidige shell","explanation":"Bevat naam en pad van je shell, bv. /bin/bash. Bekijken met echo $SHELL.","sourceName":"Chapter 6 - The work environment.pptx","slide":20,"createdAt":1790250000226,"id":"les_0227"},{"command":"$OSTYPE","tab":"linux","group":"Omgeving & variabelen","title":"Type besturingssysteem","explanation":"Systeemvariabele met informatie over het besturingssysteem, bv. linux-gnu. Bekijken met echo $OSTYPE.","sourceName":"Chapter 6 - The work environment.pptx","slide":20,"createdAt":1790250000227,"id":"les_0228"},{"command":"$UID","tab":"linux","group":"Omgeving & variabelen","title":"Nummer van de gebruiker","explanation":"Identificatienummer (user ID) van de gebruiker; root heeft 0. Bekijken met echo $UID.","sourceName":"Chapter 6 - The work environment.pptx","slide":20,"createdAt":1790250000228,"id":"les_0229"},{"command":"$TERM","tab":"linux","group":"Omgeving & variabelen","title":"Type terminal","explanation":"Welk type terminal je gebruikt, bv. xterm-256color. Bekijken met echo $TERM.","sourceName":"Chapter 6 - The work environment.pptx","slide":20,"createdAt":1790250000229,"id":"les_0230"},{"command":"alias naam='commando -opties'","tab":"linux","group":"Omgeving & variabelen","title":"Korte naam voor commando maken","explanation":"Maakt een alias: een korte naam voor een commando dat je vaak gebruikt, bv. alias la='ls -a'. Zonder argumenten toont alias alle aliassen. Een alias in de terminal verdwijnt als je de shell sluit; zet hem in ~/.bashrc om hem te bewaren.","parts":[{"m":"maak of toon aliassen","t":"alias"},{"m":"de korte naam, bv. la","t":"naam"},{"m":"zonder spaties","t":"="},{"m":"het volledige commando tussen aanhalingstekens","t":"'commando -opties'"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":21,"createdAt":1790250000231,"id":"les_0232"},{"command":"alias nb='nano ~/.bashrc'","tab":"linux","group":"Omgeving & variabelen","title":"Alias om .bashrc te bewerken","explanation":"Voorbeeld van een handige alias: nb opent je .bashrc in de editor nano. Een tweede alias sb='source ~/.bashrc' leest het bestand daarna opnieuw in.","parts":[{"m":"naam van de alias","t":"nb"},{"m":"eenvoudige teksteditor","t":"nano"},{"m":"je configuratiebestand","t":"~/.bashrc"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":23,"createdAt":1790250000232,"id":"les_0233"},{"command":"alias nohead=\"awk 'NR > 1 && NR <= 11'\"","tab":"linux","group":"Omgeving & variabelen","title":"Alias: head zonder kopregel","explanation":"Maakt een alias nohead die 10 regels van een bestand toont zoals head, maar de eerste regel (kopregel) overslaat. Gebruik: nohead bestand.","parts":[{"m":"maak een nieuwe opdrachtnaam nohead","t":"alias nohead="},{"m":"sla regel 1 over","t":"NR > 1"},{"m":"stop na regel 11 (10 dataregels)","t":"NR <= 11"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":37,"createdAt":1790250000297,"id":"les_0298"},{"command":"export PATH=$PATH:directory","tab":"linux","group":"Omgeving & variabelen","title":"Map toevoegen aan PATH","explanation":"Voegt een map toe aan de lijst waarin de shell naar programma's zoekt. Daarna kun je scripts in die map van overal uitvoeren zonder ./. Zet deze regel in ~/.bashrc of ~/.bash_profile om hem blijvend te maken.","parts":[{"m":"maak de variabele ook beschikbaar voor subshells","t":"export"},{"m":"de huidige inhoud van PATH","t":"$PATH"},{"m":"voeg deze map achteraan toe (: scheidt de mappen)","t":":directory"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":7,"createdAt":1790250000369,"id":"les_0370"},{"command":"ANSWER=yes","tab":"linux","group":"Omgeving & variabelen","title":"Variabele aanmaken","explanation":"Maakt de variabele ANSWER met waarde yes in de huidige shell. Er mogen geen spaties rond het = staan. Hoofdletters zijn niet verplicht. In een subshell (bv. na het commando bash) bestaat deze variabele niet.","parts":[{"m":"naam van de variabele","t":"ANSWER"},{"m":"ken toe (zonder spaties)","t":"="},{"m":"de
