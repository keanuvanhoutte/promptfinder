,"sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":21,"createdAt":1790250000545,"id":"les_0546"},{"command":"'tekst met $'","tab":"php","group":"Strings","title":"String zonder interpolatie (enkele quotes)","explanation":"In een string tussen enkele aanhalingstekens vult PHP geen variabelen in: $ en de naam blijven letterlijk staan. Gebruik dit voor tekst met een dollarteken, zoals 'K$sha'; met dubbele quotes zou PHP $sha als (onbestaande) variabele zien en een waarschuwing geven.","parts":[{"m":"enkele aanhalingstekens: alles letterlijk","t":"' '"}],"examples":[{"command":"'tekst met $'","note":"echo 'We just attended a performance by K$sha.'; toont de naam correct. Met dubbele quotes krijg je: PHP Warning: Undefined variable $sha.","output":"","slide":22,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":22,"createdAt":1790250000546,"id":"les_0547"},{"command":"Escape sequence","tab":"php","group":"Strings","title":"Speciaal teken in een string","explanation":"Een escape sequence is een backslash (\\) gevolgd door een teken, waarmee je tekens in een string zet die anders moeilijk in te voegen zijn, zoals een nieuwe regel, een tab, een $ of een aanhalingsteken. In dubbele quotes werken \\n, \\t, \\$, \\\" en \\\\; in enkele quotes alleen \\' en \\\\.","sourceName":"4. Fundamentals of PHP.pptx","slide":23,"createdAt":1790250000547,"id":"les_0548"},{"command":"\\n","tab":"php","group":"Strings","title":"Nieuwe regel in string","explanation":"\\n zet een nieuwe regel (newline) in een string met dubbele aanhalingstekens: de tekst erna begint op de volgende regel. Veel gebruikt om uitvoer in de terminal netjes onder elkaar te krijgen.","parts":[{"m":"newline-teken","t":"\\n"}],"examples":[{"command":"\\n","note":"echo \"And here we are\\nHalf past three in the morning\\nI can't get no sleep\"; toont drie regels.","output":"And here we are\nHalf past three in the morning\nI can't get no sleep","slide":23,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":23,"createdAt":1790250000548,"id":"les_0549"},{"command":"\\t","tab":"php","group":"Strings","title":"Tab in string","explanation":"\\t zet een tab (horizontale inspringing) in een string met dubbele aanhalingstekens.","parts":[{"m":"tab-teken","t":"\\t"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":23,"createdAt":1790250000549,"id":"les_0550"},{"command":"\\$","tab":"php","group":"Strings","title":"Letterlijk dollarteken in string","explanation":"\\$ zet een gewoon dollarteken in een string met dubbele aanhalingstekens, zonder dat PHP er een variabele in ziet.","parts":[{"m":"letterlijk $-teken","t":"\\$"}],"examples":[{"command":"\\$","note":"echo \"The name of the variable is \\$password\"; toont letterlijk $password.","output":"","slide":23,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":23,"createdAt":1790250000550,"id":"les_0551"},{"command":"\\\\","tab":"php","group":"Strings","title":"Letterlijke backslash in string","explanation":"\\\\ zet één gewone backslash (\\) in een string; werkt zowel tussen enkele als dubbele aanhalingstekens.","parts":[{"m":"letterlijke \\","t":"\\\\"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":23,"createdAt":1790250000551,"id":"les_0552"},{"command":"\\\" en \\'","tab":"php","group":"Strings","title":"Aanhalingsteken in string zetten","explanation":"\\\" zet een dubbel aanhalingsteken in een string tussen dubbele quotes; \\' zet een enkel aanhalingsteken in een string tussen enkele quotes. Zo sluit het aanhalingsteken de string niet per ongeluk af.","parts":[{"m":"letterlijk \" (in dubbele quotes)","t":"\\\""},{"m":"letterlijk ' (in enkele quotes)","t":"\\'"}],"examples":[{"command":"\\\" en \\'","note":"echo \"Faithless's \\\"Insomnia\\\" lyrics:\\n\"; toont de titel tussen aanhalingstekens.","output":"Faithless's \"Insomnia\" lyrics:","slide":24,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":24,"createdAt":1790250000552,"id":"les_0553"},{"command":"strlen($string)","tab":"php","group":"Strings","title":"Lengte van een string","explanation":"Geeft het aantal tekens in een string terug, spaties en leestekens inbegrepen.","parts":[{"m":"string length","t":"strlen"},{"m":"de tekst die je wil meten","t":"$string"}],"examples":[{"command":"strlen($string)","note":"strlen(\"Hippopotomonstrosesquipedaliophobia\") geeft 35.","output":"","slide":82,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":82,"createdAt":1790250000599,"id":"les_0600"},{"command":"str_split($string)","tab":"php","group":"Strings","title":"String opsplitsen in tekens","explanation":"Splitst een string in losse tekens en geeft een array terug waarin elk element één teken is.","parts":[{"m":"splits de string","t":"str_split"},{"m":"de tekst die je wil opsplitsen","t":"$string"}],"examples":[{"command":"str_split($string)","note":"Met str_split en een for-lus die van achter naar voor telt, toon je een omgekeerd bericht weer leesbaar.","output":"","slide":84,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":84,"createdAt":1790250000601,"id":"les_0602"},{"command":"strtolower($string)","tab":"php","group":"Strings","title":"Tekst naar kleine letters","explanation":"Geeft een nieuwe string terug waarin alle letters omgezet zijn naar kleine letters.","parts":[{"m":"string to lower (case)","t":"strtolower"},{"m":"de om te zetten tekst","t":"$string"}],"examples":[{"command":"strtolower($string)","note":"echo strtolower(\"THESE PHP EXAMPLES ARE RIDICULOUS!\");","output":"these php examples are ridiculous!","slide":85,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":85,"createdAt":1790250000602,"id":"les_0603"},{"command":"strtoupper($string)","tab":"php","group":"Strings","title":"Tekst naar hoofdletters","explanation":"Geeft een nieuwe string terug waarin alle letters omgezet zijn naar hoofdletters.","parts":[{"m":"string to upper (case)","t":"strtoupper"},{"m":"de om te zetten tekst","t":"$string"}],"examples":[{"command":"strtoupper($string)","note":"echo strtoupper(\"I know these PHP examples are ridiculous!\");","output":"I KNOW THESE PHP EXAMPLES ARE RIDICULOUS!","slide":86,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":86,"createdAt":1790250000603,"id":"les_0604"},{"command":"explode(delimiter, $string)","tab":"php","group":"Strings","title":"String splitsen in een array","explanation":"Knipt een string in stukken telkens waar de delimiter voorkomt en geeft die stukken terug als array. De delimiter zelf verdwijnt.","parts":[{"m":"splits de string","t":"explode"},{"m":"het scheidingsteken, bv. \",\" of \"um\"","t":"delimiter"},{"m":"de tekst die gesplitst wordt","t":"$string"}],"examples":[{"command":"explode(delimiter, $string)","note":"explode(\"um\", \"WelcomeumtoumWeb\") geeft de array [\"Welcome\", \"to\", \"Web\"].","output":"","slide":87,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":87,"createdAt":1790250000605,"id":"les_0606"},{"command":"implode(delimiter, $array)","tab":"php","group":"Strings","title":"Array samenvoegen tot string","explanation":"Plakt alle elementen van een array aan elkaar tot één string, met de delimiter ertussen. Het omgekeerde van explode().","parts":[{"m":"voeg samen","t":"implode"},{"m":"wat tussen de elementen komt, bv. \" \"","t":"delimiter"},{"m":"de array met de stukken","t":"$array"}],"examples":[{"command":"implode(delimiter, $array)","note":"echo implode(\" \", $words); toont de woorden als één zin met spaties ertussen.","output":"","slide":89,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":89,"createdAt":1790250000606,"id":"les_0607"},{"command":"preg_match('/^>/', $string)","tab":"php","group":"Strings","title":"Patroon zoeken in een string","explanation":"Controleert of een patroon (een reguliere expressie) in een string voorkomt en geeft true (1) of false (0) terug. Het patroon '/^>/' checkt of de string begint met >, handig om de headerregels van een (multi)FASTA-bestand te herkennen.","parts":[{"m":"zoek een patroon","t":"preg_match"},{"m":"het patroon staat tussen slashes","t":"'/.../'"},{"m":"begin van de string","t":"^"},{"m":"het teken >","t":">"},{"m":"de tekst die doorzocht wordt","t":"$string"}],"examples":[{"command":"preg_match('/^>/', $string)","note":"if (preg_match('/^A/', $bloodType)) controleert of een bloedgroep met A begint.","output":"","slide":90,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":90,"createdAt":1790250000607,"id":"les_0608"},{"command":"trim($string)","tab":"php","group":"Strings","title":"Witruimte aan begin/einde verwijderen","explanation":"Verwijdert spaties, tabs en newlines aan het begin en het einde van een string; witruimte in het midden blijft staan. Handig om ingevoerde gegevens zoals e-mailadressen op te kuisen.","parts":[{"m":"knip witruimte weg","t":"trim"},{"m":"de op te kuisen tekst","t":"$string"}],"examples":[{"command":"trim($string)","note":"trim(\"  paco.hulpiau@howest.be  \") geeft \"paco.hulpiau@howest.be\".","output":"","slide":96,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":96,"createdAt":1790250000611,"id":"les_0612"},{"command":"strtolower($tekst)","tab":"php","group":"Strings","title":"Tekst naar kleine letters","explanation":"Zet alle letters van een string om naar kleine letters. Handig om invoer te vergelijken, ongeacht of de gebruiker hoofdletters typte.","parts":[{"m":"de string die je omzet","t":"$tekst"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":22,"createdAt":1790250000632,"id":"les_0633"},{"command":"explode(\"\\n\", $tekst)","tab":"php","group":"Strings","title":"Tekst splitsen in array","explanation":"Knipt een string op elke plaats waar het scheidingsteken staat en geeft een array van de stukken. Met \"\\n\" splits je tekst (bv. uit een textarea of file_get_contents()) in aparte regels.","parts":[{"m":"scheidingsteken: regeleinde (dubbele aanhalingstekens nodig)","t":"\"\\n\""},{"m":"de string die je splitst","t":"$tekst"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":38,"createdAt":1790250000641,"id":"les_0642"},{"command":"trim($tekst)","tab":"php","group":"Strings","title":"Spaties en regeleinden weghalen","explanation":"Verwijdert witruimte zoals spaties en \\n aan het begin en einde van een string. Nodig bij regels uit file(), anders klopt een vergelijking zoals $line == \"Aurelia aurita\" niet.","parts":[{"m":"de string die je opschoont","t":"$tekst"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":50,"createdAt":1790250000651,"id":"les_0652"},{"command":"Scalaire types (integer, float, string, boolean)","tab":"php","group":"Variabelen & types","title":"De vier eenvoudigste datatypes","explanation":"Scalaire waarden zijn de eenvoudigste soorten data en stellen één enkele waarde voor. Er zijn vier types: integer (geheel getal, bv. 42), float (kommagetal, bv. 3.14), string (tekst tussen ' ' of \" \", bv. \"Don't panic\") en boolean (true of false).","sourceName":"4. Fundamentals of PHP.pptx","slide":14,"createdAt":1790250000539,"id":"les_0540"},{"command":"$naam = waarde;","tab":"php","group":"Variabelen & types","title":"Waarde opslaan in een variabele","explanation":"Maakt een variabele en geeft ze een waarde, zodat je die later in het script kunt gebruiken. Een variabelenaam begint met $ gevolgd door letters, cijfers of underscores, maar mag niet met een cijfer beginnen (dus $Mona_Lisa mag, $123VanGogh of $Mona-Lisa niet). Een nieuwe waarde toekennen overschrijft de oude.","parts":[{"m":"elke variabelenaam begint met een dollarteken","t":"$"},{"m":"letters, cijfers of _ (niet met een cijfer beginnen; hoofdlettergevoelig)","t":"naam"},{"m":"ken de waarde toe","t":"="},{"m":"bv. 42, 3.14, \"Don't panic\" of true","t":"waarde"}],"examples":[{"command":"$naam = waarde;","note":"$howestPassword = 'H0w3st!2024'; bewaart een wachtwoord in een variabele.","output":"","slide":15,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":15,"createdAt":1790250000540,"id":"les_0541"},{"command":"$naam = $naam . \" \" . $naam;","tab":"php","group":"Variabelen & types","title":"Variabele bijwerken met huidige waarde","explanation":"Je kunt een variabele aanpassen op basis van haar huidige waarde: rechts van = wordt eerst de nieuwe waarde berekend met de oude, en die wordt daarna terug in dezelfde variabele gestoken.","parts":[{"m":"de huidige waarde","t":"$naam (rechts)"},{"m":"plak een spatie en de waarde erachter","t":". \" \" ."},{"m":"krijgt het nieuwe resultaat","t":"$naam (links)"}],"examples":[{"command":"$naam = $naam . \" \" . $naam;","note":"Met $scientificName = 'papio'; wordt de variabele na deze regel 'papio papio'.","output":"papio papio","slide":25,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":25,"createdAt":1790250000553,"id":"les_0554"},{"command":"$argv","tab":"php","group":"Variabelen & types","title":"Command-line argumenten uitlezen","explanation":"$argv is een ingebouwde array met de argumenten die je bij het starten van het script in de terminal meegeeft. $argv[0] is altijd de naam van het script zelf, $argv[1] het eerste argument, $argv[2] het tweede, enzovoort.","parts":[{"m":"naam van het script","t":"$argv[0]"},{"m":"eerste argument na de scriptnaam","t":"$argv[1]"},{"m":"tweede argument","t":"$argv[2]"}],"examples":[{"command":"$argv","note":"Bij php discountCalculator.php 100 15 bevat $argv[1] de waarde 100 en $argv[2] de waarde 15.","output":"","slide":47,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":47,"createdAt":1790250000572,"id":"les_0573"},{"command":"if (voorwaarde) { ... }","tab":"php","group":"Voorwaarden","title":"Code uitvoeren als voorwaarde waar is","explanation":"Een if-statement controleert een voorwaarde en voert de code tussen de accolades alleen uit als die voorwaarde true is; anders wordt die code overgeslagen. Er komt geen puntkomma na het blok. Een nieuwe if start een aparte, onafhankelijke voorwaarde.","parts":[{"m":"als","t":"if"},{"m":"test die true of false oplevert","t":"(voorwaarde)"},{"m":"code die uitgevoerd wordt als de voorwaarde waar is","t":"{ ... }"}],"examples":[{"command":"if (voorwaarde) { ... }","note":"if ($Trigger == \"Boo!\") { echo \"The goat is startled and falls over!\"; }","output":"","slide":57,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":57,"createdAt":1790250000585,"id":"les_0586"},{"command":"elseif (voorwaarde) { ... }","tab":"php","group":"Voorwaarden","title":"Extra voorwaarde als vorige onwaar","explanation":"elseif test een extra voorwaarde als alle voorgaande if/elseif-voorwaarden onwaar waren. Je mag er meerdere na een if zetten; zodra er één waar is, worden de volgende niet meer gecontroleerd.","parts":[{"m":"anders als","t":"elseif"},{"m":"nieuwe test","t":"(voorwaarde)"},{"m":"code als deze voorwaarde waar is","t":"{ ... }"}],"examples":[{"command":"elseif (voorwaarde) { ... }","note":"elseif ($environment == \"rock\") { $chameleon_color = \"grey\"; }","output":"","slide":58,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":58,"createdAt":1790250000586,"id":"les_0587"},{"command":"else { ... }","tab":"php","group":"Voorwaarden","title":"Code als niets anders klopt","explanation":"else voert zijn code uit als alle voorgaande if- en elseif-voorwaarden onwaar zijn. Het heeft zelf geen voorwaarde en staat altijd als laatste. Een conditional heeft precies één if, optioneel één else en nul of meer elseifs.","parts":[{"m":"anders","t":"else"},{"m":"code als geen enkele voorwaarde waar was","t":"{ ... }"}],"examples":[{"command":"else { ... }","note":"if ($distance <= 3.0) { echo \"Warning: ...\"; } else { echo \"You are safe.\"; }","output":"","slide":60,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":60,"createdAt":1790250000587,"id":"les_0588"},{"command":"Geneste if","tab":"php","group":"Voorwaarden","title":"Voorwaarde binnen een voorwaarde","explanation":"Je kunt een if-statement binnen een ander if-blok plaatsen (nesten). Zo behandel je ingewikkeldere logica waarbij een beslissing van meerdere voorwaarden afhangt.","parts":[{"m":"binnenste test wordt pas bekeken als de buitenste waar is","t":"if (...) { if (...) { ... } }"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":63,"createdAt":1790250000588,"id":"les_0589"},{"command":"ray 1200,800","tab":"pymol","group":"Afbeeldingen","title":"Figuur renderen met ray tracing","explanation":"Maakt met de ingebouwde ray tracing een mooie, scherpe figuur met schaduwen, hier met een resolutie van 1200 op 800 pixels.","parts":[{"m":"ray tracing uitvoeren","t":"ray"},{"m":"breedte en hoogte in pixels","t":"1200,800"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":37,"createdAt":1790250000700,"id":"les_0701"},{"command":"File > Export Image As > PNG...","tab":"pymol","group":"Afbeeldingen","title":"Figuur opslaan als PNG","explanation":"Bewaart het huidige beeld (bv. na ray) als PNG-afbeelding.","sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":37,"createdAt":1790250000701,"id":"les_0702"},{"command":"png figuur.png","tab":"pymol","group":"Afbeeldingen","title":"Beeld opslaan als PNG","explanation":"Bewaart het huidige beeld (bv. na ray) als PNG-afbeelding, zonder via het menu te gaan.","parts":[{"m":"bewaar als PNG-afbeelding","t":"png"},{"m":"bestandsnaam","t":"figuur.png"}],"sourceName":"SB-workshop-3-molecular-visualization.pptx","slide":6,"createdAt":1790250000737,"id":"les_0738"},{"command":"Setting > Edit All...","tab":"pymol","group":"Instellingen","title":"Alle parameters bekijken en wijzigen","explanation":"Opent een lijst met alle parameters die je in PyMOL kunt instellen, zoals sphere_scale of transparency.","sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":36,"createdAt":1790250000698,"id":"les_0699"},{"command":"set sphere_scale, 0.8, chain B","tab":"pymol","group":"Instellingen","title":"Bolgrootte van keten B verkleinen","explanation":"Stelt de grootte van de bollen (show spheres) in op 0,8 keer de normale grootte, enkel voor keten B. Algemene vorm: set parameter, waarde, selectie.","parts":[{"m":"stel een parameter in","t":"set"},{"m":"parameter: grootte van de bollen (standaard 1)","t":"sphere_scale"},{"m":"nieuwe waarde","t":"0.8"},{"m":"selectie waarvoor het geldt","t":"chain B"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":36,"createdAt":1790250000699,"id":"les_0700"},{"command":"set transparency, 0.4","tab":"pymol","group":"Instellingen","title":"Oppervlak doorschijnend maken","explanation":"Maakt het oppervlak (surface) voor 40% doorzichtig, zodat de cartoon eronder zichtbaar blijft.","parts":[{"m":"stel een parameter in","t":"set"},{"m":"doorzichtigheid van het oppervlak","t":"transparency"},{"m":"waarde tussen 0 (ondoorzichtig) en 1 (onzichtbaar)","t":"0.4"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":38,"createdAt":1790250000704,"id":"les_0705"},{"command":"File > Edit pymolrc","tab":"pymol","group":"Instellingen","title":"Opstartinstellingen bewerken","explanation":"Opent het bestand .pymolrc in je thuismap. De commando's daarin voert PyMOL automatisch uit bij elke start, bv. een witte achtergrond.","sourceName":"SB-workshop-4-molecular-visualization.pptx","slide":3,"createdAt":1790250000745,"id":"les_0746"},{"command":"bg_color white","tab":"pymol","group":"Instellingen","title":"Witte achtergrond instellen","explanation":"Maakt de achtergrond van het canvas wit. In .pymolrc wordt dit de standaard bij elke start.","parts":[{"m":"achtergrondkleur instellen","t":"bg_color"},{"m":"kleur","t":"white"}],"sourceName":"SB-workshop-4-molecular-visualization.pptx","slide":3,"createdAt":1790250000746,"id":"les_0747"},{"command":"set seq_view_format, 1","tab":"pymol","group":"Instellingen","title":"Drielettercodes in sequentie","explanation":"Toont in de sequentieweergave (Display > Sequence) de residuen met drielettercodes (bv. ALA) in plaats van eenlettercodes.","parts":[{"m":"stel een parameter in","t":"set"},{"m":"formaat van de sequentieweergave","t":"seq_view_format"},{"m":"residunamen (drie letters)","t":"1"}],"sourceName":"SB-workshop-4-molecular-visualization.pptx","slide":3,"createdAt":1790250000747,"id":"les_0748"},{"command":"color red, chain A","tab":"pymol","group":"Kleuren","title":"Kleur keten A rood","explanation":"Geeft alle atomen van keten A een rode kleur.","parts":[{"m":"kleur geven","t":"color"},{"m":"kleurnaam","t":"red"},{"m":"selectie: keten A","t":"chain A"}],"createdAt":1790233200000,"id":"ex_color"},{"command":"color red, hetatm","tab":"pymol","group":"Kleuren","title":"Alle niet-eiwitatomen rood kleuren","explanation":"Voorbeeld van de basisvorm van een PyMOL-commando: een sleutelwoord gevolgd door één of meer argumenten, gescheiden door komma's. Dit kleurt alle HETATM-atomen (niet-eiwit, bv. liganden) rood.","parts":[{"m":"commando: kleur geven","t":"color"},{"m":"eerste argument: de kleur","t":"red"},{"m":"tweede argument: de selectie (niet-standaard atomen)","t":"hetatm"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":21,"createdAt":1790250000664,"id":"les_0665"},{"command":"C > by ss","tab":"pymol","group":"Kleuren","title":"Kleuren volgens secundaire structuur","explanation":"In het Color-menu (knop C) naast een object kies je by ss om helices, β-strengen en lussen elk een eigen kleur te geven.","parts":[{"m":"Color-knop naast het object","t":"C"},{"m":"by secondary structure","t":"by ss"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":25,"createdAt":1790250000671,"id":"les_0672"},{"command":"color cyan, chain A","tab":"pymol","group":"Kleuren","title":"Keten A cyaan kleuren","explanation":"Geeft alle atomen van keten A de kleur cyaan. Zo kun je verschillende ketens van elkaar onderscheiden.","parts":[{"m":"kleur geven","t":"color"},{"m":"de kleur","t":"cyan"},{"m":"selectie: keten A","t":"chain A"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":28,"createdAt":1790250000680,"id":"les_0681"},{"command":"color magenta, chain B + chain C + chain D","tab":"pymol","group":"Kleuren","title":"Meerdere ketens tegelijk kleuren","explanation":"Kleurt de ketens B, C en D in één keer magenta. Met + voeg je selecties samen (zoals or).","parts":[{"m":"kleur magenta geven","t":"color magenta"},{"m":"ketens B, C en D samen","t":"chain B + chain C + chain D"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":28,"createdAt":1790250000681,"id":"les_0682"},{"command":"color skyblue, chain A","tab":"pymol","group":"Kleuren","title":"Keten A hemelsblauw kleuren","explanation":"Kleurt keten A in skyblue. PyMOL kent veel kleurnamen, bv. firebrick (donkerrood), forest (donkergroen) en gray50.","parts":[{"m":"kleur geven","t":"color"},{"m":"kleurnaam","t":"skyblue"},{"m":"selectie","t":"chain A"}],"sourceName":"SB-workshop-3-molecular-visualization.pptx","slide":6,"createdAt":1790250000733,"id":"les_0734"},{"command":"color orange, resn DA","tab":"pymol","group":"Kleuren","title":"DNA-nucleotiden per type kleuren","explanation":"Kleurt alle adenine-nucleotiden (residunaam DA) oranje. Doe hetzelfde met een andere kleur voor DG, DT en DC om elk type nucleotide een eigen kleur te geven.","parts":[{"m":"oranje kleuren","t":"color orange"},{"m":"deoxyadenosine; DG, DT, DC zijn de andere DNA-nucleotiden","t":"resn DA"}],"sourceName":"SB-workshop-3-molecular-visualization.pptx","slide":7,"createdAt":1790250000738,"id":"les_0739"},{"command":"png eiwit.png, dpi=300, ray=1","tab":"pymol","group":"Laden & bewaren","title":"Bewaar mooie afbeelding","explanation":"Rendert het beeld in hoge kwaliteit en bewaart het als eiwit.png met 300 dpi, geschikt voor een verslag.","parts":[{"m":"bewaar als afbeelding","t":"png"},{"m":"bestandsnaam","t":"eiwit.png"},{"m":"resolutie","t":"dpi=300"},{"m":"eerst mooi renderen","t":"ray=1"}],"createdAt":1790233200000,"id":"ex_png"},{"command":"fetch 1ubq","tab":"pymol","group":"Laden & bewaren","title":"Download ubiquitine uit PDB","explanation":"Haalt de structuur met PDB-code 1UBQ (ubiquitine) op uit de Protein Data Bank en opent ze.","parts":[{"m":"download structuur uit de PDB","t":"fetch"},{"m":"PDB-code van de structuur","t":"1ubq"}],"createdAt":1790233200000,"id":"ex_fetch"},{"command":"fetch 3CIG","tab":"pymol","group":"Laden & bewaren","title":"Structuur laden uit de PDB","explanation":"Downloadt een structuur rechtstreeks van de Protein Data Bank via internet en laadt ze in PyMOL. Het enige argument is de PDB-code.","parts":[{"m":"haal een structuur op uit de PDB","t":"fetch"},{"m":"PDB-code van de structuur","t":"3CIG"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":23,"createdAt":1790250000666,"id":"les_0667"},{"command":"File > Open","tab":"pymol","group":"Laden & bewaren","title":"Coördinatenbestand openen van laptop","explanation":"Via het menu File > Open kies je een bestand met atoomcoördinaten (bv. een .pdb- of .cif-bestand) dat al op je computer staat.","sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":23,"createdAt":1790250000667,"id":"les_0668"},{"command":"delete 3CIG","tab":"pymol","group":"Laden & bewaren","title":"Object verwijderen","explanation":"Verwijdert een object (hier de structuur 3CIG) uit PyMOL. Handig om opnieuw te beginnen of een selectie op te ruimen.","parts":[{"m":"verwijder een object","t":"delete"},{"m":"naam van het object","t":"3CIG"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":26,"createdAt":1790250000672,"id":"les_0673"},{"command":"File > Save Session As...","tab":"pymol","group":"Laden & bewaren","title":"Sessie bewaren als .pse","explanation":"Bewaart de volledige toestand van PyMOL (structuren, weergaven, kleuren, camerastandpunt) als .pse-bestand, zodat je later verder kunt werken.","sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":37,"createdAt":1790250000702,"id":"les_0703"},{"command":"split_states 2JQY","tab":"pymol","group":"Laden & bewaren","title":"NMR-modellen in aparte objecten","explanation":"Zet elk model (state) van een NMR-structuur in een apart object, zodat je ze apart kunt kleuren, tonen of op elkaar passen.","parts":[{"m":"splits states in aparte objecten","t":"split_states"},{"m":"het object met meerdere states","t":"2JQY"}],"sourceName":"SB-workshop-3-molecular-visualization.pptx","slide":3,"createdAt":1790250000727,"id":"les_0728"},{"command":"save sessie.pse","tab":"pymol","group":"Laden & bewaren","title":"Sessie bewaren via commando","explanation":"Bewaart de volledige PyMOL-sessie als .pse-bestand (hetzelfde als File > Save Session As...). Met een extensie zoals .pdb bewaar je enkel de coördinaten.","parts":[{"m":"bewaar naar bestand","t":"save"},{"m":"bestandsnaam; .pse = PyMOL-sessie","t":"sessie.pse"}],"sourceName":"SB-workshop-3-molecular-visualization.pptx","slide":6,"createdAt":1790250000736,"id":"les_0737"},{"command":"distance hbonds, sel1, sel2, mode=2","tab":"pymol","group":"Metingen","title":"Waterstofbruggen tonen","explanation":"Tekent stippellijnen voor mogelijke polaire contacten (waterstofbruggen) tussen twee selecties en bewaart ze als object hbonds. Via de A-knop > find > polar contacts kan hetzelfde met de muis.","parts":[{"m":"afstanden meten/tekenen","t":"distance"},{"m":"naam van het nieuwe object","t":"hbonds"},{"m":"de twee selecties","t":"sel1, sel2"},{"m":"enkel polaire contacten (waterstofbruggen)","t":"mode=2"}],"sourceName":"SB-workshop-2-molecular-visualization.pptx","slide":16,"createdAt":1790250000720,"id":"les_0721"},{"command":"# commentaar","tab":"pymol","group":"Scripts","title":"Commentaar in script","explanation":"Een regel die met # begint is commentaar en wordt niet uitgevoerd. Zet commentaar in PyMOL-scripts op een aparte regel, niet achter code.","parts":[{"m":"begin van commentaar","t":"#"}],"sourceName":"SB-workshop-4-molecular-visualization.pptx","slide":5,"createdAt":1790250000749,"id":"les_0750"},{"command":"from pymol import cmd","tab":"pymol","group":"Scripts","title":"PyMOL-commando's in Python laden","explanation":"Eerste regel van een Python-script voor PyMOL: importeert de module cmd. Daarna roep je elk PyMOL-commando op als cmd.functienaam(...), bv. cmd.color('red').","parts":[{"m":"uit het pakket pymol","t":"from pymol"},{"m":"laad de module cmd met alle commando's","t":"import cmd"}],"sourceName":"SB-workshop-4-molecular-visualization.pptx","slide":5,"createdAt":1790250000750,"id":"les_0751"},{"command":"cmd.create('achain','chain A')","tab":"pymol","group":"Scripts","title":"Object maken in Python","explanation":"Python-versie van create achain, chain A: maakt een nieuw object achain met de atomen van keten A. Argumenten staan tussen haakjes en aanhalingstekens.","parts":[{"m":"commando create","t":"cmd.create"},{"m":"naam van het nieuwe object","t":"'achain'"},{"m":"selectie","t":"'chain A'"}],"sourceName":"SB-workshop-4-molecular-visualization.pptx","slide":5,"createdAt":1790250000751,"id":"les_0752"},{"command":"cmd.bg_color('white')","tab":"pymol","group":"Scripts","title":"Witte achtergrond in Python","explanation":"Python-versie van bg_color white: maakt de achtergrond wit.","parts":[{"m":"commando bg_color","t":"cmd.bg_color"},{"m":"kleur","t":"'white'"}],"sourceName":"SB-workshop-4-molecular-visualization.pptx","slide":5,"createdAt":1790250000752,"id":"les_0753"},{"command":"cmd.color('red','resn asp or resn glu')","tab":"pymol","group":"Scripts","title":"Zure residuen rood kleuren","explanation":"Kleurt alle aspartaat- en glutamaatresiduen (negatief geladen) rood. Het script simplecolors.py kleurt op dezelfde manier arg, lys en his (positief) blauw.","parts":[{"m":"commando color","t":"cmd.color"},{"m":"kleur","t":"'red'"},{"m":"selectie: Asp of Glu","t":"'resn asp or resn glu'"}],"sourceName":"SB-workshop-4-molecular-visualization.pptx","slide":7,"createdAt":1790250000753,"id":"les_0754"},{"command":"cmd.show('cartoon')","tab":"pymol","group":"Scripts","title":"Cartoon tonen in Python","explanation":"Python-versie van show cartoon. Met een tweede argument beperk je het tot een selectie, bv. cmd.show('cartoon','achain + bchain').","parts":[{"m":"commando show","t":"cmd.show"},{"m":"weergave","t":"'cartoon'"}],"sourceName":"SB-workshop-4-molecular-visualization.pptx","slide":7,"createdAt":1790250000754,"id":"les_0755"},{"command":"cmd.hide('lines')","tab":"pymol","group":"Scripts","title":"Lijnen verbergen in Python","explanation":"Python-versie van hide lines: verbergt de standaard lijnenweergave. Met cmd.hide('all') verberg je alles.","parts":[{"m":"commando hide","t":"cmd.hide"},{"m":"weergave die verdwijnt","t":"'lines'"}],"sourceName":"SB-workshop-4-molecular-visualization.pptx","slide":7,"createdAt":1790250000755,"id":"les_0756"},{"command":"run simplecolors.py","tab":"pymol","group":"Scripts","title":"Python-script uitvoeren","explanation":"Voert een Python-script uit in PyMOL. Zet het script in je thuismap (dezelfde map als .pymolrc) en laad eerst een structuur, bv. fetch 1BBB.","parts":[{"m":"voer een script uit","t":"run"},{"m":"naam van het scriptbestand","t":"simplecolors.py"}],"sourceName":"SB-workshop-4-molecular-visualization.pptx","slide":7,"createdAt":1790250000756,"id":"les_0757"},{"command":"run findseq.py","tab":"pymol","group":"Scripts","title":"findseq-script laden","explanation":"Laadt het gedownloade script findseq.py in PyMOL, zodat het nieuwe commando findseq beschikbaar wordt.","parts":[{"m":"voer een script uit","t":"run"},{"m":"script van de PyMOL-wiki","t":"findseq.py"}],"sourceName":"SB-workshop-4-molecular-visualization.pptx","slide":9,"createdAt":1790250000758,"id":"les_0759"},{"command":"select actief, resi 40-50","tab":"pymol","group":"Selecties","title":"Selecteer residuen 40-50","explanation":"Maakt een selectie met de naam 'actief' van residu 40 tot en met 50, die je daarna kan kleuren of tonen.","parts":[{"m":"maak een selectie","t":"select"},{"m":"naam van je selectie","t":"actief"},{"m":"residunummers 40 tot 50","t":"resi 40-50"}],"createdAt":1790233200000,"id":"ex_select"},{"command":"create nieuw_object, selectie","tab":"pymol","group":"Selecties","title":"Nieuw object uit selectie","explanation":"Maakt een nieuw, apart object van een selectie, bv. create achain, chain A. Dat object verschijnt in de objectlijst en kun je apart tonen, verbergen en kleuren.","parts":[{"m":"maak een nieuw object","t":"create"},{"m":"naam van het nieuwe object","t":"nieuw_object"},{"m":"welke atomen erin komen","t":"selectie"}],"examples":[{"command":"create tlr3, 1ZIW and (not hetatm)","note":"Er ontstaat een nieuw object 'tlr3' in de objectlijst dat alleen de atomen van het eiwit bevat.","output":"","source":"screenshot"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":22,"createdAt":1790250000665,"id":"les_0666"},{"command":"hetatm","tab":"pymol","group":"Selecties","title":"Niet-standaard atomen selecteren","explanation":"Sleutelwoord dat alle atomen selecteert die in het PDB-bestand als HETATM staan: liganden, water, zouten, gemodificeerde residuen.","sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":26,"createdAt":1790250000675,"id":"les_0676"},{"command":"select ///A/10","tab":"pymol","group":"Selecties","title":"Residu 10 van keten A","explanation":"Hiërarchische selectie van links naar rechts: /model/segment/chain/residue/atom. Lege velden betekenen 'alles'. Dit selecteert residu 10 in keten A.","parts":[{"m":"maak een selectie","t":"select"},{"m":"model en segment leeg = alle","t":"///"},{"m":"keten A","t":"A"},{"m":"residu 10","t":"/10"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":30,"createdAt":1790250000682,"id":"les_0683"},{"command":"select ////10-20/CA","tab":"pymol","group":"Selecties","title":"CA-atomen van residuen 10-20","explanation":"Hiërarchische selectie van de atomen met naam CA (α-koolstof) in residuen 10 tot 20, in eender welke keten.","parts":[{"m":"model, segment en keten leeg = alle","t":"////"},{"m":"residuen 10 tot 20","t":"10-20"},{"m":"atoomnaam CA","t":"/CA"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":30,"createdAt":1790250000683,"id":"les_0684"},{"command":"select 42/C,N","tab":"pymol","group":"Selecties","title":"C- en N-atoom van residu 42","explanation":"Hiërarchische selectie van rechts naar links zonder beginnende /: residu/atoom. Selecteert de atomen C en N in residu 42.","parts":[{"m":"residu 42","t":"42"},{"m":"atomen met naam C en N","t":"C,N"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":30,"createdAt":1790250000684,"id":"les_0685"},{"command":"resi","tab":"pymol","group":"Selecties","title":"Selecteren op residunummer","explanation":"Sleutelwoord om residuen te selecteren op hun nummer (residue index), bv. resi 10 of een bereik resi 10:20.","parts":[{"m":"residu nummer 10","t":"resi 10"},{"m":"residuen 10 tot en met 20","t":"resi 10:20"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":31,"createdAt":1790250000685,"id":"les_0686"},{"command":"resn","tab":"pymol","group":"Selecties","title":"Selecteren op residunaam","explanation":"Sleutelwoord om residuen te selecteren op hun naam (residue name), bv. resn ALA voor alanine of resn HEM voor de heemgroep.","parts":[{"m":"alle alanineresiduen","t":"resn ALA"},{"m":"alle heemgroepen","t":"resn HEM"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":31,"createdAt":1790250000686,"id":"les_0687"},{"command":"select chain B and resi 10:20","tab":"pymol","group":"Selecties","title":"Residuen 10-20 van keten B","explanation":"Algebraïsche selectie: termen zoals chain en resi worden gecombineerd met and. De selectie heet standaard (sele) en wordt in het beeld aangeduid.","parts":[{"m":"maak een selectie","t":"select"},{"m":"keten B","t":"chain B"},{"m":"beide voorwaarden moeten kloppen","t":"and"},{"m":"residuen 10 tot en met 20","t":"resi 10:20"}],"examples":[{"command":"select chain B and resi 10:20","note":"In structuur 1GBV bevat deze selectie 81 atomen.","output":"Selector: selection \"sele\" defined with 81 atoms.","slide":31,"source":"les","sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":31,"createdAt":1790250000687,"id":"les_0688"},{"command":"and / or / not","tab":"pymol","group":"Selecties","title":"Selecties combineren","explanation":"Logische operatoren om algebraïsche selecties te combineren: and (beide), or (één van beide), not (uitsluiten).","parts":[{"m":"beide voorwaarden","t":"and"},{"m":"minstens één voorwaarde","t":"or"},{"m":"alles behalve","t":"not"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":31,"createdAt":1790250000688,"id":"les_0689"},{"command":"elem","tab":"pymol","group":"Selecties","title":"Selecteren op chemisch element","explanation":"Sleutelwoord om atomen te selecteren op element, bv. elem O voor alle zuurstofatomen.","parts":[{"m":"alle zuurstofatomen","t":"elem O"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":32,"createdAt":1790250000689,"id":"les_0690"},{"command":"name","tab":"pymol","group":"Selecties","title":"Selecteren op atoomnaam","explanation":"Sleutelwoord om atomen te selecteren op hun naam in het PDB-bestand, bv. name CA voor de α-koolstofatomen of name N voor de backbone-stikstof.","parts":[{"m":"α-koolstofatomen","t":"name CA"},{"m":"backbone-stikstofatomen","t":"name N"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":32,"createdAt":1790250000690,"id":"les_0691"},{"command":"all","tab":"pymol","group":"Selecties","title":"Alle atomen selecteren","explanation":"Sleutelwoord dat alle atomen van alle objecten selecteert, bv. in hide all.","sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":32,"createdAt":1790250000691,"id":"les_0692"},{"command":"select resn ALA and name N","tab":"pymol","group":"Selecties","title":"Backbone-stikstof van alanines","explanation":"Selecteert de backbone-stikstofatomen (name N) van alle alanineresiduen.","parts":[{"m":"alanineresiduen","t":"resn ALA"},{"m":"en","t":"and"},{"m":"atomen met naam N","t":"name N"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":32,"createdAt":1790250000692,"id":"les_0693"},{"command":"select elem O and not name OH","tab":"pymol","group":"Selecties","title":"Zuurstofatomen behalve hydroxylen","explanation":"Selecteert alle zuurstofatomen behalve de atomen met naam OH (hydroxylgroepen).","parts":[{"m":"zuurstofatomen","t":"elem O"},{"m":"maar niet","t":"and not"},{"m":"atomen met naam OH","t":"name OH"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":32,"createdAt":1790250000693,"id":"les_0694"},{"command":"around","tab":"pymol","group":"Selecties","title":"Atomen in de buurt selecteren","explanation":"Selecteert atomen binnen een bepaalde afstand (in ångström) van een bestaande selectie, bv. hetatm around 5. Handig om te zien welke residuen betrokken zijn in een bindingsplaats.","parts":[{"m":"atomen binnen 5 Å van de selectie","t":"selectie around 5"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":32,"createdAt":1790250000694,"id":"les_0695"},{"command":"chain","tab":"pymol","group":"Selecties","title":"Selecteren op keten","explanation":"Sleutelwoord om atomen van een bepaalde keten te selecteren, bv. chain A.","parts":[{"m":"alle atomen van keten A","t":"chain A"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":33,"createdAt":1790250000695,"id":"les_0696"},{"command":"select byres (elem Ca around 3.5)","tab":"pymol","group":"Selecties","title":"Residuen rond calcium selecteren","explanation":"Selecteert alle volledige residuen (byres) met minstens één atoom binnen 3,5 Å van een calciumion. Zo vind je welke residuen calcium binden.","parts":[{"m":"maak een selectie","t":"select"},{"m":"breid uit naar volledige residuen","t":"byres"},{"m":"calciumatomen","t":"elem Ca"},{"m":"binnen 3,5 Å","t":"around 3.5"}],"sourceName":"SB-workshop-3-molecular-visualization.pptx","slide":5,"createdAt":1790250000732,"id":"les_0733"},{"command":"create nag, resn NAG","tab":"pymol","group":"Selecties","title":"Glycanen in apart object","explanation":"Maakt een apart object (laag) met de NAG-residuen (N-acetylglucosamine van glycosylaties), zodat je snel ziet waar de glycosylaties zitten (bv. N281, N433, N486).","parts":[{"m":"maak een nieuw object","t":"create"},{"m":"naam van het object","t":"nag"},{"m":"N-acetylglucosamine-residuen","t":"resn NAG"}],"sourceName":"SB-workshop-3-molecular-visualization.pptx","slide":12,"createdAt":1790250000741,"id":"les_0742"},{"command":"findseq DDMPNAL, achain, found","tab":"pymol","group":"Selecties","title":"Sequentiemotief zoeken in structuur","explanation":"Zoekt een sequentiemotief in een object en maakt er een selectie van. Werkt pas nadat je run findseq.py hebt uitgevoerd (script van de PyMOL-wiki). Kleine letters en reguliere expressies (bv. F.*W) werken ook.","parts":[{"m":"zoekcommando uit findseq.py","t":"findseq"},{"m":"sequentiemotief om te zoeken","t":"DDMPNAL"},{"m":"object waarin gezocht wordt","t":"achain"},{"m":"naam van de selectie die gemaakt wordt","t":"found"}],"sourceName":"SB-workshop-4-molecular-visualization.pptx","slide":9,"createdAt":1790250000757,"id":"les_0758"},{"command":"align 3CIG, 1ZIW","tab":"pymol","group":"Vergelijken","title":"Structuur op andere structuur passen","explanation":"Legt de eerste structuur (muis-TLR3) zo goed mogelijk op de tweede (humaan TLR3) door ze te verschuiven en draaien. Daarna kun je verschillen tussen beide zichtbaar maken, bv. met een andere kleur. PyMOL toont de RMSD als maat voor het verschil.","parts":[{"m":"structureel superponeren","t":"align"},{"m":"mobiele structuur die verplaatst wordt","t":"3CIG"},{"m":"doelstructuur die blijft staan","t":"1ZIW"}],"examples":[{"command":"align 3CIG, 1ZIW","note":"De twee eiwitstructuren worden nu bovenop elkaar geplaatst, zodat je hun 3D-vormverschillen kunt onderzoeken.","output":"","source":"screenshot"}],"sourceName":"SB-workshop-2-molecular-visualization.pptx","slide":2,"createdAt":1790250000706,"id":"les_0707"},{"command":"align 2IWW, 2JQY","tab":"pymol","group":"Vergelijken","title":"Kristal- en NMR-structuur superponeren","explanation":"Legt de kristalstructuur (gesloten vorm) op de NMR-structuur, zodat je het verschil in lus 6 van OmpG kunt zien.","parts":[{"m":"structureel superponeren","t":"align"},{"m":"mobiele structuur","t":"2IWW"},{"m":"doelstructuur","t":"2JQY"}],"sourceName":"SB-workshop-3-molecular-visualization.pptx","slide":3,"createdAt":1790250000728,"id":"les_0729"},{"command":"align 1RE2, 1HFX","tab":"pymol","group":"Vergelijken","title":"Lysozym en α-lactalbumine superponeren","explanation":"Legt de twee structuren structureel op elkaar om te bevestigen dat ze dezelfde vouw (fold) hebben.","parts":[{"m":"structureel superponeren","t":"align"},{"m":"lysozym (mobiel)","t":"1RE2"},{"m":"α-lactalbumine (doel)","t":"1HFX"}],"sourceName":"SB-workshop-5-databases-tools.pptx","slide":6,"createdAt":1790250000771,"id":"les_0772"},{"command":"align 2LHB and resn HEM, 3TM3 and resn HEM","tab":"pymol","group":"Vergelijken","title":"Structuren superponeren op heemgroep","explanation":"Legt twee hemoglobinestructuren over elkaar door enkel de heemgroepen (residunaam HEM) uit te lijnen. Handig wanneer de sequenties te verschillend zijn om de volledige ketens uit te lijnen.","parts":[{"m":"PyMOL-commando om te superponeren","t":"align"},{"m":"mobiele selectie: heem van 2LHB","t":"2LHB and resn HEM"},{"m":"doelselectie: heem van 3TM3","t":"3TM3 and resn HEM"}],"sourceName":"SB-07-structural-functional-assignment.pptx","slide":29,"createdAt":1790250000913,"id":"les_0914"},{"command":"as cartoon","tab":"pymol","group":"Weergave","title":"Toon enkel als lint","explanation":"Verbergt de andere weergaven en toont het eiwit als lint, zodat je helices en sheets goed ziet.","parts":[{"m":"toon alleen deze weergave","t":"as"},{"m":"lintweergave (secundaire structuur)","t":"cartoon"}],"createdAt":1790233200000,"id":"ex_cartoon"},{"command":"Objectlijst","tab":"pymol","group":"Weergave","title":"Geladen objecten tonen/verbergen","explanation":"De objectlijst rechts toont welke objecten (structuren, selecties) geladen zijn. Klik op de naam van een object om het te verbergen of weer te tonen.","sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":18,"createdAt":1790250000662,"id":"les_0663"},{"command":"A / S / H / L / C-knoppen","tab":"pymol","group":"Weergave","title":"Menuknoppen naast elk object","explanation":"Naast elk object in de objectlijst staan vijf knoppen die een keuzemenu openen. Zo kun je veel doen zonder commando's te typen.","parts":[{"m":"Actions: basisacties (bv. zoom, verwijderen)","t":"A"},{"m":"Show: een weergave tonen","t":"S"},{"m":"Hide: een weergave verbergen","t":"H"},{"m":"Label: labels plaatsen","t":"L"},{"m":"Color: kleuren","t":"C"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":19,"createdAt":1790250000663,"id":"les_0664"},{"command":"hide all","tab":"pymol","group":"Weergave","title":"Alle weergaven verbergen","explanation":"Verbergt alle weergaven van alle objecten, zodat je daarna zelf kiest wat je toont.","parts":[{"m":"verberg een weergave","t":"hide"},{"m":"alles","t":"all"}],"examples":[{"command":"hide all","note":"Alle voorheen zichtbare onderdelen van de eiwitstructuur worden nu onzichtbaar.","output":"","source":"screenshot"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":24,"createdAt":1790250000668,"id":"les_0669"},{"command":"show sticks","tab":"pymol","group":"Weergave","title":"Toon als staafjes","explanation":"Toont de atomen en bindingen als staafjes (sticks). Handig om zijketens of liganden in detail te bekijken. Met hide sticks verberg je ze weer.","parts":[{"m":"toon een weergave","t":"show"},{"m":"weergave: staafjesmodel","t":"sticks"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":24,"createdAt":1790250000669,"id":"les_0670"},{"command":"show cartoon","tab":"pymol","group":"Weergave","title":"Toon als cartoon","explanation":"Toont het eiwit als cartoon: helices als spiralen en β-strengen als pijlen. Deze weergave toont enkel de eiwitketen (secundaire structuur), geen liganden.","parts":[{"m":"toon een weergave","t":"show"},{"m":"weergave: secundaire structuur als spiralen en pijlen","t":"cartoon"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":24,"createdAt":1790250000670,"id":"les_0671"},{"command":"show spheres, hetatm","tab":"pymol","group":"Weergave","title":"HETATM-atomen als bollen tonen","explanation":"Toont alle HETATM-atomen (liganden, water, zouten, gemodificeerde residuen) als bollen. Vergeet niet de selectie na de komma te vermelden, anders geldt het voor alles.","parts":[{"m":"toon een weergave","t":"show"},{"m":"weergave: bollen (spacefilling)","t":"spheres"},{"m":"selectie: niet-standaard atomen","t":"hetatm"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":26,"createdAt":1790250000673,"id":"les_0674"},{"command":"show representatie, selectie","tab":"pymol","group":"Weergave","title":"Algemene vorm van show","explanation":"Algemene vorm van show (en hide): eerst de weergave, dan welke atomen. Mogelijke weergaven zijn lines, sticks, spheres, surface, mesh, dots, ribbon en cartoon.","parts":[{"m":"tonen of verbergen","t":"show / hide"},{"m":"lines, sticks, spheres, surface, mesh, dots, ribbon of cartoon","t":"representatie"},{"m":"welke atomen, bv. chain A of hetatm (weglaten = alles)","t":"selectie"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":27,"createdAt":1790250000676,"id":"les_0677"},{"command":"Wizard > Demo > Representations","tab":"pymol","group":"Weergave","title":"Demo van alle weergaven","explanation":"Via het hoofdmenu Wizard > Demo > Representations toont PyMOL een voorbeeld van alle weergaven naast elkaar: lines, sticks, spheres, surface, mesh, dots, ribbon en cartoon.","sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":27,"createdAt":1790250000677,"id":"les_0678"},{"command":"hide cartoon, chain A","tab":"pymol","group":"Weergave","title":"Cartoon van keten A verbergen","explanation":"Verbergt enkel de cartoonweergave van keten A; de andere ketens blijven zichtbaar.","parts":[{"m":"verberg een weergave","t":"hide"},{"m":"de weergave die verdwijnt","t":"cartoon"},{"m":"selectie: keten A","t":"chain A"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":28,"createdAt":1790250000678,"id":"les_0679"},{"command":"show ribbon, chain A","tab":"pymol","group":"Weergave","title":"Keten A als lint tonen","explanation":"Toont keten A als ribbon: een dunne lijn die de ruggengraat (backbone) van de keten volgt.","parts":[{"m":"toon een weergave","t":"show"},{"m":"weergave: lint langs de backbone","t":"ribbon"},{"m":"selectie: keten A","t":"chain A"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":28,"createdAt":1790250000679,"id":"les_0680"},{"command":"Display > Sequence","tab":"pymol","group":"Weergave","title":"Sequentie boven het beeld tonen","explanation":"Toont de aminozuursequentie bovenaan het canvas. Klikken op residuen in de sequentie selecteert ze in de structuur.","sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":33,"createdAt":1790250000696,"id":"les_0697"},{"command":"Display > Background","tab":"pymol","group":"Weergave","title":"Achtergrondkleur kiezen","explanation":"Via Display > Background kies je de achtergrondkleur van het canvas (bv. wit voor figuren).","sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":33,"createdAt":1790250000697,"id":"les_0698"},{"command":"show surface","tab":"pymol","group":"Weergave","title":"Moleculair oppervlak tonen","explanation":"Toont het moleculaire oppervlak van de structuur. Handig om bv. een bindingsholte te zien.","parts":[{"m":"toon een weergave","t":"show"},{"m":"weergave: moleculair oppervlak","t":"surface"}],"sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":38,"createdAt":1790250000703,"id":"les_0704"},{"command":"show sticks, resi 511-521","tab":"pymol","group":"Weergave","title":"Bereik residuen als sticks","explanation":"Toont de residuen 511 tot 521 als staafjes, bv. om de dsRNA-interactieplaats van TLR3 (met N515 en N517) in detail te bekijken.","parts":[{"m":"toon als staafjes","t":"show sticks"},{"m":"residuen 511 tot 521","t":"resi 511-521"}],"sourceName":"SB-workshop-2-molecular-visualization.pptx","slide":5,"createdAt":1790250000710,"id":"les_0711"},{"command":"set all_states, on","tab":"pymol","group":"Weergave","title":"Alle NMR-modellen tegelijk tonen","explanation":"Toont alle states (modellen/conformeren) van een object tegelijk, bv. het NMR-ensemble van 2JQY, zodat je de verschillen tussen de conformeren ziet. Met set all_states, off zie je weer één model.","parts":[{"m":"stel een parameter in","t":"set"},{"m":"alle states tegelijk tonen","t":"all_states"},{"m":"aanzetten","t":"on"}],"sourceName":"SB-workshop-3-molecular-visualization.pptx","slide":3,"createdAt":1790250000726,"id":"les_0727"},{"command":"show surface, chain A","tab":"pymol","group":"Weergave","title":"Oppervlak van één keten","explanation":"Toont enkel keten A als moleculair oppervlak, terwijl je de andere keten bv. als cartoon toont.","parts":[{"m":"toon als oppervlak","t":"show surface"},{"m":"enkel keten A","t":"chain A"}],"sourceName":"SB-workshop-3-molecular-visualization.pptx","slide":6,"createdAt":1790250000734,"id":"les_0735"},{"command":"show sticks, resn TRP and resi 2","tab":"pymol","group":"Weergave","title":"Tryptofaan 2 als sticks","explanation":"Toont het tryptofaan op positie 2 (in de adhesie-arm van cadherine) als staafjes, in beide ketens.","parts":[{"m":"tryptofaanresiduen","t":"resn TRP"},{"m":"en","t":"and"},{"m":"residu nummer 2","t":"resi 2"}],"sourceName":"SB-workshop-3-molecular-visualization.pptx","slide":6,"createdAt":1790250000735,"id":"les_0736"},{"command":"show sticks, resn DA+DC+DG+DT","tab":"pymol","group":"Weergave","title":"DNA als staafjes tonen","explanation":"Toont alle DNA-nucleotiden als staafjes. Met + som je meerdere residunamen op binnen één resn.","parts":[{"m":"residuen met naam DA, DC, DG of DT","t":"resn DA+DC+DG+DT"}],"sourceName":"SB-workshop-3-molecular-visualization.pptx","slide":7,"createdAt":1790250000739,"id":"les_0740"},{"command":"alter resi 100-103, ss='L'","tab":"pymol","group":"Weergave","title":"Secundaire structuur handmatig wijzigen","explanation":"Verandert de secundaire structuur van residuen, bv. een korte helix die als lus (L) getoond moet worden. Daarna voer je rebuild uit om de cartoon opnieuw te tekenen.","parts":[{"m":"wijzig een eigenschap van atomen","t":"alter"},{"m":"voorbeeldbereik van residuen","t":"resi 100-103"},{"m":"secundaire structuur: H = helix, S = streng, L = lus","t":"ss='L'"}],"sourceName":"SB-workshop-3-molecular-visualization.pptx","slide":12,"createdAt":1790250000742,"id":"les_0743"},{"command":"Structurele bio-informatica","tab":"structbio","group":"Algemeen","title":"Bio-informatica op 3D-structuren","explanation":"Het deel van de bio-informatica dat theorie, methoden en toepassingen (algoritmes, analyses, voorspellingen) gebruikt op structurele data van biomoleculen. In deze cursus gaat het om eiwitten, DNA, RNA, liganden en complexen daarvan.","sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":6,"createdAt":1790250000653,"id":"les_0654"},{"command":"Aminozuur","tab":"structbio","group":"Aminozuren","title":"Bouwsteen van eiwitten","explanation":"Klein molecule met een centraal Cα-atoom waaraan een aminogroep (NH2), een carboxylgroep (COOH), een H-atoom en een variabele zijketen (R-groep) hangen. Alleen de R-groep verschilt tussen de 20 standaard-aminozuren en bepaalt hun chemische eigenschappen.","sourceName":"SB-02-fundamentals-protein-structure.pptx","slide":10,"createdAt":1790250000779,"id":"les_0780"},{"command":"Posttranslationele modificatie (PTM)","tab":"structbio","group":"Aminozuren","title":"Aanpassing na eiwitsynthese","explanation":"Chemische wijziging van een aminozuur nadat het eiwit gemaakt is. Voorbeelden: glycosylering (suikergroep), fosforylering (fosfaatgroep op Ser, Thr, Tyr of His) en methylering (methylgroep op Lys of Arg).","sourceName":"SB-02-fundamentals-protein-structure.pptx","slide":14,"createdAt":1790250000780,"id":"les_0781"},{"command":"Aminozuurklassen (hydrofoob, polair, geladen)","tab":"structbio","group":"Aminozuren","title":"Indeling volgens zijketen","explanation":"De 20 aminozuren worden ingedeeld volgens hun zijketen: hydrofoob (meestal verborgen in het binnenste van het eiwit), polair (hydrofiel, vaak aan het oppervlak in contact met water) en geladen (positief of negatief). Subklassen zijn bv. aromatisch of alifatisch, groot of klein.","sourceName":"SB-02-fundamentals-protein-structure.pptx","slide":17,"createdAt":1790250000781,"id":"les_0782"},{"command":"Proline en glycine","tab":"structbio","group":"Aminozuren","title":"Twee uitzonderlijke aminozuren","explanation":"Bij proline is de zijketen verbonden met de eigen aminogroep (cyclisch), waardoor de keten minder flexibel is. Glycine heeft enkel een H-atoom als zijketen, is niet chiraal en is juist zeer flexibel.","sourceName":"SB-02-fundamentals-protein-structure.pptx","slide":26,"createdAt":1790250000782,"id":"les_0783"},{"command":"L- en D-aminozuren (chiraliteit)","tab":"structbio","group":"Aminozuren","title":"Spiegelbeeldvormen van aminozuren","explanation":"Een chiraal C-atoom is gebonden aan 4 verschillende groepen en bestaat in twee spiegelbeeldvormen: L en D. Eiwitten zijn (bijna) uitsluitend opgebouwd uit L-aminozuren.","sourceName":"SB-02-fundamentals-protein-structure.pptx","slide":28,"createdAt":1790250000783,"id":"les_0784"},{"command":"Watson-Crick-basenparing","tab":"structbio","group":"Basenparing","title":"Complementaire paren A:T en G:C","explanation":"In een dubbele helix vormen basen van tegenoverliggende strengen paren via H-bruggen: A met T (2 H-bruggen) en G met C (3 H-bruggen); in RNA A met U. Dit volgt uit de regel van Chargaff: evenveel A als T en evenveel G als C.","sourceName":"SB-03-fundamentals-dna-rna-structure.pptx","slide":24,"createdAt":1790250000806,"id":"les_0807"},{"command":"Grote en kleine groef","tab":"structbio","group":"Basenparing","title":"Twee groeven in de dubbele helix","explanation":"De suikerfosfaatruggengraat vormt aan het oppervlak van de helix twee groeven van verschillende grootte: de grote (major) en de kleine (minor) groef. Eiwitten en geneesmiddelen kunnen in deze groeven binden.","sourceName":"SB-03-fundamentals-dna-rna-structure.pptx","slide":27,"createdAt":1790250000807,"id":"les_0808"},{"command":"Base stacking","tab":"structbio","group":"Basenparing","title":"Basenparen gestapeld op elkaar","explanation":"De basenparen liggen als vlakke platen op elkaar gestapeld. Deze stapelinteracties houden de verticale schikking bij elkaar, maar laten toch wat flexibiliteit toe.","sourceName":"SB-03-fundamentals-dna-rna-structure.pptx","slide":29,"createdAt":1790250000808,"id":"les_0809"},{"command":"Basenpaarparameters","tab":"structbio","group":"Basenparing","title":"Geometrie van basenparen beschrijven","explanation":"Verschuivingen en rotaties binnen één basenpaar (shear, stretch, stagger; buckle, propeller twist, opening) en tussen opeenvolgende basenparen (shift, slide, rise; tilt, roll, twist) beschrijven de exacte 3D-geometrie van een helix.","sourceName":"SB-03-fundamentals-dna-rna-structure.pptx","slide":30,"createdAt":1790250000809,"id":"les_0810"},{"command":"Toll-like receptor (TLR)","tab":"structbio","group":"Biologische context","title":"Receptor van het aangeboren immuunsysteem","explanation":"Familie van eiwitten die micro-organismen herkennen wanneer die onze fysieke barrières (bv. de huid) doorbreken, en dan een immuunrespons activeren. TLR3 herkent dubbelstrengig RNA en heeft een hoefijzervormige (horseshoe) structuur.","sourceName":"SB-workshop-2-molecular-visualization.pptx","slide":2,"createdAt":1790250000705,"id":"les_0706"},{"command":"dsRNA","tab":"structbio","group":"Biologische context","title":"Dubbelstrengig RNA","explanation":"RNA dat uit twee complementaire strengen bestaat en een helix vormt. Veel virussen maken dsRNA; TLR3 herkent het en vormt er een dimeer op (structuur 3CIY).","sourceName":"SB-workshop-2-molecular-visualization.pptx","slide":2,"createdAt":1790250000707,"id":"les_0708"},{"command":"Transcriptiefactor (TF)","tab":"structbio","group":"Biologische context","title":"Eiwit dat transcriptie regelt","explanation":"Eiwit dat op een specifieke DNA-sequentie bindt en zo de transcriptie van een gen regelt, alleen of samen met andere eiwitten. Een activator bevordert de rekrutering van RNA-polymerase, een repressor remt ze.","sourceName":"SB-workshop-2-molecular-visualization.pptx","slide":6,"createdAt":1790250000711,"id":"les_0712"},{"command":"Desmosoom","tab":"structbio","group":"Biologische context","title":"Sterke celverbinding","explanation":"Een celverbinding die naburige cellen stevig aan elkaar vastmaakt via adhesie-eiwitten (cadherines) die in het cytoplasma aan keratinefilamenten gekoppeld zijn.","sourceName":"SB-workshop-3-molecular-visualization.pptx","slide":4,"createdAt":1790250000730,"id":"les_0731"},{"command":"Cadherine","tab":"structbio","group":"Biologische context","title":"Calciumafhankelijk adhesie-eiwit","explanation":"Adhesie-eiwitten die cellen aan elkaar hechten, bv. in desmosomen. Tussen de cadherinedomeinen zitten calciumionen, en een N-terminaal tryptofaan (Trp2) in de adhesie-arm verankert twee cadherines aan elkaar.","sourceName":"SB-workshop-3-molecular-visualization.pptx","slide":5,"createdAt":1790250000731,"id":"les_0732"},{"command":"Isoform","tab":"structbio","group":"Biologische context","title":"Variant van een eiwit","explanation":"Verschillende vormen van een eiwit die van hetzelfde gen komen, bv. door alternatieve splicing van verschillende transcripten.","sourceName":"SB-workshop-5-databases-tools.pptx","slide":2,"createdAt":1790250000762,"id":"les_0763"},{"command":"Intercalatie","tab":"structbio","group":"DNA en geneesmiddelen","title":"Molecule schuift tussen basenparen","explanation":"Een vlak, aromatisch molecule (bv. ethidiumbromide of het kankermedicijn daunomycine) schuift tussen twee basenparen in het midden van de DNA-helix.","sourceName":"SB-03-fundamentals-dna-rna-structure.pptx","slide":62,"createdAt":1790250000816,"id":"les_0817"},{"command":"Groefbinder","tab":"structbio","group":"DNA en geneesmiddelen","title":"Molecule bindt in DNA-groef","explanation":"Molecule dat in een groef van DNA bindt, meestal de kleine groef van B-DNA (bv. netropsine). Groefbinders zijn vaak sterk sequentiespecifiek.","sourceName":"SB-03-fundamentals-dna-rna-structure.pptx","slide":64,"createdAt":1790250000817,"id":"les_0818"},{"command":"DNA-alkylering","tab":"structbio","group":"DNA en geneesmiddelen","title":"Covalente binding aan basen","explanation":"Alkylerende stoffen binden covalent aan de basen en verstoren de DNA-structuur, wat leidt tot celdood als de schade niet hersteld wordt. Voorbeeld: cisplatine, gebruikt bij kankerbehandeling.","sourceName":"SB-03-fundamentals-dna-rna-structure.pptx","slide":66,"createdAt":1790250000818,"id":"les_0819"},{"command":"B-DNA","tab":"structbio","group":"DNA-vormen","title":"Klassieke Watson-Crick-helix","explanation":"De meest voorkomende DNA-vorm: rechtsdraaiende dubbele helix met ~10 basenparen per winding, antiparallelle strengen, C2'-endo pucker en anti-glycosidische hoeken.","sourceName":"SB-03-fundamentals-dna-rna-structure.pptx","slide":56,"createdAt":1790250000813,"id":"les_0814"},{"command":"A-DNA","tab":"structbio","group":"DNA-vormen","title":"Bredere, compactere rechtsdraaiende helix","explanation":"Rechtsdraaiende helix met C3'-endo pucker en ~11 basenparen per winding. De helix is breder dan B-DNA, met een diepe, smalle grote groef en een brede, ondiepe kleine groef.","sourceName":"SB-03-fundamentals-dna-rna-structure.pptx","slide":58,"createdAt":1790250000814,"id":"les_0815"},{"command":"Z-DNA","tab":"structbio","group":"DNA-vormen","title":"Linksdraaiende zigzag-helix","explanation":"Ongewone linksdraaiende DNA-vorm (ontdekt in 1979) met een zigzaggende fosfaatruggengraat. Ze komt vooral voor bij afwisselende C- en G-sequenties.","sourceName":"SB-03-fundamentals-dna-rna-structure.pptx","slide":60,"createdAt":1790250000815,"id":"les_0816"},{"command":"G-quadruplex","tab":"structbio","group":"DNA-vormen","title":"Vierstrengige guaninerijke structuur","explanation":"Viervoudige helix gevormd door guaninerijke sequenties, gestabiliseerd door een Na⁺- of K⁺-ion in het midden. Komt biologisch voor in telomeren.","sourceName":"SB-03-fundamentals-dna-rna-structure.pptx","slide":69,"createdAt":1790250000819,"id":"les_0820"},{"command":"wwPDB","tab":"structbio","group":"Databanken","title":"Wereldwijde organisatie achter PDB","explanation":"De worldwide Protein Data Bank (sinds 2003) beheert één internationaal PDB-archief. Leden waar je structuren kunt indienen en ophalen: RCSB PDB (VS), PDBe (Europa), PDBj (Japan), BMRB (NMR-data) en EMDB (EM-data).","sourceName":"SB-05-data-representation-databases.pptx","slide":4,"createdAt":1790250000862,"id":"les_0863"},{"command":"PDB-ID","tab":"structbio","group":"Databanken","title":"Code van vier tekens","explanation":"Elke PDB-entry heeft een unieke code van vier tekens (bv. 1AEW). Typ die in het zoekvak van rcsb.org om rechtstreeks naar de Structure Summary-pagina te gaan, met o.a. downloadopties, literatuur en validatiegegevens.","sourceName":"SB-05-data-representation-databases.pptx","slide":6,"createdAt":1790250000863,"id":"les_0864"},{"command":"MMDB","tab":"structbio","group":"Databanken","title":"NCBI-databank van 3D-structuren","explanation":"Molecular Modeling Database: experimentele structuren uit de PDB met extra informatie, zoals chemische grafen, berekende 3D-domeinen, links naar literatuur en gebonden liganden.","sourceName":"SB-05-data-representation-databases.pptx","slide":68,"createdAt":1790250000883,"id":"les_0884"},{"command":"CDD, CD-search en CDART","tab":"structbio","group":"Databanken","title":"Geconserveerde domeinen zoeken","explanation":"CDD is de Conserved Domain Database van NCBI (>50 000 domeinmodellen). Met CD-search vind je de geconserveerde domeinen in een eiwitsequentie; CDART zoekt eiwitten met een gelijkaardige domeinarchitectuur.","sourceName":"SB-05-data-representation-databases.pptx","slide":76,"createdAt":1790250000885,"id":"les_0886"},{"command":"PSSM en RPS-BLAST","tab":"structbio","group":"Databanken","title":"Profiel per positie in alignment","explanation":"Een PSSM (position-specific scoring matrix) geeft per positie van een meervoudige alignering scores: geconserveerde posities scoren hoog. RPS-BLAST (gebruikt door CD-search) zoekt met een sequentie in een databank van zulke PSSM's, in één keer (reverse t.o.v. PSI-BLAST).","sourceName":"SB-05-data-representation-databases.pptx","slide":80,"createdAt":1790250000886,"id":"les_0887"},{"command":"PDBsum","tab":"structbio","group":"Databanken","title":"Visueel overzicht per PDB-structuur","explanation":"Databank (EBI) met per PDB-entry afbeeldingen en analyses: componenten, domeinen, eiwit-eiwitinteracties, clefts, PROCHECK-kwaliteit en links naar andere databanken.","sourceName":"SB-05-data-representation-databases.pptx","slide":92,"createdAt":1790250000887,"id":"les_0888"},{"command":"SCOP","tab":"structbio","group":"Databanken & tools","title":"Structuurclassificatie van eiwitten","explanation":"Structural Classification Of Proteins: deelt eiwitdomeinen hiërarchisch in volgens hun structuur en evolutionaire verwantschap (klasse, fold, superfamilie, familie).","sourceName":"SB-workshop-5-databases-tools.pptx","slide":6,"createdAt":1790250000773,"id":"les_0774"},{"command":"CATH","tab":"structbio","group":"Databanken & tools","title":"Hiërarchische domeinclassificatie","explanation":"Databank die eiwitdomeinen indeelt in vier niveaus: Class, Architecture, Topology en Homologous superfamily.","sourceName":"SB-workshop-5-databases-tools.pptx","slide":6,"createdAt":1790250000774,"id":"les_0775"},{"command":"PDBeFold","tab":"structbio","group":"Databanken & tools","title":"Webtool voor structurele alignment","explanation":"Webtool van PDBe om eiwitstructuren in 3D te vergelijken: een pairwise alignment van twee structuren of een multiple 3D-alignment van meerdere structuren, bv. verschillende cadherines.","sourceName":"SB-workshop-5-databases-tools.pptx","slide":7,"createdAt":1790250000776,"id":"les_0777"},{"command":"Globulaire, membraan- en fibreuze eiwitten","tab":"structbio","group":"Eiwitclassificatie","title":"Drie grote eiwitgroepen","explanation":"Indeling op basis van globale biochemische eigenschappen: globulaire eiwitten (bv. myoglobine), membraaneiwitten (bv. rodopsine) en fibreuze eiwitten (bv. collageen).","sourceName":"SB-02-fundamentals-protein-structure.pptx","slide":95,"createdAt":1790250000798,"id":"les_0799"},{"command":"All α, all β, α/β en α+β","tab":"structbio","group":"Eiwitclassificatie","title":"Structuurklassen volgens secundaire structuur","explanation":"Classificatie (Levitt & Chothia, 1976) volgens de dominante secundaire structuur. All α: bijna enkel helices; all β: bijna enkel sheets; α/β: helices en strands gemengd (vaak parallelle strands verbonden door helices); α+β: helices en sheets in aparte delen.","sourceName":"SB-02-fundamentals-protein-structure.pptx","slide":96,"createdAt":1790250000799,"id":"les_0800"},{"command":"Expressie en labeling van eiwitten","tab":"structbio","group":"Eiwitproductie","title":"Eiwit maken voor structuuronderzoek","explanation":"Eiwitten worden meestal in E. coli geproduceerd, voor NMR gelabeld met stabiele isotopen of voor röntgen met zware atomen (bv. selenomethionine). Complexe eukaryote eiwitten vragen soms gist-, insecten- of menselijke cellen.","sourceName":"SB-04-macromolecular-structure-determination-part2.pptx","slide":13,"createdAt":1790250000848,"id":"les_0849"},{"command":"Apo- en holo-enzym","tab":"structbio","group":"Eiwitproductie","title":"Enzym zonder en met cofactor","explanation":"Een apo-enzym is het eiwitdeel zonder cofactor; samen met de cofactor (metaalion of co-enzym) vormt het het katalytisch actieve holo-enzym. Eiwitten die cofactoren nodig hebben, zijn soms moeilijk correct te produceren.","sourceName":"SB-04-macromolecular-structure-determination-part2.pptx","slide":14,"createdAt":1790250000849,"id":"les_0850"},{"command":"His-tag (6xHis)","tab":"structbio","group":"Eiwitproductie","title":"Label om eiwit te zuiveren","explanation":"Reeks van zes histidines die aan het uiteinde (bv. de N-terminus) van een recombinant eiwit wordt gezet, zodat het eiwit makkelijk gezuiverd kan worden.","sourceName":"SB-04-macromolecular-structure-determination-part2.pptx","slide":65,"createdAt":1790250000860,"id":"les_0861"},{"command":"Dynamic light scattering (DLS)","tab":"structbio","group":"Eiwitproductie","title":"Homogeniteit van eiwitstaal meten","explanation":"Meet laserlicht dat door opgeloste moleculen verstrooid wordt om hun grootte en grootteverdeling te bepalen. Zo ziet men of een staal monodispers (homogeen, één grootte) of polydispers (verschillende groottes, aggregatie) is, wat belangrijk is voor kristallisatie.","sourceName":"SB-04-macromolecular-structure-determination-part2.pptx","slide":66,"createdAt":1790250000861,"id":"les_0862"},{"command":"N-glycosylatie (N-glycaan)","tab":"structbio","group":"Eiwitstructuur","title":"Suikerketen op asparagine","explanation":"Suikerketens die aan de stikstof van een asparagine (N) van een eiwit gekoppeld zijn. In PDB-structuren verschijnen ze als HETATM-residuen zoals NAG.","sourceName":"SB-workshop-2-molecular-visualization.pptx","slide":4,"createdAt":1790250000708,"id":"les_0709"},{"command":"Ectodomein","tab":"structbio","group":"Eiwitstructuur","title":"Deel van receptor buiten de cel","explanation":"Het deel van een membraaneiwit dat buiten de cel ligt. Bij TLR3 bindt het ectodomein het dsRNA.","sourceName":"SB-workshop-2-molecular-visualization.pptx","slide":4,"createdAt":1790250000709,"id":"les_0710"},{"command":"Rel Homology Region (RHR)","tab":"structbio","group":"Eiwitstructuur","title":"Gedeelde N-terminale regio Rel/NF-κB","explanation":"N-terminale regio van ongeveer 300 aminozuren die alle eiwitten van de Rel/NF-κB-familie gemeen hebben. Ze zorgt voor de dimerisatie en de binding aan DNA.","sourceName":"SB-workshop-2-molecular-visualization.pptx","slide":10,"createdAt":1790250000713,"id":"les_0714"},{"command":"Geconserveerd residu","tab":"structbio","group":"Eiwitstructuur","title":"Residu dat niet verandert","explanation":"Een residu dat op dezelfde positie in alle vergeleken sequenties identiek is. Geconserveerde residuen zijn vaak belangrijk voor structuur of functie.","sourceName":"SB-workshop-2-molecular-visualization.pptx","slide":11,"createdAt":1790250000714,"id":"les_0715"},{"command":"Eiwitdomein","tab":"structbio","group":"Eiwitstructuur","title":"Zelfstandig gevouwen eiwitdeel","explanation":"Een deel van een eiwit dat op zichzelf een compacte structuur vouwt en vaak een eigen functie heeft. De Rel Homology Region van c-Rel bestaat uit twee immunoglobuline-achtige domeinen verbonden door een korte flexibele linker (L3).","sourceName":"SB-workshop-2-molecular-visualization.pptx","slide":12,"createdAt":1790250000715,"id":"les_0716"},{"command":"Fosforylatie","tab":"structbio","group":"Eiwitstructuur","title":"Fosfaatgroep aan eiwit koppelen","explanation":"Een kinase (bv. proteïnekinase A) hangt een fosfaatgroep aan een residu zoals serine. Dit kan de werking van een eiwit aan- of uitzetten; bij c-Rel is fosforylatie van Ser263 belangrijk voor transcriptie.","sourceName":"SB-workshop-2-molecular-visualization.pptx","slide":13,"createdAt":1790250000716,"id":"les_0717"},{"command":"Porine","tab":"structbio","group":"Eiwitstructuur","title":"Kanaalvormend membraaneiwit","explanation":"Membraaneiwit dat een porie vormt waardoor kleine moleculen door het membraan kunnen. OmpG is een porine uit de buitenmembraan van bacteriën.","sourceName":"SB-workshop-3-molecular-visualization.pptx","slide":2,"createdAt":1790250000724,"id":"les_0725"},{"command":"β-barrel","tab":"structbio","group":"Eiwitstructuur","title":"Tonvormige vouw uit β-strengen","explanation":"Een eiwitvouw waarbij β-strengen een gesloten ton (cilinder) vormen. OmpG bestaat uit een β-barrel van 14 strengen.","sourceName":"SB-workshop-3-molecular-visualization.pptx","slide":2,"createdAt":1790250000725,"id":"les_0726"},{"command":"Sequentiemotief","tab":"structbio","group":"Eiwitstructuur","title":"Kort herkenbaar sequentiepatroon","explanation":"Een korte reeks aminozuren die in verwante eiwitten terugkomt en vaak een functie heeft, bv. DWGET in LRP5 en DWGEV in LRP6.","sourceName":"SB-workshop-3-molecular-visualization.pptx","slide":12,"createdAt":1790250000743,"id":"les_0744"},{"command":"Domeinarchitectuur","tab":"structbio","group":"Eiwitstructuur","title":"Volgorde van domeinen in eiwit","explanation":"Welke domeinen een eiwit bevat en in welke volgorde, bv. de 7 zinkvingers van A20.","sourceName":"SB-workshop-5-databases-tools.pptx","slide":3,"createdAt":1790250000765,"id":"les_0766"},{"command":"Zinkvinger","tab":"structbio","group":"Eiwitstructuur","title":"Klein domein rond zinkion","explanation":"Klein eiwitdomein dat door een zinkion wordt gestabiliseerd. Zinkvingers binden vaak DNA, RNA of andere eiwitten.","sourceName":"SB-workshop-5-databases-tools.pptx","slide":3,"createdAt":1790250000766,"id":"les_0767"},{"command":"Fold (vouw)","tab":"structbio","group":"Eiwitstructuur","title":"Driedimensionale vouwing van eiwit","explanation":"De algemene 3D-schikking van de secundaire structuurelementen in een eiwit. Eiwitten met een andere functie, zoals lysozym en α-lactalbumine, kunnen dezelfde fold hebben.","sourceName":"SB-workshop-5-databases-tools.pptx","slide":6,"createdAt":1790250000772,"id":"les_0773"},{"command":"Elektronenmicroscopie (EM)","tab":"structbio","group":"Elektronenmicroscopie","title":"Beeldvorming met elektronen","explanation":"Gebruikt versnelde elektronen, met een veel kleinere golflengte dan licht, en haalt zo een veel hogere resolutie dan een lichtmicroscoop. Geschikt voor grote, complexe structuren; nadeel: zeer duur en gespecialiseerd.","sourceName":"SB-04-macromolecular-structure-determination-part2.pptx","slide":29,"createdAt":1790250000852,"id":"les_0853"},{"command":"TEM","tab":"structbio","group":"Elektronenmicroscopie","title":"Transmissie-elektronenmicroscoop","explanation":"Een elektronenbundel gaat door een dun preparaat; het beeld wordt vergroot en op een detector (bv. CCD-camera) gefocust. Resolutie tot ~0,1 nm, vergroting > 1 000 000 keer.","sourceName":"SB-04-macromolecular-structure-determination-part2.pptx","slide":33,"createdAt":1790250000853,"id":"les_0854"},{"command":"SEM","tab":"structbio","group":"Elektronenmicroscopie","title":"Scanning-elektronenmicroscoop","explanation":"Een gefocuste elektronenbundel scant (raster scanning) het oppervlak van het preparaat en detecteert teruggekaatste elektronen. Toont vooral het oppervlak; resolutie ~2 nm bij biologische stalen.","sourceName":"SB-04-macromolecular-structure-determination-part2.pptx","slide":36,"createdAt":1790250000854,"id":"les_0855"},{"command":"STEM","tab":"structbio","group":"Elektronenmicroscopie","title":"Scanning-transmissie-elektronenmicroscoop","explanation":"Combinatie van beide: een gefocuste bundel scant over een dun preparaat en de doorgelaten elektronen worden gedetecteerd. Haalt de hoge resolutie van TEM; de focussering gebeurt vóór het preparaat.","sourceName":"SB-04-macromolecular-structure-determination-part2.pptx","slide":39,"createdAt":1790250000855,"id":"les_0856"},{"command":"Cryo-EM","tab":"structbio","group":"Elektronenmicroscopie","title":"EM op ingevroren stalen","explanation":"Het staal wordt als dunne waterige film razendsnel ingevroren (gevitrifieerd), zodat moleculen in hun natuurlijke toestand bekeken worden. Nobelprijs Chemie 2017 (Dubochet, Frank, Henderson).","sourceName":"SB-04-macromolecular-structure-determination-part2.pptx","slide":40,"createdAt":1790250000856,"id":"les_0857"},{"command":"Elektronentomografie (ET)","tab":"structbio","group":"Elektronenmicroscopie","title":"3D-beeld uit vele hoeken","explanation":"Uitbreiding van TEM waarbij beelden vanuit veel hoeken worden uitgelijnd en gecombineerd tot een 3D-structuur.","sourceName":"SB-04-macromolecular-structure-determination-part2.pptx","slide":41,"createdAt":1790250000857,"id":"les_0858"},{"command":"Volume-EM (ATUM, SBEM, FIB-SEM)","tab":"structbio","group":"Elektronenmicroscopie","title":"3D-EM via seriële coupes","explanation":"Technieken om grote stalen laag per laag in beeld te brengen: ATUM snijdt automatisch duizenden dunne coupes, SBEM snijdt met een diamantmes in de microscoop het blokoppervlak weg, en FIB-SEM gebruikt een ionenbundel. De beelden worden tot 3D gereconstrueerd.","sourceName":"SB-04-macromolecular-structure-determination-part2.pptx","slide":45,"createdAt":1790250000858,"id":"les_0859"},{"command":"Divergente evolutie","tab":"structbio","group":"Evolutie en functie","title":"Zelfde fold, andere functie","explanation":"Homologe eiwitten kunnen een andere functie krijgen. Voorbeeld: lysozym en α-lactalbumine (40% identiek, zelfde structuur), maar bij α-lactalbumine zijn de katalytische residuen vervangen, waardoor het geen enzym meer is.","sourceName":"SB-07-structural-functional-assignment.pptx","slide":26,"createdAt":1790250000912,"id":"les_0913"},{"command":"Structuur geconserveerder dan sequentie","tab":"structbio","group":"Evolutie en functie","title":"Zelfde fold bij weinig sequentiegelijkenis","explanation":"Bij ver verwante eiwitten blijft de structuur beter bewaard dan de sequentie. Voorbeeld: bacteriële en eukaryote hemoglobine hebben maar 8% sequentie-identiteit, toch zelfde fold en functie.","sourceName":"SB-07-structural-functional-assignment.pptx","slide":30,"createdAt":1790250000914,"id":"les_0915"},{"command":"Convergente evolutie (analoge eiwitten)","tab":"structbio","group":"Evolutie
