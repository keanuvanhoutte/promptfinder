nation":"Doet hetzelfde als test: hier controleren of twee teksten gelijk zijn. Vergeet de spatie na [ en vóór ] niet, anders krijg je een fout.","parts":[{"m":"zelfde als test (spaties verplicht)","t":"[ ]"},{"m":"zijn beide teksten gelijk?","t":"string1 = string2"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":25,"createdAt":1790250000395,"id":"les_0396"},{"command":"if [ ] then … elif [ ] then … else … fi","tab":"linux","group":"Scripts","title":"Meerdere voorwaarden na elkaar","explanation":"Met elif (else if) test je een tweede voorwaarde als de eerste niet klopte. Je kunt meerdere elif's na elkaar zetten; else vangt alle overige gevallen op.","parts":[{"m":"anders, als deze voorwaarde klopt","t":"elif [ ]"},{"m":"in alle andere gevallen","t":"else"},{"m":"einde van if","t":"fi"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":27,"createdAt":1790250000396,"id":"les_0397"},{"command":"[ ] && …","tab":"linux","group":"Scripts","title":"Uitvoeren als test lukt","explanation":"Het commando na && wordt enkel uitgevoerd als de test ervoor gelukt is (exitstatus 0), bv. [ -f $1 ] && echo bestand.","parts":[{"m":"voer het volgende uit bij succes","t":"&&"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":27,"createdAt":1790250000397,"id":"les_0398"},{"command":"[ ] || …","tab":"linux","group":"Scripts","title":"Uitvoeren als test mislukt","explanation":"Het commando na || wordt enkel uitgevoerd als de test ervoor mislukt is (exitstatus niet 0), bv. [ -e $1 ] || echo bestaat niet.","parts":[{"m":"voer het volgende uit bij mislukking","t":"||"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":27,"createdAt":1790250000398,"id":"les_0399"},{"command":"for i in … do … done","tab":"linux","group":"Scripts","title":"Lus over een lijst","explanation":"Voert de opdrachten tussen do en done uit voor elk element uit de lijst; i krijgt telkens de waarde van het volgende element, bv. for i in $(seq 1 100).","parts":[{"m":"i is de lusvariabele","t":"for i"},{"m":"de lijst van elementen","t":"in …"},{"m":"de opdrachten voor elk element","t":"do … done"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":27,"createdAt":1790250000399,"id":"les_0400"},{"command":"if test -f $1 then … else … fi","tab":"linux","group":"Scripts","title":"Keuze maken met if","explanation":"Voert de opdrachten na then uit als de test lukt (hier: $1 is een bestand); anders de opdrachten na else. fi sluit het if-blok af. then staat meestal op een nieuwe regel of na een ;.","parts":[{"m":"als","t":"if"},{"m":"de voorwaarde","t":"test -f $1"},{"m":"dan: uit te voeren bij succes","t":"then"},{"m":"anders","t":"else"},{"m":"einde van if","t":"fi"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":28,"createdAt":1790250000400,"id":"les_0401"},{"command":"$#","tab":"linux","group":"Scripts","title":"Aantal argumenten","explanation":"Bevat het aantal argumenten dat aan het script meegegeven is.","parts":[{"m":"aantal argumenten","t":"$#"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":29,"createdAt":1790250000401,"id":"les_0402"},{"command":"\"$*\"","tab":"linux","group":"Scripts","title":"Alle argumenten als één geheel","explanation":"Bevat alle argumenten samen als één tekst. In for i in \"$*\" loopt de lus dus maar één keer, met alle argumenten tegelijk.","parts":[{"m":"alle argumenten samen","t":"$*"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":29,"createdAt":1790250000402,"id":"les_0403"},{"command":"\"$@\"","tab":"linux","group":"Scripts","title":"Alle argumenten apart","explanation":"Bevat alle argumenten, maar elk als apart element. In for i in \"$@\" loopt de lus één keer per argument.","parts":[{"m":"alle argumenten, elk apart","t":"$@"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":29,"createdAt":1790250000403,"id":"les_0404"},{"command":"case $ANS in … esac","tab":"linux","group":"Scripts","title":"Meerdere waarden testen met case","explanation":"Vergelijkt de waarde van een variabele met verschillende patronen en voert de opdrachten uit bij het eerste patroon dat past. Handiger dan een lange if/elif bij veel waarden. Elk blok eindigt met ;; en esac sluit af.","parts":[{"m":"vergelijk de waarde van ANS","t":"case $ANS in"},{"m":"patroon; | groepeert meerdere waarden","t":"yes|yay)"},{"m":"einde van dit blok","t":";;"},{"m":"alle andere waarden (zoals else)","t":"*)"},{"m":"einde van case","t":"esac"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":30,"createdAt":1790250000404,"id":"les_0405"},{"command":"while true do … done","tab":"linux","group":"Scripts","title":"Lus die blijft herhalen","explanation":"Herhaalt de opdrachten tussen do en done zolang de test lukt (exitstatus 0). true lukt altijd, dus deze lus stopt nooit vanzelf (stoppen met Ctrl+C). Gebruik test of [ ] voor een echte voorwaarde.","parts":[{"m":"herhaal zolang de test lukt","t":"while"},{"m":"commando dat altijd lukt","t":"true"},{"m":"de opdrachten die herhaald worden","t":"do … done"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":31,"createdAt":1790250000405,"id":"les_0406"},{"command":"while read LINE do … done < file","tab":"linux","group":"Scripts","title":"Bestand regel per regel lezen","explanation":"Leest een bestand regel per regel: door invoerredirectie (< file) is het bestand de stdin van de lus, en read zet elke regel in de variabele LINE. De lus stopt aan het einde van het bestand.","parts":[{"m":"lees een regel in LINE zolang er regels zijn","t":"while read LINE"},{"m":"opdrachten voor elke regel","t":"do … done"},{"m":"gebruik het bestand als invoer","t":"< file"}],"sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":33,"createdAt":1790250000407,"id":"les_0408"},{"command":"cut -f 1 snp151annotation.txt","tab":"linux","group":"Tekst bewerken","title":"Eén kolom uit tabel halen","explanation":"cut selecteert kolommen uit een tabel; hier kolom 1 (de SNP-namen). Standaard is het scheidingsteken een tab; met -d kies je een ander scheidingsteken (bv. -d ',').","parts":[{"m":"knip kolommen uit elke regel","t":"cut"},{"m":"neem veld (kolom) 1","t":"-f 1"},{"m":"invoerbestand","t":"snp151annotation.txt"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":9,"createdAt":1790250000260,"id":"les_0261"},{"command":"cut -f 1-3 snp151position.txt","tab":"linux","group":"Tekst bewerken","title":"Meerdere kolommen selecteren","explanation":"Selecteert kolommen 1 tot en met 3. Met een koppelteken (-) geef je een bereik op, met een komma losse kolommen, bv. -f 1,4.","parts":[{"m":"kolommen 1 tot en met 3","t":"-f 1-3"},{"m":"alleen kolom 1 en kolom 4","t":"-f 1,4"},{"m":"invoerbestand","t":"snp151position.txt"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":9,"createdAt":1790250000261,"id":"les_0262"},{"command":"paste tmp5 tmp6 tmp1","tab":"linux","group":"Tekst bewerken","title":"Bestanden naast elkaar plakken","explanation":"paste zet de regels van meerdere bestanden naast elkaar als kolommen (gescheiden door een tab). Zo kun je kolommen in een andere volgorde zetten: eerst knippen met cut, dan in de gewenste volgorde plakken. cat zet bestanden net ónder elkaar.","parts":[{"m":"voeg regels van bestanden samen als kolommen","t":"paste"},{"m":"de bestanden, in de volgorde waarin ze als kolommen verschijnen","t":"tmp5 tmp6 tmp1"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":10,"createdAt":1790250000262,"id":"les_0263"},{"command":"join FILE1 FILE2","tab":"linux","group":"Tekst bewerken","title":"Twee tabellen koppelen op sleutel","explanation":"join voegt de regels van twee bestanden samen die dezelfde waarde hebben in een gemeenschappelijke kolom (standaard de eerste kolom). Beide bestanden moeten eerst gesorteerd zijn met sort. Standaard is het scheidingsteken een spatie.","parts":[{"m":"koppel regels van twee bestanden","t":"join"},{"m":"de twee (gesorteerde) bestanden","t":"FILE1 FILE2"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":13,"createdAt":1790250000263,"id":"les_0264"},{"command":"join -t $'\\t' FILE1 FILE2","tab":"linux","group":"Tekst bewerken","title":"Koppelen met tab als scheiding","explanation":"Zelfde als join, maar met een tab als scheidingsteken in plaats van een spatie. Gebruik --header als de bestanden een kopregel hebben, zodat die niet mee gesorteerd/gekoppeld wordt.","parts":[{"m":"gebruik een tab als scheidingsteken","t":"-t $'\\t'"},{"m":"behandel de eerste regel als kopregel","t":"--header"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":13,"createdAt":1790250000264,"id":"les_0265"},{"command":"join -t $'\\t' -o '1.1 1.2 2.2' --header snp151position-sorted.txt snp151annotation-sorted.txt","tab":"linux","group":"Tekst bewerken","title":"Gekozen kolommen na join","explanation":"Koppelt twee gesorteerde tabellen op kolom 1 en houdt enkel de opgegeven kolommen over. Met -o kies je welke velden in de uitvoer komen, in de vorm bestand.kolom.","parts":[{"m":"tab als scheidingsteken","t":"-t $'\\t'"},{"m":"toon kolom 1 en 2 van bestand 1 en kolom 2 van bestand 2","t":"-o '1.1 1.2 2.2'"},{"m":"eerste regel is een kopregel","t":"--header"},{"m":"bestand 1","t":"snp151position-sorted.txt"},{"m":"bestand 2","t":"snp151annotation-sorted.txt"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":15,"createdAt":1790250000265,"id":"les_0266"},{"command":"sort /etc/passwd","tab":"linux","group":"Tekst bewerken","title":"Regels alfabetisch sorteren","explanation":"Sorteert de regels van een bestand: eerst cijfers (0-9), dan letters (aA-zZ). Het sorteert teken per teken, daarom komt 10 vóór 2. Hetzelfde resultaat krijg je met cat /etc/passwd | sort.","parts":[{"m":"sorteer de regels","t":"sort"},{"m":"het te sorteren bestand","t":"/etc/passwd"}],"examples":[{"command":"sort /etc/passwd","note":"","output":"abrt:x:173:173::/etc/abrt:/sbin/nologin\nadm:x:3:4:adm:/var/adm:/sbin/nologin\napache:x:48:48:Apache:/usr/share/httpd:/sbin/nologin","slide":16,"source":"les","sourceName":"Chapter 7 - Tables and text file manipulation.pptx"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":16,"createdAt":1790250000266,"id":"les_0267"},{"command":"sort -k 2 DATA","tab":"linux","group":"Tekst bewerken","title":"Sorteren op een kolom","explanation":"Sorteert de regels op basis van kolom 2 in plaats van vanaf het begin van de regel. Met -k 2,2 sorteer je strikt op enkel kolom 2.","parts":[{"m":"sorteer vanaf kolom (key) 2","t":"-k 2"},{"m":"het bestand zonder kopregel","t":"DATA"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":16,"createdAt":1790250000267,"id":"les_0268"},{"command":"sort -k 6 -n -r DATA","tab":"linux","group":"Tekst bewerken","title":"Numeriek omgekeerd sorteren","explanation":"Sorteert op kolom 6 volgens de getalwaarde (-n), van groot naar klein (-r). Zonder -n sorteert sort als tekst, waardoor bv. 10 vóór 2 komt.","parts":[{"m":"sorteer op kolom 6","t":"-k 6"},{"m":"numeriek sorteren (als getallen)","t":"-n"},{"m":"omgekeerde volgorde (groot naar klein)","t":"-r"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":16,"createdAt":1790250000268,"id":"les_0269"},{"command":"sort -R bestand","tab":"linux","group":"Tekst bewerken","title":"Regels willekeurig schudden","explanation":"Zet de regels in een willekeurige volgorde (random sort).","parts":[{"m":"willekeurige volgorde","t":"-R"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":16,"createdAt":1790250000269,"id":"les_0270"},{"command":"sort -u -k 1,1 DATA","tab":"linux","group":"Tekst bewerken","title":"Sorteren en dubbels verwijderen","explanation":"Sorteert en houdt per waarde in kolom 1 maar één regel over (unique sort). Zonder -k verwijdert sort -u enkel regels die volledig identiek zijn.","parts":[{"m":"unieke regels: dubbels weglaten","t":"-u"},{"m":"vergelijk alleen kolom 1","t":"-k 1,1"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":16,"createdAt":1790250000270,"id":"les_0271"},{"command":"cut -f 2 DATA | sort -u | wc -l","tab":"linux","group":"Tekst bewerken","title":"Aantal verschillende waarden tellen","explanation":"Haalt kolom 2 uit DATA, houdt elke waarde maar één keer over en telt het aantal regels. Zo krijg je het aantal verschillende (distinct) waarden in die kolom.","parts":[{"m":"neem kolom 2","t":"cut -f 2 DATA"},{"m":"sorteer en verwijder dubbels","t":"sort -u"},{"m":"tel het aantal regels","t":"wc -l"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":18,"createdAt":1790250000273,"id":"les_0274"},{"command":"sort bestand | uniq","tab":"linux","group":"Tekst bewerken","title":"Aangrenzende dubbele regels weglaten","explanation":"uniq herkent enkel identieke regels die direct na elkaar staan. Daarom sorteer je eerst, en gebruik je daarna uniq. Het resultaat is gelijk aan sort -u.","parts":[{"m":"zet gelijke regels naast elkaar","t":"sort"},{"m":"geef de uitvoer door aan het volgende commando","t":"|"},{"m":"laat herhaalde, aangrenzende regels weg","t":"uniq"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":19,"createdAt":1790250000274,"id":"les_0275"},{"command":"uniq -d bestand","tab":"linux","group":"Tekst bewerken","title":"Alleen herhaalde regels tonen","explanation":"Toont enkel regels die meer dan één keer (na elkaar) voorkomen, telkens één keer. Sorteer het bestand eerst.","parts":[{"m":"toon alleen de herhaalde (dubbele) regels","t":"-d"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":19,"createdAt":1790250000275,"id":"les_0276"},{"command":"uniq -c -f 1 snp151annotation-short.txt","tab":"linux","group":"Tekst bewerken","title":"Herhaalde regels tellen","explanation":"Telt hoe vaak elke (aangrenzende) regel voorkomt, waarbij het eerste veld genegeerd wordt; zo tel je hier de waarden van de class-kolom. Omdat uniq enkel aangrenzende regels vergelijkt, moet je eerst op die kolom sorteren: sort -k 2 snp151annotation-short.txt | uniq -c -f 1.","parts":[{"m":"zet het aantal keer dat een regel voorkomt ervoor","t":"-c"},{"m":"negeer het eerste veld bij het vergelijken","t":"-f 1"},{"m":"invoerbestand","t":"snp151annotation-short.txt"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":20,"createdAt":1790250000276,"id":"les_0277"},{"command":"sed s/chr/chromosome/g snp151position.txt","tab":"linux","group":"Tekst bewerken","title":"Tekst vervangen in bestand","explanation":"sed is een stream editor die tekst filtert en omzet. Hier wordt overal 'chr' vervangen door 'chromosome'. Het bestand zelf verandert niet; het resultaat verschijnt op het scherm.","parts":[{"m":"stream editor","t":"sed"},{"m":"substitute: vervang chr door chromosome","t":"s/chr/chromosome/"},{"m":"global: vervang alle keren in de regel, niet enkel de eerste","t":"g"},{"m":"invoerbestand","t":"snp151position.txt"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":21,"createdAt":1790250000277,"id":"les_0278"},{"command":"awk 'condition {action}' inputfile","tab":"linux","group":"Tekst bewerken","title":"Basisvorm van awk","explanation":"awk is een kleine programmeertaal voor tabellen. Het leest het bestand regel per regel (record) en voert de actie uit op elke regel die aan de voorwaarde voldoet. Elke regel wordt opgedeeld in velden (kolommen).","parts":[{"m":"patroon- en tabelverwerkingstaal","t":"awk"},{"m":"voorwaarde of patroon waaraan een regel moet voldoen","t":"condition"},{"m":"wat er met die regel moet gebeuren, bv. print","t":"{action}"},{"m":"het invoerbestand","t":"inputfile"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":22,"createdAt":1790250000279,"id":"les_0280"},{"command":"$0, $1, NR, NF, FS","tab":"linux","group":"Tekst bewerken","title":"Ingebouwde variabelen van awk","explanation":"Deze variabelen gebruik je binnen een awk-opdracht. Ze geven de hele regel, een bepaalde kolom, het regelnummer, het aantal kolommen of het scheidingsteken.","parts":[{"m":"de hele regel (record)","t":"$0"},{"m":"het eerste, tweede … veld (kolom)","t":"$1, $2 …"},{"m":"number of records: het nummer van de huidige regel","t":"NR"},{"m":"number of fields: het aantal kolommen in de regel","t":"NF"},{"m":"field separator: scheidingsteken, standaard spatie of tab; aan te passen, bv. met awk -F","t":"FS"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":23,"createdAt":1790250000280,"id":"les_0281"},{"command":"awk '{print $1}' snp151annotation.txt","tab":"linux","group":"Tekst bewerken","title":"Eerste kolom afdrukken","explanation":"Drukt van elke regel enkel het eerste veld (kolom) af. Er is geen voorwaarde, dus de actie gebeurt op alle regels.","parts":[{"m":"druk veld 1 af","t":"{print $1}"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":24,"createdAt":1790250000281,"id":"les_0282"},{"command":"awk '{print $1, $3, $2}' snp151annotation.txt","tab":"linux","group":"Tekst bewerken","title":"Kolommen herschikken met awk","explanation":"Drukt kolom 1, 3 en 2 af in die volgorde, gescheiden door een spatie. De komma tussen de velden zet er een spatie tussen.","parts":[{"m":"de velden in de nieuwe volgorde","t":"$1, $3, $2"},{"m":"zet een spatie tussen de velden in de uitvoer","t":","}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":24,"createdAt":1790250000282,"id":"les_0283"},{"command":"awk '{print $1, \"\\t\", $3, \"\\t\", $2}' snp151annotation.txt","tab":"linux","group":"Tekst bewerken","title":"Kolommen herschikken, tab-gescheiden","explanation":"Herschikt de kolommen en zet een tab tussen de velden. Door de komma's komt er ook een spatie rond elke tab; schrijf $1 \"\\t\" $3 \"\\t\" $2 (zonder komma's) voor enkel een tab.","parts":[{"m":"een tab-teken","t":"\"\\t\""},{"m":"de velden in de nieuwe volgorde","t":"$1 … $3 … $2"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":24,"createdAt":1790250000283,"id":"les_0284"},{"command":"awk '{print NF}' snp151annotation.txt","tab":"linux","group":"Tekst bewerken","title":"Aantal kolommen per regel","explanation":"Drukt voor elke regel het aantal velden (kolommen) af. Met awk '{print NF, $0}' zet je dat aantal als extra eerste kolom vóór de inhoud van de regel.","parts":[{"m":"number of fields: aantal kolommen in de regel","t":"NF"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":25,"createdAt":1790250000284,"id":"les_0285"},{"command":"awk '{print $NF}' snp151annotation.txt","tab":"linux","group":"Tekst bewerken","title":"Laatste kolom afdrukken","explanation":"Drukt van elke regel het laatste veld af. NF is het aantal kolommen, dus $NF is de inhoud van de laatste kolom (en niet het aantal).","parts":[{"m":"het veld met nummer NF = de laatste kolom","t":"$NF"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":25,"createdAt":1790250000285,"id":"les_0286"},{"command":"awk 'BEGIN {print \"some text\"}'","tab":"linux","group":"Tekst bewerken","title":"Actie vóór het lezen","explanation":"BEGIN voert de actie uit vóór er regels gelezen worden, hier tekst afdrukken. Er is zelfs geen invoerbestand nodig.","parts":[{"m":"voer de actie uit vóór het lezen van de regels","t":"BEGIN"},{"m":"druk de tekst af","t":"{print \"some text\"}"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":27,"createdAt":1790250000286,"id":"les_0287"},{"command":"awk 'BEGIN {print \"2+3=\" 2+3}'","tab":"linux","group":"Tekst bewerken","title":"Rekenen met awk","explanation":"awk kan rekenen: dit drukt de tekst 2+3= af, gevolgd door het resultaat van de berekening.","parts":[{"m":"gewone tekst","t":"\"2+3=\""},{"m":"berekening die awk uitvoert","t":"2+3"}],"examples":[{"command":"awk 'BEGIN {print \"2+3=\" 2+3}'","note":"","output":"2+3=5","slide":27,"source":"les","sourceName":"Chapter 7 - Tables and text file manipulation.pptx"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":27,"createdAt":1790250000287,"id":"les_0288"},{"command":"awk 'END {print NR}' snp151annotation.txt","tab":"linux","group":"Tekst bewerken","title":"Totaal aantal regels tellen","explanation":"END voert de actie uit nadat alle regels gelezen zijn; NR is dan het totale aantal regels. awk '{print NR}' (zonder END) drukt daarentegen bij elke regel het regelnummer af.","parts":[{"m":"voer de actie uit na het lezen van alle regels","t":"END"},{"m":"aantal gelezen regels","t":"NR"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":28,"createdAt":1790250000288,"id":"les_0289"},{"command":"awk 'NR > 1 {s=0; for (i=2; i<=NF; i++) s=s+$i; print s}' arrayDat.txt","tab":"linux","group":"Tekst bewerken","title":"Som per regel berekenen","explanation":"Slaat de kopregel over en telt per regel (gen) alle waarden vanaf kolom 2 op, dus de expressiewaarden van alle stalen. Daarna wordt de som afgedrukt.","parts":[{"m":"sla de kopregel over","t":"NR > 1"},{"m":"zet de som op 0 voor elke regel","t":"s=0"},{"m":"loop over kolom 2 tot de laatste kolom","t":"for (i=2; i<=NF; i++)"},{"m":"tel de waarde van kolom i bij de som","t":"s=s+$i"},{"m":"druk de som af","t":"print s"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":36,"createdAt":1790250000295,"id":"les_0296"},{"command":"awk 'NR > 1 {s=0; n=NF-1; for (i=2; i<=NF; i++) s=s+$i; s=s/n; print s}' arrayDat.txt","tab":"linux","group":"Tekst bewerken","title":"Gemiddelde per regel berekenen","explanation":"Zelfde als de som per regel, maar deelt de som door het aantal stalen (NF-1, want kolom 1 is de ProbeID). Zo krijg je de gemiddelde expressie per gen.","parts":[{"m":"aantal waardekolommen (alle kolommen min de ID-kolom)","t":"n=NF-1"},{"m":"deel de som door het aantal: gemiddelde","t":"s=s/n"},{"m":"druk het gemiddelde af","t":"print s"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":36,"createdAt":1790250000296,"id":"les_0297"},{"command":"Ctrl + Alt + F3","tab":"linux","group":"Terminal & sneltoetsen","title":"Virtuele console openen","explanation":"Opent een virtuele console: een tekstterminal over het hele scherm, zonder grafische omgeving. F3 tot F6 geven elk een andere console.","parts":[{"m":"samen ingedrukt houden","t":"Ctrl + Alt"},{"m":"functietoets; F3 tot F6 kan","t":"F3"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":7,"createdAt":1790250000011,"id":"les_0012"},{"command":"Ctrl + Alt + F2","tab":"linux","group":"Terminal & sneltoetsen","title":"Terug naar grafische omgeving","explanation":"Verlaat de virtuele console en brengt je terug naar de grafische omgeving (GNOME).","parts":[{"m":"samen ingedrukt houden","t":"Ctrl + Alt"},{"m":"functietoets van de grafische sessie","t":"F2"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":7,"createdAt":1790250000012,"id":"les_0013"},{"command":"exit","tab":"linux","group":"Terminal & sneltoetsen","title":"Terminal of sessie afsluiten","explanation":"Sluit de shell af: het terminalvenster sluit, of je logt uit van een virtuele console of een SSH-verbinding. exit is een ingebouwd Bash-commando.","parts":[{"m":"stop de huidige shell","t":"exit"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":7,"createdAt":1790250000013,"id":"les_0014"},{"command":"↑ / ↓","tab":"linux","group":"Terminal & sneltoetsen","title":"Vorige commando's herhalen","explanation":"Met de pijltjestoetsen omhoog en omlaag blader je door de commando's die je eerder typte, zodat je ze niet opnieuw moet typen.","parts":[{"m":"vorig commando","t":"↑"},{"m":"volgend commando","t":"↓"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":23,"createdAt":1790250000039,"id":"les_0040"},{"command":"Tab","tab":"linux","group":"Terminal & sneltoetsen","title":"Commando of naam aanvullen","explanation":"Druk op Tab terwijl je typt en Bash vult de naam van het commando, bestand of map automatisch aan. Twee keer Tab toont alle mogelijke aanvullingen als er meerdere zijn.","parts":[{"m":"vul aan","t":"Tab"},{"m":"toon alle mogelijkheden","t":"Tab Tab"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":23,"createdAt":1790250000040,"id":"les_0041"},{"command":"dubbelklik / 3× klikken / middelste muisknop","tab":"linux","group":"Terminal & sneltoetsen","title":"Kopiëren en plakken met muis","explanation":"In de terminal selecteer je met een dubbelklik een heel woord en met drie klikken een hele regel. Plakken doe je met de middelste muisknop (of links en rechts tegelijk).","parts":[{"m":"selecteer woord","t":"dubbelklik"},{"m":"selecteer regel","t":"3× klikken"},{"m":"plak de selectie","t":"middelste muisknop"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":23,"createdAt":1790250000041,"id":"les_0042"},{"command":"Ctrl + D","tab":"linux","group":"Terminal & sneltoetsen","title":"Terminal afsluiten","explanation":"Sluit de terminal of de shell af, net als exit. Werkt ook om een SSH-verbinding te sluiten.","parts":[{"m":"einde invoer: shell stopt","t":"Ctrl + D"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":24,"createdAt":1790250000042,"id":"les_0043"},{"command":"Ctrl + Shift + W","tab":"linux","group":"Terminal & sneltoetsen","title":"Terminalvenster of tabblad sluiten","explanation":"Sluit het terminaltabblad (W) of het hele terminalvenster (Ctrl + Shift + Q) in de grafische omgeving.","parts":[{"m":"sluit tabblad","t":"W"},{"m":"sluit venster","t":"Q"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":24,"createdAt":1790250000043,"id":"les_0044"},{"command":"Ctrl + R","tab":"linux","group":"Terminal & sneltoetsen","title":"Zoeken in commandogeschiedenis","explanation":"Start 'reverse-i-search': typ een stukje van een eerder commando en Bash zoekt het in je geschiedenis. Druk Enter om het uit te voeren.","parts":[{"m":"zoek achterwaarts in geschiedenis","t":"Ctrl + R"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":24,"createdAt":1790250000044,"id":"les_0045"},{"command":"Ctrl + A","tab":"linux","group":"Terminal & sneltoetsen","title":"Cursor naar begin van regel","explanation":"Zet de cursor vooraan op de commandoregel, net achter de prompt.","parts":[{"m":"ga naar begin","t":"Ctrl + A"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":24,"createdAt":1790250000045,"id":"les_0046"},{"command":"Ctrl + E","tab":"linux","group":"Terminal & sneltoetsen","title":"Cursor naar einde van regel","explanation":"Zet de cursor achteraan op de commandoregel.","parts":[{"m":"ga naar einde (end)","t":"Ctrl + E"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":24,"createdAt":1790250000046,"id":"les_0047"},{"command":"Ctrl + C","tab":"linux","group":"Terminal & sneltoetsen","title":"Lopend commando stoppen","explanation":"Beëindigt het commando of programma dat nu loopt en geeft je de prompt terug. Handig als een commando blijft hangen.","parts":[{"m":"onderbreek en stop","t":"Ctrl + C"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":24,"createdAt":1790250000047,"id":"les_0048"},{"command":"Ctrl + H","tab":"linux","group":"Terminal & sneltoetsen","title":"Teken links van cursor wissen","explanation":"Werkt als de Backspace-toets: verwijdert het teken links van de cursor.","parts":[{"m":"backspace","t":"Ctrl + H"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":24,"createdAt":1790250000048,"id":"les_0049"},{"command":"Ctrl + L","tab":"linux","group":"Terminal & sneltoetsen","title":"Terminalscherm leegmaken","explanation":"Zet de prompt bovenaan en maakt zo het terminalscherm leeg. Je vorige commando's blijven wel in de geschiedenis.","parts":[{"m":"scherm leegmaken","t":"Ctrl + L"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":24,"createdAt":1790250000049,"id":"les_0050"},{"command":"Ctrl + Z","tab":"linux","group":"Terminal & sneltoetsen","title":"Lopend programma bevriezen","explanation":"Pauzeert (bevriest) het programma dat nu loopt, bv. Firefox gestart vanuit de terminal, zodat je de terminal weer kan gebruiken. Het programma wordt niet afgesloten.","parts":[{"m":"pauzeer (tijdelijk stoppen)","t":"Ctrl + Z"}],"sourceName":"Chapter 2 - The terminal.pptx","slide":24,"createdAt":1790250000050,"id":"les_0051"},{"command":"grep -c \">\" sequentie.fasta","tab":"linux","group":"Zoeken & filteren","title":"Tel sequenties in FASTA","explanation":"Telt hoeveel regels met '>' beginnen, dus hoeveel sequenties er in een FASTA-bestand staan.","parts":[{"m":"zoek tekst in bestanden","t":"grep"},{"m":"tel het aantal gevonden regels","t":"-c"},{"m":"zoekpatroon: het teken > (begin van elke sequentie)","t":"\">\""},{"m":"het bestand","t":"sequentie.fasta"}],"createdAt":1790233200000,"id":"ex_grep"},{"command":"find ~ -name file6","tab":"linux","group":"Zoeken & filteren","title":"Bestand zoeken op naam","explanation":"Zoekt in je thuismap en alle submappen naar bestanden met de naam file6. Met find kan je ook zoeken op grootte, tijdstip, eigenaar, type of rechten (zie man find).","parts":[{"m":"zoek in een mappenstructuur","t":"find"},{"m":"waar zoeken: thuismap","t":"~"},{"m":"zoek op naam","t":"-name"},{"m":"de gezochte naam","t":"file6"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":32,"createdAt":1790250000104,"id":"les_0105"},{"command":"locate pattern","tab":"linux","group":"Zoeken & filteren","title":"Snel zoeken via index","explanation":"Toont alle absolute paden waarin het woord pattern voorkomt. locate zoekt in een index (databank), dus bestanden die net aangemaakt zijn vindt hij pas na het bijwerken van die index.","parts":[{"m":"zoek in de index","t":"locate"},{"m":"woord dat in het pad moet staan","t":"pattern"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":34,"createdAt":1790250000105,"id":"les_0106"},{"command":"updatedb -l 0 -o ~/dbfile -U /","tab":"linux","group":"Zoeken & filteren","title":"Eigen zoekindex maken","explanation":"Maakt een eigen indexbestand ~/dbfile voor locate, met alle bestanden vanaf de root /.","parts":[{"m":"maak/werk de index bij","t":"updatedb"},{"m":"geen beperking op zichtbaarheid (alle bestanden)","t":"-l 0"},{"m":"schrijf index naar ~/dbfile","t":"-o ~/dbfile"},{"m":"indexeer vanaf de root /","t":"-U /"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":36,"createdAt":1790250000106,"id":"les_0107"},{"command":"locate -d ~/dbfile pattern","tab":"linux","group":"Zoeken & filteren","title":"Zoeken in eigen index","explanation":"Zoekt pattern in je eigen indexbestand in plaats van in de standaardindex.","parts":[{"m":"zoek in index","t":"locate"},{"m":"gebruik deze indexdatabank","t":"-d ~/dbfile"},{"m":"gezocht woord","t":"pattern"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":36,"createdAt":1790250000107,"id":"les_0108"},{"command":"which command","tab":"linux","group":"Zoeken & filteren","title":"Locatie van commando vinden","explanation":"Toont waar het programma van een commando staat, bv. which ls. which zoekt in alle mappen uit de variabele PATH.","parts":[{"m":"waar staat dit programma?","t":"which"},{"m":"naam van het commando, bv. rm","t":"command"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":37,"createdAt":1790250000108,"id":"les_0109"},{"command":"grep string file","tab":"linux","group":"Zoeken & filteren","title":"Tekst zoeken in bestand","explanation":"Toont alle regels van een bestand waarin het woord string voorkomt. grep werkt met reguliere expressies en heeft nuttige opties zoals -i (hoofdletters negeren) en -v (regels tonen die het woord níet bevatten).","parts":[{"m":"zoek regels die passen","t":"grep"},{"m":"het zoekwoord of patroon","t":"string"},{"m":"bv. /usr/share/dict/words","t":"file"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":39,"createdAt":1790250000111,"id":"les_0112"},{"command":"grep ^\\> P00687.fasta","tab":"linux","group":"Zoeken & filteren","title":"Kopregel van FASTA-bestand tonen","explanation":"Toont de regels die beginnen met >: in een FASTA-bestand is dat de kopregel met de naam van de sequentie. De \\ zorgt dat Bash > niet als redirect ziet.","parts":[{"m":"zoek regels","t":"grep"},{"m":"begin van de regel","t":"^"},{"m":"het teken > (geëscapet)","t":"\\>"},{"m":"FASTA-bestand","t":"P00687.fasta"}],"sourceName":"Chapter 3 - Organizing files.pptx","slide":40,"createdAt":1790250000112,"id":"les_0113"},{"command":"grep rs112803166 snp151*","tab":"linux","group":"Zoeken & filteren","title":"Regels met een ID zoeken","explanation":"Toont in beide snp151-bestanden de regels waarin rs112803166 voorkomt, met de bestandsnaam ervoor. Zo filter je de informatie over één SNP uit meerdere tabellen.","parts":[{"m":"zoek regels die een patroon bevatten","t":"grep"},{"m":"het gezochte SNP-ID","t":"rs112803166"},{"m":"alle bestanden die met snp151 beginnen","t":"snp151*"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":8,"createdAt":1790250000258,"id":"les_0259"},{"command":"awk 'NR < 6' snp151annotation.txt","tab":"linux","group":"Zoeken & filteren","title":"Eerste vijf regels met awk","explanation":"Drukt de regels af waarvan het regelnummer kleiner is dan 6, dus de eerste 5 regels. Zonder actie is afdrukken de standaardactie; het is hetzelfde als awk 'NR < 6 {print $0}'.","parts":[{"m":"voorwaarde: regelnummer kleiner dan 6","t":"NR < 6"},{"m":"standaard: druk de regel af","t":"(geen actie)"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":29,"createdAt":1790250000289,"id":"les_0290"},{"command":"awk 'NR == 1' snp151annotation.txt","tab":"linux","group":"Zoeken & filteren","title":"Alleen de eerste regel","explanation":"Drukt enkel regel 1 af (bv. de kopregel). Let op: gebruik == om te vergelijken, niet =.","parts":[{"m":"voorwaarde: regelnummer is gelijk aan 1","t":"NR == 1"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":29,"createdAt":1790250000290,"id":"les_0291"},{"command":"awk 'NR > 1 && NR < 7' snp151annotation.txt","tab":"linux","group":"Zoeken & filteren","title":"Regels 2 tot en met 6","explanation":"Drukt de regels af met een nummer groter dan 1 én kleiner dan 7, dus regel 2 tot en met 6.","parts":[{"m":"regelnummer groter dan 1","t":"NR > 1"},{"m":"en: beide voorwaarden moeten kloppen","t":"&&"},{"m":"regelnummer kleiner dan 7","t":"NR < 7"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":29,"createdAt":1790250000291,"id":"les_0292"},{"command":"awk '/ccttcc/' snp151annotation.txt","tab":"linux","group":"Zoeken & filteren","title":"Regels met patroon afdrukken","explanation":"Drukt alle regels af die het patroon (een reguliere expressie) ccttcc bevatten, vergelijkbaar met grep. Het patroon staat tussen schuine strepen; hoofdletters en kleine letters zijn verschillend.","parts":[{"m":"patroon (regex) waaraan de regel moet voldoen","t":"/ccttcc/"},{"m":"standaardactie is de regel afdrukken","t":"(geen actie)"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":30,"createdAt":1790250000292,"id":"les_0293"},{"command":"awk '/ccttcc/ {print $1}' snp151annotation.txt","tab":"linux","group":"Zoeken & filteren","title":"ID's van gevonden regels","explanation":"Drukt enkel het SNP-ID (kolom 1) af van de regels die ccttcc bevatten.","parts":[{"m":"voorwaarde: regel bevat ccttcc","t":"/ccttcc/"},{"m":"actie: druk kolom 1 af","t":"{print $1}"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":30,"createdAt":1790250000293,"id":"les_0294"},{"command":"awk 'BEGIN {n=0}; /CCTTCC/ {n++}; END {print n}' snp151annotation.txt","tab":"linux","group":"Zoeken & filteren","title":"Gevonden regels tellen met awk","explanation":"Telt het aantal regels die CCTTCC bevatten. Vóór het lezen wordt teller n op 0 gezet, bij elke passende regel verhoogd met 1, en na het lezen wordt n afgedrukt.","parts":[{"m":"vóór het lezen: zet teller n op 0","t":"BEGIN {n=0}"},{"m":"bij elke passende regel: n plus 1","t":"/CCTTCC/ {n++}"},{"m":"na het lezen: druk n af","t":"END {print n}"}],"sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":30,"createdAt":1790250000294,"id":"les_0295"},{"command":"array(\"a\", \"b\", \"c\")","tab":"php","group":"Arrays","title":"Array maken met array()","explanation":"De klassieke manier om een array te maken: de array()-functie krijgt een lijst waarden gescheiden door komma's. Een array bewaart meerdere waarden in één variabele; de waarden hoeven niet van hetzelfde type te zijn.","parts":[{"m":"maak een array","t":"array( )"},{"m":"de waarden, gescheiden door komma's","t":"\"a\", \"b\", \"c\""}],"examples":[{"command":"array(\"a\", \"b\", \"c\")","note":"$BITLecturers = array(\"Paco\", \"Jasper\", \"Cedric\", \"Mathias\");","output":"","slide":33,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":33,"createdAt":1790250000559,"id":"les_0560"},{"command":"[\"a\", \"b\", \"c\"]","tab":"php","group":"Arrays","title":"Geïndexeerde array (korte syntax)","explanation":"Maakt een array met vierkante haken, korter dan array(). In zo'n geïndexeerde array krijgt elke waarde automatisch een nummer (index) als sleutel, te beginnen bij 0.","parts":[{"m":"maak een array","t":"[ ]"},{"m":"automatisch 0, 1, 2 ...","t":"index"}],"examples":[{"command":"[\"a\", \"b\", \"c\"]","note":"In $Marathon = [\"Marieke\", \"Paco\", \"Mathias\"]; is $Marathon[0] gelijk aan \"Marieke\".","output":"","slide":34,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":34,"createdAt":1790250000560,"id":"les_0561"},{"command":"[\"sleutel\" => waarde]","tab":"php","group":"Arrays","title":"Associatieve array met eigen sleutels","explanation":"In een associatieve array kies je zelf de sleutel van elke waarde (een string of een getal). Je schrijft de sleutel, dan =>, dan de waarde.","parts":[{"m":"zelfgekozen naam of nummer","t":"\"sleutel\""},{"m":"koppelt sleutel aan waarde","t":"=>"},{"m":"de bewaarde waarde","t":"waarde"}],"examples":[{"command":"[\"sleutel\" => waarde]","note":"$Marathon = [\"first\" => \"Marieke\", \"second\" => \"Paco\", \"third\" => \"Mathias\"];","output":"","slide":35,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":35,"createdAt":1790250000561,"id":"les_0562"},{"command":"print_r($array);","tab":"php","group":"Arrays","title":"Volledige array tonen","explanation":"Toont de hele inhoud van een array, met alle sleutels en waarden. echo en print werken niet voor een volledige array.","parts":[{"m":"toon array leesbaar","t":"print_r"},{"m":"de array die je wil zien","t":"$array"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":37,"createdAt":1790250000562,"id":"les_0563"},{"command":"$array[sleutel]","tab":"php","group":"Arrays","title":"Waarde uit array ophalen","explanation":"Haalt één waarde uit een array: de naam van de array gevolgd door de sleutel (index of naam) tussen vierkante haken. Die waarde kun je tonen, bewaren of in je code gebruiken.","parts":[{"m":"naam van de array","t":"$array"},{"m":"index (bv. 2) of sleutelnaam (bv. 'fuel type')","t":"[sleutel]"}],"examples":[{"command":"$array[sleutel]","note":"echo \"The car's fuel type is: \" . $carSpecs['fuel type']; toont het brandstoftype.","output":"","slide":38,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":38,"createdAt":1790250000563,"id":"les_0564"},{"command":"$array[sleutel] = waarde;","tab":"php","group":"Arrays","title":"Waarde in array aanpassen/toevoegen","explanation":"Geeft de waarde bij een bepaalde sleutel een nieuwe waarde. Bestaat de sleutel al, dan wordt de waarde overschreven; is het een nieuwe sleutel, dan wordt een nieuw element toegevoegd.","parts":[{"m":"naam van de array","t":"$array"},{"m":"bestaande of nieuwe sleutel","t":"[sleutel]"},{"m":"de nieuwe waarde","t":"= waarde"}],"examples":[{"command":"$array[sleutel] = waarde;","note":"$carSpecs['number of scratches'] = 3; past het aantal krassen aan van 2 naar 3.","output":"","slide":40,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":40,"createdAt":1790250000564,"id":"les_0565"},{"command":"$array[] = waarde;","tab":"php","group":"Arrays","title":"Waarde achteraan toevoegen","explanation":"Lege vierkante haken voegen een nieuwe waarde toe aan het einde van de array (met de volgende vrije index). Doet hetzelfde als array_push.","parts":[{"m":"nieuw element achteraan","t":"[]"}],"examples":[{"command":"$array[] = waarde;","note":"$hamburger[] = 'bun'; zet een broodje achteraan de ingrediëntenlijst.","output":"","slide":41,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":41,"createdAt":1790250000565,"id":"les_0566"},{"command":"array_push($array, waarde);","tab":"php","group":"Arrays","title":"Waarde aan einde toevoegen","explanation":"Voegt een nieuwe waarde toe aan het einde van een array.","parts":[{"m":"achteraan toevoegen","t":"array_push"},{"m":"de array","t":"$array"},{"m":"de nieuwe waarde","t":"waarde"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":41,"createdAt":1790250000566,"id":"les_0567"},{"command":"array_unshift($array, waarde);","tab":"php","group":"Arrays","title":"Waarde vooraan toevoegen","explanation":"Voegt een nieuwe waarde toe aan het begin van een array; de indexen van de andere elementen schuiven op.","parts":[{"m":"vooraan toevoegen","t":"array_unshift"},{"m":"de array","t":"$array"},{"m":"de nieuwe waarde","t":"waarde"}],"examples":[{"command":"array_unshift($array, waarde);","note":"array_unshift($hamburger, 'bun'); zet een broodje vooraan de ingrediëntenlijst.","output":"","slide":41,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":41,"createdAt":1790250000567,"id":"les_0568"},{"command":"array_shift($array);","tab":"php","group":"Arrays","title":"Eerste waarde verwijderen","explanation":"Verwijdert de eerste waarde van een array.","parts":[{"m":"vooraan verwijderen","t":"array_shift"},{"m":"de array","t":"$array"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":43,"createdAt":1790250000568,"id":"les_0569"},{"command":"array_pop($array);","tab":"php","group":"Arrays","title":"Laatste waarde verwijderen","explanation":"Verwijdert de laatste waarde van een array.","parts":[{"m":"achteraan verwijderen","t":"array_pop"},{"m":"de array","t":"$array"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":43,"createdAt":1790250000569,"id":"les_0570"},{"command":"unset($array[sleutel]);","tab":"php","group":"Arrays","title":"Specifieke waarde uit array verwijderen","explanation":"Verwijdert het element met de opgegeven sleutel uit een array.","parts":[{"m":"verwijder","t":"unset"},{"m":"het element dat weg moet","t":"$array[sleutel]"}],"examples":[{"command":"unset($array[sleutel]);","note":"unset($minifigures[6506754]); verwijdert de minifiguur met die ID uit de lijst.","output":"","slide":43,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":43,"createdAt":1790250000570,"id":"les_0571"},{"command":"$array[key1][key2]","tab":"php","group":"Arrays","title":"Waarde uit tweedimensionale array","explanation":"Een tweedimensionale array is een array waarvan elk element zelf een array is (zoals een rooster). Met de eerste sleutel kies je de sub-array, met de tweede het element daarin.","parts":[{"m":"kiest de sub-array (rij)","t":"[key1]"},{"m":"kiest het element in die sub-array (kolom)","t":"[key2]"}],"examples":[{"command":"$array[key1][key2]","note":"echo $eatingContestResults[\"Hot Dogs\"][0]; toont de winnaar van de hotdogwedstrijd.","output":"","slide":45,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":45,"createdAt":1790250000571,"id":"les_0572"},{"command":"count($array)","tab":"php","group":"Arrays","title":"Aantal elementen in array","explanation":"Geeft het aantal elementen in een array terug.","parts":[{"m":"tel","t":"count"},{"m":"de array","t":"$array"}],"examples":[{"command":"count($array)","note":"count($spills) geeft 5 als de array vijf datums bevat.","output":"","slide":83,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":83,"createdAt":1790250000600,"id":"les_0601"},{"command":"in_array(waarde, $array)","tab":"php","group":"Arrays","title":"Controleren of waarde in array zit","explanation":"Geeft true als de gezochte waarde in de array voorkomt en false als ze er niet in zit, zonder dat je zelf een lus moet schrijven.","parts":[{"m":"zit het erin?","t":"in_array"},{"m":"wat je zoekt","t":"waarde"},{"m":"de array die doorzocht wordt","t":"$array"}],"examples":[{"command":"in_array(waarde, $array)","note":"if (in_array('needle', $haystack)) { echo \"Needle found in haystack.\"; }","output":"","slide":92,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":92,"createdAt":1790250000608,"id":"les_0609"},{"command":"print_r($_POST)","tab":"php","group":"Arrays","title":"Hele array leesbaar tonen","explanation":"Toont alle sleutels en waarden van een array, handig om te zien wat een formulier verstuurd heeft. De sleutels zijn de name-attributen van de velden.","parts":[{"m":"druk een array leesbaar af","t":"print_r"},{"m":"de array die je wilt bekijken","t":"$_POST"}],"examples":[{"command":"print_r($_POST)","note":"Na het invullen van 'Mathias' en klikken op de knop.","output":"Array ( [surname] => Mathias [submit] => Submit Query )","slide":15,"source":"les","sourceName":"5. Dynamic Web Pages.pptx"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":15,"createdAt":1790250000623,"id":"les_0624"},{"command":"in_array($zoek, $array)","tab":"php","group":"Arrays","title":"Zit waarde in array?","explanation":"Geeft true als de gezochte waarde in de array voorkomt, anders false. In de les: nagaan of een chemische stof in de voorraad zit.","parts":[{"m":"de waarde die je zoekt","t":"$zoek"},{"m":"de array waarin je zoekt","t":"$array"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":22,"createdAt":1790250000631,"id":"les_0632"},{"command":"php bestand.php","tab":"php","group":"Basis & syntax","title":"PHP-script uitvoeren in terminal","explanation":"Voert een PHP-bestand uit via de command line: typ php gevolgd door de naam van het bestand. Bewaar je code eerst in een bestand met de extensie .php en ga in de terminal naar de map waar dat bestand staat.","parts":[{"m":"de PHP-interpreter die de code uitvoert","t":"php"},{"m":"het bestand met je PHP-code","t":"bestand.php"}],"examples":[{"command":"php bestand.php","note":"php HelloWorld.php voert het Hello World-script uit en toont Hello World! in de terminal.","output":"Hello World!","slide":5,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":5,"createdAt":1790250000532,"id":"les_0533"},{"command":"<?php ... ?>","tab":"php","group":"Basis & syntax","title":"PHP-code afbakenen met tags","explanation":"PHP voert alleen de code uit die tussen <?php en ?> staat; een bestand mag meerdere van die blokken bevatten. Alles buiten de PHP-tags (bv. gewone tekst of HTML) blijft ongewijzigd staan.","parts":[{"m":"begin van de PHP-code","t":"<?php"},{"m":"einde van de PHP-code","t":"?>"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":8,"createdAt":1790250000533,"id":"les_0534"},{"command":";","tab":"php","group":"Basis & syntax","title":"Statement afsluiten met puntkomma","explanation":"Elke PHP-opdracht (statement) eindigt met een puntkomma. Een vergeten puntkomma is een veelvoorkomende oorzaak van fouten. Uitzondering: if-, while-, for- en foreach-blokken met accolades krijgen geen puntkomma na de }.","parts":[{"m":"einde van één opdracht","t":";"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":10,"createdAt":1790250000534,"id":"les_0535"},{"command":"// commentaar","tab":"php","group":"Basis & syntax","title":"Commentaar op één regel","explanation":"Alles na // (of #) tot het einde van de regel is commentaar: PHP negeert het. Je gebruikt het om uitleg bij je code te schrijven, zodat jij en anderen later nog weten wat de code doet.","parts":[{"m":"start commentaar tot einde van de regel","t":"//"},{"m":"andere manier om een regel commentaar te starten","t":"#"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":11,"createdAt":1790250000535,"id":"les_0536"},{"command":"/* commentaar */","tab":"php","group":"Basis & syntax","title":"Commentaar over meerdere regels","explanation":"Alles tussen /* en */ is commentaar, ook als het over meerdere regels loopt. Handig voor langere uitleg of om een stuk code tijdelijk uit te schakelen.","parts":[{"m":"begin van het commentaar","t":"/*"},{"m":"einde van het commentaar","t":"*/"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":11,"createdAt":1790250000536,"id":"les_0537"},{"command":"var_dump(waarde);","tab":"php","group":"Basis & syntax","title":"Type en waarde in detail tonen","explanation":"var_dump() toont gedetailleerde info over een waarde: het datatype én de waarde zelf (werkt ook voor arrays). Handig om te controleren welk type iets heeft of om het resultaat van een voorwaarde (true/false) te zien.","parts":[{"m":"toon type en waarde","t":"var_dump"},{"m":"waarde, variabele of voorwaarde die je wil onderzoeken","t":"(waarde)"}],"examples":[{"command":"var_dump(waarde);","note":"var_dump(true); toont dat de waarde een boolean is met waarde true: bool(true).","output":"","slide":14,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":14,"createdAt":1790250000538,"id":"les_0539"},{"command":"echo waarde;","tab":"php","group":"Basis & syntax","title":"Waarde of variabele tonen","explanation":"echo toont een waarde of de inhoud van een variabele (in de terminal of later in de browser). Het werkt voor getallen, tekst en booleans.","parts":[{"m":"toon wat volgt","t":"echo"},{"m":"getal, string, boolean of variabele, bv. 42, \"Don't Panic\" of $variable","t":"waarde"}],"examples":[{"command":"echo waarde;","note":"<?php echo \"Hello World!\"; ?> toont de tekst Hello World!","output":"","slide":17,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":17,"createdAt":1790250000541,"id":"les_0542"},{"command":"echo \"tekst\", $variabele;","tab":"php","group":"Basis & syntax","title":"Meerdere waarden tegelijk tonen","explanation":"Met echo kun je meerdere waarden en variabelen in één keer tonen door ze met komma's te scheiden. Ze worden achter elkaar getoond.","parts":[{"m":"toon wat volgt","t":"echo"},{"m":"scheidt de verschillende waarden","t":","},{"m":"variabele waarvan de inhoud getoond wordt","t":"$variabele"}],"examples":[{"command":"echo \"tekst\", $variabele;","note":"echo \"The password for Mathias' Howest account is: \", $howestPassword; toont de zin gevolgd door het wachtwoord.","output":"","slide":18,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":18,"createdAt":1790250000542,"id":"les_0543"},{"command":"print(waarde);","tab":"php","group":"Basis & syntax","title":"Eén waarde tonen met print","explanation":"print() toont net als echo een waarde of variabele, maar slechts één tegelijk. Wil je meerdere stukken tonen, combineer ze dan eerst met concatenatie (.) of interpolatie.","parts":[{"m":"toon de waarde","t":"print"},{"m":"één getal, string, boolean of variabele","t":"(waarde)"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":19,"createdAt":1790250000543,"id":"les_0544"},{"command":"<?php echo \"<div>...<\/div>\"; ?>","tab":"php","group":"Basis & syntax","title":"PHP in een HTML-pagina","explanation":"Je kunt PHP-code tussen <?php en ?> midden in HTML zetten. De server voert de code uit en vervangt ze door de HTML die echo maakt. Een bestand met PHP-code moet altijd de extensie .php hebben, ook als er vooral HTML in staat.","parts":[{"m":"begin van PHP-code","t":"<?php"},{"m":"schrijft tekst/HTML naar de pagina","t":"echo"},{"m":"einde van PHP-code","t":"?>"}],"examples":[{"command":"<?php echo \"<div>...<\/div>\"; ?>","note":"Met $OG = 1.050 en $FG = 1.010 maakt de server van ($OG - $FG) * 131.25 de gewone HTML \"The ABV is: 5.25%\".","output":"<div>The ABV is: 5.25%<\/div>","slide":3,"source":"les","sourceName":"5. Dynamic Web Pages.pptx"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":3,"createdAt":1790250000614,"id":"les_0615"},{"command":"php -S localhost:8080","tab":"php","group":"Basis & syntax","title":"Ingebouwde PHP-webserver starten","explanation":"Start in de terminal een kleine webserver die je .php-bestanden uitvoert. Voer het uit in de map met je bestanden (de root-map) en open daarna de getoonde URL in de browser; standaard wordt index.php of index.html getoond. Een ander bestand open je door /bestandsnaam achter de URL te zetten (bv. localhost:8080/ABV.php).","parts":[{"m":"start de PHP-interpreter","t":"php"},{"m":"start de ingebouwde webserver","t":"-S"},{"m":"je eigen computer","t":"localhost"},{"m":"poortnummer (tussen 1024 en 65535, meestal 8000 of 8080)","t":"8080"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":4,"createdAt":1790250000616,"id":"les_0617"},{"command":"include('bestand')","tab":"php","group":"Basis & syntax","title":"Ander bestand invoegen","explanation":"Voegt de inhoud van een .html- of .php-bestand in op die plek, bv. een header of footer die op veel pagina's terugkomt. Ontbreekt het bestand, dan gaat het script gewoon verder.","parts":[{"m":"voeg bestand in, ga door bij fout","t":"include"},{"m":"naam van het bestand, tussen aanhalingstekens","t":"'bestand'"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":8,"createdAt":1790250000617,"id":"les_0618"},{"command":"require('bestand')","tab":"php","group":"Basis & syntax","title":"Bestand invoegen, stoppen als ontbreekt","explanation":"Voegt net als include een bestand in, maar stopt het script met een fatale fout als het bestand ontbreekt. Gebruik het voor onderdelen die er zeker moeten zijn.","parts":[{"m":"voeg bestand in, stop bij fout","t":"require"},{"m":"naam van het bestand, tussen aanhalingstekens","t":"'bestand'"}],"examples":[{"command":"require('bestand')","note":"require('bugReport.html'); voegt onderaan elke pagina dezelfde 'Report a bug'-footer in.","output":"","slide":9,"source":"les","sourceName":"5. Dynamic Web Pages.pptx"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":9,"createdAt":1790250000618,"id":"les_0619"},{"command":"background: <?php echo $kleur; ?>;","tab":"php","group":"Basis & syntax","title":"PHP gebruiken binnen CSS","explanation":"PHP kan ook in een <style>-blok staan om een CSS-waarde te kiezen, bv. de achtergrondkleur afhankelijk van wat de gebruiker indiende. In de les: rood als de knop is ingedrukt, anders wit.","parts":[{"m":"CSS-eigenschap voor de achtergrond","t":"background:"},{"m":"PHP schrijft de kleurnaam op die plek","t":"<?php echo ...; ?>"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":20,"createdAt":1790250000628,"id":"les_0629"},{"command":"$_POST['naam']","tab":"php","group":"Formulieren","title":"Formulierwaarde ophalen (POST)","explanation":"Ingebouwde array met de gegevens van een formulier met method=\"POST\". De sleutel is de name van het invoerveld, de waarde is wat de gebruiker invulde.","parts":[{"m":"ingebouwde array met POST-data","t":"$_POST"},{"m":"de name van het invoerveld","t":"'naam'"}],"examples":[{"command":"$_POST['naam']","note":"echo \"Welcome \" . $_POST['surname']; begroet de gebruiker met de ingevulde naam.","output":"","slide":16,"source":"les","sourceName":"5. Dynamic Web Pages.pptx"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":16,"createdAt":1790250000624,"id":"les_0625"},{"command":"if (isset($_POST['submit'])) { }","tab":"php","group":"Formulieren","title":"Controleren of formulier verstuurd is","explanation":"isset() geeft true als de naam in de array bestaat. Zo voer je de verwerkingscode pas uit nadat op de verzendknop (name=\"submit\") is geklikt, en vermijd je fouten. Ook te gebruiken om te zien of een checkbox aangevinkt is.","parts":[{"m":"true als de variabele/sleutel bestaat","t":"isset()"},{"m":"de name van de verzendknop of het veld","t":"'submit'"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":16,"createdAt":1790250000625,"id":"les_0626"},{"command":"$_GET['naam']","tab":"php","group":"Formulieren","title":"Formulierwaarde ophalen (GET)","explanation":"Ingebouwde array met de gegevens van een formulier met method=\"GET\" (de waarden staan ook in de URL). Werkt verder net als $_POST.","parts":[{"m":"ingebouwde array met GET-data","t":"$_GET"},{"m":"de name van het invoerveld","t":"'naam'"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":17,"createdAt":1790250000626,"id":"les_0627"},{"command":"$_FILES['naam']['tmp_name']","tab":"php","group":"Formulieren","title":"Tijdelijke locatie van upload","explanation":"Een geüpload bestand wordt eerst op een tijdelijke plaats bewaard. De ingebouwde array $_FILES bevat info over het bestand (naam, type, grootte …); via 'tmp_name' krijg je het pad om het bestand te lezen.","parts":[{"m":"ingebouwde array met geüploade bestanden","t":"$_FILES"},{"m":"de name van het file-invoerveld","t":"'naam'"},{"m":"tijdelijk pad van het bestand op de server","t":"'tmp_name'"}],"examples":[{"command":"$_FILES['naam']['tmp_name']","note":"","output":"[name] => sequences.fasta\n[type] => application/octet-stream\n[tmp_name] => /tmp/phpxYaBEg\n[error] => 0\n[size] => 123","slide":48,"source":"les","sourceName":"5. Dynamic Web Pages.pptx"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":48,"createdAt":1790250000648,"id":"les_0649"},{"command":"file($bestand)","tab":"php","group":"Formulieren","title":"Bestand inlezen als array regels","explanation":"Leest een bestand en geeft een array terug met één element per regel. Elke regel bevat nog het regeleinde \\n, dus gebruik trim() voor je ermee vergelijkt.","parts":[{"m":"pad naar het bestand, bv. $_FILES['naam']['tmp_name']","t":"$bestand"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":49,"createdAt":1790250000649,"id":"les_0650"},{"command":"file_get_contents($bestand)","tab":"php","group":"Formulieren","title":"Hele bestand als één string","explanation":"Leest de volledige inhoud van een bestand in als één string. Met explode(\"\\n\", ...) splits je die daarna in regels.","parts":[{"m":"pad naar het bestand, bv. $_FILES['naam']['tmp_name']","t":"$bestand"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":49,"createdAt":1790250000650,"id":"les_0651"},{"command":"isset($variabele)","tab":"php","group":"Functies","title":"Controleren of variabele bestaat","explanation":"Geeft true als de variabele (of het array-element) bestaat en een waarde heeft, en false als ze niet bestaat of null is. Handig om te controleren of een sleutel in een array zit of of er een argument meegegeven is.","parts":[{"m":"is het ingesteld?","t":"isset"},{"m":"variabele of array-element, bv. $cards[$name]","t":"$variabele"}],"examples":[{"command":"isset($variabele)","note":"if (isset($pokemon_cards[$pokemon_name])) controleert of Cedric een kaart van die Pokémon heeft.","output":"","slide":76,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":76,"createdAt":1790250000596,"id":"les_0597"},{"command":"empty($variabele)","tab":"php","group":"Functies","title":"Controleren of variabele leeg is","explanation":"Geeft true als de variabele niet bestaat of een 'lege' waarde heeft: 0, een lege string \"\", null, false of een lege array [].","parts":[{"m":"is het leeg?","t":"empty"},{"m":"de variabele die je test","t":"$variabele"}],"examples":[{"command":"empty($variabele)","note":"if (empty($tattooAreas[$clientName])) toont dat een klant geen plek meer heeft voor tattoos.","output":"","slide":78,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":78,"createdAt":1790250000597,"id":"les_0598"},{"command":"exit(\"bericht\"); / die(\"bericht\");","tab":"php","group":"Functies","title":"Script onmiddellijk stoppen","explanation":"exit() en die() stoppen het volledige script meteen; code daarna wordt niet meer uitgevoerd. Een optionele tekst tussen de haakjes wordt eerst nog getoond. Verschil met break: break stopt enkel een lus, de rest van het script loopt verder.","parts":[{"m":"stop het script (beide doen hetzelfde)","t":"exit / die"},{"m":"optioneel: tekst die getoond wordt vóór het stoppen","t":"(\"bericht\")"}],"examples":[{"command":"exit(\"bericht\"); / die(\"bericht\");","note":"if (!isset($argv[1])) { exit(\"Oops! You forgot to mention which snail we're working with.\\n\"); } stopt het script als er geen argument meegegeven is.","output":"","slide":80,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":80,"createdAt":1790250000598,"id":"les_0599"},{"command":"rand(min, max)","tab":"php","group":"Functies","title":"Willekeurig geheel getal","explanation":"Geeft een willekeurig geheel getal tussen min en max (beide inbegrepen). Wil je een willekeurig kommagetal, deel dan het resultaat, bv. rand(0, 10) / 10 geeft 0.0, 0.1 ... 1.0.","parts":[{"m":"willekeurig getal","t":"rand"},{"m":"kleinst mogelijke waarde","t":"min"},{"m":"grootst mogelijke waarde","t":"max"}],"examples":[{"command":"rand(min, max)","note":"$randomValue = rand(0, 1); geeft willekeurig 0 of 1 (virtueel huisdier wel of niet gevoed).","output":"","slide":93,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":93,"createdAt":1790250000609,"id":"les_0610"},{"command":"sleep(seconden);","tab":"php","group":"Functies","title":"Script even pauzeren","explanation":"Pauzeert de uitvoering van het script gedurende het opgegeven aantal seconden.","parts":[{"m":"wacht","t":"sleep"},{"m":"aantal seconden, bv. 1","t":"seconden"}],"examples":[{"command":"sleep(seconden);","note":"In een for-lus van 10 naar 0 zorgt sleep(1); voor een aftelling van één seconde per stap.","output":"","slide":95,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":95,"createdAt":1790250000610,"id":"les_0611"},{"command":"unset($variabele);","tab":"php","group":"Functies","title":"Variabele verwijderen","explanation":"Verwijdert een variabele of een array-element, zodat ze daarna niet meer bestaat.","parts":[{"m":"verwijder","t":"unset"},{"m":"de variabele of het array-element","t":"$variabele"}],"examples":[{"command":"unset($variabele);","note":"foreach ($didNotInviteMathias as $person) { unset($invitationList[$person]); }","output":"","slide":97,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":97,"createdAt":1790250000612,"id":"les_0613"},{"command":"while (voorwaarde) { ... }","tab":"php","group":"Lussen","title":"Herhalen zolang voorwaarde waar is","explanation":"Een while-lus controleert telkens de voorwaarde en voert het codeblok opnieuw uit zolang die true is. Zodra de voorwaarde false is, stopt de lus. Zorg dat er in de lus iets verandert, anders stopt ze nooit.","parts":[{"m":"zolang","t":"while"},{"m":"wordt voor elke herhaling getest","t":"(voorwaarde)"},{"m":"code die herhaald wordt","t":"{ ... }"}],"examples":[{"command":"while (voorwaarde) { ... }","note":"while ($currentAmount < $totalAmount) { $currentAmount += 25; $additions++; } telt hoeveel keer je 25 ml moet toevoegen.","output":"","slide":66,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":66,"createdAt":1790250000589,"id":"les_0590"},{"command":"while (true) { ... }","tab":"php","group":"Lussen","title":"Oneindige lus","explanation":"Omdat de voorwaarde altijd true is, stopt deze lus nooit vanzelf. Stop het script in de terminal met Ctrl + C.","parts":[{"m":"voorwaarde die altijd waar is","t":"true"},{"m":"script onderbreken in de terminal","t":"Ctrl + C"}],"examples":[{"command":"while (true) { ... }","note":"while (true) { echo \"Narcissus, you are beautiful!\\n\"; } blijft eindeloos dezelfde zin tonen.","output":"","slide":66,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":66,"createdAt":1790250000590,"id":"les_0591"},{"command":"for (start; voorwaarde; update) { ... }","tab":"php","group":"Lussen","title":"Lus met teller","explanation":"Een for-lus heeft drie delen tussen haakjes: een startwaarde voor de lusvariabele, een voorwaarde die bepaalt of de lus doorgaat, en een update die de lusvariabele na elke ronde aanpast (meestal +1 of -1).","parts":[{"m":"beginwaarde, bv. $i = 0","t":"start"},{"m":"lus loopt zolang dit true is, bv. $i < 400","t":"voorwaarde"},{"m":"aanpassing na elke ronde, bv. $i++","t":"update"},{"m":"code die herhaald wordt","t":"{ ... }"}],"examples":[{"command":"for (start; voorwaarde; update) { ... }","note":"for ($i = 0; $i < 400; $i++) { echo '<div class=\"leg\"><\/div>'; } maakt 400 div-tags.","output":"","slide":68,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":68,"createdAt":1790250000591,"id":"les_0592"},{"command":"foreach ($array as $value) { ... }","tab":"php","group":"Lussen","title":"Elke waarde van array overlopen","explanation":"Een foreach-lus overloopt elk element van een array: bij elke ronde krijgt $value de volgende waarde uit de array.","parts":[{"m":"voor elk","t":"foreach"},{"m":"de array die je overloopt","t":"$array"},{"m":"variabele die telkens de huidige waarde krijgt","t":"as $value"}],"examples":[{"command":"foreach ($array as $value) { ... }","note":"foreach ($emailAddresses as $email) { $trimmedEmailAddresses[] = trim($email); }","output":"","slide":70,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":70,"createdAt":1790250000592,"id":"les_0593"},{"command":"foreach ($array as $key => $value) { ... }","tab":"php","group":"Lussen","title":"Sleutels en waarden van array overlopen","explanation":"Deze foreach-lus overloopt een array en geeft bij elke ronde zowel de sleutel ($key) als de bijhorende waarde ($value). Handig bij associatieve arrays.","parts":[{"m":"de array die je overloopt","t":"$array"},{"m":"krijgt telkens de huidige sleutel","t":"$key"},{"m":"koppelt sleutel en waarde","t":"=>"},{"m":"krijgt de bijhorende waarde","t":"$value"}],"examples":[{"command":"foreach ($array as $key => $value) { ... }","note":"foreach ($creatures as $name => $description) { echo \"A $name is a $description.\\n\"; }","output":"A Minotaur is a Half-human, half-bull.\nA Mermaid is a Half-human, half-fish.","slide":71,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":71,"createdAt":1790250000593,"id":"les_0594"},{"command":"continue;","tab":"php","group":"Lussen","title":"Naar volgende lusronde springen","explanation":"continue slaat de rest van de huidige ronde van een lus over en gaat meteen verder met de volgende ronde.","parts":[{"m":"sla de rest van deze ronde over","t":"continue"}],"examples":[{"command":"continue;","note":"if ($level < $safeThreshold) { continue; } slaat lessen met een veilig geluidsniveau over.","output":"","slide":73,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":73,"createdAt":1790250000594,"id":"les_0595"},{"command":"break;","tab":"php","group":"Lussen","title":"Lus volledig stoppen","explanation":"break stopt de lus meteen; het script gaat verder met de code na de lus. Handig om niet verder te zoeken als je gevonden hebt wat je zocht.","parts":[{"m":"verlaat de lus","t":"break"}],"examples":[{"command":"break;","note":"if ($value == 'Nemo') { echo 'We found Nemo!'; break; }","output":"","slide":73,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":73,"createdAt":1790250000595,"id":"les_0596"},{"command":"$a + $b, $a - $b, $a * $b, $a / $b","tab":"php","group":"Operatoren","title":"Optellen, aftrekken, vermenigvuldigen, delen","explanation":"Rekenkundige operatoren voor berekeningen met integers en floats. -$a geeft het tegengestelde van $a. Het resultaat kun je tonen of in een variabele bewaren; met haakjes bepaal je wat eerst berekend wordt.","parts":[{"m":"optellen","t":"+"},{"m":"aftrekken (of -$a: tegengestelde)","t":"-"},{"m":"vermenigvuldigen","t":"*"},{"m":"delen","t":"/"}],"examples":[{"command":"$a + $b, $a - $b, $a * $b, $a / $b","note":"echo \"The ABV is: \" . ($OG - $FG) * 131.25 . \"%\"; berekent het alcoholpercentage van bier.","output":"","slide":27,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":27,"createdAt":1790250000554,"id":"les_0555"},{"command":"$a ** $b","tab":"php","group":"Operatoren","title":"Machtsverheffing","explanation":"Verheft $a tot de macht $b.","parts":[{"m":"tot de macht","t":"**"}],"examples":[{"command":"$a ** $b","note":"10**5 geeft 100000.","output":"","slide":27,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":27,"createdAt":1790250000555,"id":"les_0556"},{"command":"$a % $b","tab":"php","group":"Operatoren","title":"Rest na deling (modulus)","explanation":"Geeft de rest als je $a deelt door $b. Vaak gebruikt om deelbaarheid te testen: $getal % 2 is 0 bij een even getal en 1 bij een oneven getal.","parts":[{"m":"modulus: rest van de deling","t":"%"}],"examples":[{"command":"$a % $b","note":"7 % 2 geeft 1, dus 7 is oneven.","output":"","slide":28,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":28,"createdAt":1790250000556,"id":"les_0557"},{"command":"$var++ en $var--","tab":"php","group":"Operatoren","title":"Variabele met 1 verhogen/verlagen","explanation":"++ verhoogt de waarde van een numerieke variabele met 1, -- verlaagt ze met 1. Een kortere schrijfwijze voor $var = $var + 1 en $var = $var - 1; veel gebruikt in lussen.","parts":[{"m":"+1","t":"++"},{"m":"-1","t":"--"}],"examples":[{"command":"$var++ en $var--","note":"$petals = 20; gevolgd door drie keer $petals--; laat 17 blaadjes over.","output":"","slide":30,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":30,"createdAt":1790250000557,"id":"les_0558"},{"command":"$var += n en $var -= n","tab":"php","group":"Operatoren","title":"Getal optellen bij/aftrekken van variabele","explanation":"+= telt een getal op bij de huidige waarde van een variabele, -= trekt er een getal van af. Korter dan $var = $var + n.","parts":[{"m":"tel n erbij op","t":"+="},{"m":"trek n ervan af","t":"-="},{"m":"het getal","t":"n"}],"examples":[{"command":"$var += n en $var -= n","note":"$temperature -= 273.15; zet een temperatuur in Kelvin om naar °C.","output":"","slide":30,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":30,"createdAt":1790250000558,"id":"les_0559"},{"command":"$a == $b","tab":"php","group":"Operatoren","title":"Gelijk aan (na type juggling)","explanation":"Geeft true als $a gelijk is aan $b, nadat PHP de types zo nodig automatisch omgezet heeft (type juggling). Let op: één = kent een waarde toe, == vergelijkt.","parts":[{"m":"is gelijk aan","t":"=="}],"examples":[{"command":"$a == $b","note":"var_dump($AmountOfLegs == 8); toont true als het dier 8 poten heeft (een spin).","output":"","slide":51,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":51,"createdAt":1790250000574,"id":"les_0575"},{"command":"$a === $b","tab":"php","group":"Operatoren","title":"Identiek: zelfde waarde én type","explanation":"Geeft enkel true als $a en $b dezelfde waarde én hetzelfde type hebben; PHP zet niets automatisch om. Zo is false == 0 true, maar false === 0 false.","parts":[{"m":"is identiek aan (strikte vergelijking)","t":"==="}],"sourceName":"4. Fundamentals of PHP.pptx","slide":51,"createdAt":1790250000575,"id":"les_0576"},{"command":"$a != $b","tab":"php","group":"Operatoren","title":"Niet gelijk aan","explanation":"Geeft true als $a niet gelijk is aan $b, na automatische typeomzetting. Zo is false != 0 false, omdat PHP 0 als false beschouwt.","parts":[{"m":"is niet gelijk aan","t":"!="}],"sourceName":"4. Fundamentals of PHP.pptx","slide":51,"createdAt":1790250000576,"id":"les_0577"},{"command":"$a !== $b","tab":"php","group":"Operatoren","title":"Niet identiek","explanation":"Geeft true als $a en $b een andere waarde óf een ander type hebben. Zo is false !== 0 true, omdat het ene een boolean en het andere een integer is.","parts":[{"m":"is niet identiek aan","t":"!=="}],"sourceName":"4. Fundamentals of PHP.pptx","slide":51,"createdAt":1790250000577,"id":"les_0578"},{"command":"<  >  <=  >=","tab":"php","group":"Operatoren","title":"Kleiner/groter dan vergelijken","explanation":"Vergelijkt twee waarden: < kleiner dan, > groter dan, <= kleiner dan of gelijk aan, >= groter dan of gelijk aan. Het resultaat is altijd true of false.","parts":[{"m":"kleiner dan","t":"<"},{"m":"groter dan","t":">"},{"m":"kleiner dan of gelijk aan","t":"<="},{"m":"groter dan of gelijk aan","t":">="}],"examples":[{"command":"<  >  <=  >=","note":"if ($distance <= $dangerZoneThreshold) waarschuwt de zookeeper binnen 3 meter van de lama.","output":"","slide":51,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":51,"createdAt":1790250000578,"id":"les_0579"},{"command":"Type juggling","tab":"php","group":"Operatoren","title":"Automatische omzetting van types","explanation":"PHP zet waarden van verschillende types automatisch om als je ze vergelijkt, wat soms verrassend is: false == 0 is bijvoorbeeld true. Gebruik === en !== als ook het type moet kloppen.","sourceName":"4. Fundamentals of PHP.pptx","slide":52,"createdAt":1790250000579,"id":"les_0580"},{"command":"$a && $b (and)","tab":"php","group":"Operatoren","title":"Logische EN","explanation":"Geeft true als beide voorwaarden waar zijn. && en and doen hetzelfde.","parts":[{"m":"en","t":"&&"},{"m":"andere schrijfwijze voor &&","t":"and"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":54,"createdAt":1790250000580,"id":"les_0581"},{"command":"$a || $b (or)","tab":"php","group":"Operatoren","title":"Logische OF","explanation":"Geeft true als minstens één van de voorwaarden waar is. || en or doen hetzelfde.","parts":[{"m":"of","t":"||"},{"m":"andere schrijfwijze voor ||","t":"or"}],"examples":[{"command":"$a || $b (or)","note":"var_dump($antidotes[0] >= 2024 or $antidotes[1] >= 2024); geeft false als beide tegengif vervallen zijn.","output":"","slide":54,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":54,"createdAt":1790250000581,"id":"les_0582"},{"command":"$a xor $b","tab":"php","group":"Operatoren","title":"Exclusieve OF","explanation":"Geeft true als precies één van de twee voorwaarden waar is, maar niet allebei.","parts":[{"m":"exclusief of","t":"xor"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":54,"createdAt":1790250000582,"id":"les_0583"},{"command":"!$a","tab":"php","group":"Operatoren","title":"Logische NIET (omkeren)","explanation":"Keert het resultaat van een voorwaarde om: true wordt false en false wordt true.","parts":[{"m":"niet","t":"!"}],"examples":[{"command":"!$a","note":"if (!isset($argv[1])) is waar als er géén argument meegegeven is.","output":"","slide":54,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":54,"createdAt":1790250000583,"id":"les_0584"},{"command":"$a && ($b || $c)","tab":"php","group":"Operatoren","title":"Haakjes in samengestelde voorwaarden","explanation":"Je mag meerdere logische operatoren combineren. Wat tussen haakjes staat wordt eerst geëvalueerd, zo bepaal je de juiste volgorde.","parts":[{"m":"dit deel eerst evalueren","t":"( )"},{"m":"en","t":"&&"},{"m":"of","t":"||"}],"examples":[{"command":"$a && ($b || $c)","note":"var_dump($containsPeanuts && ($allergicToPeanuts || $dislikesPeanuts)); geeft true als het gerecht ongeschikt is.","output":"","slide":56,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":56,"createdAt":1790250000584,"id":"les_0585"},{"command":"$a ?? 'standaard'","tab":"php","group":"Operatoren","title":"Standaardwaarde als iets ontbreekt","explanation":"De ??-operator geeft de linkerwaarde als die bestaat (en niet null is), anders de rechterwaarde. Korte vorm van if (isset(...)) ... else ....","parts":[{"m":"null-coalescing-operator","t":"??"},{"m":"waarde als de linkerkant niet bestaat","t":"'standaard'"}],"examples":[{"command":"$a ?? 'standaard'","note":"<?php echo $_GET['mood'] ?? 'white' ?> geeft de gekozen kleur, of 'white' zolang er niets verstuurd is.","output":"","slide":41,"source":"les","sourceName":"5. Dynamic Web Pages.pptx"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":41,"createdAt":1790250000643,"id":"les_0644"},{"command":"preg_replace(patroon, vervanging, $string)","tab":"php","group":"Strings","title":"Patroon vervangen in een string","explanation":"Zoekt een patroon (reguliere expressie) in een string en vervangt het. Met $1, $2 ... verwijs je in de vervanging naar de stukken tussen haakjes in het patroon.","parts":[{"m":"zoek en vervang","t":"preg_replace"},{"m":"reguliere expressie tussen slashes","t":"patroon"},{"m":"nieuwe tekst, eventueel met $1, $2 ...","t":"vervanging"},{"m":"de tekst waarin vervangen wordt","t":"$string"}],"examples":[{"command":"preg_replace(patroon, vervanging, $string)","note":"preg_replace('/(\\+\\d{2})(\\d{3})(\\d{2})(\\d{2})(\\d{2})/', '$1 $2 $3 $4 $5', '+32492756421') maakt er +32 492 75 64 21 van.","output":"","slide":11,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":11,"createdAt":1790250000537,"id":"les_0538"},{"command":"\"tekst\" . $variabele","tab":"php","group":"Strings","title":"Strings aan elkaar plakken (concatenatie)","explanation":"De punt (.) plakt twee of meer waarden achter elkaar tot één string. Het resultaat kun je tonen met echo of print, of in een nieuwe variabele bewaren.","parts":[{"m":"concatenatie-operator: plak aan elkaar","t":"."}],"examples":[{"command":"\"tekst\" . $variabele","note":"print(\"The password for Mathias' Howest account is: \" . $howestPassword); toont zin en wachtwoord met één print.","output":"","slide":20,"source":"les","sourceName":"4. Fundamentals of PHP.pptx"}],"sourceName":"4. Fundamentals of PHP.pptx","slide":20,"createdAt":1790250000544,"id":"les_0545"},{"command":"\"tekst $variabele\"","tab":"php","group":"Strings","title":"Variabele in string zetten (interpolatie)","explanation":"Zet je een variabele binnen een string met dubbele aanhalingstekens, dan vult PHP automatisch de waarde van die variabele in. Dit heet string-interpolatie. Je kunt de naam ook tussen accolades zetten, bv. \"{$naam}\".","parts":[{"m":"dubbele aanhalingstekens: variabelen worden ingevuld","t":"\" \""},{"m":"wordt vervangen door zijn waarde","t":"$variabele"}],"examples":[{"command":"\"tekst $variabele\"","note":"$passwordString = \"The password for Mathias' Howest account is: $howestPassword\"; zet het wachtwoord mee in de zin.","output":"","slide":21,"source":"les"
