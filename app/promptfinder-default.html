otte groter maken. Je ziet het box model via rechtsklik > Inspecteren in de browser.","sourceName":"3. Introduction to CSS.pptx","slide":54,"createdAt":1790250000506,"id":"les_0507"},{"command":"Ontwikkelaarstools (Inspecteren)","tab":"algemeen","group":"Web","title":"HTML en CSS bekijken in browser","explanation":"Via rechtsklik op een element en 'Inspecteren' open je de ontwikkelaarstools van de browser. Daar zie je de HTML, de toegepaste CSS en het box model van het element.","sourceName":"3. Introduction to CSS.pptx","slide":54,"createdAt":1790250000507,"id":"les_0508"},{"command":"Blok- en inline-element","tab":"algemeen","group":"Web","title":"Twee soorten HTML-elementen","explanation":"Een blokelement (block-level, bv. <div>, <p>) begint op een nieuwe regel, laat niets naast zich toe en kan een breedte en hoogte krijgen. Een inline-element (bv. <span>, <a>) staat op dezelfde regel als andere elementen en negeert width en height (uitzondering: <img>).","sourceName":"3. Introduction to CSS.pptx","slide":71,"createdAt":1790250000522,"id":"les_0523"},{"command":"Dynamische webpagina","tab":"algemeen","group":"Web","title":"Pagina die de server aanmaakt","explanation":"Een webpagina waarvan de inhoud door code op de server (bv. PHP) wordt gemaakt, bijvoorbeeld op basis van wat de gebruiker invult. De browser kan PHP niet zelf lezen: de PHP-server voert de code uit en stuurt gewone HTML en CSS naar de browser.","sourceName":"5. Dynamic Web Pages.pptx","slide":3,"createdAt":1790250000613,"id":"les_0614"},{"command":"GET en POST","tab":"algemeen","group":"Web","title":"Twee manieren om formulierdata te versturen","explanation":"Met GET komen de ingevulde gegevens zichtbaar in de URL; alleen geschikt voor niet-gevoelige data. Met POST worden de gegevens in de body van het verzoek meegestuurd: veiliger en geschikt voor grotere hoeveelheden, wachtwoorden en bestanden.","sourceName":"5. Dynamic Web Pages.pptx","slide":13,"createdAt":1790250000621,"id":"les_0622"},{"command":"border: 6px solid rgb(64,58,50);","tab":"css","group":"Box model","title":"Rand rond een element","explanation":"border is een shorthand die in één keer de dikte, de stijl en de kleur van de rand instelt (border-width, border-style en border-color).","parts":[{"m":"shorthand voor de rand","t":"border"},{"m":"dikte: in pixels of thin, medium, thick","t":"6px"},{"m":"stijl: solid (doorlopend), dashed (streepjes), dotted (puntjes)","t":"solid"},{"m":"kleur: kleurnaam, hexcode of RGB","t":"rgb(64,58,50)"}],"examples":[{"command":"border: 6px solid rgb(64,58,50);","note":"img {border: 6px solid rgb(64,58,50);} zet een bruine rand van 6 pixels rond elke foto van Dimi.","output":"","slide":48,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":48,"createdAt":1790250000500,"id":"les_0501"},{"command":"height: 250px;","tab":"css","group":"Box model","title":"Breedte en hoogte instellen","explanation":"width bepaalt de horizontale grootte van een element, height de verticale. Je kunt verschillende eenheden gebruiken.","parts":[{"m":"breedte / hoogte","t":"width / height"},{"m":"vaste grootte in pixels","t":"px"},{"m":"percentage van de grootte van het ouder-element","t":"%"},{"m":"relatief t.o.v. de lettergrootte (1em = huidige lettergrootte)","t":"em"},{"m":"percentage van de breedte / hoogte van het browservenster (viewport)","t":"vw / vh"}],"examples":[{"command":"height: 250px;","note":"img {height: 250px;} maakt de afbeelding van de mime 250 pixels hoog.","output":"","slide":49,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":49,"createdAt":1790250000501,"id":"les_0502"},{"command":"width: fit-content;","tab":"css","group":"Box model","title":"Breedte passend bij inhoud","explanation":"Met fit-content berekent de browser zelf de breedte (of hoogte) op basis van de inhoud. Zo is een div niet meer standaard even breed als het venster.","parts":[{"m":"breedte","t":"width"},{"m":"zo breed als de inhoud","t":"fit-content"}],"examples":[{"command":"width: fit-content;","note":"De div met rand rond de mime wordt precies zo breed als de afbeelding.","output":"","slide":50,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":50,"createdAt":1790250000503,"id":"les_0504"},{"command":"padding: 16px;","tab":"css","group":"Box model","title":"Ruimte binnen de rand","explanation":"padding is de ruimte tussen de inhoud van een element en zijn rand. Het is een shorthand voor padding-top, -right, -bottom en -left. Met 1 tot 4 waarden kies je welke kanten welke ruimte krijgen.","parts":[{"m":"ruimte binnen de rand","t":"padding"},{"m":"1 waarde: alle vier de kanten","t":"16px"},{"m":"boven+onder, links+rechts","t":"2 waarden"},{"m":"boven, links+rechts, onder","t":"3 waarden"},{"m":"boven, rechts, onder, links (met de klok mee)","t":"4 waarden"}],"examples":[{"command":"padding: 16px;","note":"De mime in de div krijgt 16 pixels ruimte tussen de afbeelding en de rand.","output":"","slide":53,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":53,"createdAt":1790250000504,"id":"les_0505"},{"command":"margin: 0px 0px 15px 0px;","tab":"css","group":"Box model","title":"Ruimte buiten de rand","explanation":"margin is de ruimte buiten de rand, tussen het element en andere elementen. Het is een shorthand voor margin-top, -right, -bottom en -left; de regels voor 1 tot 4 waarden zijn dezelfde als bij padding.","parts":[{"m":"ruimte buiten de rand","t":"margin"},{"m":"boven","t":"0px"},{"m":"rechts","t":"0px"},{"m":"onder","t":"15px"},{"m":"links","t":"0px"}],"examples":[{"command":"margin: 0px 0px 15px 0px;","note":"Twee roze vierkantjes van 20x20 pixels staan 15 pixels van elkaar (marge onder de eerste div).","output":"","slide":53,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":53,"createdAt":1790250000505,"id":"les_0506"},{"command":"box-sizing: border-box;","tab":"css","group":"Box model","title":"Padding en rand meetellen","explanation":"Standaard (content-box) geldt width/height alleen voor de inhoud; padding en rand komen er nog bij. Met border-box tellen padding en rand mee in de opgegeven breedte en hoogte.","parts":[{"m":"hoe breedte en hoogte berekend worden","t":"box-sizing"},{"m":"standaard: padding en rand komen erbij","t":"content-box"},{"m":"padding en rand zitten in de breedte/hoogte","t":"border-box"}],"examples":[{"command":"box-sizing: border-box;","note":"Een div van 300px met een rand van 15px blijft in totaal 300 pixels breed.","output":"","slide":55,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":55,"createdAt":1790250000508,"id":"les_0509"},{"command":"outline: 20px solid yellow;","tab":"css","group":"Box model","title":"Lijn buiten de rand","explanation":"outline tekent een lijn buiten de rand van een element, met dezelfde waarden als border (dikte, stijl, kleur). Anders dan een rand neemt een outline geen plaats in en duwt ze andere elementen niet weg.","parts":[{"m":"shorthand voor de omlijning","t":"outline"},{"m":"dikte","t":"20px"},{"m":"stijl","t":"solid"},{"m":"kleur","t":"yellow"}],"examples":[{"command":"outline: 20px solid yellow;","note":"div:active {outline: 20px solid yellow;} laat een gele lijn verschijnen als je op de 'lichtschakelaar' klikt.","output":"","slide":57,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":57,"createdAt":1790250000509,"id":"les_0510"},{"command":"background-color","tab":"css","group":"Kleur & achtergrond","title":"Achtergrondkleur instellen","explanation":"Stelt de achtergrondkleur van een element in, bv. body { background-color: green; } voor een groene pagina.","parts":[{"m":"eigenschap achtergrondkleur","t":"background-color:"},{"m":"waarde: de kleur","t":"green"}],"sourceName":"2. Introduction to HTML.pptx","slide":14,"createdAt":1790250000423,"id":"les_0424"},{"command":"color: red;","tab":"css","group":"Kleur & achtergrond","title":"Tekstkleur instellen","explanation":"De eigenschap color bepaalt de kleur van de tekst in een element. Je kunt een kleurnaam, een hexcode of een RGB-waarde gebruiken.","parts":[{"m":"eigenschap voor de tekstkleur","t":"color"},{"m":"waarde: kleurnaam, hexcode (#FF0000) of rgb(255,0,0)","t":"red"}],"examples":[{"command":"color: red;","note":"Bij de M&M's-tekst krijgt elk <span> met style=\"color: …;\" de kleur van zijn mascotte.","output":"","slide":45,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":45,"createdAt":1790250000496,"id":"les_0497"},{"command":"#FF0000 / rgb(255, 0, 0)","tab":"css","group":"Kleur & achtergrond","title":"Kleur als hexcode of RGB","explanation":"Behalve met een naam (red, hotpink, tomato …) kun je een kleur geven als hexcode of RGB-waarde. Bij RGB geef je de hoeveelheid rood, groen en blauw, elk van 0 tot 255; een hexcode geeft dezelfde drie getallen in hexadecimale notatie.","parts":[{"m":"begin van een hexcode","t":"#"},{"m":"rood, groen, blauw in hexadecimaal (00 tot FF)","t":"FF 00 00"},{"m":"kleur als RGB-waarde","t":"rgb(…)"},{"m":"rood, groen, blauw van 0 tot 255","t":"255, 0, 0"}],"examples":[{"command":"#FF0000 / rgb(255, 0, 0)","note":"hotpink = #FF69B4 = rgb(255, 105, 180); white = #FFFFFF; black = #000000.","output":"","slide":45,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":45,"createdAt":1790250000497,"id":"les_0498"},{"command":"background: #D73233;","tab":"css","group":"Kleur & achtergrond","title":"Achtergrondkleur instellen","explanation":"De eigenschap background kleurt de achtergrond van een element. Het is een shorthand: ze kan ook o.a. background-color, background-image en background-repeat in één keer instellen. Voor alleen de kleur kun je ook background-color gebruiken.","parts":[{"m":"shorthand-eigenschap voor de achtergrond","t":"background"},{"m":"kleur als hexcode (kan ook kleurnaam of rgb())","t":"#D73233"}],"examples":[{"command":"background: #D73233;","note":"De M&M's-tekst krijgt achtergrondkleuren in de exacte merktinten.","output":"","slide":46,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":46,"createdAt":1790250000498,"id":"les_0499"},{"command":"selector { eigenschap: waarde; }","tab":"css","group":"Koppelen aan HTML","title":"Opbouw van een CSS-regel","explanation":"Een CSS-regel bestaat uit een selector en een declaratieblok tussen accolades. Elke declaratie is een eigenschap met een waarde, gevolgd door een puntkomma. Voorbeeld: p { font-size: 1.2em; } geeft alle <p>-elementen een bepaalde lettergrootte.","parts":[{"m":"welke HTML-elementen je opmaakt (bv. p)","t":"selector"},{"m":"declaratieblok: bevat één of meer declaraties","t":"{ }"},{"m":"wat je verandert (bv. color, font-size)","t":"eigenschap"},{"m":"scheidt eigenschap en waarde","t":":"},{"m":"hoe je het verandert (bv. red, 1.2em)","t":"waarde"},{"m":"sluit een declaratie af; scheidt meerdere declaraties","t":";"}],"sourceName":"3. Introduction to CSS.pptx","slide":4,"createdAt":1790250000467,"id":"les_0468"},{"command":"<p style=\"color: red; background: green\">","tab":"css","group":"Koppelen aan HTML","title":"Inline CSS met style-attribuut","explanation":"Met het style-attribuut zet je CSS rechtstreeks op één HTML-element. Meerdere declaraties scheid je met een puntkomma. Handig voor één element, maar onhandig als je later veel elementen moet aanpassen.","parts":[{"m":"HTML-attribuut met CSS-declaraties voor dit ene element","t":"style"},{"m":"de declaraties staan tussen aanhalingstekens","t":"\"…\""},{"m":"tekstkleur rood","t":"color: red"},{"m":"scheidt de declaraties","t":";"},{"m":"achtergrond groen","t":"background: green"}],"examples":[{"command":"<p style=\"color: red; background: green\">","note":"In de vlinderles krijgt elk <span> met style=\"color: red\" (egg, caterpillar …) rode tekst.","output":"","slide":6,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":6,"createdAt":1790250000470,"id":"les_0471"},{"command":"<style> span {color: red;} <\/style>","tab":"css","group":"Koppelen aan HTML","title":"Interne CSS in style-tag","explanation":"Met de <style>-tag in de <head> schrijf je CSS-regels die gelden voor meerdere elementen in hetzelfde HTML-document. Zo pas je een stijl op één plaats aan in plaats van bij elk element apart.","parts":[{"m":"tag in de <head> waarin CSS-regels staan","t":"<style>"},{"m":"selector: alle <span>-elementen","t":"span"},{"m":"declaratieblok: tekst rood maken","t":"{color: red;}"},{"m":"sluit de style-tag","t":"<\/style>"}],"examples":[{"command":"<style> span {color: red;} <\/style>","note":"Alle <span>-elementen in de vlindertekst worden rood met één enkele regel.","output":"","slide":8,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":8,"createdAt":1790250000471,"id":"les_0472"},{"command":"<link rel=\"stylesheet\" type=\"text/css\" href=\"style.css\">","tab":"css","group":"Koppelen aan HTML","title":"Extern stylesheet koppelen","explanation":"Zet je CSS-regels in een apart .css-bestand en koppel dat met de <link>-tag in de <head>. Zo kunnen meerdere HTML-pagina's dezelfde stijl delen.","parts":[{"m":"tag in de <head> die een extern bestand koppelt","t":"<link>"},{"m":"het gekoppelde bestand is een stylesheet met CSS-regels","t":"rel=\"stylesheet\""},{"m":"het bestand bevat CSS-code","t":"type=\"text/css\""},{"m":"pad of URL naar het CSS-bestand (hier in dezelfde map)","t":"href=\"style.css\""}],"examples":[{"command":"<link rel=\"stylesheet\" type=\"text/css\" href=\"style.css\">","note":"Twee Barbie-pagina's linken naar style.css met body {background: pink;} en h1 {color: hotpink;}, zodat beide dezelfde stijl krijgen.","output":"","slide":10,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":10,"createdAt":1790250000472,"id":"les_0473"},{"command":"display: inline-block;","tab":"css","group":"Layout & positie","title":"Blok- of inline-gedrag wijzigen","explanation":"display verandert hoe een element zich gedraagt: als blokelement (eigen regel, breedte/hoogte instelbaar) of als inline-element (op dezelfde regel). inline-block zet elementen naast elkaar maar laat breedte en hoogte toe.","parts":[{"m":"weergavetype","t":"display"},{"m":"gedraagt zich als blokelement","t":"block"},{"m":"gedraagt zich als inline-element","t":"inline"},{"m":"inline, maar met instelbare breedte en hoogte","t":"inline-block"},{"m":"onzichtbaar en neemt geen plaats in","t":"none"}],"examples":[{"command":"display: inline-block;","note":"De vier div's van de graansilo staan na display: inline-block naast elkaar in plaats van onder elkaar.","output":"","slide":72,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":72,"createdAt":1790250000523,"id":"les_0524"},{"command":"visibility: hidden;","tab":"css","group":"Layout & positie","title":"Element verbergen, plaats houden","explanation":"visibility: hidden maakt een element onzichtbaar, maar het blijft zijn plaats innemen in de layout. visible (standaard) toont het. Bij display: none verdwijnt de plaats wel.","parts":[{"m":"zichtbaarheid","t":"visibility"},{"m":"zichtbaar (standaard)","t":"visible"},{"m":"onzichtbaar, maar de ruimte blijft","t":"hidden"}],"examples":[{"command":"visibility: hidden;","note":".Mathias {visibility: hidden;} verbergt Mathias' info zonder dat de rest van de pagina verschuift.","output":"","slide":73,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":73,"createdAt":1790250000524,"id":"les_0525"},{"command":"top / bottom / left / right","tab":"css","group":"Layout & positie","title":"Afstanden voor positionering","explanation":"Deze eigenschappen geven de plaats van een element aan met een afstand (px, %, em …). Wat ze precies doen hangt af van de position-waarde; bij position: static (standaard) hebben ze geen effect.","parts":[{"m":"afstand vanaf de bovenkant","t":"top"},{"m":"afstand vanaf de onderkant","t":"bottom"},{"m":"afstand vanaf de linkerkant","t":"left"},{"m":"afstand vanaf de rechterkant","t":"right"}],"sourceName":"3. Introduction to CSS.pptx","slide":74,"createdAt":1790250000525,"id":"les_0526"},{"command":"position: relative; top: 50px;","tab":"css","group":"Layout & positie","title":"Verschuiven t.o.v. normale plaats","explanation":"Met position: relative verschuif je een element ten opzichte van zijn normale plaats. top: 50px schuift het 50 pixels naar beneden. De oorspronkelijke ruimte blijft behouden en andere elementen bewegen niet mee.","parts":[{"m":"relatief t.o.v. de normale plaats","t":"position: relative"},{"m":"50 pixels naar beneden (bottom = omhoog, left = naar rechts, right = naar links)","t":"top: 50px"}],"examples":[{"command":"position: relative; top: 50px;","note":"a:active {position: relative; top: 50px;} laat de knop wegspringen zodra je erop klikt.","output":"","slide":76,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":76,"createdAt":1790250000526,"id":"les_0527"},{"command":"position: fixed;","tab":"css","group":"Layout & positie","title":"Vast op het scherm plaatsen","explanation":"Met position: fixed staat een element vast ten opzichte van het browservenster en blijft het op dezelfde plek, ook bij scrollen. top, bottom, left en right geven de afstand tot de randen van het venster. De oorspronkelijke ruimte blijft niet behouden.","parts":[{"m":"vast t.o.v. het browservenster","t":"position: fixed"},{"m":"10 pixels van de rechterrand","t":"right: 10px"},{"m":"10 pixels van de onderrand","t":"bottom: 10px"}],"examples":[{"command":"position: fixed;","note":"img {position: fixed; right: 10px; bottom: 10px;} houdt het Howest-logo altijd rechtsonder in beeld.","output":"","slide":78,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":78,"createdAt":1790250000527,"id":"les_0528"},{"command":"position: absolute;","tab":"css","group":"Layout & positie","title":"Plaatsen binnen gepositioneerde voorouder","explanation":"Met position: absolute plaats je een element ten opzichte van de dichtstbijzijnde voorouder die zelf een position heeft (niet static). Daarom geef je de container vaak position: relative. De oorspronkelijke ruimte blijft niet behouden.","parts":[{"m":"t.o.v. de dichtstbijzijnde gepositioneerde voorouder","t":"position: absolute"},{"m":"afstand tot de randen van die voorouder","t":"top / bottom / left / right"},{"m":"maakt de ouder het referentiepunt","t":"position: relative (op de ouder)"}],"examples":[{"command":"position: absolute;","note":"In het Pong-spel staan de witte batjes en de bal op vaste afstanden van de randen van de zwarte container.","output":"","slide":80,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":80,"createdAt":1790250000528,"id":"les_0529"},{"command":"overflow: auto;","tab":"css","group":"Layout & positie","title":"Wat met te veel inhoud","explanation":"overflow bepaalt wat er gebeurt als de inhoud groter is dan het element.","parts":[{"m":"gedrag bij te veel inhoud","t":"overflow"},{"m":"standaard: inhoud steekt buiten het vak uit","t":"visible"},{"m":"wat te veel is wordt afgeknipt en is onzichtbaar","t":"hidden"},{"m":"afgeknipt, altijd een schuifbalk","t":"scroll"},{"m":"schuifbalk enkel als de inhoud niet past","t":"auto"}],"sourceName":"3. Introduction to CSS.pptx","slide":81,"createdAt":1790250000529,"id":"les_0530"},{"command":"float: right;","tab":"css","group":"Layout & positie","title":"Element links of rechts laten zweven","explanation":"float haalt een element uit de normale volgorde en zet het links of rechts in zijn ouder-element. Tekst en andere elementen lopen er dan omheen.","parts":[{"m":"laat een element zweven","t":"float"},{"m":"naar rechts (of left: naar links)","t":"right"}],"examples":[{"command":"float: right;","note":"img {float: right;} zet de afbeelding van Blackbeard rechts naast de tekst in plaats van erboven.","output":"","slide":82,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":82,"createdAt":1790250000530,"id":"les_0531"},{"command":"list-style-type: none;","tab":"css","group":"Overige eigenschappen","title":"Opsommingsteken van lijst kiezen","explanation":"list-style-type bepaalt hoe de tekens voor lijstitems eruitzien. Voor een ongeordende lijst (<ul>): disc (standaard, gevuld bolletje), circle (leeg bolletje), square (vierkantje) of none (geen teken).","parts":[{"m":"soort lijstteken","t":"list-style-type"},{"m":"gevuld bolletje (standaard)","t":"disc"},{"m":"leeg bolletje","t":"circle"},{"m":"gevuld vierkantje","t":"square"},{"m":"geen teken","t":"none"}],"examples":[{"command":"list-style-type: none;","note":"li {list-style-type: none;} haalt de bolletjes weg bij de lijst over de gevaren van kogels.","output":"","slide":67,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":67,"createdAt":1790250000519,"id":"les_0520"},{"command":"list-style-type: upper-roman;","tab":"css","group":"Overige eigenschappen","title":"Nummering van geordende lijst","explanation":"Voor een geordende lijst (<ol>) kies je met list-style-type hoe er genummerd wordt: cijfers, letters of Romeinse cijfers.","parts":[{"m":"cijfers 1, 2, 3 (standaard)","t":"decimal"},{"m":"a, b, c / A, B, C","t":"lower-alpha / upper-alpha"},{"m":"i, ii, iii / I, II, III","t":"lower-roman / upper-roman"}],"examples":[{"command":"list-style-type: upper-roman;","note":"De Romeinse keizers Augustus, Tiberius en Caligula krijgen de nummers I, II en III.","output":"","slide":68,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":68,"createdAt":1790250000520,"id":"les_0521"},{"command":"border-collapse: collapse;","tab":"css","group":"Overige eigenschappen","title":"Tabelranden samenvoegen","explanation":"Geef je een tabel en haar cellen een rand, dan krijg je dubbele lijnen met kleine tussenruimtes. Met border-collapse: collapse worden aangrenzende randen één lijn; separate houdt ze apart. Zet dit op het <table>-element.","parts":[{"m":"hoe tabelranden samenkomen","t":"border-collapse"},{"m":"randen samenvoegen tot één lijn","t":"collapse"},{"m":"randen apart met ruimte ertussen","t":"separate"},{"m":"in het voorbeeld: de tabel en alle elementen erin (* = elk element)","t":"table, table *"}],"examples":[{"command":"border-collapse: collapse;","note":"table, table * {border: solid black 1px; border-collapse: collapse;} geeft het boter-kaas-en-eieren-rooster nette enkele lijnen.","output":"","slide":70,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":70,"createdAt":1790250000521,"id":"les_0522"},{"command":"p {color: red;}","tab":"css","group":"Selectors","title":"Alle elementen van één soort opmaken","explanation":"Een CSS-regel met de naam van een tag als selector geldt voor alle elementen van die soort. Hier worden alle paragrafen rood.","parts":[{"m":"selector: alle <p>-elementen","t":"p"},{"m":"begin en einde van de stijlregels","t":"{ }"},{"m":"eigenschap: tekstkleur rood","t":"color: red;"}],"sourceName":"2. Introduction to HTML.pptx","slide":14,"createdAt":1790250000422,"id":"les_0423"},{"command":".klasse {…}","tab":"css","group":"Selectors","title":"Elementen met een klasse opmaken","explanation":"Een punt voor een naam selecteert alle elementen met die klasse. Zo krijgt .vader {color: red;} alle elementen met class=\"vader\" rode tekst.","parts":[{"m":"selecteer op klasse","t":"."},{"m":"naam van de klasse","t":"vader"},{"m":"de stijl die wordt toegepast","t":"{color: red;}"}],"sourceName":"2. Introduction to HTML.pptx","slide":54,"createdAt":1790250000459,"id":"les_0460"},{"command":"#id {…}","tab":"css","group":"Selectors","title":"Element met een id opmaken","explanation":"Een hekje (#) voor een naam selecteert het element met dat id. Zo krijgt #kenobi {color: blue;} het element met id=\"kenobi\" blauwe tekst.","parts":[{"m":"selecteer op id","t":"#"},{"m":"het id van het element","t":"kenobi"},{"m":"de stijl die wordt toegepast","t":"{color: blue;}"}],"sourceName":"2. Introduction to HTML.pptx","slide":56,"createdAt":1790250000462,"id":"les_0463"},{"command":"div {background: red;}","tab":"css","group":"Selectors","title":"Elementselector: alle elementen van type","explanation":"Een elementselector is gewoon de tagnaam. De stijl geldt voor alle elementen van dat type op de pagina.","parts":[{"m":"tagnaam: selecteert alle <div>-elementen","t":"div"},{"m":"achtergrond rood","t":"background: red"}],"examples":[{"command":"div {background: red;}","note":"De drie <div>-elementen krijgen een rode achtergrond, het <p>-element niet.","output":"","slide":14,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":14,"createdAt":1790250000474,"id":"les_0475"},{"command":"#Nemo {background: orange;}","tab":"css","group":"Selectors","title":"ID-selector: één element","explanation":"Met # gevolgd door de naam van een id selecteer je het ene element met dat id-attribuut. Een id is uniek op de pagina.","parts":[{"m":"betekent: selecteer op id","t":"#"},{"m":"de waarde van het id-attribuut (id=\"Nemo\")","t":"Nemo"}],"examples":[{"command":"#Nemo {background: orange;}","note":"Alleen <div id=\"Nemo\">Just keep swimming.<\/div> krijgt een oranje achtergrond.","output":"","slide":15,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":15,"createdAt":1790250000475,"id":"les_0476"},{"command":".TopGun {background: green;}","tab":"css","group":"Selectors","title":"Klasseselector: elementen met klasse","explanation":"Met een punt gevolgd door de klassenaam selecteer je alle elementen met dat class-attribuut, ook als het verschillende tags zijn.","parts":[{"m":"betekent: selecteer op klasse","t":"."},{"m":"de waarde van het class-attribuut (class=\"TopGun\")","t":"TopGun"}],"examples":[{"command":".TopGun {background: green;}","note":"Zowel de <div> als de <p> met class=\"TopGun\" krijgen een groene achtergrond.","output":"","slide":16,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":16,"createdAt":1790250000476,"id":"les_0477"},{"command":"h1, h4 {background: red;}","tab":"css","group":"Selectors","title":"Selectors groeperen met komma","explanation":"Scheid je selectors met een komma, dan geldt de stijl voor alle elementen die aan minstens één van de selectors voldoen. Zo hoef je dezelfde regel niet twee keer te schrijven.","parts":[{"m":"eerste selector","t":"h1"},{"m":"of: ook de volgende selector","t":","},{"m":"tweede selector","t":"h4"}],"examples":[{"command":"h1, h4 {background: red;}","note":"De <h1> en de <h4> krijgen een rode achtergrond, <h2> en <h3> niet.","output":"","slide":17,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":17,"createdAt":1790250000477,"id":"les_0478"},{"command":"p.BB.JP {background: orange;}","tab":"css","group":"Selectors","title":"Samengestelde selector (zonder spaties)","explanation":"Plak je selectors aan elkaar zonder spatie, dan moet een element aan alle delen tegelijk voldoen. p.BB kiest <p>-elementen met klasse BB; p.BB.JP kiest <p>-elementen die zowel klasse BB als JP hebben.","parts":[{"m":"het element moet een <p> zijn","t":"p"},{"m":"én klasse BB hebben","t":".BB"},{"m":"én klasse JP hebben","t":".JP"},{"m":"alle voorwaarden gelden voor hetzelfde element","t":"(geen spatie)"}],"examples":[{"command":"p.BB.JP {background: orange;}","note":"p.BB kleurt de twee <p>'s met klasse BB; p.BB.JP kleurt enkel 'Yeah, science!'.","output":"","slide":19,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":19,"createdAt":1790250000478,"id":"les_0479"},{"command":"div h3 {background: red;}","tab":"css","group":"Selectors","title":"Afstammelingenselector (spatie)","explanation":"Een spatie tussen selectors betekent: het rechtse element moet ergens binnen het linkse element zitten (kind, kleinkind of dieper). Je kunt er meer aan elkaar rijgen, bv. div blockquote h3.","parts":[{"m":"voorouder-element","t":"div"},{"m":"ergens binnenin, op elke diepte","t":"(spatie)"},{"m":"het element dat de stijl krijgt","t":"h3"}],"examples":[{"command":"div h3 {background: red;}","note":"Alle <h3>'s binnen de div (Marieke en Mathias) worden rood, de <h3> Bart buiten de div niet.","output":"","slide":22,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":22,"createdAt":1790250000479,"id":"les_0480"},{"command":"div > h3 {background: red;}","tab":"css","group":"Selectors","title":"Kindselector: enkel directe kinderen","explanation":"Met > selecteer je alleen elementen die een direct kind zijn van het linkse element, zonder ander element ertussen.","parts":[{"m":"ouder-element","t":"div"},{"m":"direct kind, niet dieper","t":">"},{"m":"het element dat de stijl krijgt","t":"h3"}],"examples":[{"command":"div > h3 {background: red;}","note":"Alleen Marieke (h3 direct in de div) wordt rood; Mathias zit in een blockquote en telt niet mee.","output":"","slide":24,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":24,"createdAt":1790250000480,"id":"les_0481"},{"command":"#Cedric ~ h3 {background: purple;}","tab":"css","group":"Selectors","title":"Siblingselector: latere broers/zussen","explanation":"Met ~ selecteer je elementen met dezelfde ouder die ergens ná het linkse element komen, niet noodzakelijk er direct na.","parts":[{"m":"het startelement","t":"#Cedric"},{"m":"een latere sibling (zelfde ouder), niet per se direct erna","t":"~"},{"m":"het element dat de stijl krijgt","t":"h3"}],"examples":[{"command":"#Cedric ~ h3 {background: purple;}","note":"Mathias en Anneleen (h3 na Cedric in dezelfde div) worden paars; Bart heeft een andere ouder.","output":"","slide":26,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":26,"createdAt":1790250000482,"id":"les_0483"},{"command":"#Cedric + h3 {background: green;}","tab":"css","group":"Selectors","title":"Directe siblingselector (+)","explanation":"Met + selecteer je enkel het element dat onmiddellijk ná het linkse element komt en dezelfde ouder heeft.","parts":[{"m":"het startelement","t":"#Cedric"},{"m":"de sibling die er direct na komt","t":"+"},{"m":"moet een <h3> zijn","t":"h3"}],"examples":[{"command":"#Cedric + h3 {background: green;}","note":"Alleen Mathias, de <h3> direct na Cedric, wordt groen. Met div + h3 worden Mathias en Bart rood.","output":"","slide":28,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":28,"createdAt":1790250000483,"id":"les_0484"},{"command":"#Jasper :first-child {background: purple;}","tab":"css","group":"Selectors","title":"Eerste kind binnen een ouder","explanation":":first-child selecteert een element dat het eerste is van zijn siblings. Met de ouder-selector, een spatie en dan :first-child kies je het eerste kind binnen die ouder.","parts":[{"m":"de ouder","t":"#Jasper"},{"m":"binnen die ouder","t":"(spatie)"},{"m":"pseudo-klasse: het eerste kind","t":":first-child"}],"examples":[{"command":"#Jasper :first-child {background: purple;}","note":"Cedric, het eerste kind van Jasper, wordt paars.","output":"","slide":32,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":32,"createdAt":1790250000485,"id":"les_0486"},{"command":"h3:first-child {background: orange;}","tab":"css","group":"Selectors","title":"Elk h3 dat eerste kind is","explanation":"Zet je :first-child zonder spatie achter een element- of klasseselector, dan kies je elk element van dat type dat het eerste is tussen zijn siblings.","parts":[{"m":"het type element","t":"h3"},{"m":"én het is het eerste kind van zijn ouder","t":":first-child"},{"m":"beide voorwaarden voor hetzelfde element","t":"(geen spatie)"}],"examples":[{"command":"h3:first-child {background: orange;}","note":"Alleen Marieke wordt oranje: zij is een <h3> en het eerste kind van Bart. Mathias is een <h3> maar niet het eerste kind.","output":"","slide":33,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":33,"createdAt":1790250000486,"id":"les_0487"},{"command":"#Bart :last-child {background: red;}","tab":"css","group":"Selectors","title":"Laatste kind selecteren","explanation":":last-child selecteert het laatste element tussen zijn siblings. Met een spatie (#Bart :last-child) kies je het laatste kind van Bart; zonder spatie (h3:last-child) kies je elke <h3> die het laatste kind is.","parts":[{"m":"de ouder","t":"#Bart"},{"m":"binnen die ouder","t":"(spatie)"},{"m":"pseudo-klasse: het laatste kind","t":":last-child"}],"examples":[{"command":"#Bart :last-child {background: red;}","note":"#Bart :last-child kleurt Anneleen; h3:last-child kleurt Mathias.","output":"","slide":34,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":34,"createdAt":1790250000487,"id":"les_0488"},{"command":"#Jasper :nth-child(3) {background: purple;}","tab":"css","group":"Selectors","title":"Het n-de kind selecteren","explanation":":nth-child(n) selecteert het element op positie n tussen zijn siblings (tellen begint bij 1). n kan een getal of een formule zijn.","parts":[{"m":"de ouder","t":"#Jasper"},{"m":"het derde kind","t":":nth-child(3)"}],"examples":[{"command":"#Jasper :nth-child(3) {background: purple;}","note":"Marieke, het derde kind van Jasper, wordt paars.","output":"","slide":36,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":36,"createdAt":1790250000488,"id":"les_0489"},{"command":"#Jasper :nth-child(2n) {background: green;}","tab":"css","group":"Selectors","title":"Kinderen op even posities","explanation":"Met de formule 2n selecteer je alle kinderen op een even positie (2, 4, 6 …).","parts":[{"m":"de ouder","t":"#Jasper"},{"m":"kinderen op positie 2, 4, 6 …","t":":nth-child(2n)"}],"examples":[{"command":"#Jasper :nth-child(2n) {background: green;}","note":"Mathias (2de) en Anneleen (4de) worden groen.","output":"","slide":37,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":37,"createdAt":1790250000489,"id":"les_0490"},{"command":"#Jasper :nth-child(2n+1) {background: red;}","tab":"css","group":"Selectors","title":"Kinderen op oneven posities","explanation":"Met de formule 2n+1 selecteer je alle kinderen op een oneven positie (1, 3, 5 …).","parts":[{"m":"de ouder","t":"#Jasper"},{"m":"kinderen op positie 1, 3, 5 …","t":":nth-child(2n+1)"}],"examples":[{"command":"#Jasper :nth-child(2n+1) {background: red;}","note":"Cedric (1ste), Marieke (3de) en Bart (5de) worden rood.","output":"","slide":38,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":38,"createdAt":1790250000490,"id":"les_0491"},{"command":"#Jasper h3:first-of-type {background: red;}","tab":"css","group":"Selectors","title":"Eerste element van een type","explanation":":first-of-type selecteert het eerste element van een bepaald type tussen zijn siblings, ook als er andere elementen vóór staan. Tussen h3 en :first-of-type staat geen spatie.","parts":[{"m":"de ouder","t":"#Jasper"},{"m":"het type element","t":"h3"},{"m":"het eerste van dat type","t":":first-of-type"}],"examples":[{"command":"#Jasper h3:first-of-type {background: red;}","note":"Mathias, de eerste <h3> binnen Jasper, wordt rood (ook al is Cedric het eerste kind).","output":"","slide":39,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":39,"createdAt":1790250000491,"id":"les_0492"},{"command":"#Jasper h3:last-of-type {background: red;}","tab":"css","group":"Selectors","title":"Laatste element van een type","explanation":":last-of-type selecteert het laatste element van een bepaald type tussen zijn siblings, ook als er nog andere elementen na komen.","parts":[{"m":"de ouder","t":"#Jasper"},{"m":"het type element","t":"h3"},{"m":"het laatste van dat type","t":":last-of-type"}],"examples":[{"command":"#Jasper h3:last-of-type {background: red;}","note":"Anneleen, de laatste <h3> binnen Jasper, wordt rood (ook al volgt er nog een <h5>).","output":"","slide":40,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":40,"createdAt":1790250000492,"id":"les_0493"},{"command":"#Paco:hover {background: orange;}","tab":"css","group":"Selectors","title":"Stijl bij muis erover","explanation":":hover past de stijl toe zolang de gebruiker met de muiscursor over het element beweegt.","parts":[{"m":"het element","t":"#Paco"},{"m":"pseudo-klasse: toestand 'muis erover'","t":":hover"}],"examples":[{"command":"#Paco:hover {background: orange;}","note":"De div Paco wordt oranje zolang de muis erover staat.","output":"","slide":41,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":41,"createdAt":1790250000493,"id":"les_0494"},{"command":"#Paco:active {background: purple;}","tab":"css","group":"Selectors","title":"Stijl tijdens het klikken","explanation":":active past de stijl toe op het moment dat de gebruiker op het element klikt (de muisknop ingedrukt houdt).","parts":[{"m":"het element","t":"#Paco"},{"m":"pseudo-klasse: toestand 'wordt aangeklikt'","t":":active"}],"examples":[{"command":"#Paco:active {background: purple;}","note":"De div Paco wordt paars terwijl je erop klikt.","output":"","slide":42,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":42,"createdAt":1790250000494,"id":"les_0495"},{"command":"a:link / a:visited","tab":"css","group":"Selectors","title":"Onbezochte en bezochte links","explanation":":link geeft een stijl aan links die nog niet bezocht zijn, :visited aan links die je al bezocht hebt. Voorbeeld: a:link {background: white;} en a:visited {background: red;}.","parts":[{"m":"link-element (anchor)","t":"a"},{"m":"link die nog niet bezocht is","t":":link"},{"m":"link die al bezocht is","t":":visited"}],"sourceName":"3. Introduction to CSS.pptx","slide":43,"createdAt":1790250000495,"id":"les_0496"},{"command":"color","tab":"css","group":"Tekst & lettertype","title":"Tekstkleur instellen","explanation":"Stelt de kleur van de tekst in, bv. color: red; of color: blue;.","parts":[{"m":"eigenschap tekstkleur","t":"color:"},{"m":"waarde: de kleur","t":"red"}],"sourceName":"2. Introduction to HTML.pptx","slide":54,"createdAt":1790250000460,"id":"les_0461"},{"command":"font-family","tab":"css","group":"Tekst & lettertype","title":"Lettertype kiezen","explanation":"Stelt het lettertype van de tekst in. Een naam met spaties zet je tussen aanhalingstekens, bv. font-family: 'Comic Sans MS';.","parts":[{"m":"eigenschap lettertype","t":"font-family:"},{"m":"naam van het lettertype","t":"'Comic Sans MS'"}],"sourceName":"2. Introduction to HTML.pptx","slide":58,"createdAt":1790250000465,"id":"les_0466"},{"command":"font-size: 1.2em;","tab":"css","group":"Tekst & lettertype","title":"Lettergrootte instellen","explanation":"font-size bepaalt hoe groot de tekst in een element is.","parts":[{"m":"lettergrootte","t":"font-size"},{"m":"vaste grootte in pixels","t":"px"},{"m":"percentage t.o.v. het ouder-element","t":"%"},{"m":"relatief (1em = huidige lettergrootte, 1.2em = 20% groter)","t":"em"},{"m":"vooraf bepaalde groottes","t":"small / medium / large"}],"sourceName":"3. Introduction to CSS.pptx","slide":58,"createdAt":1790250000510,"id":"les_0511"},{"command":"font-weight: bold;","tab":"css","group":"Tekst & lettertype","title":"Letterdikte (vet) instellen","explanation":"font-weight bepaalt hoe dik of vet de tekst is.","parts":[{"m":"letterdikte","t":"font-weight"},{"m":"getal in stappen van 100: 100 = dunst, 900 = dikst","t":"100 – 900"},{"m":"gelijk aan 400","t":"normal"},{"m":"vet, gelijk aan 700","t":"bold"}],"sourceName":"3. Introduction to CSS.pptx","slide":59,"createdAt":1790250000511,"id":"les_0512"},{"command":"font-style: italic;","tab":"css","group":"Tekst & lettertype","title":"Schuine tekst instellen","explanation":"font-style bepaalt of tekst rechtop of schuin staat.","parts":[{"m":"stijl van de letters","t":"font-style"},{"m":"gewone, rechte tekst","t":"normal"},{"m":"schuine tekst (cursief)","t":"italic"},{"m":"schuin, maar minder uitgesproken; ziet er vaak hetzelfde uit als italic","t":"oblique"}],"sourceName":"3. Introduction to CSS.pptx","slide":60,"createdAt":1790250000512,"id":"les_0513"},{"command":"font-family: 'Atkinson Hyperlegible', sans-serif;","tab":"css","group":"Tekst & lettertype","title":"Lettertype kiezen met reserve","explanation":"font-family kiest het lettertype. Je geeft een lijst gescheiden door komma's: lukt het eerste niet, dan gebruikt de browser het volgende. Een naam van meerdere woorden zet je tussen aanhalingstekens.","parts":[{"m":"lettertype(s)","t":"font-family"},{"m":"gewenst lettertype (tussen aanhalingstekens want meerdere woorden)","t":"'Atkinson Hyperlegible'"},{"m":"scheidt de keuzes; volgende = reserve","t":","},{"m":"algemene soort: letters zonder schreefjes (bv. Arial); andere: serif (bv. Times New Roman), monospace (bv. Monaco)","t":"sans-serif"}],"examples":[{"command":"font-family: 'Atkinson Hyperlegible', sans-serif;","note":"body {font-family: 'Atkinson Hyperlegible', sans-serif;} toont de hele pagina in dat lettertype, of anders in een gewone sans-serif.","output":"","slide":62,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":62,"createdAt":1790250000513,"id":"les_0514"},{"command":"font-variant: small-caps;","tab":"css","group":"Tekst & lettertype","title":"Tekst in kleine hoofdletters","explanation":"font-variant voegt een stijleffect toe aan tekst. Met small-caps worden kleine letters getoond als kleinere hoofdletters; normal is de gewone weergave.","parts":[{"m":"stijlvariant van de tekst","t":"font-variant"},{"m":"standaard, geen effect","t":"normal"},{"m":"kleine letters als kleine hoofdletters","t":"small-caps"}],"sourceName":"3. Introduction to CSS.pptx","slide":63,"createdAt":1790250000514,"id":"les_0515"},{"command":"letter-spacing: 40px;","tab":"css","group":"Tekst & lettertype","title":"Ruimte tussen letters","explanation":"letter-spacing regelt de afstand tussen de letters. Je kunt px, em, % en andere eenheden gebruiken.","parts":[{"m":"afstand tussen letters","t":"letter-spacing"},{"m":"extra ruimte van 40 pixels","t":"40px"}],"examples":[{"command":"letter-spacing: 40px;","note":"h2, h3 {letter-spacing: 40px;} zet de letters van de Snellen-kaart ver uit elkaar.","output":"","slide":64,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":64,"createdAt":1790250000515,"id":"les_0516"},{"command":"word-spacing: …","tab":"css","group":"Tekst & lettertype","title":"Ruimte tussen woorden","explanation":"word-spacing regelt de afstand tussen woorden, net zoals letter-spacing dat doet tussen letters. Je kunt px, em, % en andere eenheden gebruiken.","parts":[{"m":"afstand tussen woorden","t":"word-spacing"},{"m":"een afstand, bv. 10px of 1em","t":"…"}],"sourceName":"3. Introduction to CSS.pptx","slide":64,"createdAt":1790250000516,"id":"les_0517"},{"command":"text-align: center;","tab":"css","group":"Tekst & lettertype","title":"Tekst horizontaal uitlijnen","explanation":"text-align bepaalt hoe tekst horizontaal uitgelijnd wordt binnen een element: links, rechts, gecentreerd of uitgevuld over de hele breedte.","parts":[{"m":"horizontale uitlijning","t":"text-align"},{"m":"links / rechts uitlijnen","t":"left / right"},{"m":"centreren","t":"center"},{"m":"uitvullen over de volledige breedte","t":"justify"}],"examples":[{"command":"text-align: center;","note":"h1, h2, h3 {text-align: center;} centreert de regels van de Snellen-kaart.","output":"","slide":65,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":65,"createdAt":1790250000517,"id":"les_0518"},{"command":"text-decoration: line-through;","tab":"css","group":"Tekst & lettertype","title":"Lijn onder, boven of door tekst","explanation":"text-decoration voegt een lijn toe aan tekst of haalt die weg (bv. de standaard onderstreping van links).","parts":[{"m":"decoratielijn bij tekst","t":"text-decoration"},{"m":"lijn onder de tekst","t":"underline"},{"m":"lijn boven de tekst","t":"overline"},{"m":"lijn door de tekst (doorstreept)","t":"line-through"},{"m":"geen lijn","t":"none"}],"examples":[{"command":"text-decoration: line-through;","note":"div {text-decoration: line-through;} streept 'CSS is not fun!' door.","output":"","slide":66,"source":"les","sourceName":"3. Introduction to CSS.pptx"}],"sourceName":"3. Introduction to CSS.pptx","slide":66,"createdAt":1790250000518,"id":"les_0519"},{"command":"<img src=\"\" alt=\"\">","tab":"html","group":"Attributen","title":"Alternatieve tekst bij afbeelding","explanation":"Het alt-attribuut geeft tekst die getoond wordt als de afbeelding niet laadt, bv. door een typfout in het pad.","parts":[{"m":"locatie van de afbeelding","t":"src=\"\""},{"m":"vervangtekst als de afbeelding niet laadt","t":"alt=\"Image of Luigi\""}],"sourceName":"2. Introduction to HTML.pptx","slide":38,"createdAt":1790250000446,"id":"les_0447"},{"command":"<img src=\"\" width=\"500px\">","tab":"html","group":"Attributen","title":"Breedte of hoogte van afbeelding","explanation":"Met width en height stel je de afmetingen van een afbeelding in (in pixels). Geef je enkel de breedte of enkel de hoogte, dan past de andere zich aan zodat de afbeelding niet vervormt.","parts":[{"m":"breedte van 500 pixels (width=\"500\" is de officiële schrijfwijze)","t":"width=\"500px\""},{"m":"hoogte in pixels","t":"height=\"\""}],"sourceName":"2. Introduction to HTML.pptx","slide":39,"createdAt":1790250000447,"id":"les_0448"},{"command":"class=\"\"","tab":"html","group":"Attributen","title":"Klasse (label) aan element geven","explanation":"Geeft een element een label (klasse) zodat je het kan aanspreken, bv. met CSS. Meerdere elementen mogen dezelfde klasse hebben en één element kan meerdere klassen hebben, gescheiden door spaties.","parts":[{"m":"één klasse","t":"class=\"nucleotides\""},{"m":"twee klassen, gescheiden door een spatie","t":"class=\"nucleotides RNA\""}],"sourceName":"2. Introduction to HTML.pptx","slide":53,"createdAt":1790250000458,"id":"les_0459"},{"command":"id=\"\"","tab":"html","group":"Attributen","title":"Unieke naam aan element geven","explanation":"Geeft een element een unieke naam (id). Twee elementen mogen niet hetzelfde id hebben en elk element heeft maximaal één id.","parts":[{"m":"unieke naam van dit element","t":"id=\"protein\""}],"sourceName":"2. Introduction to HTML.pptx","slide":55,"createdAt":1790250000461,"id":"les_0462"},{"command":"style=\"\"","tab":"html","group":"Attributen","title":"CSS op één element","explanation":"Met het style-attribuut geef je CSS-opmaak aan één enkel element (inline stijl).","parts":[{"m":"CSS-code voor enkel dit element","t":"style=\"font-family: 'Comic Sans MS';\""}],"sourceName":"2. Introduction to HTML.pptx","slide":58,"createdAt":1790250000464,"id":"les_0465"},{"command":"title=\"\"","tab":"html","group":"Attributen","title":"Tooltip bij element","explanation":"Geeft extra informatie die als tooltip verschijnt wanneer je met de muis over het element gaat. Niet verwarren met de <title>-tag, die de titel in het browsertabblad zet.","parts":[{"m":"tekst van de tooltip","t":"title=\"…\""}],"examples":[{"command":"title=\"\"","note":"<div title=\"A gummy bear!\">What do you call a bear with no teeth?<\/div> toont de clou pas als je over de vraag zweeft.","output":"","slide":59,"source":"les","sourceName":"2. Introduction to HTML.pptx"}],"sourceName":"2. Introduction to HTML.pptx","slide":59,"createdAt":1790250000466,"id":"les_0467"},{"command":"placeholder=\"tekst\"","tab":"html","group":"Attributen","title":"Hulptekst in leeg invoerveld","explanation":"Toont een lichtgrijze hint in een leeg invoerveld (bv. 'Provide your name'). De hint verdwijnt als je begint te typen en wordt niet verstuurd.","parts":[{"m":"attribuut met de hulptekst","t":"placeholder"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":11,"createdAt":1790250000620,"id":"les_0621"},{"command":"checked","tab":"html","group":"Attributen","title":"Standaard aangevinkt bij laden","explanation":"Checkboxes en radioknoppen zijn standaard niet aangevinkt. Zet checked in de tag om ze vooraf aan te vinken: bij checkboxes mag dat bij meerdere, bij radioknoppen bij één knop per groep.","parts":[{"m":"attribuut zonder waarde: vooraf geselecteerd","t":"checked"}],"examples":[{"command":"checked","note":"<input type=\"checkbox\" name=\"BIT01\" checked> BIT01","output":"","slide":31,"source":"les","sourceName":"5. Dynamic Web Pages.pptx"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":31,"createdAt":1790250000638,"id":"les_0639"},{"command":"<fieldset><\/fieldset>","tab":"html","group":"Formulieren","title":"Kader met zichtbare rand","explanation":"Maakt een container met een zichtbare rand rond de inhoud.","parts":[{"m":"openingstag","t":"<fieldset>"},{"m":"sluitingstag","t":"<\/fieldset>"}],"sourceName":"2. Introduction to HTML.pptx","slide":41,"createdAt":1790250000449,"id":"les_0450"},{"command":"<legend><\/legend>","tab":"html","group":"Formulieren","title":"Titel op rand van fieldset","explanation":"Zet een titel bovenaan op de rand van een <fieldset>. Werkt enkel binnen een fieldset-tag.","parts":[{"m":"openingstag, binnen <fieldset>","t":"<legend>"},{"m":"sluitingstag","t":"<\/legend>"}],"examples":[{"command":"<legend><\/legend>","note":"<fieldset><legend>Lasagna from the Aldi<\/legend> … <\/fieldset> toont het recept in een kader met de naam van het gerecht bovenaan.","output":"","slide":41,"source":"les","sourceName":"2. Introduction to HTML.pptx"}],"sourceName":"2. Introduction to HTML.pptx","slide":41,"createdAt":1790250000450,"id":"les_0451"},{"command":"<form action=\"#\" method=\"POST\"><\/form>","tab":"html","group":"Formulieren","title":"Formulier voor invoervelden","explanation":"Een formulier bevat de invoervelden en bepaalt waar en hoe de gegevens na verzenden naartoe gaan. Alle invoervelden (<input>, <select>, <textarea>) moeten erin staan.","parts":[{"m":"waar de data naartoe gaat: # of de eigen bestandsnaam = dezelfde pagina, anders een ander bestand","t":"action"},{"m":"hoe de data verstuurd wordt: GET (in de URL) of POST (verborgen in het verzoek)","t":"method"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":13,"createdAt":1790250000622,"id":"les_0623"},{"command":"<input type=\"\" name=\"\" value=\"\">","tab":"html","group":"Formulieren","title":"Invoerveld maken","explanation":"De belangrijkste tag voor invoervelden. Via name haal je de ingevulde waarde later op in PHP.","parts":[{"m":"soort veld: text, number, password, email, hidden, checkbox, radio, submit, file …","t":"type"},{"m":"naam waarmee PHP de waarde terugvindt in $_POST/$_GET","t":"name"},{"m":"standaardwaarde (soms optioneel)","t":"value"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":19,"createdAt":1790250000627,"id":"les_0628"},{"command":"<input type=\"submit\" name=\"submit\" value=\"tekst\">","tab":"html","group":"Formulieren","title":"Verzendknop voor formulier","explanation":"Maakt een knop die het formulier naar de PHP-server stuurt. value bepaalt de tekst op de knop (en de waarde in $_POST/$_GET); zonder value staat er 'Submit Query'.","parts":[{"m":"verzendknop","t":"type=\"submit\""},{"m":"naam om te controleren of er op de knop is geklikt","t":"name"},{"m":"tekst op de knop (optioneel)","t":"value"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":20,"createdAt":1790250000629,"id":"les_0630"},{"command":"<input type=\"text\" name=\"\">","tab":"html","group":"Formulieren","title":"Invoerveld voor korte tekst","explanation":"Een veld waarin de gebruiker een korte tekst typt. Met value kun je een standaardtekst meegeven.","parts":[{"m":"tekstveld","t":"type=\"text\""},{"m":"naam voor PHP","t":"name"},{"m":"standaardtekst (optioneel)","t":"value"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":21,"createdAt":1790250000630,"id":"les_0631"},{"command":"<input type=\"number\" name=\"\">","tab":"html","group":"Formulieren","title":"Invoerveld voor getallen","explanation":"Een veld waarin alleen getallen ingevuld kunnen worden, bv. een leeftijd. Er bestaan ook min, max en step om het bereik te beperken (buiten de leerstof).","parts":[{"m":"getalveld","t":"type=\"number\""},{"m":"naam voor PHP","t":"name"},{"m":"standaardgetal (optioneel)","t":"value"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":23,"createdAt":1790250000633,"id":"les_0634"},{"command":"<input type=\"password\" name=\"\">","tab":"html","group":"Formulieren","title":"Verborgen invoer voor wachtwoorden","explanation":"De getypte tekens worden als bolletjes of sterretjes getoond. Gebruik voor gevoelige gegevens altijd method=\"POST\", anders staat de waarde leesbaar in de URL.","parts":[{"m":"invoer wordt verborgen","t":"type=\"password\""},{"m":"naam voor PHP","t":"name"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":25,"createdAt":1790250000634,"id":"les_0635"},{"command":"<input type=\"email\" name=\"\">","tab":"html","group":"Formulieren","title":"Invoerveld voor e-mailadres","explanation":"Een veld voor een e-mailadres. Bij een ongeldig adres toont de browser meestal een foutmelding en wordt het formulier niet verstuurd.","parts":[{"m":"e-mailveld met controle","t":"type=\"email\""},{"m":"naam voor PHP","t":"name"},{"m":"standaardadres (optioneel)","t":"value"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":27,"createdAt":1790250000635,"id":"les_0636"},{"command":"<input type=\"hidden\" name=\"\" value=\"\">","tab":"html","group":"Formulieren","title":"Onzichtbaar veld meesturen","explanation":"Een veld dat de gebruiker niet ziet, maar waarvan de value toch mee verstuurd wordt. Handig om extra informatie achter de schermen naar de PHP-server te sturen.","parts":[{"m":"onzichtbaar veld","t":"type=\"hidden\""},{"m":"de data die verstuurd wordt","t":"value"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":29,"createdAt":1790250000636,"id":"les_0637"},{"command":"<input type=\"checkbox\" name=\"\">","tab":"html","group":"Formulieren","title":"Aanvinkvakje","explanation":"Een vakje dat je aan- of uitvinkt; je kunt er meerdere tegelijk aanvinken. Aangevinkt: de naam komt in $_POST/$_GET met waarde 'on' (of de eigen value). Niet aangevinkt: de naam ontbreekt helemaal.","parts":[{"m":"aanvinkvakje","t":"type=\"checkbox\""},{"m":"naam voor PHP","t":"name"},{"m":"waarde als aangevinkt (standaard 'on')","t":"value"}],"examples":[{"command":"<input type=\"checkbox\" name=\"\">","note":"Van drie vakjes BIT01–BIT03 is alleen BIT02 aangevinkt.","output":"Array\n(\n    [BIT02] => on\n)","slide":30,"source":"les","sourceName":"5. Dynamic Web Pages.pptx"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":30,"createdAt":1790250000637,"id":"les_0638"},{"command":"<input type=\"radio\" name=\"groep\" value=\"\">","tab":"html","group":"Formulieren","title":"Keuzerondje: één uit groep","explanation":"Radioknoppen met dezelfde name vormen een groep waarin je maar één optie kunt kiezen; elke knop heeft een eigen value. In $_POST/$_GET staat de groepsnaam met de value van de gekozen knop; is niets gekozen, dan ontbreekt de naam.","parts":[{"m":"keuzerondje","t":"type=\"radio\""},{"m":"groepsnaam (zelfde voor alle knoppen in de groep)","t":"name"},{"m":"unieke waarde per knop","t":"value"}],"examples":[{"command":"<input type=\"radio\" name=\"groep\" value=\"\">","note":"","output":"Array\n(\n    [course] => BIT01\n)","slide":33,"source":"les","sourceName":"5. Dynamic Web Pages.pptx"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":33,"createdAt":1790250000639,"id":"les_0640"},{"command":"<textarea name=\"\"><\/textarea>","tab":"html","group":"Formulieren","title":"Invoerveld voor meerdere regels","explanation":"Een groot tekstveld waarin je over meerdere regels kunt typen. Na verzenden is de inhoud één string, met \\n op de plaats van de regeleinden. Tekst tussen de tags is de standaardinhoud.","parts":[{"m":"naam voor PHP","t":"name"},{"m":"standaardinhoud (optioneel)","t":"tekst tussen de tags"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":38,"createdAt":1790250000640,"id":"les_0641"},{"command":"<select name=\"\"><option value=\"\">tekst<\/option><\/select>","tab":"html","group":"Formulieren","title":"Keuzelijst (dropdown menu)","explanation":"Maakt een uitklapmenu waarin je één optie kiest. name staat op <select>, value op elke <option>; de tekst tussen de <option>-tags ziet de gebruiker.","parts":[{"m":"het menu; name is de naam voor PHP","t":"<select name=\"\">"},{"m":"één keuze; value wordt verstuurd als deze gekozen is","t":"<option value=\"\">"},{"m":"wat de gebruiker in de lijst ziet","t":"tekst"}],"examples":[{"command":"<select name=\"\"><option value=\"\">tekst<\/option><\/select>","note":"De optie met tekst BIT03 en value 'Paco' wordt gekozen.","output":"Array ( [Lecturer] => Paco )","slide":40,"source":"les","sourceName":"5. Dynamic Web Pages.pptx"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":40,"createdAt":1790250000642,"id":"les_0643"},{"command":"<select name=\"naam[]\" multiple>","tab":"html","group":"Formulieren","title":"Dropdown met meerdere keuzes","explanation":"Met het attribuut multiple kun je meerdere opties kiezen (Ctrl of Shift ingedrukt houden bij klikken). De [] achter de naam zorgt dat PHP de gekozen waarden als array ontvangt.","parts":[{"m":"meerdere opties tegelijk kiezen","t":"multiple"},{"m":"sla de keuzes op als array","t":"naam[]"}],"examples":[{"command":"<select name=\"naam[]\" multiple>","note":"","output":"Array ( [Lecturer] => Array (\n    [0] => Jasper\n    [1] => Paco\n  )\n)","slide":42,"source":"les","sourceName":"5. Dynamic Web Pages.pptx"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":42,"createdAt":1790250000644,"id":"les_0645"},{"command":"<optgroup label=\"\">","tab":"html","group":"Formulieren","title":"Opties in dropdown groeperen","explanation":"Groepeert verwante <option>-tags in een <select> onder een kopje, zodat een lange lijst overzichtelijk blijft. Het kopje zelf kun je niet kiezen.","parts":[{"m":"groep binnen de select, rond de options","t":"<optgroup>"},{"m":"naam van de categorie","t":"label"}],"examples":[{"command":"<optgroup label=\"\">","note":"Steden gegroepeerd per provincie: West Flanders (Bruges, Kortrijk) en East Flanders (Oudenaarde).","output":"","slide":44,"source":"les","sourceName":"5. Dynamic Web Pages.pptx"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":44,"createdAt":1790250000645,"id":"les_0646"},{"command":"<input type=\"file\" name=\"\">","tab":"html","group":"Formulieren","title":"Bestand laten uploaden","explanation":"Maakt een knop waarmee de gebruiker een bestand kiest om te uploaden. Werkt alleen in een formulier met method=\"POST\" en enctype=\"multipart/form-data\".","parts":[{"m":"bestandskiezer","t":"type=\"file\""},{"m":"naam waarmee PHP het bestand terugvindt in $_FILES","t":"name"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":47,"createdAt":1790250000646,"id":"les_0647"},{"command":"enctype=\"multipart/form-data\"","tab":"html","group":"Formulieren","title":"Formulier geschikt maken voor uploads","explanation":"Attribuut op de <form>-tag dat nodig is om bestanden te versturen. Het verpakt tekstvelden en bestanden in aparte delen, zodat de server ze correct kan verwerken; zonder dit werkt uploaden niet.","parts":[{"m":"hoe de formulierdata gecodeerd wordt","t":"enctype"},{"m":"codering in aparte delen, nodig voor bestanden","t":"multipart/form-data"}],"examples":[{"command":"enctype=\"multipart/form-data\"","note":"<form action=\"#\" method=\"POST\" enctype=\"multipart/form-data\">","output":"","slide":47,"source":"les","sourceName":"5. Dynamic Web Pages.pptx"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":47,"createdAt":1790250000647,"id":"les_0648"},{"command":"<title><\/title>","tab":"html","group":"Head & koppelingen","title":"Titel van de webpagina","explanation":"Stelt de titel van de webpagina in; de browser toont die in het tabblad. Staat binnen de <head>.","parts":[{"m":"openingstag","t":"<title>"},{"m":"de titeltekst (voorbeeld)","t":"An original title"},{"m":"sluitingstag","t":"<\/title>"}],"examples":[{"command":"<title><\/title>","note":"Met <title>An original title<\/title> staat 'An original title' in het browsertabblad.","output":"","slide":13,"source":"les","sourceName":"2. Introduction to HTML.pptx"}],"sourceName":"2. Introduction to HTML.pptx","slide":13,"createdAt":1790250000420,"id":"les_0421"},{"command":"<style><\/style>","tab":"html","group":"Head & koppelingen","title":"CSS-stijlen in de head","explanation":"Hiertussen zet je CSS-regels die de opmaak van de pagina bepalen (interne stijl). De <style>-tag staat in de <head>.","parts":[{"m":"begin van de CSS-code","t":"<style>"},{"m":"CSS-regel: alle paragrafen rood","t":"p {color: red;}"},{"m":"einde van de CSS-code","t":"<\/style>"}],"sourceName":"2. Introduction to HTML.pptx","slide":14,"createdAt":1790250000421,"id":"les_0422"},{"command":"<div><\/div>","tab":"html","group":"Layout","title":"Algemene container (blok)","explanation":"Groepeert inhoud zodat je die samen kan opmaken met CSS. De div-tag heeft geen eigen betekenis en voegt, anders dan <p>, geen extra witruimte toe boven of onder.","parts":[{"m":"openingstag (division)","t":"<div>"},{"m":"sluitingstag","t":"<\/div>"}],"sourceName":"2. Introduction to HTML.pptx","slide":22,"createdAt":1790250000429,"id":"les_0430"},{"command":"<hr>","tab":"html","group":"Layout","title":"Horizontale lijn","explanation":"Tekent een horizontale lijn om secties van elkaar te scheiden. Het is een self-closing tag: er is geen sluitingstag en geen inhoud.","parts":[{"m":"horizontal rule; geen sluitingstag","t":"<hr>"}],"sourceName":"2. Introduction to HTML.pptx","slide":26,"createdAt":1790250000434,"id":"les_0435"},{"command":"<span><\/span>","tab":"html","group":"Layout","title":"Algemene container binnen regel","explanation":"Groepeert een stukje tekst binnen een regel zodat je het met CSS kan opmaken. Net als <div> heeft span geen eigen betekenis of effect, maar het is een inline-element.","parts":[{"m":"openingstag","t":"<span>"},{"m":"sluitingstag","t":"<\/span>"}],"sourceName":"2. Introduction to HTML.pptx","slide":36,"createdAt":1790250000444,"id":"les_0445"},{"command":"<ul><li>Item<\/li><\/ul>","tab":"html","group":"Lijsten","title":"Lijst met bolletjes","explanation":"Een ongeordende lijst; elk <li> is één punt in de lijst.","parts":[{"m":"lijst met bolletjes","t":"<ul>"},{"m":"één lijstitem","t":"<li>"}],"createdAt":1790233200000,"id":"ex_ul"},{"command":"<ul><\/ul>","tab":"html","group":"Lijsten","title":"Lijst met opsommingstekens","explanation":"Maakt een ongenummerde lijst met bolletjes. Elk item staat in een eigen <li>-tag binnen de <ul>.","parts":[{"m":"unordered list: begin van de lijst","t":"<ul>"},{"m":"één item","t":"<li>…<\/li>"},{"m":"einde van de lijst","t":"<\/ul>"}],"sourceName":"2. Introduction to HTML.pptx","slide":42,"createdAt":1790250000451,"id":"les_0452"},{"command":"<li><\/li>","tab":"html","group":"Lijsten","title":"Eén item in een lijst","explanation":"Elk item van een lijst staat in een eigen <li>-tag, binnen <ul> of <ol>. Voeg meer li-tags toe voor meer items.","parts":[{"m":"list item: openingstag","t":"<li>"},{"m":"sluitingstag","t":"<\/li>"}],"sourceName":"2. Introduction to HTML.pptx","slide":42,"createdAt":1790250000452,"id":"les_0453"},{"command":"<ol><\/ol>","tab":"html","group":"Lijsten","title":"Genummerde lijst","explanation":"Maakt een lijst met nummers, handig als de volgorde belangrijk is. Elk item staat in een eigen <li>-tag binnen de <ol>.","parts":[{"m":"ordered list: begin van de lijst","t":"<ol>"},{"m":"één item","t":"<li>…<\/li>"},{"m":"einde van de lijst","t":"<\/ol>"}],"sourceName":"2. Introduction to HTML.pptx","slide":43,"createdAt":1790250000453,"id":"les_0454"},{"command":"<img src=\"eiwit.png\" alt=\"Eiwitstructuur\">","tab":"html","group":"Links & media","title":"Afbeelding tonen","explanation":"Toont de afbeelding eiwit.png. De alt-tekst beschrijft de afbeelding voor schermlezers en als ze niet laadt.","parts":[{"m":"afbeelding (geen sluittag nodig)","t":"<img>"},{"m":"bestand van de afbeelding","t":"src=\"eiwit.png\""},{"m":"beschrijving","t":"alt=\"Eiwitstructuur\""}],"createdAt":1790233200000,"id":"ex_img"},{"command":"<a href=\"pagina2.html\">Volgende<\/a>","tab":"html","group":"Links & media","title":"Link naar andere pagina","explanation":"Maakt de klikbare tekst 'Volgende' die naar pagina2.html gaat.","parts":[{"m":"link","t":"<a>"},{"m":"adres waar de link naartoe gaat","t":"href=\"pagina2.html\""},{"m":"de zichtbare, klikbare tekst","t":"Volgende"}],"createdAt":1790233200000,"id":"ex_a"},{"command":"<a href=\"URL\"><\/a>","tab":"html","group":"Links & media","title":"Link naar andere website","explanation":"Maakt een klikbare hyperlink. In het href-attribuut zet je het adres (URL) van de pagina; de tekst tussen de tags is waarop je klikt.","parts":[{"m":"anchor: de link-tag","t":"<a>"},{"m":"bestemming van de link (verplicht)","t":"href=\"URL\""},{"m":"de klikbare tekst tussen de tags","t":"linktekst"},{"m":"sluitingstag","t":"<\/a>"}],"sourceName":"2. Introduction to HTML.pptx","slide":27,"createdAt":1790250000435,"id":"les_0436"},{"command":"<a href=\"info/contact.html\"><\/a>","tab":"html","group":"Links & media","title":"Link naar pagina op eigen site","explanation":"Verwijst naar een ander HTML-bestand van je eigen website. Staat het bestand in dezelfde map, dan volstaat de naam (about.html); in een submap zet je de mapnaam ervoor (info/contact.html).","parts":[{"m":"bestand in dezelfde map","t":"href=\"about.html\""},{"m":"bestand contact.html in de submap info","t":"href=\"info/contact.html\""}],"sourceName":"2. Introduction to HTML.pptx","slide":28,"createdAt":1790250000436,"id":"les_0437"},{"command":"<img src=\"\">","tab":"html","group":"Links & media","title":"Afbeelding tonen","explanation":"Voegt een afbeelding in de pagina. Het src-attribuut is verplicht en geeft de locatie: een lokaal pad (bv. Mario.png in dezelfde map) of een volledige URL.","parts":[{"m":"afbeeldingstag; geen sluitingstag","t":"<img>"},{"m":"lokaal bestand, relatief pad","t":"src=\"Mario.png\""},{"m":"online afbeelding via volledige URL","t":"src=\"https://…\""}],"sourceName":"2. Introduction to HTML.pptx","slide":37,"createdAt":1790250000445,"id":"les_0446"},{"command":"<a href=\"#id\"><\/a>","tab":"html","group":"Links & media","title":"Link naar plek op pagina","explanation":"Een link met href=\"#\" gevolgd door een id springt naar het element met dat id op dezelfde pagina. Handig voor een inhoudstafel.","parts":[{"m":"ga naar het element met id=\"Jasper\"","t":"href=\"#Jasper\""},{"m":"het doel van de link","t":"<h1 id=\"Jasper\">"}],"sourceName":"2. Introduction to HTML.pptx","slide":57,"createdAt":1790250000463,"id":"les_0464"},{"command":"<a href=\"mailto:adres\">tekst<\/a>","tab":"html","group":"Links & media","title":"Link die e-mail opstelt","explanation":"Een link met mailto: opent het e-mailprogramma van de gebruiker met het adres al ingevuld als ontvanger.","parts":[{"m":"doel van de link","t":"href"},{"m":"open e-mail naar dit adres","t":"mailto:"},{"m":"zichtbare linktekst","t":"tekst"}],"examples":[{"command":"<a href=\"mailto:adres\">tekst<\/a>","note":"<a href=\"mailto:mathias.verbeke@howest.be\">Report a bug<\/a>","output":"","slide":9,"source":"les","sourceName":"5. Dynamic Web Pages.pptx"}],"sourceName":"5. Dynamic Web Pages.pptx","slide":9,"createdAt":1790250000619,"id":"les_0620"},{"command":"<!DOCTYPE html>","tab":"html","group":"Structuur","title":"Documenttype","explanation":"Staat helemaal bovenaan elk HTML-bestand en vertelt de browser dat het om moderne HTML gaat.","parts":[{"m":"documenttype HTML5","t":"<!DOCTYPE html>"}],"createdAt":1790233200000,"id":"ex_doctype"},{"command":"! + Enter","tab":"html","group":"Structuur","title":"HTML-basisstructuur invoegen (VS Code)","explanation":"In VS Code typ je in een leeg .html-bestand een uitroepteken en druk je op Enter (of Tab). Dan wordt de volledige HTML5-basisstructuur met doctype, html, head en body automatisch ingevuld.","parts":[{"m":"afkorting (Emmet) voor een HTML5-sjabloon","t":"!"},{"m":"sjabloon invoegen","t":"Enter"}],"sourceName":"2. Introduction to HTML.pptx","slide":9,"createdAt":1790250000417,"id":"les_0418"},{"command":"<html lang=\"en\"><\/html>","tab":"html","group":"Structuur","title":"Begin en einde van document","explanation":"De <html>-tag en de sluitingstag <\/html> markeren het begin en einde van het HTML-document; alles staat hiertussen. Het lang-attribuut zegt in welke taal de pagina geschreven is.","parts":[{"m":"openingstag: begin van het document","t":"<html>"},{"m":"taal van de pagina (en = Engels, nl = Nederlands)","t":"lang=\"en\""},{"m":"sluitingstag: einde van het document","t":"<\/html>"}],"sourceName":"2. Introduction to HTML.pptx","slide":11,"createdAt":1790250000418,"id":"les_0419"},{"command":"<head><\/head>","tab":"html","group":"Structuur","title":"Metadata van de pagina","explanation":"In de <head> zet je informatie over de pagina (metadata), zoals de titel en CSS-stijlen. Het is een omhulsel rond andere tags; de inhoud ervan verschijnt niet in het browservenster zelf.","parts":[{"m":"openingstag van het head-gedeelte","t":"<head>"},{"m":"sluitingstag","t":"<\/head>"}],"sourceName":"2. Introduction to HTML.pptx","slide":12,"createdAt":1790250000419,"id":"les_0420"},{"command":"<body><\/body>","tab":"html","group":"Structuur","title":"Zichtbare inhoud van de pagina","explanation":"Alles tussen <body> en <\/body> wordt in het browservenster getoond. Het is een omhulsel rond alle andere inhoudstags zoals koppen, paragrafen en afbeeldingen.","parts":[{"m":"openingstag van de inhoud","t":"<body>"},{"m":"sluitingstag","t":"<\/body>"}],"sourceName":"2. Introduction to HTML.pptx","slide":15,"createdAt":1790250000424,"id":"les_0425"},{"command":"<!-- commentaar -->","tab":"html","group":"Structuur","title":"Commentaar in HTML","explanation":"Tekst tussen <!-- en --> is commentaar: de browser toont het niet. Je gebruikt het voor uitleg en notities in je code, zodat die makkelijker te begrijpen is.","parts":[{"m":"begin van het commentaar","t":"<!--"},{"m":"je notitie","t":"commentaar"},{"m":"einde van het commentaar","t":"-->"}],"sourceName":"2. Introduction to HTML.pptx","slide":16,"createdAt":1790250000425,"id":"les_0426"},{"command":"<table><\/table>","tab":"html","group":"Tabellen","title":"Tabel maken","explanation":"Maakt een tabel en is de buitenste laag die de hele tabel omsluit. Binnenin staan rijen (<tr>) met cellen (<td> of <th>).","parts":[{"m":"begin van de tabel","t":"<table>"},{"m":"einde van de tabel","t":"<\/table>"}],"sourceName":"2. Introduction to HTML.pptx","slide":45,"createdAt":1790250000454,"id":"les_0455"},{"command":"<tr><\/tr>","tab":"html","group":"Tabellen","title":"Rij in een tabel","explanation":"Maakt één rij in een tabel. Voeg meer tr-tags toe voor meer rijen.","parts":[{"m":"table row: begin van de rij","t":"<tr>"},{"m":"einde van de rij","t":"<\/tr>"}],"sourceName":"2. Introduction to HTML.pptx","slide":46,"createdAt":1790250000455,"id":"les_0456"},{"command":"<td><\/td>","tab":"html","group":"Tabellen","title":"Cel in een tabelrij","explanation":"Maakt één gewone cel in een tabelrij. Voeg meer td-tags toe voor meer cellen (kolommen) in de rij.","parts":[{"m":"table data: begin van de cel","t":"<td>"},{"m":"einde van de cel","t":"<\/td>"}],"sourceName":"2. Introduction to HTML.pptx","slide":47,"createdAt":1790250000456,"id":"les_0457"},{"command":"<th><\/th>","tab":"html","group":"Tabellen","title":"Kopcel in een tabel","explanation":"Maakt een kopcel, meestal om kolommen of rijen te benoemen. Browsers tonen die standaard vet en gecentreerd.","parts":[{"m":"table header: begin van de kopcel","t":"<th>"},{"m":"einde van de kopcel","t":"<\/th>"}],"sourceName":"2. Introduction to HTML.pptx","slide":48,"createdAt":1790250000457,"id":"les_0458"},{"command":"<h1><\/h1> … <h6><\/h6>","tab":"html","group":"Tekst","title":"Koppen (titels) van secties","explanation":"Koppen geven een titel aan een nieuwe sectie. Er zijn zes niveaus: h1 is de grootste, h6 de kleinste; de browser past de grootte automatisch aan.","parts":[{"m":"grootste kop","t":"<h1>"},{"m":"tussenliggende koppen","t":"<h2> … <h5>"},{"m":"kleinste kop","t":"<h6>"}],"examples":[{"command":"<h1><\/h1> … <h6><\/h6>","note":"<h1>Whale<\/h1> tot <h6>Plankton<\/h6>: hoe groter het dier, hoe groter de kop.","output":"","slide":20,"source":"les","sourceName":"2. Introduction to HTML.pptx"}],"sourceName":"2. Introduction to HTML.pptx","slide":20,"createdAt":1790250000427,"id":"les_0428"},{"command":"<p><\/p>","tab":"html","group":"Tekst","title":"Paragraaf maken","explanation":"Groepeert tekst die bij elkaar hoort in een paragraaf. De browser voegt automatisch witruimte toe boven en onder de paragraaf.","parts":[{"m":"openingstag (p = paragraph)","t":"<p>"},{"m":"sluitingstag","t":"<\/p>"}],"sourceName":"2. Introduction to HTML.pptx","slide":21,"createdAt":1790250000428,"id":"les_0429"},{"command":"<pre><\/pre>","tab":"html","group":"Tekst","title":"Tekst exact zoals getypt","explanation":"Toont tekst met alle spaties, tabs en regeleinden precies zoals in de code, in een monospaced lettertype. Ideaal voor sequenties van nucleotiden of aminozuren, of ASCII-art.","parts":[{"m":"openingstag (pre-formatted)","t":"<pre>"},{"m":"sluitingstag","t":"<\/pre>"}],"sourceName":"2. Introduction to HTML.pptx","slide":23,"createdAt":1790250000430,"id":"les_0431"},{"command":"<blockquote><\/blockquote>","tab":"html","group":"Tekst","title":"Blok citaat uit andere bron","explanation":"Markeert een blok tekst als citaat uit een andere bron. De browser voegt witruimte toe boven, onder en links van het citaat.","parts":[{"m":"openingstag","t":"<blockquote>"},{"m":"sluitingstag","t":"<\/blockquote>"}],"sourceName":"2. Introduction to HTML.pptx","slide":25,"createdAt":1790250000433,"id":"les_0434"},{"command":"<br>","tab":"html","group":"Tekst","title":"Nieuwe regel beginnen","explanation":"Voegt een regeleinde in: wat volgt komt op een nieuwe regel. Het is een self-closing tag. Anders dan <hr> tekent het geen lijn.","parts":[{"m":"line break; geen sluitingstag","t":"<br>"}],"sourceName":"2. Introduction to HTML.pptx","slide":29,"createdAt":1790250000437,"id":"les_0438"},{"command":"<code><\/code>","tab":"html","group":"Tekst","title":"Code-tekst binnen een regel","explanation":"Toont tekst in een monospaced lettertype, zoals <pre>, maar is een inline-element: de tekst blijft op dezelfde regel staan.","parts":[{"m":"openingstag","t":"<code>"},{"m":"sluitingstag","t":"<\/code>"}],"examples":[{"command":"<code><\/code>","note":"EcoRI: <code>GAATTC<\/code><br> toont de naam van het restrictie-enzym met de herkenningssequentie in monospaced letters op dezelfde regel.","output":"","slide":30,"source":"les","sourceName":"2. Introduction to HTML.pptx"}],"sourceName":"2. Introduction to HTML.pptx","slide":30,"createdAt":1790250000438,"id":"les_0439"},{"command":"<em><\/em>","tab":"html","group":"Tekst","title":"Tekst benadrukken (cursief)","explanation":"Legt nadruk op tekst; de browser toont die cursief.","parts":[{"m":"openingstag (emphasis)","t":"<em>"},{"m":"sluitingstag","t":"<\/em>"}],"sourceName":"2. Introduction to HTML.pptx","slide":31,"createdAt":1790250000439,"id":"les_0440"},{"command":"<small><\/small>","tab":"html","group":"Tekst","title":"Kleinere tekst","explanation":"Toont tekst in een kleiner lettertype. Je kan small-tags in elkaar zetten (nesten): hoe meer small-tags, hoe kleiner de tekst.","parts":[{"m":"openingstag","t":"<small>"},{"m":"sluitingstag","t":"<\/small>"}],"sourceName":"2. Introduction to HTML.pptx","slide":32,"createdAt":1790250000440,"id":"les_0441"},{"command":"<strike><\/strike>","tab":"html","group":"Tekst","title":"Tekst doorstrepen","explanation":"Toont tekst met een lijn erdoor, bv. om een fout aan te duiden.","parts":[{"m":"openingstag","t":"<strike>"},{"m":"sluitingstag","t":"<\/strike>"}],"sourceName":"2. Introduction to HTML.pptx","slide":33,"createdAt":1790250000441,"id":"les_0442"},{"command":"<strong><\/strong>","tab":"html","group":"Tekst","title":"Tekst vet maken","explanation":"Benadrukt tekst sterk; de browser toont die in het vet.","parts":[{"m":"openingstag","t":"<strong>"},{"m":"sluitingstag","t":"<\/strong>"}],"sourceName":"2. Introduction to HTML.pptx","slide":34,"createdAt":1790250000442,"id":"les_0443"},{"command":"<q><\/q>","tab":"html","group":"Tekst","title":"Kort citaat binnen regel","explanation":"Markeert een kort citaat binnen een regel tekst; de browser zet er automatisch aanhalingstekens rond.","parts":[{"m":"openingstag (quote)","t":"<q>"},{"m":"sluitingstag","t":"<\/q>"}],"sourceName":"2. Introduction to HTML.pptx","slide":35,"createdAt":1790250000443,"id":"les_0444"},{"command":"tar -xvf archief.tar","tab":"linux","group":"Archieven & compressie","title":"Archief uitpakken","explanation":"Haalt alle bestanden uit een tar-archief en zet ze in de huidige map.","parts":[{"m":"werk met archieven","t":"tar"},{"m":"extract: pak uit","t":"-x"},{"m":"toon wat er gebeurt","t":"-v"},{"m":"naam van het archief","t":"-f archief.tar"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":24,"createdAt":1790250000234,"id":"les_0235"},{"command":"tar -cvf archief.tar map","tab":"linux","group":"Archieven & compressie","title":"Archief maken van een map","explanation":"Maakt één archiefbestand met alle bestanden uit de map, bv. tar -cvf /var/tmp/archive.tar /home/guest. tar comprimeert niet: het archief is dus niet kleiner. Het minteken voor de opties mag je vaak weglaten.","parts":[{"m":"tape archiver: werk met archieven","t":"tar"},{"m":"create: maak een nieuw archief","t":"-c"},{"m":"verbose: toon wat er gebeurt","t":"-v"},{"m":"file: naam van het archief","t":"-f archief.tar"},{"m":"wat in het archief moet","t":"map"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":25,"createdAt":1790250000235,"id":"les_0236"},{"command":"tar -tf archief.tar | grep bestand","tab":"linux","group":"Archieven & compressie","title":"Zoeken in inhoud van archief","explanation":"tar -t toont de inhoud van een archief zonder het uit te pakken. Met | grep controleer je of een bepaald bestand erin zit.","parts":[{"m":"list: toon inhoud","t":"-t"},{"m":"naam van het archief","t":"-f archief.tar"},{"m":"filter op de gezochte naam","t":"| grep bestand"}],"sourceName":"Chapter 6 - The work environment.pptx","slide":26,"createdAt":1790250000236,
