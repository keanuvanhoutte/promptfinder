en functie","title":"Zelfde functie, andere fold","explanation":"Niet-verwante eiwitten kunnen onafhankelijk dezelfde functie ontwikkelen. Voorbeeld: subtilisine en chymotrypsine hebben geen sequentie- of foldverwantschap, maar wel een identieke katalytische triade.","sourceName":"SB-07-structural-functional-assignment.pptx","slide":32,"createdAt":1790250000915,"id":"les_0916"},{"command":"Katalytische triade (Ser-His-Asp)","tab":"structbio","group":"Evolutie en functie","title":"Drie samenwerkende actieve residuen","explanation":"Set van drie gecoördineerde aminozuren (serine, histidine, aspartaat) in de actieve site van o.a. proteasen, die peptidebindingen hydrolyseren.","sourceName":"SB-07-structural-functional-assignment.pptx","slide":33,"createdAt":1790250000916,"id":"les_0917"},{"command":"Obsolete structuren","tab":"structbio","group":"Fouten in structuren","title":"Vervangen foute PDB-entries","explanation":"Foute of verbeterde modellen verdwijnen niet: ze belanden in het archief van obsolete PDB-structuren. Via PDB-versiebeheer (bv. rcsb.org/versions/9PAP) zie je de geschiedenis van een entry.","sourceName":"SB-06-structure-quality-validation.pptx","slide":29,"createdAt":1790250000895,"id":"les_0896"},{"command":"Ernstige modelfouten","tab":"structbio","group":"Fouten in structuren","title":"Van verkeerde fold tot zijketen","explanation":"Van ernstig naar minder ernstig: volledig verkeerde fold (keten volgt verkeerd pad door de dichtheid), verkeerde verbindingen tussen secundaire elementen, frameshiftfouten, en verkeerde hoofd- of zijketenconformaties.","sourceName":"SB-06-structure-quality-validation.pptx","slide":30,"createdAt":1790250000896,"id":"les_0897"},{"command":"Frameshiftfout","tab":"structbio","group":"Fouten in structuren","title":"Residuen één plaats verschoven","explanation":"Een residu wordt in de elektronendichtheid van het volgende residu gebouwd, en de fout loopt door tot een compenserende fout. Komt vooral voor in loops en bij lage resolutie (3 Å of slechter).","sourceName":"SB-06-structure-quality-validation.pptx","slide":32,"createdAt":1790250000897,"id":"les_0898"},{"command":"EC 1.2.1.12","tab":"structbio","group":"Functieclassificatie","title":"EC-nummer van een enzym","explanation":"De Enzyme Commission-classificatie deelt enzymen in volgens de reactie die ze katalyseren, in 4 niveaus. Voorbeeld: GAPDH heeft EC 1.2.1.12. Opzoeken kan via enzyme.expasy.org.","parts":[{"m":"klasse van reactie: oxidoreductase","t":"1"},{"m":"werkt op een aldehyde- of oxogroep","t":"2"},{"m":"met NAD⁺ of NADP⁺ als acceptor","t":"1"},{"m":"het specifieke enzym: glyceraldehyde-3-fosfaatdehydrogenase","t":"12"}],"sourceName":"SB-07-structural-functional-assignment.pptx","slide":9,"createdAt":1790250000908,"id":"les_0909"},{"command":"ChEBI","tab":"structbio","group":"Functieclassificatie","title":"Databank van kleine moleculen","explanation":"Chemical Entities of Biological Interest: vrij beschikbaar woordenboek van kleine, biologisch relevante chemische verbindingen (EBI).","sourceName":"SB-07-structural-functional-assignment.pptx","slide":9,"createdAt":1790250000909,"id":"les_0910"},{"command":"ProFunc","tab":"structbio","group":"Functietools","title":"Functievoorspelling uit structuur","explanation":"Server (EBI) die veel voorspellingsmethoden combineert. Sequentiegebaseerd: BLAST, InterProScan, residuconservering. Structuurgebaseerd: fold matching (DALI), HTH-motieven, clefts, 'nests' en templates voor actieve sites en bindingsplaatsen.","sourceName":"SB-07-structural-functional-assignment.pptx","slide":17,"createdAt":1790250000911,"id":"les_0912"},{"command":"PDBeFold (SSM)","tab":"structbio","group":"Functietools","title":"Structuren vergelijken via secundaire structuur","explanation":"Tool van PDBe die 3D-structuren vergelijkt op basis van secondary structure matching (SSM).","sourceName":"SB-07-structural-functional-assignment.pptx","slide":38,"createdAt":1790250000918,"id":"les_0919"},{"command":"PROSITE","tab":"structbio","group":"Functietools","title":"Databank van eiwitmotieven","explanation":"Databank met profielen en patronen om eiwitdomeinen, families en functionele sites te herkennen (prosite.expasy.org).","sourceName":"SB-07-structural-functional-assignment.pptx","slide":44,"createdAt":1790250000919,"id":"les_0920"},{"command":"ELM","tab":"structbio","group":"Functietools","title":"Eukaryote lineaire motieven","explanation":"Eukaryotic Linear Motif resource: databank van korte functionele sequentiemotieven in eukaryote eiwitten (elm.eu.org).","sourceName":"SB-07-structural-functional-assignment.pptx","slide":44,"createdAt":1790250000920,"id":"les_0921"},{"command":"ConSurf","tab":"structbio","group":"Functietools","title":"Geconserveerde regio's op structuur","explanation":"Server die evolutionaire conservering per residu op het oppervlak van de structuur kleurt, om functionele regio's te vinden.","sourceName":"SB-07-structural-functional-assignment.pptx","slide":44,"createdAt":1790250000921,"id":"les_0922"},{"command":"PDBePISA","tab":"structbio","group":"Functietools","title":"Interfaces tussen moleculen analyseren","explanation":"Tool van PDBe om macromoleculaire interfaces en complexen (bv. contacten tussen eiwitketens) te onderzoeken.","sourceName":"SB-07-structural-functional-assignment.pptx","slide":51,"createdAt":1790250000923,"id":"les_0924"},{"command":"SURFNET","tab":"structbio","group":"Functietools","title":"Clefts en pockets opsporen","explanation":"Algoritme dat holtes in een eiwit vindt door bolletjes tussen de atomen te passen; PDBsum gebruikt het voor de Clefts-pagina.","sourceName":"SB-07-structural-functional-assignment.pptx","slide":52,"createdAt":1790250000924,"id":"les_0925"},{"command":"Sequentie- vs structuurgebaseerde voorspelling","tab":"structbio","group":"Functievoorspelling","title":"Twee manieren om functie te voorspellen","explanation":"Sequentiegebaseerd: functie overnemen van gelijkaardige sequenties (>40% identiteit). Structuurgebaseerd: vergelijken met gekende structuren (bv. via CATH, SCOP), zoeken naar gekende structurele motieven, of ab initio analyseren van enkel de structuur (bv. clefts).","sourceName":"SB-07-structural-functional-assignment.pptx","slide":34,"createdAt":1790250000917,"id":"les_0918"},{"command":"Cleft (groeve)","tab":"structbio","group":"Functievoorspelling","title":"Holte waar liganden binden","explanation":"Groeve of holte in het eiwitoppervlak. De actieve site of ligandbindingsplaats is vaak de grootste cleft: daar kan het substraat nauwkeurig geplaatst en van het water afgeschermd worden.","sourceName":"SB-07-structural-functional-assignment.pptx","slide":48,"createdAt":1790250000922,"id":"les_0923"},{"command":"Dimeerinterface","tab":"structbio","group":"Interacties","title":"Contactvlak tussen twee subeenheden","explanation":"Het oppervlak waar twee subeenheden van een dimeer elkaar raken. Bij c-Rel is de kern hydrofoob (Phe204, Leu206, Ala240, Val242) en zorgen geladen residuen voor ionische interacties.","sourceName":"SB-workshop-2-molecular-visualization.pptx","slide":15,"createdAt":1790250000717,"id":"les_0718"},{"command":"Transcriptiefactorbindingsplaats (TFBS)","tab":"structbio","group":"Interacties","title":"DNA-plaats waar TF bindt","explanation":"De korte, specifieke DNA-sequentie waarop een transcriptiefactor bindt, bv. 5'-AGAAATTCC-3' voor c-Rel in structuur 1GJI.","sourceName":"SB-workshop-2-molecular-visualization.pptx","slide":16,"createdAt":1790250000718,"id":"les_0719"},{"command":"Waterstofbrug","tab":"structbio","group":"Interacties","title":"Zwakke binding via waterstof","explanation":"Een zwakke aantrekking tussen een waterstofatoom op een N of O en een ander N- of O-atoom. Waterstofbruggen houden de baseparen van DNA samen en komen veel voor in eiwit-DNA-interfaces.","sourceName":"SB-workshop-2-molecular-visualization.pptx","slide":16,"createdAt":1790250000719,"id":"les_0720"},{"command":"Eiwit-DNA-interface","tab":"structbio","group":"Interacties","title":"Contactvlak tussen eiwit en DNA","explanation":"De plaats waar een eiwit het DNA raakt. Sommige residuen maken contact met de basen (sequentiespecifiek), andere met de suiker-fosfaatruggengraat van het DNA.","sourceName":"SB-workshop-2-molecular-visualization.pptx","slide":18,"createdAt":1790250000721,"id":"les_0722"},{"command":"Eiwitkristallisatie","tab":"structbio","group":"Kristallisatie","title":"Eiwitkristal laten groeien","explanation":"Eerste en vaak moeilijkste stap: een zuiver, homogeen kristal van >0,1 mm maken. Belangrijke parameters zijn eiwitzuiverheid en -concentratie, pH, temperatuur en precipitans.","sourceName":"SB-04-macromolecular-structure-determination-part1.pptx","slide":17,"createdAt":1790250000827,"id":"les_0828"},{"command":"Vapor diffusion (hanging/sitting drop)","tab":"structbio","group":"Kristallisatie","title":"Meest gebruikte kristallisatiemethode","explanation":"Een druppel (1 µl eiwit + 1 µl kristallisatieoplossing) hangt boven (hanging drop) of staat naast (sitting drop) een reservoir met geconcentreerdere oplossing. Water verdampt uit de druppel tot die oververzadigd wordt en kristallen kunnen vormen. Handig om veel condities te screenen met weinig eiwit.","sourceName":"SB-04-macromolecular-structure-determination-part1.pptx","slide":20,"createdAt":1790250000828,"id":"les_0829"},{"command":"Fasediagram (oplosbaarheidsdiagram)","tab":"structbio","group":"Kristallisatie","title":"Zones voor kristalgroei","explanation":"Grafiek van eiwitconcentratie tegenover precipitansconcentratie. Onder de oplosbaarheidscurve is de oplossing onverzadigd (geen kristallen); daarboven oververzadigd, met een metastabiele zone (enkel groei), een labiele zone (nucleatie + groei) en een precipitatiezone (amorf neerslag).","sourceName":"SB-04-macromolecular-structure-determination-part1.pptx","slide":26,"createdAt":1790250000829,"id":"les_0830"},{"command":"Seeding","tab":"structbio","group":"Kristallisatie","title":"Kristalkiemen toevoegen","explanation":"Techniek waarbij men nucleatie overslaat door kristalkiemen in een metastabiele eiwitoplossing te brengen, zodat ze kunnen uitgroeien. Varianten: macroseeding (kleine kristallen), microseeding (verpulverde kristallen) en streak seeding (met een paardenhaar).","sourceName":"SB-04-macromolecular-structure-determination-part1.pptx","slide":35,"createdAt":1790250000830,"id":"les_0831"},{"command":"Kristal en kristalrooster","tab":"structbio","group":"Kristallografie","title":"Regelmatig herhaald atoompatroon","explanation":"Een kristal is een vaste stof waarin atomen of moleculen ordelijk en herhaald in drie richtingen (x, y, z) geschikt zijn. Die regelmatige schikking heet het kristalrooster.","sourceName":"SB-04-macromolecular-structure-determination-part1.pptx","slide":9,"createdAt":1790250000825,"id":"les_0826"},{"command":"Eenheidscel (unit cell)","tab":"structbio","group":"Kristallografie","title":"Kleinste herhalende blok","explanation":"Het kleinste blok dat, herhaald in drie richtingen, het volledige kristalrooster opbouwt.","sourceName":"SB-04-macromolecular-structure-determination-part1.pptx","slide":51,"createdAt":1790250000834,"id":"les_0835"},{"command":"Ruimtegroep (space group)","tab":"structbio","group":"Kristallografie","title":"Alle symmetrie van een kristal","explanation":"De verzameling symmetrieoperaties van de eenheidscel in een kristalstructuur: combinatie van het Bravais-rooster en de symmetrie van het kristal. Er bestaan 230 ruimtegroepen.","sourceName":"SB-04-macromolecular-structure-determination-part1.pptx","slide":53,"createdAt":1790250000835,"id":"les_0836"},{"command":"Bravais-rooster","tab":"structbio","group":"Kristallografie","title":"14 mogelijke 3D-roosters","explanation":"Een van de 14 mogelijke driedimensionale puntroosters die de ordelijke schikking in een kristal beschrijven (bv. primitief, ruimtelijk of vlakgecentreerd kubisch). Ze horen bij 7 kristalsystemen: kubisch, tetragonaal, hexagonaal, rhomboëdrisch, orthorhombisch, monoklien en triklien.","sourceName":"SB-04-macromolecular-structure-determination-part1.pptx","slide":54,"createdAt":1790250000836,"id":"les_0837"},{"command":"Resolutie","tab":"structbio","group":"Kwaliteit & validatie","title":"Detailniveau van een structuur","explanation":"Maat (in ångström) voor hoe gedetailleerd een experimentele structuur is. Hoe lager het getal, hoe beter je individuele atomen kunt onderscheiden.","sourceName":"SB-workshop-5-databases-tools.pptx","slide":4,"createdAt":1790250000767,"id":"les_0768"},{"command":"R-waarde en R-free","tab":"structbio","group":"Kwaliteit & validatie","title":"Hoe goed model en data kloppen","explanation":"Maten voor hoe goed een kristallografisch model overeenkomt met de gemeten diffractiedata; lager is beter. R-free wordt berekend op data die niet gebruikt werden om het model te bouwen en is daardoor eerlijker.","sourceName":"SB-workshop-5-databases-tools.pptx","slide":4,"createdAt":1790250000768,"id":"les_0769"},{"command":"Ramachandran-plot","tab":"structbio","group":"Kwaliteit & validatie","title":"Grafiek van backbone-hoeken","explanation":"Grafiek van de backbone-torsiehoeken phi en psi van elk residu. Residuen in ongebruikelijke gebieden (outliers) wijzen op mogelijke fouten, dus je gebruikt hem om de kwaliteit van een structuur te controleren.","sourceName":"SB-workshop-5-databases-tools.pptx","slide":5,"createdAt":1790250000769,"id":"les_0770"},{"command":"Z-score","tab":"structbio","group":"Kwaliteit & validatie","title":"Afwijking van het gemiddelde","explanation":"Geeft aan hoeveel standaardafwijkingen een waarde van het gemiddelde van goede referentiestructuren ligt. Een Z-score dicht bij 0 betekent dat de structuur normaal oogt.","sourceName":"SB-workshop-5-databases-tools.pptx","slide":5,"createdAt":1790250000770,"id":"les_0771"},{"command":"Kwaliteit van NMR-structuren","tab":"structbio","group":"Kwaliteit NMR-structuren","title":"NMR-structuren beoordelen","explanation":"De header van een NMR-bestand bevat geen standaard kwaliteitsmaat. Lees het originele artikel of gebruik stereochemische controles, bv. PROCHECK-NMR via PDBsum.","sourceName":"SB-06-structure-quality-validation.pptx","slide":25,"createdAt":1790250000894,"id":"les_0895"},{"command":"Rfree","tab":"structbio","group":"Kwaliteit röntgenstructuren","title":"Onafhankelijke R-factor","explanation":"Wordt berekend zoals de R-factor, maar op een testset van 5–10% van de data die niet gebruikt wordt bij de verfijning (de rest is de working set). Daardoor is Rfree niet te 'manipuleren' tijdens de verfijning; hij is meestal iets hoger dan R, en waarden boven 0,40 zijn verdacht.","sourceName":"SB-06-structure-quality-validation.pptx","slide":18,"createdAt":1790250000891,"id":"les_0892"},{"command":"B-factor","tab":"structbio","group":"Kwaliteit röntgenstructuren","title":"Onzekerheid per atoompositie","explanation":"Waarde per atoom (laatste kolom in een ATOM-record) die aangeeft hoe onzeker of beweeglijk de positie is. Hoe hoger, hoe onzekerder; als vuistregel worden atomen met B > 40 vaak als onbetrouwbaar weggelaten.","sourceName":"SB-06-structure-quality-validation.pptx","slide":22,"createdAt":1790250000892,"id":"les_0893"},{"command":"Selectiecriteria röntgenstructuren","tab":"structbio","group":"Kwaliteit röntgenstructuren","title":"Vuistregels voor goede structuren","explanation":"Kies bij voorkeur structuren met een resolutie van 2,0 Å of beter, een R-factor van 0,20 of lager, en een recent bepalingsjaar (technieken zijn verbeterd). Deze waarden staan in de header van het PDB-bestand.","sourceName":"SB-06-structure-quality-validation.pptx","slide":23,"createdAt":1790250000893,"id":"les_0894"},{"command":"Elektronendichtheidskaart","tab":"structbio","group":"Model & kwaliteit","title":"3D-kaart van elektronen","explanation":"Met een Fouriertransformatie worden de 2D-diffractiebeelden omgezet in een 3D-kaart van de elektronendichtheid in het kristal. Daarin wordt het atoommodel gebouwd.","sourceName":"SB-04-macromolecular-structure-determination-part1.pptx","slide":50,"createdAt":1790250000833,"id":"les_0834"},{"command":"Faseprobleem","tab":"structbio","group":"Model & kwaliteit","title":"Fase ontbreekt in diffractiedata","explanation":"Elke diffractievlek is een golf met amplitude en fase. Het experiment meet enkel de intensiteit (amplitude), niet de fase, terwijl die nodig is om de structuur te berekenen. Oplossingen: MIR, SAD/MAD of moleculaire vervanging.","sourceName":"SB-04-macromolecular-structure-determination-part1.pptx","slide":62,"createdAt":1790250000837,"id":"les_0838"},{"command":"MIR (multiple isomorphous replacement)","tab":"structbio","group":"Model & kwaliteit","title":"Fases via zware atomen","explanation":"Zware atomen (Au, Hg, Pb, Pt) worden in het kristal gebracht door soaking of co-kristallisatie, zonder de vorm van het kristal te veranderen (isomorf). De verschillen in diffractie helpen de fases te bepalen.","sourceName":"SB-04-macromolecular-structure-determination-part1.pptx","slide":64,"createdAt":1790250000838,"id":"les_0839"},{"command":"SAD/MAD","tab":"structbio","group":"Model & kwaliteit","title":"Fases via anomale diffractie","explanation":"Single- of multi-wavelength anomalous diffraction gebruikt de anomale verstrooiing van zware atomen, meestal selenium: men laat het eiwit selenomethionine inbouwen in plaats van methionine.","sourceName":"SB-04-macromolecular-structure-determination-part1.pptx","slide":65,"createdAt":1790250000839,"id":"les_0840"},{"command":"Moleculaire vervanging","tab":"structbio","group":"Model & kwaliteit","title":"Fases via gekende homologe structuur","explanation":"Een bestaande homologe structuur wordt als model in de onbekende eenheidscel geplaatst met 3 rotatiehoeken en 3 translaties. Zo verkrijgt men beginfases.","sourceName":"SB-04-macromolecular-structure-determination-part1.pptx","slide":66,"createdAt":1790250000840,"id":"les_0841"},{"command":"Verfijning (refinement)","tab":"structbio","group":"Model & kwaliteit","title":"Model iteratief verbeteren","explanation":"Het beginmodel wordt stap voor stap aangepast zodat het beter overeenkomt met de gemeten diffractiedata én een correcte stereochemie heeft. Betere fases geven een betere dichtheidskaart (iteratief proces).","sourceName":"SB-04-macromolecular-structure-determination-part1.pptx","slide":67,"createdAt":1790250000841,"id":"les_0842"},{"command":"R-factor","tab":"structbio","group":"Model & kwaliteit","title":"Overeenkomst model en data","explanation":"Maat voor de overeenkomst tussen het kristallografische model en de experimentele diffractiedata: hoe lager, hoe beter. Een goed verfijnd model heeft typisch R < 0,25.","sourceName":"SB-04-macromolecular-structure-determination-part1.pptx","slide":69,"createdAt":1790250000842,"id":"les_0843"},{"command":"Resolutie (Å)","tab":"structbio","group":"Model & kwaliteit","title":"Detailniveau van de structuur","explanation":"Kleinste afstand die nog te onderscheiden is in de elektronendichtheidskaart, uitgedrukt in Ångström (1 Å = 10⁻¹⁰ m). Hoe kleiner het getal, hoe beter: >4 Å toont enkel secundaire structuur, rond 2 Å zijn watermoleculen zichtbaar, onder 1,5 Å zijn individuele atomen zichtbaar.","sourceName":"SB-04-macromolecular-structure-determination-part1.pptx","slide":70,"createdAt":1790250000843,"id":"les_0844"},{"command":"Rotameer","tab":"structbio","group":"Model & kwaliteit","title":"Voorkeursstand van een zijketen","explanation":"Een van de gunstige conformaties van een zijketen (door draaiing rond enkelvoudige bindingen). Bij lage resolutie worden zijketens vaak in een verkeerde rotameer geplaatst.","sourceName":"SB-04-macromolecular-structure-determination-part1.pptx","slide":71,"createdAt":1790250000844,"id":"les_0845"},{"command":"Moleculaire visualisatie","tab":"structbio","group":"Moleculaire visualisatie","title":"Structuren in 3D weergeven","explanation":"Het tonen van macromoleculaire structuren als 3D-beeld op basis van de atoomcoördinaten van een model. Het is de beste manier om een structuur te bekijken, te begrijpen en te analyseren.","sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":9,"createdAt":1790250000654,"id":"les_0655"},{"command":"PyMOL-venster (GUI)","tab":"structbio","group":"Moleculaire visualisatie","title":"Onderdelen van het PyMOL-scherm","explanation":"Het PyMOL-venster bestaat uit het hoofdmenu (File, Edit, Display, Setting, Wizard ...), het canvas met het 3D-beeld, de objectlijst met knoppen rechts, het GUI-menu en twee opdrachtregels (command line) waar je commando's typt.","sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":17,"createdAt":1790250000661,"id":"les_0662"},{"command":"HETATM","tab":"structbio","group":"Moleculaire visualisatie","title":"Niet-standaard atomen in PDB-bestand","explanation":"In een PDB-bestand worden atomen van niet-standaard residuen als HETATM aangeduid: liganden, water, zouten of gemodificeerde aminozuren en nucleotiden. In PyMOL selecteer je ze met het sleutelwoord hetatm.","sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":26,"createdAt":1790250000674,"id":"les_0675"},{"command":"PyMOL-sessie (.pse)","tab":"structbio","group":"Moleculaire visualisatie","title":"Bewaarde PyMOL-toestand","explanation":"Een .pse-bestand bewaart alles wat je in PyMOL deed (structuren, weergaven, kleuren, camerastandpunt). Voor elke oefening bewaar je je oplossing als sessie.","sourceName":"SB-workshop-4-molecular-visualization.pptx","slide":2,"createdAt":1790250000744,"id":"les_0745"},{"command":"PyMOL-movie","tab":"structbio","group":"Moleculaire visualisatie","title":"Animatie van een structuur","explanation":"Een filmpje in PyMOL (bv. draaien of inzoomen) vertelt soms beter een verhaal dan een stilstaande figuur. Uitleg vind je op de PyMOL-wiki onder MovieSchool.","sourceName":"SB-workshop-4-molecular-visualization.pptx","slide":10,"createdAt":1790250000759,"id":"les_0760"},{"command":"Domein","tab":"structbio","group":"Motieven & domeinen","title":"Zelfstandige structurele eenheid","explanation":"Compact deel van een eiwit dat structureel onafhankelijk is: het behoudt zijn vorm ook als het van de rest van het eiwit wordt losgemaakt. Hetzelfde domein kan in verder totaal verschillende eiwitten voorkomen.","sourceName":"SB-02-fundamentals-protein-structure.pptx","slide":69,"createdAt":1790250000792,"id":"les_0793"},{"command":"Motief (supersecundaire structuur)","tab":"structbio","group":"Motieven & domeinen","title":"Kleine combinatie van secundaire elementen","explanation":"Kleine combinatie van enkele secundaire structuurelementen, niet noodzakelijk structureel onafhankelijk, vaak met een belangrijke functie. Motieven kunnen samen domeinen vormen. De term wordt ook gebruikt voor geconserveerde sequentiepatronen.","sourceName":"SB-02-fundamentals-protein-structure.pptx","slide":70,"createdAt":1790250000793,"id":"les_0794"},{"command":"Topologieën (α, β, α/β)","tab":"structbio","group":"Motieven & domeinen","title":"Veelvoorkomende motieftypes","explanation":"α-topologieën: helix-turn-helix (bindt DNA) en four-helix bundle. β-topologieën: β-hairpin, Greek key, β-sandwich (bv. immunoglobuline) en β-barrel (bv. porines). α/β-topologieën: β-α-β-motief, Rossmann-fold (β-α-β-α-β) en horseshoe.","sourceName":"SB-02-fundamentals-protein-structure.pptx","slide":71,"createdAt":1790250000794,"id":"les_0795"},{"command":"Kernspin","tab":"structbio","group":"NMR","title":"Tollende geladen atoomkern","explanation":"Sommige atoomkernen gedragen zich als kleine tollende magneetjes. In een extern magneetveld nemen ze een spin-up (grondtoestand) of spin-down (aangeslagen) toestand in; radiogolven met de juiste energie laten ze 'omflippen'.","sourceName":"SB-04-macromolecular-structure-determination-part2.pptx","slide":5,"createdAt":1790250000845,"id":"les_0846"},{"command":"NMR-actieve isotopen","tab":"structbio","group":"NMR","title":"¹H, ¹³C, ¹⁵N en ³¹P","explanation":"Kernen die een NMR-signaal geven en belangrijk zijn voor eiwitten: proton (¹H), koolstof-13 (¹³C), stikstof-15 (¹⁵N) en fosfor-31 (³¹P). Eiwitten worden daarom vaak gelabeld met deze stabiele isotopen.","sourceName":"SB-04-macromolecular-structure-determination-part2.pptx","slide":10,"createdAt":1790250000846,"id":"les_0847"},{"command":"NMR versus röntgenkristallografie","tab":"structbio","group":"NMR","title":"Complementaire methoden vergelijken","explanation":"NMR (in oplossing) werkt vooral voor kleine eiwitten (< ~30 kDa), ook als ze deels ongeordend zijn, meerdere conformaties hebben of moeilijk kristalliseren. Solid-state NMR kan onoplosbare eiwitten zoals membraaneiwitten bestuderen.","sourceName":"SB-04-macromolecular-structure-determination-part2.pptx","slide":11,"createdAt":1790250000847,"id":"les_0848"},{"command":"NMR-conformeren (ensemble)","tab":"structbio","group":"NMR","title":"Meerdere modellen per NMR-structuur","explanation":"Een NMR-structuur bestaat uit een set van meestal 10 à 20 modellen (conformeren) met de minste fouten, gekozen uit ~100 berekende. Uiteinden en oppervlak tonen de meeste variatie.","sourceName":"SB-04-macromolecular-structure-determination-part2.pptx","slide":20,"createdAt":1790250000850,"id":"les_0851"},{"command":"RMSD","tab":"structbio","group":"NMR","title":"Gemiddelde afstand tussen gesuperponeerde structuren","explanation":"Root mean square deviation: maat voor de gemiddelde afstand (in Å) tussen overeenkomstige atomen van twee over elkaar gelegde structuren. 0 betekent een perfecte overlap; hoe kleiner, hoe gelijkaardiger.","sourceName":"SB-04-macromolecular-structure-determination-part2.pptx","slide":22,"createdAt":1790250000851,"id":"les_0852"},{"command":"Nucleotide en nucleoside","tab":"structbio","group":"Nucleïnezuren: bouwstenen","title":"Bouwstenen van DNA en RNA","explanation":"Een nucleoside bestaat uit een suiker (ribose of desoxyribose) en een stikstofbase. Een nucleotide is een nucleoside met een fosfaatgroep erbij; het is de herhalende bouwsteen van een nucleïnezuur.","sourceName":"SB-03-fundamentals-dna-rna-structure.pptx","slide":15,"createdAt":1790250000801,"id":"les_0802"},{"command":"Purines en pyrimidines","tab":"structbio","group":"Nucleïnezuren: bouwstenen","title":"Twee groepen stikstofbasen","explanation":"De basen zijn vlakke, aromatische ringmoleculen. Purines (A en G) hebben twee ringen; pyrimidines (C, T en U) hebben één ring. In sequenties worden ze afgekort als R (purine) en Y (pyrimidine).","sourceName":"SB-03-fundamentals-dna-rna-structure.pptx","slide":16,"createdAt":1790250000802,"id":"les_0803"},{"command":"DNA versus RNA","tab":"structbio","group":"Nucleïnezuren: bouwstenen","title":"Verschil in suiker en base","explanation":"DNA bevat de suiker desoxyribose en de basen A, C, G en T. RNA bevat ribose en uracil (U) in plaats van thymine. RNA is meestal enkelstrengs, DNA meestal dubbelstrengs.","sourceName":"SB-03-fundamentals-dna-rna-structure.pptx","slide":17,"createdAt":1790250000803,"id":"les_0804"},{"command":"5'CpGpCpGpApApTpTpCpG","tab":"structbio","group":"Nucleïnezuren: bouwstenen","title":"Notatie van nucleïnezuursequentie","explanation":"Sequenties worden geschreven met éénlettercodes van 5' naar 3'; 'p' staat voor de fosfaatgroep tussen twee nucleotiden. Een zelfcomplementaire dubbele helix kan kort genoteerd worden als (CGCGAATTCG)2.","parts":[{"m":"begin (5'-uiteinde) van de streng","t":"5'"},{"m":"de nucleotiden (basen)","t":"C, G, A, T, U"},{"m":"fosfaatgroep die twee nucleotiden verbindt","t":"p"},{"m":"twee identieke, complementaire strengen","t":"(…)2"}],"sourceName":"SB-03-fundamentals-dna-rna-structure.pptx","slide":19,"createdAt":1790250000804,"id":"les_0805"},{"command":"Glycosidische binding","tab":"structbio","group":"Nucleïnezuren: bouwstenen","title":"Binding tussen suiker en base","explanation":"Binding tussen het C1'-atoom van de suiker en de base (N9 bij purines, N1 bij pyrimidines). De draaihoek rond deze binding heet χ (chi).","sourceName":"SB-03-fundamentals-dna-rna-structure.pptx","slide":20,"createdAt":1790250000805,"id":"les_0806"},{"command":"PDB-formaat (.pdb)","tab":"structbio","group":"PDB-formaat","title":"Klassiek tekstformaat voor structuren","explanation":"Tekstbestand met regels van max. 80 tekens; de eerste 6 kolommen bevatten het recordtype (HEADER, REMARK, ATOM …) en elk gegeven staat op vaste kolomposities. Bevat coördinaten, chemische info en experimentele details. Het formaat is sinds 2012 bevroren; mmCIF is nu de standaard.","sourceName":"SB-05-data-representation-databases.pptx","slide":17,"createdAt":1790250000864,"id":"les_0865"},{"command":"REMARK 2 / REMARK 3","tab":"structbio","group":"PDB-formaat","title":"Resolutie en verfijning","explanation":"REMARK-records bevatten allerlei opmerkingen. REMARK 2 geeft de resolutie, REMARK 3 de gegevens over de verfijning (bv. R-factor).","sourceName":"SB-05-data-representation-databases.pptx","slide":24,"createdAt":1790250000865,"id":"les_0866"},{"command":"HELIX / SHEET","tab":"structbio","group":"PDB-formaat","title":"Secundaire structuur in bestand","explanation":"Records die aangeven welke residuen een α-helix (HELIX) of β-sheet (SHEET) vormen.","sourceName":"SB-05-data-representation-databases.pptx","slide":25,"createdAt":1790250000866,"id":"les_0867"},{"command":"MODEL / ENDMDL","tab":"structbio","group":"PDB-formaat","title":"Meerdere modellen afbakenen","explanation":"Records die het begin en einde van één model aangeven, bv. bij de verschillende conformeren van een NMR-structuur. TER markeert het einde van een keten, END het einde van het bestand.","sourceName":"SB-05-data-representation-databases.pptx","slide":27,"createdAt":1790250000867,"id":"les_0868"},{"command":"ATOM","tab":"structbio","group":"PDB-formaat","title":"Coördinaten van één atoom","explanation":"Record met de gegevens en coördinaten van elk atoom van een standaardresidu, telkens op vaste kolomposities.","parts":[{"m":"recordnaam","t":"ATOM"},{"m":"volgnummer van het atoom","t":"atoomnummer"},{"m":"bv. N, CA, C, O, CB","t":"atoomnaam"},{"m":"drielettercode, bv. LEU","t":"residunaam"},{"m":"letter van de keten, bv. A","t":"keten-ID"},{"m":"positie in de keten","t":"residunummer"},{"m":"coördinaten in Å","t":"x, y, z"}],"sourceName":"SB-05-data-representation-databases.pptx","slide":28,"createdAt":1790250000868,"id":"les_0869"},{"command":"Peptidebinding","tab":"structbio","group":"Primaire structuur","title":"Binding tussen twee aminozuren","explanation":"Covalente amidebinding tussen de carboxylgroep van het ene en de aminogroep van het volgende aminozuur, waarbij een watermolecule vrijkomt. De peptidebinding is vlak en vrij stijf.","sourceName":"SB-02-fundamentals-protein-structure.pptx","slide":30,"createdAt":1790250000784,"id":"les_0785"},{"command":"Peptide, polypeptide en residu","tab":"structbio","group":"Primaire structuur","title":"Namen voor aminozuurketens","explanation":"Een peptide is een korte keten van twee of meer aminozuren; een lange keten (typisch ≥ 50 aminozuren) heet een polypeptide. Een aminozuur dat in zo'n keten zit, noemt men een residu.","sourceName":"SB-02-fundamentals-protein-structure.pptx","slide":31,"createdAt":1790250000785,"id":"les_0786"},{"command":"Backbone, N-terminus en C-terminus","tab":"structbio","group":"Primaire structuur","title":"Ruggengraat en uiteinden van eiwitketen","explanation":"De backbone (ruggengraat) bestaat uit de atomen van de peptidebindingen (N, Cα, C). De keten begint aan de N-terminus (vrije aminogroep) en eindigt aan de C-terminus (vrije carboxylgroep).","sourceName":"SB-02-fundamentals-protein-structure.pptx","slide":33,"createdAt":1790250000786,"id":"les_0787"},{"command":"Torsiehoeken phi (Φ) en psi (Ψ)","tab":"structbio","group":"Primaire structuur","title":"Draaihoeken van de backbone","explanation":"Omdat de peptidebinding stijf is, kan de keten enkel draaien rond de bindingen van het Cα-atoom: phi (rond N–Cα) en psi (rond Cα–C). Deze twee hoeken per residu bepalen samen de 3D-vorm van de backbone.","sourceName":"SB-02-fundamentals-protein-structure.pptx","slide":35,"createdAt":1790250000787,"id":"les_0788"},{"command":"Homomeer en heteromeer","tab":"structbio","group":"Quaternaire structuur","title":"Eiwit uit meerdere ketens","explanation":"De quaternaire structuur beschrijft hoe meerdere polypeptideketens (subeenheden) samen één eiwit (multimeer) vormen. Zijn de subeenheden identiek, dan is het een homomeer; zijn ze verschillend, een heteromeer.","sourceName":"SB-02-fundamentals-protein-structure.pptx","slide":101,"createdAt":1790250000800,"id":"les_0801"},{"command":"A-RNA (dubbelstrengs RNA)","tab":"structbio","group":"RNA-structuren","title":"Helixvorm van dsRNA","explanation":"Dubbelstrengs RNA heeft bijna altijd één vorm, A-RNA: een rechtsdraaiende helix met ~11 basenparen per winding, C3'-endo pucker, een smalle diepe grote groef en een brede ondiepe kleine groef.","sourceName":"SB-03-fundamentals-dna-rna-structure.pptx","slide":72,"createdAt":1790250000820,"id":"les_0821"},{"command":"tRNA","tab":"structbio","group":"RNA-structuren","title":"L-vormig adaptermolecule","explanation":"Transfer-RNA is gevouwen in een L-vorm uit korte A-RNA-helices. Aan het 3'-CCA-uiteinde (acceptorstam) hangt het aminozuur; het anticodon in de anticodonlus past op het codon van het mRNA.","sourceName":"SB-03-fundamentals-dna-rna-structure.pptx","slide":79,"createdAt":1790250000821,"id":"les_0822"},{"command":"Ribozym","tab":"structbio","group":"RNA-structuren","title":"Katalytisch RNA-molecule","explanation":"RNA-molecule dat zelf een reactie katalyseert, bv. zichzelf of ander RNA knippen. Voorbeelden: zelfsplitsende introns, hammerhead-ribozym, RNase P en het rRNA in het ribosoom.","sourceName":"SB-03-fundamentals-dna-rna-structure.pptx","slide":81,"createdAt":1790250000822,"id":"les_0823"},{"command":"Ribosoom: A-, P- en E-site","tab":"structbio","group":"RNA-structuren","title":"Bindingsplaatsen voor tRNA","explanation":"Het ribosoom (kleine en grote subeenheid uit rRNA en eiwitten) maakt eiwitten. In de A-site bindt het aminoacyl-tRNA met het nieuwe aminozuur, in de P-site hangt het tRNA aan de groeiende peptideketen, en via de E-site verlaat het tRNA het ribosoom.","sourceName":"SB-03-fundamentals-dna-rna-structure.pptx","slide":93,"createdAt":1790250000823,"id":"les_0824"},{"command":"n λ = 2d sin θ","tab":"structbio","group":"Röntgendiffractie","title":"Wet van Bragg","explanation":"Beschrijft wanneer röntgenstralen die op opeenvolgende atoomlagen weerkaatsen in fase zijn en een heldere vlek geven. Zo kan men afstanden tussen vlakken in het kristalrooster berekenen.","parts":[{"m":"geheel getal (orde van de reflectie)","t":"n"},{"m":"golflengte van de röntgenstralen","t":"λ"},{"m":"afstand tussen de vlakken (atoomlagen) in het rooster","t":"d"},{"m":"hoek tussen de invallende straal en de vlakken","t":"θ"}],"sourceName":"SB-04-macromolecular-structure-determination-part1.pptx","slide":13,"createdAt":1790250000826,"id":"les_0827"},{"command":"Synchrotron","tab":"structbio","group":"Röntgendiffractie","title":"Ringvormige deeltjesversneller als röntgenbron","explanation":"Beste en meest gebruikte röntgenbron: een ringvormige deeltjesversneller die zeer intense straling levert aan beamlines. Bekende synchrotrons staan in Grenoble, Hamburg en Triëst.","sourceName":"SB-04-macromolecular-structure-determination-part1.pptx","slide":44,"createdAt":1790250000831,"id":"les_0832"},{"command":"Diffractiepatroon","tab":"structbio","group":"Röntgendiffractie","title":"Patroon van reflecties","explanation":"Het kristal wordt (op een lusje, ingevroren in vloeibare stikstof) in een intense monochromatische röntgenbundel geplaatst. De verstrooide stralen geven een patroon van vlekken (reflecties); door het kristal ~180° te draaien verzamelt men alle informatie.","sourceName":"SB-04-macromolecular-structure-determination-part1.pptx","slide":47,"createdAt":1790250000832,"id":"les_0833"},{"command":"α-helix","tab":"structbio","group":"Secundaire structuur","title":"Rechtsdraaiende spiraal in eiwit","explanation":"Meest voorkomende secundaire structuur: een (bijna altijd rechtsdraaiende) spiraal met ~3,6 residuen per winding. Ze wordt gestabiliseerd door H-bruggen tussen de C=O van residu i en de N-H van residu i+4; de zijketens wijzen naar buiten. Zeldzamere varianten zijn de 3₁₀-helix (3 residuen/winding) en de π-helix (4,4 residuen/winding).","sourceName":"SB-02-fundamentals-protein-structure.pptx","slide":45,"createdAt":1790250000788,"id":"les_0789"},{"command":"β-strand en β-sheet","tab":"structbio","group":"Secundaire structuur","title":"Gestrekte ketens in plaatstructuur","explanation":"Een β-strand is een kort (5–8 residuen), uitgestrekt stuk keten. Meerdere strands naast elkaar vormen via H-bruggen een geplooide β-sheet, parallel (zelfde richting) of antiparallel (tegengestelde richting). Sheets zijn meestal licht rechtsdraaiend getwist.","sourceName":"SB-02-fundamentals-protein-structure.pptx","slide":50,"createdAt":1790250000789,"id":"les_0790"},{"command":"Loop (coil)","tab":"structbio","group":"Secundaire structuur","title":"Onregelmatig verbindingsstuk","explanation":"Onregelmatige stukken tussen helices en strands, meestal aan het eiwitoppervlak; ze kunnen belangrijk zijn, bv. als actieve site. Types: hairpin loop (4–5 residuen tussen antiparallelle strands), omega-loop (6–16 residuen), extended loop en random coil (geen vaste structuur).","sourceName":"SB-02-fundamentals-protein-structure.pptx","slide":58,"createdAt":1790250000790,"id":"les_0791"},{"command":"HGNC-gennomenclatuur","tab":"structbio","group":"Sequentiedatabanken","title":"Officiële gensymbolen","explanation":"Het HUGO Gene Nomenclature Committee keurt unieke namen en symbolen voor menselijke genen goed (genenames.org). Menselijke symbolen staan volledig in hoofdletters (CDHR1); bij de muis (MGI) enkel de eerste letter (Cdhr1).","sourceName":"SB-05-data-representation-databases.pptx","slide":59,"createdAt":1790250000878,"id":"les_0879"},{"command":"GenBank en INSDC","tab":"structbio","group":"Sequentiedatabanken","title":"Archief van alle DNA-sequenties","explanation":"GenBank (NCBI) bevat alle publiek beschikbare DNA-sequenties, ingediend door auteurs en niet gecureerd. Het maakt deel uit van de INSDC samen met ENA (EBI) en DDBJ (Japan), die dagelijks data uitwisselen.","sourceName":"SB-05-data-representation-databases.pptx","slide":61,"createdAt":1790250000879,"id":"les_0880"},{"command":"RefSeq","tab":"structbio","group":"Sequentiedatabanken","title":"Gecureerde referentiesequenties van NCBI","explanation":"Door NCBI gecureerde collectie met één record per molecule, gemaakt op basis van bestaande data (in tegenstelling tot GenBank). Gecureerde data verdienen de voorkeur.","sourceName":"SB-05-data-representation-databases.pptx","slide":62,"createdAt":1790250000880,"id":"les_0881"},{"command":"UniProt: Swiss-Prot en TrEMBL","tab":"structbio","group":"Sequentiedatabanken","title":"Eiwitsequentiedatabank","explanation":"UniProt (SIB & EBI) bevat enkel eiwitdata. Swiss-Prot is manueel gecureerd, TrEMBL automatisch geannoteerd en niet gecureerd.","sourceName":"SB-05-data-representation-databases.pptx","slide":63,"createdAt":1790250000881,"id":"les_0882"},{"command":"NM_004360.4","tab":"structbio","group":"Sequentiedatabanken","title":"RefSeq-accessienummer lezen","explanation":"RefSeq-nummers hebben twee letters + underscore die het type molecule aangeven, gevolgd door een nummer en een versie.","parts":[{"m":"mRNA (NP_ = eiwit, NC_ = volledig chromosoom/genoom, NR_ = niet-coderend RNA)","t":"NM_"},{"m":"voorspelde (model) mRNA/eiwitten","t":"XM_ / XP_"},{"m":"uniek nummer","t":"004360"},{"m":"versienummer","t":".4"}],"sourceName":"SB-05-data-representation-databases.pptx","slide":64,"createdAt":1790250000882,"id":"les_0883"},{"command":"Stereochemische controle","tab":"structbio","group":"Stereochemische controle","title":"Geometrie vergelijken met de norm","explanation":"Controle van bindingslengtes, hoeken en andere geometrische eigenschappen van een model, vergeleken met wat bekend is uit hoge-resolutiestructuren. Grote afwijkingen wijzen op problemen.","sourceName":"SB-06-structure-quality-validation.pptx","slide":35,"createdAt":1790250000898,"id":"les_0899"},{"command":"Ramachandran-plot als validatie","tab":"structbio","group":"Stereochemische controle","title":"Phi/psi-controle van model","explanation":"Krachtigste controle voor eiwitten: in een goed model liggen de phi/psi-punten vooral in de gunstige gebieden, in een slecht model verspreid over verboden gebieden. Glycine heeft meer vrijheid, proline minder.","sourceName":"SB-06-structure-quality-validation.pptx","slide":36,"createdAt":1790250000899,"id":"les_0900"},{"command":"χ-hoeken (χ1–χ2-plot)","tab":"structbio","group":"Stereochemische controle","title":"Controle van zijketenhoeken","explanation":"De torsiehoeken in de zijketen (χ1 = N-Cα-Cβ-Xγ, χ2 de volgende) hebben voorkeursconformaties (rotameren). Een χ1–χ2-plot toont of zijketens in gunstige gebieden liggen.","sourceName":"SB-06-structure-quality-validation.pptx","slide":41,"createdAt":1790250000900,"id":"les_0901"},{"command":"Structurele genomica","tab":"structbio","group":"Structurele genomica","title":"Structuren op grote schaal bepalen","explanation":"Grootschalige, high-throughput structuurbepaling om een overzicht te krijgen van alle eiwitstructuren (folds) in genomen. Voorbeelden: Protein 3000 (Japan, 2002–2007) en de Protein Structure Initiative (PSI, VS, 2000–2015).","sourceName":"SB-04-macromolecular-structure-determination-part2.pptx","slide":49,"createdAt":1790250000859,"id":"les_0860"},{"command":"Structuur = model","tab":"structbio","group":"Structuren als model","title":"Structuren zijn modellen","explanation":"Elke experimentele structuur is eigenlijk een model dat de data zo goed mogelijk verklaart. Een model kan nauwkeurig of slecht zijn; daarom moet je structuren kritisch beoordelen voor je ze gebruikt.","sourceName":"SB-06-structure-quality-validation.pptx","slide":4,"createdAt":1790250000889,"id":"les_0890"},{"command":"Systematische en toevallige fouten","tab":"structbio","group":"Structuren als model","title":"Juistheid versus precisie","explanation":"Systematische fouten bepalen de juistheid (accuracy): hoe goed het model overeenkomt met de echte structuur, bv. door interpretatiefouten. Toevallige fouten bepalen de precisie: hoe nauwkeurig een meting is (vergelijkbaar met een standaardafwijking).","sourceName":"SB-06-structure-quality-validation.pptx","slide":6,"createdAt":1790250000890,"id":"les_0891"},{"command":"40%-regel sequentie-identiteit","tab":"structbio","group":"Structuur en functie","title":"Functie overdragen via sequentie","explanation":"Eiwitten met meer dan ~40% sequentie-identiteit hebben meestal dezelfde functie; daaronder daalt dat snel. Structuur blijft langer bewaard dan functie, dus voorzichtigheid is nodig (bv. δ-I en δ-II-kristalline: 94% identiek maar andere functie).","sourceName":"SB-07-structural-functional-assignment.pptx","slide":3,"createdAt":1790250000906,"id":"les_0907"},{"command":"Biochemische en biologische functie","tab":"structbio","group":"Structuur en functie","title":"Verschillende betekenissen van functie","explanation":"'Functie' kan verschillende dingen betekenen: de biochemische functie (bv. welke reactie een gezuiverd enzym in vitro katalyseert) of de biologische functie (de rol in de cel, bv. zichtbaar met een fluorescent label).","sourceName":"SB-07-structural-functional-assignment.pptx","slide":6,"createdAt":1790250000907,"id":"les_0908"},{"command":"Foute annotaties","tab":"structbio","group":"Structuur en functie","title":"Voorspelde functies kunnen fout zijn","explanation":"Veel functies in databanken zijn enkel afgeleid uit sequentiegelijkenis en kunnen fout zijn. Vertrouw bij voorkeur op manueel gecureerde data (bv. Swiss-Prot) of experimentele bevestiging.","sourceName":"SB-07-structural-functional-assignment.pptx","slide":14,"createdAt":1790250000910,"id":"les_0911"},{"command":"NMR-spectroscopie","tab":"structbio","group":"Structuurbepaling","title":"Structuurbepaling in oplossing","explanation":"Methode om een structuur te bepalen in oplossing. Het resultaat is geen enkele structuur maar een ensemble van meerdere modellen (conformeren) die allemaal bij de meetdata passen, bv. OmpG in 2JQY.","sourceName":"SB-workshop-3-molecular-visualization.pptx","slide":2,"createdAt":1790250000722,"id":"les_0723"},{"command":"Röntgenkristallografie","tab":"structbio","group":"Structuurbepaling","title":"Structuur uit eiwitkristal","explanation":"Methode waarbij een eiwitkristal met röntgenstralen wordt beschoten; uit het diffractiepatroon volgt een elektronendichtheid en een atoommodel. Een kristalstructuur toont één toestand, bv. OmpG in gesloten vorm (2IWW).","sourceName":"SB-workshop-3-molecular-visualization.pptx","slide":2,"createdAt":1790250000723,"id":"les_0724"},{"command":"Elektronentomografie","tab":"structbio","group":"Structuurbepaling","title":"3D-beeld via elektronenmicroscopie","explanation":"Techniek waarbij een staal vanuit veel hoeken met een elektronenmicroscoop wordt gefotografeerd en daarna een 3D-beeld wordt berekend. Kristalstructuren (bv. C-cadherine 1L3W) kunnen in dat beeld worden gefit.","sourceName":"SB-workshop-3-molecular-visualization.pptx","slide":4,"createdAt":1790250000729,"id":"les_0730"},{"command":"Methoden voor structuurbepaling","tab":"structbio","group":"Structuurbepaling","title":"Drie experimentele technieken","explanation":"Macromoleculaire 3D-structuren worden experimenteel bepaald met röntgenkristallografie, NMR-spectroscopie of elektronenmicroscopie (EM). Statistieken per methode staan op rcsb.org/stats.","sourceName":"SB-04-macromolecular-structure-determination-part1.pptx","slide":2,"createdAt":1790250000824,"id":"les_0825"},{"command":"VAST","tab":"structbio","group":"Structuurvergelijking","title":"Gelijkaardige 3D-structuren zoeken","explanation":"Vector Alignment Search Tool (NCBI) zoekt structuren die geometrisch op elkaar lijken. Zo vind je verre homologen die je met sequentievergelijking niet herkent.","sourceName":"SB-05-data-representation-databases.pptx","slide":72,"createdAt":1790250000884,"id":"les_0885"},{"command":"DALI","tab":"structbio","group":"Structuurvergelijking","title":"3D-structuren vergelijken","explanation":"Server (Distance Alignment Matrix Method) die eiwitstructuren in 3D vergelijkt: één structuur tegen de hele PDB, paarsgewijs tegen een lijst, of allemaal tegen elkaar. Toont verwantschap die je in de sequentie niet ziet.","sourceName":"SB-05-data-representation-databases.pptx","slide":96,"createdAt":1790250000888,"id":"les_0889"},{"command":"Suikerpuckering (C2'-endo, C3'-endo)","tab":"structbio","group":"Suikerfosfaatruggengraat","title":"Niet-vlakke vorm van suikerring","explanation":"De vijfring van de suiker is niet vlak maar 'geplooid' (puckering). De meest voorkomende vormen zijn C2'-endo (S-type, typisch voor B-DNA) en C3'-endo (N-type, typisch voor A-DNA en RNA). De pucker beïnvloedt de vorm van de hele ruggengraat.","sourceName":"SB-03-fundamentals-dna-rna-structure.pptx","slide":41,"createdAt":1790250000810,"id":"les_0811"},{"command":"Anti- en syn-conformatie","tab":"structbio","group":"Suikerfosfaatruggengraat","title":"Stand van base t.o.v. suiker","explanation":"Twee gunstige standen van de glycosidische torsiehoek χ. In anti wijst de base weg van de suiker (normaal in Watson-Crick-helices); in syn ligt de base boven de suikerring.","sourceName":"SB-03-fundamentals-dna-rna-structure.pptx","slide":45,"createdAt":1790250000811,"id":"les_0812"},{"command":"Fosfodiësterbinding","tab":"structbio","group":"Suikerfosfaatruggengraat","title":"Verbindt nucleotiden in de streng","explanation":"Covalente binding via een fosfaatgroep tussen het 3'-C-atoom van de ene suiker en het 5'-C-atoom van de volgende; zo krijgt een streng een 5'→3'-richting. De ruggengraat heeft 6 variabele torsiehoeken (α, β, γ, δ, ε, ζ).","sourceName":"SB-03-fundamentals-dna-rna-structure.pptx","slide":49,"createdAt":1790250000812,"id":"les_0813"},{"command":"Fold en eiwitvouwing","tab":"structbio","group":"Tertiaire structuur","title":"Eindvorm en vouwproces van eiwit","explanation":"De tertiaire structuur is de globale 3D-vorm van één polypeptideketen, ook de fold genoemd. Het proces waarbij de lineaire keten die vorm aanneemt, heet eiwitvouwing (protein folding).","sourceName":"SB-02-fundamentals-protein-structure.pptx","slide":68,"createdAt":1790250000791,"id":"les_0792"},{"command":"Hydrofoob effect","tab":"structbio","group":"Tertiaire structuur","title":"Hydrofobe residuen naar de kern","explanation":"Belangrijkste kracht bij de vouwing: hydrofobe zijketens worden in de kern van het eiwit gepakt, weg van het water. Polaire en geladen residuen vormen het oppervlak en interageren met water en ionen.","sourceName":"SB-02-fundamentals-protein-structure.pptx","slide":84,"createdAt":1790250000795,"id":"les_0796"},{"command":"Zoutbrug (ionpaar)","tab":"structbio","group":"Tertiaire structuur","title":"Aantrekking tussen tegengestelde ladingen","explanation":"Niet-covalente interactie tussen een positief en een negatief geladen residu. Zo kan een geladen residu toch in de hydrofobe kern zitten, omdat de netto lading nul is.","sourceName":"SB-02-fundamentals-protein-structure.pptx","slide":88,"createdAt":1790250000796,"id":"les_0797"},{"command":"Disulfidebrug","tab":"structbio","group":"Tertiaire structuur","title":"Covalente brug tussen cysteïnes","explanation":"Covalente binding tussen de thiolgroepen (-SH) van twee cysteïnes, die de fold extra stabiliseert. Cysteïne is het enige standaard-aminozuur dat dit kan; de meeste cysteïnes vormen echter geen disulfidebrug.","sourceName":"SB-02-fundamentals-protein-structure.pptx","slide":89,"createdAt":1790250000797,"id":"les_0798"},{"command":"PROCHECK","tab":"structbio","group":"Validatietools","title":"Stereochemische kwaliteit controleren","explanation":"Programma dat stereochemische parameters van een eiwitmodel berekent en plots maakt (Ramachandran-plot, χ1–χ2-plots, bindingslengtes …). Afwijkingen t.o.v. hoge-resolutiestructuren worden gemeld; beschikbaar via PDBsum.","sourceName":"SB-06-structure-quality-validation.pptx","slide":43,"createdAt":1790250000901,"id":"les_0902"},{"command":"RamplotR","tab":"structbio","group":"Validatietools","title":"Ramachandran-plots maken (Howest)","explanation":"In-house R Shiny-app van Howest BiKC om Ramachandran-plots te maken (bioit.shinyapps.io/RamplotR).","sourceName":"SB-06-structure-quality-validation.pptx","slide":49,"createdAt":1790250000902,"id":"les_0903"},{"command":"ProSa-web","tab":"structbio","group":"Validatietools","title":"Energiegebaseerde kwaliteitscontrole","explanation":"Webtool die de kwaliteit van een eiwitstructuur toont met scores en energieplots, vergeleken met alle gekende structuren; probleemzones worden gemarkeerd in 3D.","sourceName":"SB-06-structure-quality-validation.pptx","slide":50,"createdAt":1790250000903,"id":"les_0904"},{"command":"z-score (ProSa)","tab":"structbio","group":"Validatietools","title":"Globale modelkwaliteit","explanation":"Maat voor de totale kwaliteit van het model, getoond t.o.v. de z-scores van alle experimentele eiwitketens in de PDB. Valt de score buiten het gebied van gelijkaardige structuren, dan is het model verdacht.","sourceName":"SB-06-structure-quality-validation.pptx","slide":52,"createdAt":1790250000904,"id":"les_0905"},{"command":"Energieplot (ProSa)","tab":"structbio","group":"Validatietools","title":"Lokale modelkwaliteit per residu","explanation":"Toont de energie per residupositie (gemiddeld over fragmenten van 40 residuen). Positieve waarden wijzen op problematische of foute delen van het model.","sourceName":"SB-06-structure-quality-validation.pptx","slide":53,"createdAt":1790250000905,"id":"les_0906"},{"command":"Structurele alignment","tab":"structbio","group":"Vergelijken","title":"Structuren in 3D vergelijken","explanation":"Het op elkaar leggen van twee (pairwise) of meer (multiple) 3D-structuren om overeenkomsten in vouwing te vinden, ook als de sequenties weinig gelijken.","sourceName":"SB-workshop-5-databases-tools.pptx","slide":7,"createdAt":1790250000775,"id":"les_0776"},{"command":"PDBx/mmCIF","tab":"structbio","group":"mmCIF-formaat","title":"Standaard archiefformaat van PDB","explanation":"Macromolecular Crystallographic Information File: sinds 2014 het officiële formaat van het PDB-archief. Gegevens staan in categorieën als tabellen of sleutel-waardeparen, zonder limiet op het aantal atomen of ketens. Coördinaten staan in de categorie _atom_site.","sourceName":"SB-05-data-representation-databases.pptx","slide":30,"createdAt":1790250000869,"id":"les_0870"},{"command":"_categorie.attribuut","tab":"structbio","group":"mmCIF-formaat","title":"Naam van een mmCIF-gegeven","explanation":"Elk gegeven begint met een underscore; de naam bestaat uit een categorie en een attribuut, gescheiden door een punt (bv. _audit_conform.dict_name). In key-value-stijl staat de waarde gewoon achter de naam.","parts":[{"m":"begin van elke gegevensnaam","t":"_"},{"m":"bv. _audit_conform","t":"categorie"},{"m":"scheiding","t":"."},{"m":"bv. dict_name","t":"attribuut"}],"sourceName":"SB-05-data-representation-databases.pptx","slide":34,"createdAt":1790250000870,"id":"les_0871"},{"command":"loop_","tab":"structbio","group":"mmCIF-formaat","title":"Tabel in mmCIF","explanation":"Gereserveerd woord dat een tabel start: eerst volgen de kolomnamen (_categorie.attribuut), daarna de rijen met waarden.","sourceName":"SB-05-data-representation-databases.pptx","slide":35,"createdAt":1790250000871,"id":"les_0872"},{"command":"# en ; in mmCIF","tab":"structbio","group":"mmCIF-formaat","title":"Commentaar en tekst over meerdere regels","explanation":"Een regel die begint met # is commentaar. Tekst met spaties staat tussen enkele of dubbele aanhalingstekens; tekst over meerdere regels staat tussen puntkomma's (;) aan het begin van een regel.","sourceName":"SB-05-data-representation-databases.pptx","slide":36,"createdAt":1790250000872,"id":"les_0873"},{"command":"PDBML/XML","tab":"structbio","group":"mmCIF-formaat","title":"PDB-data in XML","explanation":"Protein Data Bank Markup Language: de PDB-gegevens in XML-formaat, beschreven in een XML-schema.","sourceName":"SB-05-data-representation-databases.pptx","slide":39,"createdAt":1790250000873,"id":"les_0874"}]}</script>
<script>
/* PromptFinder (default): alleen lezen en zoeken, zonder Claude. Momentopname van de lijst. */
const DATA=JSON.parse(document.getElementById("data").textContent);
const EXPORTED="24 september 2026";
const PS={linux:"$",pymol:"PyMOL>",html:""};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function toast(m){const r=$("#toastRoot");r.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML="",2200)}
async function copyText(t){ try{await navigator.clipboard.writeText(t);toast("Gekopieerd: "+(t.length>40?t.slice(0,40)+"…":t));}catch{ prompt("Kopieer:",t); } }
const tabs=[...DATA.tabs].sort((a,b)=>(a.order??99)-(b.order??99));
const prompts=DATA.prompts;
const tabById=id=>tabs.find(t=>t.id===id);
const secOf=t=>String(t?.section||"").trim()||String(t?.name||"");
function sections(){ const m=new Map(); for(const t of tabs){ const k=secOf(t); if(!m.has(k)) m.set(k,{name:k,tabs:[],grouped:false}); const g=m.get(k); g.tabs.push(t); if(String(t.section||"").trim()) g.grouped=true; } return [...m.values()]; }
const state={active:lsGet("pfd.active",tabs[0]?.id),q:"",allTabs:false};
function activeTab(){ return tabById(state.active)||tabs[0]; }
function activeSection(){ const a=activeTab(); return sections().find(g=>g.tabs.some(t=>t.id===a.id)); }
const counts={}; prompts.forEach(p=>counts[p.tab]=(counts[p.tab]||0)+1);
function searchLoc(){ if(!state.q.trim()) return null; const r=results(); if(!r.length) return null; const hits={}; r.forEach(p=>hits[p.tab]=(hits[p.tab]||0)+1); return {tab:tabById(r[0].tab),hits}; }
function renderTabs(){
  const loc=searchLoc(); state.loc=loc?.tab?.id||null; const act=loc?.tab||activeTab();
  const secs=sections(); const cur=secs.find(g=>g.tabs.some(t=>t.id===act.id));
  const num=t=>loc?(loc.hits[t.id]||0):(counts[t.id]||0);
  $("#tabs").innerHTML=secs.map(g=>{ const n=g.tabs.reduce((a,t)=>a+num(t),0); return `<button class="tab${loc&&!n?" nohit":""}" role="tab" aria-selected="${cur&&cur.name===g.name}" data-sec="${esc(g.name)}" style="--c:${esc(g.tabs[0].color||"#0B7A83")}"><span class="dot"></span>${esc(g.name)}<span class="count">${n}</span></button>`; }).join("");
  if(cur&&(cur.grouped||cur.tabs.length>1)){ $("#subbar").hidden=false;
    $("#subtabs").innerHTML=cur.tabs.map(t=>`<button class="stab${loc&&!num(t)?" nohit":""}" role="tab" aria-selected="${t.id===act.id}" data-tab="${esc(t.id)}" style="--c:${esc(t.color||"#0B7A83")}"><span class="dot"></span>${esc(t.name)}<span class="count">${num(t)}</span></button>`).join("")+(loc?`<span class="subhint">Aantal gevonden per onderdeel · beste resultaat in ${esc(act.name)}</span>`:"");
  } else { $("#subbar").hidden=true; $("#subtabs").innerHTML=""; }
}
function moveTo(id){ const t=tabById(id); if(!t) return; state.active=id; lsSet("pfd.active",id); lsSet("pfd.sec."+secOf(t),id); }
function tokens(q){ return norm(q).split(/[^a-z0-9_.\-<>!/~+]+/).filter(Boolean); }
function score(p,toks,rawq){
  const cmd=norm(p.command),title=norm(p.title),ex=norm(p.explanation),grp=norm(p.group),parts=norm((p.parts||[]).map(x=>x.t+" "+x.m).join(" ")+" "+(p.examples||[]).map(x=>x.command+" "+(x.note||"")).join(" "));
  let s=0; const nq=norm(rawq).trim();
  if(cmd===nq)s+=100; else if(cmd.startsWith(nq))s+=60; else if(cmd.includes(nq))s+=35;
  for(const t of toks){ const stem=t.length>=7?t.slice(0,t.length-2):t; const first=cmd.split(/\s+/)[0].replace(/[<>]/g,""); let hit=false;
    if(first===t.replace(/[<>]/g,"")){s+=30;hit=true} else if(cmd.includes(t)){s+=14;hit=true}
    if(title.includes(stem)){s+=10;hit=true} if(ex.includes(stem)){s+=6;hit=true} if(grp.includes(stem)){s+=4;hit=true} if(parts.includes(stem)){s+=4;hit=true} if(!hit)s-=8; }
  return s;
}
function results(){ const toks=tokens(state.q); if(!toks.length) return []; const ids=state.allTabs?null:new Set(activeSection().tabs.map(t=>t.id));
  return prompts.filter(p=>!ids||ids.has(p.tab)).map(p=>({p,s:score(p,toks,state.q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.p); }
function hl(text){ const toks=tokens(state.q).filter(t=>t.length>1); let h=esc(text); if(!toks.length) return h;
  const pats=toks.map(t=>(t.length>=7?t.slice(0,t.length-2):t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).map(esc);
  try{ return h.replace(new RegExp("("+pats.join("|")+")","gi"),"<mark>$1</mark>"); }catch{ return h; } }
function exHTML(x,ps){ return `<div class="ex"><div class="excmd">${ps?`<span class="ps">${esc(ps)}</span>`:""}<code>${esc(x.command)}</code></div>${x.output?`<pre class="exout">${esc(x.output)}</pre>`:""}${x.note?`<p class="exnote">${esc(x.note)}</p>`:""}<div class="exmeta"><span>${x.source==="les"?`les${x.sourceName?": "+esc(String(x.sourceName).replace(/\.pptx$/i,"").slice(0,28)):""}${x.slide?` · dia ${x.slide}`:""}`:"eigen screenshot"}</span></div></div>`; }
function card(p,top){
  const t=tabById(p.tab); const kind=t?.kind||""; const ps=PS[kind]??""; const parts=(p.parts||[]).filter(x=>x&&x.t); const ex=p.examples||[];
  return `<article class="card${top?" top1":""}">
    ${kind==="concept"?`<div class="term">${hl(p.command)}</div>`:`<div class="cmd">${ps?`<span class="ps">${esc(ps)}</span>`:""}<code>${hl(p.command)}</code><button class="copy" data-copy="${esc(p.id)}">Kopieer</button></div>`}
    ${p.title?`<div class="title">${hl(p.title)}</div>`:""}${p.explanation?`<p class="expl">${hl(p.explanation)}</p>`:""}
    ${ex.length?`<div class="exs"><div class="exlabel">Voorbeeld${ex.length>1?"en ("+ex.length+")":""}</div>${ex.slice().reverse().map(x=>exHTML(x,ps)).join("")}</div>`:""}
    ${parts.length?`<details class="parts"><summary>Stuk voor stuk</summary><div class="partlist">${parts.map(x=>`<code title="${esc(x.t)}">${esc(x.t)}</code><span>${esc(x.m)}</span>`).join("")}</div></details>`:""}
    <div class="meta">${(state.allTabs||state.q)&&t?`<span class="pill tabp" style="--c:${esc(t.color)}"><i></i>${esc(t.name)}</span>`:""}${state.q&&p.group?`<span class="pill">${esc(p.group)}</span>`:""}${p.sourceName?`<span class="pill">les: ${esc(String(p.sourceName).replace(/\.pptx$/i,"").slice(0,32))}${p.slide?` · dia ${p.slide}`:""}</span>`:""}</div>
  </article>`;
}
function renderLib(){
  const el=$("#lib"), act=activeTab();
  if(state.q.trim()){ const r=results(); const scope=state.allTabs?"alle tabs":activeSection().name;
    el.innerHTML=`<div class="libhead"><h1>${r.length} resultaat${r.length===1?"":"en"}</h1><span class="hint">voor “${esc(state.q)}” in ${esc(scope)} · Enter kopieert het bovenste</span></div>`+(r.length?`<div class="cards" style="margin-top:10px">${r.slice(0,60).map((p,i)=>card(p,i===0)).join("")}</div>`:`<div class="empty" style="margin-top:10px"><b>Niets gevonden</b>Probeer andere woorden of zet “in alle tabs” aan.</div>`); return; }
  const list=prompts.filter(p=>p.tab===act.id);
  if(act.kind==="concept"){ const first={}; list.forEach(p=>{const g=p.group||"Overig"; first[g]=Math.min(first[g]??Infinity,p.createdAt||0)}); list.sort((a,b)=>(first[a.group||"Overig"]-first[b.group||"Overig"])||((a.createdAt||0)-(b.createdAt||0))); }
  else list.sort((a,b)=>String(a.group||"~").localeCompare(String(b.group||"~"))||String(a.command).localeCompare(String(b.command)));
  const groups=new Map(); list.forEach(p=>{const g=p.group||"Overig"; if(!groups.has(g)) groups.set(g,[]); groups.get(g).push(p)});
  el.innerHTML=`<div class="libhead"><h1>${esc(act.name)}</h1><span class="hint">${esc(act.hint||"")}</span></div>`+[...groups].map(([g,ps])=>`<div class="group"><h3>${esc(g)} <span class="n">${ps.length}</span></h3><div class="cards">${ps.map(p=>card(p)).join("")}</div></div>`).join("");
}
function renderAll(){ renderTabs(); renderLib(); }
document.addEventListener("click",e=>{
  if(e.target.closest("[data-sec],[data-tab]")&&state.q){ q.value=""; state.q=""; $("#qClear").hidden=true; }
  const s=e.target.closest("[data-sec]"); if(s){ const g=sections().find(x=>x.name===s.dataset.sec); const last=lsGet("pfd.sec."+g.name,null); state.active=(g.tabs.find(t=>t.id===last)||g.tabs[0]).id; lsSet("pfd.active",state.active); renderAll(); return; }
  const t=e.target.closest("[data-tab]"); if(t){ state.active=t.dataset.tab; lsSet("pfd.active",state.active); lsSet("pfd.sec."+secOf(tabById(state.active)),state.active); renderAll(); return; }
  const c=e.target.closest("[data-copy]"); if(c){ const p=prompts.find(x=>x.id===c.dataset.copy); if(p) copyText(p.command); }
});
const q=$("#q");
q.addEventListener("input",()=>{ const had=state.loc; state.q=q.value; $("#qClear").hidden=!q.value; if(!q.value.trim()&&had) moveTo(had); renderTabs(); renderLib(); });
q.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const r=results(); if(r[0]) copyText(r[0].command); } });
$("#qClear").onclick=()=>{ const had=state.loc; q.value=""; state.q=""; $("#qClear").hidden=true; if(had) moveTo(had); renderTabs(); renderLib(); q.focus(); };
$("#allTabs").onchange=e=>{ state.allTabs=e.target.checked; renderTabs(); renderLib(); };
document.addEventListener("keydown",e=>{ if(e.key==="/"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); q.focus(); } });
$("#ver").textContent="Versie van "+EXPORTED+" · alleen lezen";
renderAll();
</script>
</body></html>
