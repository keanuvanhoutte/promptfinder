<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PromptFinder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%20100%20100%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22lg1%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%230E9AA5%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23075A61%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222%22%20fill%3D%22url%28%23lg1%29%22/%3E%3Crect%20x%3D%2216%22%20y%3D%2222%22%20width%3D%2256%22%20height%3D%2242%22%20rx%3D%227%22%20fill%3D%22%230F1A21%22/%3E%3Ccircle%20cx%3D%2223%22%20cy%3D%2228%22%20r%3D%221.8%22%20fill%3D%22%23FF6B5E%22/%3E%3Ccircle%20cx%3D%2229%22%20cy%3D%2228%22%20r%3D%221.8%22%20fill%3D%22%23F5B83D%22/%3E%3Ccircle%20cx%3D%2235%22%20cy%3D%2228%22%20r%3D%221.8%22%20fill%3D%22%233CCB7F%22/%3E%3Cpath%20d%3D%22M24%2040%20l7%206%20-7%206%22%20stroke%3D%22%233BE0EA%22%20stroke-width%3D%223.6%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Crect%20x%3D%2235%22%20y%3D%2250%22%20width%3D%2212%22%20height%3D%223.6%22%20rx%3D%221.8%22%20fill%3D%22%233BE0EA%22/%3E%3Ccircle%20cx%3D%2266%22%20cy%3D%2264%22%20r%3D%2214%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22/%3E%3Ccircle%20cx%3D%2266%22%20cy%3D%2264%22%20r%3D%2211%22%20fill%3D%22rgba%28255%2C255%2C255%2C.18%29%22/%3E%3Cpath%20d%3D%22M76%2074%20l9%209%22%20stroke%3D%22%23fff%22%20stroke-width%3D%227%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --surface-2:#F6F8F9; --ink:#15202A; --muted:#5A6874; --line:#D5DDE2;
  --accent:#0B7A83; --accent-ink:#FFFFFF; --accent-soft:#DCEFF0;
  --code-bg:#121B23; --code-ink:#DCE7EF; --code-dim:#7C8C99;
  --warn:#9A5B00; --warn-soft:#FBEFD9; --bad:#B3261E; --good:#1E7A46;
  --shadow:0 1px 2px rgba(16,32,44,.06),0 4px 14px rgba(16,32,44,.06);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1419; --surface:#151F27; --surface-2:#1A262F; --ink:#E4ECF1; --muted:#90A0AC; --line:#26343F;
    --accent:#3BBFC8; --accent-ink:#06282B; --accent-soft:#12343A;
    --code-bg:#0A1116; --code-ink:#DCE7EF; --code-dim:#6F8190;
    --warn:#F0B35A; --warn-soft:#3A2B12; --bad:#FF8A80; --good:#6FD39A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1419; --surface:#151F27; --surface-2:#1A262F; --ink:#E4ECF1; --muted:#90A0AC; --line:#26343F;
  --accent:#3BBFC8; --accent-ink:#06282B; --accent-soft:#12343A;
  --code-bg:#0A1116; --code-ink:#DCE7EF; --code-dim:#6F8190;
  --warn:#F0B35A; --warn-soft:#3A2B12; --bad:#FF8A80; --good:#6FD39A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}

/* ---------- Top: brand + tabs ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;gap:12px;padding:10px 16px 0;max-width:1100px;margin:0 auto}
.brand{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.brand .caret{color:var(--accent)}
.brand .logo{width:26px;height:26px;flex:0 0 auto;margin-right:2px}
.brandrow .spacer{flex:1}
.storage{font-size:12px;color:var(--muted)}
.claudest{font-size:12px;color:var(--muted);white-space:nowrap}
.claudest.st-granted{color:var(--good)}
.claudest.st-prompt,.claudest.st-denied{color:var(--warn)}
@media (max-width:520px){.storage{display:none}}
.iconbtn{border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;font-size:13px}
.iconbtn:hover{background:var(--surface);border-color:var(--line);color:var(--ink)}
.tabs{display:flex;align-items:flex-end;gap:2px;padding:8px 16px 0;max-width:1100px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 14px 10px;border:1px solid transparent;border-bottom:none;border-radius:10px 10px 0 0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;position:relative;top:1px;white-space:nowrap}
.tab:hover{background:color-mix(in srgb,var(--surface) 60%,transparent);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink)}
.tab .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent));flex:0 0 auto}
.tab .count{font-size:11px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.tab.add{color:var(--muted);font-weight:500;padding-inline:12px}
.subtabs{display:flex;align-items:center;gap:6px;padding:8px 16px;max-width:1100px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs[hidden]{display:none!important}
.subbar{background:var(--surface);border-top:1px solid var(--line)}
.stab{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.stab:hover{color:var(--ink);border-color:var(--c,var(--accent))}
.stab[aria-selected="true"]{background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);border-color:var(--c,var(--accent));color:var(--ink)}
.stab .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent))}
.stab .count{font-size:11px;font-weight:500;color:var(--muted)}
.stab.add{border-style:dashed;font-weight:500}
.stab.dragging,.tab.dragging{opacity:.4}
.stab.dropbefore{box-shadow:-3px 0 0 var(--accent)}
.tab.nohit,.stab.nohit{opacity:.45}
.subhint{font-size:12px;color:var(--muted);white-space:nowrap;margin-left:4px}

/* ---------- Main ---------- */
main{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
.searchwrap{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.search{flex:1 1 320px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 8px 0 16px;box-shadow:var(--shadow);min-height:48px}
.search:focus-within{border-color:var(--accent)}
.search svg{flex:0 0 auto;color:var(--muted)}
.search input{flex:1;min-width:0;border:none;background:transparent;outline:none;font-size:16px;padding:12px 0}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{border:none;background:transparent;color:var(--muted);padding:6px 8px;border-radius:999px}
.searchopts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);user-select:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Drop zone */
.drop{border:1.5px dashed var(--line);border-radius:14px;background:var(--surface-2);padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .txt{flex:1 1 260px;min-width:0}
.drop .txt b{display:block;font-size:14px}
.drop .txt span{font-size:13px;color:var(--muted)}
.kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:none;background:transparent;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* Review */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.panel-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{font-size:15px;margin:0;flex:1 1 auto}
.panel-b{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.qlist{gap:14px}
.job{display:flex;flex-direction:column;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.job:last-child{border-bottom:none;padding-bottom:0}
.jhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.jthumb{height:56px;width:auto;max-width:120px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:0 0 auto}
.jthumb.ph{width:80px;display:grid;place-items:center;font-size:11px;color:var(--muted);background:var(--surface-2)}
.jinfo{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:3px}
.jacts{display:flex;gap:6px;flex-wrap:wrap}
.chip{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:1px 8px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.s-bezig{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.s-klaar{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chip.s-fout{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.jthumb.deck{width:56px;display:grid;place-items:center;background:#C4502A;color:#fff;font-family:var(--mono);font-weight:700;font-size:11px;border:none}
.jtitle{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.jname{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.rows{display:flex;flex-direction:column;gap:10px}
.rrow.dupe{background:transparent;border-style:dashed}
.rrow.dupe.off{opacity:.85}
.exs{display:flex;flex-direction:column;gap:6px}
.exlabel{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.ex{border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 8px 8px 0;padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.excmd{display:flex;gap:6px;font-family:var(--mono);font-size:12.5px;min-width:0}
.excmd .ps{color:var(--muted)}
.excmd code{white-space:pre-wrap;word-break:break-word;font-family:inherit}
.exout{margin:0;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:pre-wrap;word-break:break-word;max-height:9em;overflow:auto}
.exnote{margin:0;font-size:13.5px}
.exmeta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.linkbtn{border:none;background:none;padding:0;color:var(--accent);font-weight:600;font-size:12px;text-decoration:underline;text-underline-offset:2px}
.linkbtn.danger{color:var(--bad)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px}
.compare>div{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);min-width:0}
@media (max-width:600px){.compare{grid-template-columns:1fr}}
.thumbs img{height:64px;width:auto;border-radius:6px;border:1px solid var(--line)}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.notice{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--ink)}
.notice b{color:var(--warn)}
.rrow{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.rrow.off{opacity:.55}
.rrow input[type=checkbox]{width:18px;height:18px;margin-top:10px;accent-color:var(--accent)}
.rfields{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
.rfields .full{grid-column:1/-1}
@media (max-width:600px){.rfields{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:7px 9px;font-size:14px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:60px}
.field .mono,.field input.mono{font-family:var(--mono);font-size:13px}
.tagline{font-size:12px;color:var(--muted)}
.tagline.dup{color:var(--warn);font-weight:600}

/* Library */
.libhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.libhead h1{font-size:20px;margin:0;text-wrap:balance}
.libhead .hint{color:var(--muted);font-size:13px;flex:1 1 200px}
.group{display:flex;flex-direction:column;gap:8px}
.group{margin-top:10px}
.group h3{margin:0;padding-bottom:6px;border-bottom:1px solid var(--line);font-size:17px;letter-spacing:-.005em;color:var(--ink);font-weight:700;display:flex;gap:10px;align-items:baseline}
.group h3 .n{font-size:13px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
@media (max-width:420px){.cards{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.top1{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.term{font-family:var(--mono);font-weight:700;font-size:16px;color:var(--accent);overflow-wrap:anywhere}
.tab.dragging{opacity:.4}
.tab.dropbefore{box-shadow:inset 3px 0 0 var(--accent)}
.cmd{display:flex;align-items:flex-start;gap:8px;background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:9px 10px;font-family:var(--mono);font-size:13px;min-width:0}
.cmd .ps{color:var(--code-dim);flex:0 0 auto;user-select:none}
.cmd code{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;font-family:inherit}
.cmd .copy{flex:0 0 auto;border:1px solid #2C3A45;background:transparent;color:var(--code-ink);border-radius:6px;font-size:11px;padding:2px 7px;font-family:var(--sans);font-weight:600}
.cmd .copy:hover{background:#22303B}
.card .title{font-weight:700;font-size:14px}
.card .expl{font-size:14px;color:var(--ink);margin:0}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:11px;border-radius:999px;padding:1px 8px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-weight:600}
.pill.sample{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pill.tabp{display:inline-flex;align-items:center;gap:5px}
.pill.tabp i{width:7px;height:7px;border-radius:50%;background:var(--c)}
details.parts summary{font-size:12px;color:var(--accent);cursor:pointer;font-weight:600}
.partlist{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin-top:6px;font-size:13px}
.partlist code{font-family:var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:12px;white-space:nowrap;max-width:40vw;overflow:hidden;text-overflow:ellipsis;justify-self:start}
.cardfoot{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-top:auto}
mark{background:color-mix(in srgb,var(--accent) 28%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;background:var(--surface-2)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.smart{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(8,14,18,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .panel-b{gap:10px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;background:var(--c)}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.menu{position:absolute;right:16px;top:44px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;min-width:220px;z-index:40}
.menu button{border:none;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;font-size:14px}
.menu button:hover{background:var(--surface-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
<style>
.subtabs{display:flex;align-items:center;gap:6px;padding:8px 16px;max-width:1100px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.subbar{background:var(--surface);border-top:1px solid var(--line)}
.stab{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.stab[aria-selected="true"]{background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);border-color:var(--c,var(--accent));color:var(--ink)}

<script id="data" type="application/json">{"tabs":[{"id":"algemeen","name":"Algemeen","kind":"concept","color":"#5A6874","order":1,"hint":"Begrippen en uitleg: besturingssysteem, kernel, shell, bash, prompt, pad, pipe, HTML, CSS, PDB …"},{"id":"linux","name":"Linux","kind":"linux","color":"#C27C0E","order":2,"hint":"Commando's in de Linux-terminal (bash)"},{"id":"html","name":"HTML","kind":"html","color":"#3559C7","order":3,"hint":"HTML-tags en -attributen om webpagina's te schrijven","section":"Web design"},{"id":"css","name":"CSS","kind":"","color":"#7A4FD0","order":3.3,"hint":"CSS: opmaak van webpagina's (selectors, kleuren, box model, layout)","section":"Web design"},{"id":"php","name":"PHP","kind":"","color":"#B3407A","order":3.6,"hint":"PHP: code die op de webserver draait (variabelen, lussen, formulieren)","section":"Web design"},{"id":"pymol","name":"PyMOL","kind":"pymol","color":"#1E8A5A","order":4,"hint":"PyMOL-commando's om eiwitstructuren te bekijken","section":"Struc. bio"},{"id":"structbio","name":"Structurele biologie","kind":"concept","color":"#0B7A83","order":5,"hint":"Begrippen uit structurele biologie: eiwit- en DNA-structuur, structuurbepaling, databanken, validatie","section":"Struc. bio"}],"prompts":[{"command":"Bestandssysteem","tab":"algemeen","group":"Bestanden & mappen","title":"Hoe bestanden georganiseerd zijn","explanation":"De manier waarop bestanden en mappen op de schijf bewaard worden. Op Linux is dat één grote boom die start bij de root-map /, zonder stationsletters zoals C: op Windows.","createdAt":1790244000015,"id":"alg_bestandssysteem"},{"command":"Map (directory)","tab":"algemeen","group":"Bestanden & mappen","title":"Een container voor bestanden","explanation":"Wat je op Windows een 'folder' noemt. In de terminal heet het een directory. Mappen kunnen andere mappen bevatten, zo ontstaat een boomstructuur.","createdAt":1790244000016,"id":"alg_map-directory"},{"command":"Root-map ( / )","tab":"algemeen","group":"Bestanden & mappen","title":"Het begin van het bestandssysteem","explanation":"De bovenste map waar alles onder hangt. Belangrijke mappen eronder: /home (thuismappen), /bin en /usr (programma's), /etc (instellingen), /tmp (tijdelijke bestanden).","parts":[{"m":"thuismappen","t":"/home"},{"m":"instellingen","t":"/etc"},{"m":"tijdelijk","t":"/tmp"}],"createdAt":1790244000017,"id":"alg_root-map"},{"command":"Thuismap ( ~ )","tab":"algemeen","group":"Bestanden & mappen","title":"Jouw eigen map","explanation":"Elke gebruiker heeft een eigen map, bv. /home/guest. Het teken ~ is er een afkorting voor. Met cd zonder argument ga je er altijd naartoe.","createdAt":1790244000018,"id":"alg_thuismap"},{"command":"Pad (absoluut en relatief)","tab":"algemeen","group":"Bestanden & mappen","title":"Het 'adres' van een bestand","explanation":"Een absoluut pad start bij de root: /home/guest/data/seq.fasta. Een relatief pad start vanaf de map waar je nu staat: data/seq.fasta. . betekent 'deze map', .. betekent 'één map hoger'.","parts":[{"m":"huidige map","t":"."},{"m":"bovenliggende map","t":".."}],"createdAt":1790244000019,"id":"alg_pad-absoluut-en-relatief"},{"command":"Verborgen bestand","tab":"algemeen","group":"Bestanden & mappen","title":"Bestand dat met een punt begint","explanation":"Bestanden zoals .bashrc worden niet getoond door een gewone ls. Ze bevatten meestal instellingen. Toon ze met ls -a.","createdAt":1790244000020,"id":"alg_verborgen-bestand"},{"command":"Bestandsrechten (rwx)","tab":"algemeen","group":"Bestanden & mappen","title":"Wie mag wat met een bestand","explanation":"Elk bestand heeft rechten voor de eigenaar, de groep en de rest: lezen (r), schrijven (w) en uitvoeren (x). ls -l toont ze, bv. -rwxr-xr--. Je past ze aan met chmod.","parts":[{"m":"read, lezen","t":"r"},{"m":"write, schrijven","t":"w"},{"m":"execute, uitvoeren","t":"x"}],"createdAt":1790244000021,"id":"alg_bestandsrechten-rwx"},{"command":"Bestandsnamen in Linux","tab":"algemeen","group":"Bestanden & mappen","title":"Regels voor goede bestandsnamen","explanation":"In Linux is alles een bestand en zijn extensies (zoals .txt) niet verplicht, maar wel handig. Gebruik geen speciale tekens zoals ( ) [ ] { } / ? * ' \" ~ ` & $ ! | in namen; punten en komma's mogen wel.","sourceName":"Chapter 3 - Organizing files.pptx","slide":4,"createdAt":1790250000066,"id":"les_0067"},{"command":"Bestandstypes","tab":"algemeen","group":"Bestanden & mappen","title":"Soorten bestanden in Linux","explanation":"Linux kent gewone bestanden (tekst), uitvoerbare bestanden (programma's), mappen, links (verwijzing naar een bestand op een andere plaats), sockets (netwerkcommunicatie tussen processen) en named pipes (communicatie tussen processen zonder netwerk).","sourceName":"Chapter 3 - Organizing files.pptx","slide":5,"createdAt":1790250000067,"id":"les_0068"},{"command":"Systeemmappen","tab":"algemeen","group":"Bestanden & mappen","title":"Vaste mappen van het systeem","explanation":"Systeembestanden staan in vaste mappen: bin/sbin/lib voor programma's, etc voor configuratie, dev/media/mnt voor hardware, doc/share voor documentatie. /boot bevat de kernel, /proc en /run lopende processen, /lost+found teruggevonden bestanden. Die mappen bestaan op drie niveaus: /, /usr en /usr/local.","sourceName":"Chapter 3 - Organizing files.pptx","slide":9,"createdAt":1790250000074,"id":"les_0075"},{"command":"Inode","tab":"algemeen","group":"Bestanden & mappen","title":"Verwijzing naar data op schijf","explanation":"Een inode is een verwijzing naar de datablokken van een bestand op de harde schijf. Eén of meer bestandsnamen zijn gekoppeld aan een inode; zo kan dezelfde data meerdere namen hebben (links).","sourceName":"Chapter 3 - Organizing files.pptx","slide":24,"createdAt":1790250000094,"id":"les_0095"},{"command":"Hardlink en symbolische link","tab":"algemeen","group":"Bestanden & mappen","title":"Twee soorten links","explanation":"Een hardlink is een extra naam voor dezelfde inode (dezelfde data); verwijder je het origineel, dan blijft de data bereikbaar via de hardlink. Een symbolische link (symlink) is een klein apart bestand met een eigen inode dat naar een andere bestandsnaam wijst; verwijder je het origineel, dan werkt de symlink niet meer.","sourceName":"Chapter 3 - Organizing files.pptx","slide":25,"createdAt":1790250000095,"id":"les_0096"},{"command":"Archief","tab":"algemeen","group":"Bestanden & mappen","title":"Veel bestanden in één bestand","explanation":"Een archief bundelt veel bestanden en mappen in één bestand (bv. .tar). Zo kan je ze makkelijk als één geheel verplaatsen of een back-up maken. Een archief is niet automatisch gecomprimeerd.","sourceName":"Chapter 6 - The work environment.pptx","slide":24,"createdAt":1790250000233,"id":"les_0234"},{"command":"Compressie","tab":"algemeen","group":"Bestanden & mappen","title":"Bestand kleiner maken","explanation":"Compressie maakt een bestand kleiner zodat het minder schijfruimte inneemt, bv. met gzip (.gz) of bzip2 (.bz2). Een .tar.gz is een archief dat daarna gecomprimeerd werd.","sourceName":"Chapter 6 - The work environment.pptx","slide":27,"createdAt":1790250000237,"id":"les_0238"},{"command":"Scheidingsteken (delimiter)","tab":"algemeen","group":"Bestanden & mappen","title":"Teken tussen de kolommen","explanation":"Het scheidingsteken is het teken dat de kolommen (velden) van een tabel van elkaar scheidt, meestal een tab, spatie of komma. Bij veel commando's kun je het instellen, bv. cut -d, join -t of de awk-variabele FS.","sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":9,"createdAt":1790250000259,"id":"les_0260"},{"command":"Record en veld","tab":"algemeen","group":"Bestanden & mappen","title":"Regel en kolom van een tabel","explanation":"In een tabelbestand is een record één regel (één rij) en een veld één kolom binnen die regel. Commando's zoals cut, sort, join en awk werken met die velden.","sourceName":"Chapter 7 - Tables and text file manipulation.pptx","slide":22,"createdAt":1790250000278,"id":"les_0279"},{"command":"PDB (Protein Data Bank)","tab":"algemeen","group":"Bio-informatica","title":"Databank met 3D-structuren","explanation":"Een publieke databank met experimenteel bepaalde 3D-structuren van eiwitten en nucleïnezuren. Elke structuur heeft een code van 4 tekens, bv. 1UBQ. In PyMOL laad je die met fetch 1ubq.","createdAt":1790244000043,"id":"alg_pdb-protein-data-bank"},{"command":"FASTA","tab":"algemeen","group":"Bio-informatica","title":"Tekstformaat voor sequenties","explanation":"Een eenvoudig formaat voor DNA- of eiwitsequenties: een regel die begint met > bevat de naam, de regels eronder de sequentie. Daarom telt grep -c '>' het aantal sequenties.","parts":[{"m":"titelregel","t":">naam"},{"m":"sequentie","t":"ATGC…"}],"createdAt":1790244000044,"id":"alg_fasta"},{"command":"PyMOL","tab":"algemeen","group":"Bio-informatica","title":"Programma om moleculen in 3D te bekijken","explanation":"Toont eiwitstructuren in 3D en laat je ze kleuren, selecteren en meten. Je kan klikken in de menu's of commando's typen achter de PyMOL>-prompt.","createdAt":1790244000045,"id":"alg_pymol"},{"command":"Eiwitstructuur (primair tot quaternair)","tab":"algemeen","group":"Bio-informatica","title":"De vier niveaus van een eiwit","explanation":"Primair: de volgorde van aminozuren. Secundair: lokale vormen zoals α-helices en β-sheets. Tertiair: de volledige 3D-vouwing van één keten. Quaternair: hoe meerdere ketens samen een complex vormen.","parts":[{"m":"PyMOL-weergave die de secundaire structuur toont","t":"cartoon"}],"createdAt":1790244000046,"id":"alg_eiwitstructuur-primair-tot-quaternair"},{"command":"Reproduceerbaarheid","tab":"algemeen","group":"Bio-informatica","title":"Analyse opnieuw met zelfde resultaat","explanation":"Een analyse is reproduceerbaar als iemand anders ze later opnieuw kan uitvoeren en hetzelfde resultaat krijgt. Dat is nodig voor goed databeheer en FAIR-data (Findable, Accessible, Interoperable, Reusable). Hoe meer je isoleert (VENV < container < virtuele machine), hoe reproduceerbaarder.","sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":4,"createdAt":1790250000298,"id":"les_0299"},{"command":"Virtuele omgeving (VENV)","tab":"algemeen","group":"Bio-informatica","title":"Afgeschermde set software-versies","explanation":"Een virtuele omgeving is een aparte omgeving waarin je analysetools en hun afhankelijkheden in een bepaalde versie installeert, los van de rest van het systeem. Je kunt ze exporteren en elders opnieuw opbouwen, bv. met Conda.","sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":6,"createdAt":1790250000301,"id":"les_0302"},{"command":"Conda","tab":"algemeen","group":"Bio-informatica","title":"Pakketbeheerder met virtuele omgevingen","explanation":"Conda is een pakketbeheerder die afgeschermde omgevingen beheert, inclusief afhankelijkheden en versies. Je hebt geen administratorrechten nodig. Miniconda is een afgeslankte versie van de volledige Anaconda.","sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":9,"createdAt":1790250000303,"id":"les_0304"},{"command":"Kanaal (conda channel)","tab":"algemeen","group":"Bio-informatica","title":"Bron van kant-en-klare pakketten","explanation":"Een kanaal is een online verzameling voorgecompileerde conda-pakketten. Voorbeelden: defaults, conda-forge (algemene software en bibliotheken) en bioconda (bio-informaticasoftware). De volgorde van de kanalen staat in ~/.condarc.","sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":9,"createdAt":1790250000304,"id":"les_0305"},{"command":"Wet lab en dry lab","tab":"algemeen","group":"Bio-informatica","title":"Experimenteel labo versus computerwerk","explanation":"In het wet lab doe je experimenten met echte biologische stalen. In het dry lab werk je op de computer: je ontwikkelt en gebruikt algoritmes en tools om biologische data om te zetten in kennis, die dan weer tot nieuwe experimenten leidt.","sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":5,"createdAt":1790250000652,"id":"les_0653"},{"command":"Moleculaire visualisatiesoftware","tab":"algemeen","group":"Bio-informatica","title":"Programma's om moleculen te bekijken","explanation":"Programma's die 3D-structuren van moleculen tonen, bv. PyMOL, Cn3D, Jmol, Swiss-PdbViewer, VMD en YASARA. Een lijst vind je op de RCSB-website (rcsb.org/docs/additional-resources/molecular-graphics-software).","sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":14,"createdAt":1790250000655,"id":"les_0656"},{"command":"LiteMol","tab":"algemeen","group":"Bio-informatica","title":"3D-viewer in de webbrowser","explanation":"Gratis HTML5-webapplicatie om moleculen in 3D te bekijken in je browser. Ze is ingebouwd in PDBe (Protein Data Bank in Europe) en andere websites zoals UniProt en Ensembl; de broncode staat op GitHub.","sourceName":"SB-01-introduction-workshop-1-molecular-visualization.pptx","slide":15,"createdAt":1790250000656,"id":"les_0657"},{"command":"Multiple sequence alignment (MSA)","tab":"algemeen","group":"Bio-informatica","title":"Meerdere sequenties onder elkaar uitlijnen","explanation":"Meerdere eiwit- of DNA-sequenties zo onder elkaar zetten dat overeenkomstige posities in dezelfde kolom staan. Zo zie je welke residuen geconserveerd zijn tussen soorten of familieleden.","sourceName":"SB-workshop-2-molecular-visualization.pptx","slide":10,"createdAt":1790250000712,"id":"les_0713"},{"command":"RCSB-sequentieweergave","tab":"algemeen","group":"Bio-informatica","title":"Annotaties langs de sequentie","explanation":"Op rcsb.org/sequence/<PDB-code> zie je per keten de sequentie met annotaties: secundaire structuur, UniProt-koppeling, bindingsplaatsen, glycosylaties, disulfidebruggen, domeinen (Pfam, CATH) en validatie-outliers.","sourceName":"SB-workshop-3-molecular-visualization.pptx","slide":11,"createdAt":1790250000740,"id":"les_0741"},{"command":"PyMOL Script Library","tab":"algemeen","group":"Bio-informatica","title":"Verzameling kant-en-klare PyMOL-scripts","explanation":"Op de PyMOL-wiki (pymolwiki.org, Category:Script_Library) staan veel gratis scripts die extra functies toevoegen, bv. findseq of kleuren volgens conservering.","sourceName":"SB-workshop-4-molecular-visualization.pptx","slide":4,"createdAt":1790250000748,"id":"les_0749"},{"command":"NCBI Protein","tab":"algemeen","group":"Bio-informatica","title":"Databank met eiwitsequenties","explanation":"Databank van het NCBI met eiwitsequenties. Je zoekt er bv. isoformen van een eiwit en bewaart de sequenties in FASTA-formaat, bv. voor een alignment.","sourceName":"SB-workshop-5-databases-tools.pptx","slide":2,"createdAt":1790250000760,"id":"les_0761"},{"command":"RefSeq","tab":"algemeen","group":"Bio-informatica","title":"Gecureerde referentiesequenties (NCBI)","explanation":"Collectie van het NCBI met één gecontroleerde, niet-redundante referentiesequentie per transcript of eiwit. Handig om te tellen hoeveel echte eiwitvarianten een gen heeft.","sourceName":"SB-workshop-5-databases-tools.pptx","slide":2,"createdAt":1790250000761,"id":"les_0762"},{"command":"NCBI Gene","tab":"algemeen","group":"Bio-informatica","title":"Databank met informatie per gen","explanation":"Databank van het NCBI met per gen de officiële naam en het symbool, de transcripten en eiwitten, en links naar andere databanken.","sourceName":"SB-workshop-5-databases-tools.pptx","slide":3,"createdAt":1790250000763,"id":"les_0764"},{"command":"CD-search","tab":"algemeen","group":"Bio-informatica","title":"Geconserveerde domeinen zoeken","explanation":"Tool van het NCBI (Conserved Domain search) die in een eiwitsequentie de gekende domeinen zoekt en hun posities en belangrijke residuen toont.","sourceName":"SB-workshop-5-databases-tools.pptx","slide":3,"createdAt":1790250000764,"id":"les_0765"},{"command":"HGNC (genenames.org)","tab":"algemeen","group":"Bio-informatica","title":"Officiële menselijke gennamen","explanation":"Het HUGO Gene Nomenclature Committee kent officiële namen en symbolen toe aan menselijke genen en groepeert ze in genfamilies, bv. de cadherines (CDH1, CDH2 ...).","sourceName":"SB-workshop-5-databases-tools.pptx","slide":7,"createdAt":1790250000777,"id":"les_0778"},{"command":"PubMed","tab":"algemeen","group":"Bio-informatica","title":"Databank met wetenschappelijke artikels","explanation":"Zoekmachine van het NCBI voor biomedische wetenschappelijke publicaties (pubmed.ncbi.nlm.nih.gov).","sourceName":"SB-workshop-5-databases-tools.pptx","slide":7,"createdAt":1790250000778,"id":"les_0779"},{"command":"PubMed en MeSH","tab":"algemeen","group":"Bio-informatica","title":"Wetenschappelijke literatuur zoeken","explanation":"PubMed (NCBI) doorzoekt miljoenen biomedische publicaties, vooral uit MEDLINE. Automatic Term Mapping koppelt zoektermen aan MeSH-trefwoorden, tijdschriften en auteurs; met een zoektag of een zinsdeel tussen aanhalingstekens (\"transcription factor\") wordt dat overgeslagen.","sourceName":"SB-05-data-representation-databases.pptx","slide":46,"createdAt":1790250000874,"id":"les_0875"},{"command":"salmonella AND (hamburger OR eggs)","tab":"algemeen","group":"Bio-informatica","title":"Zoektermen combineren met operatoren","explanation":"Booleaanse operatoren combineren zoektermen in PubMed. Ze worden van links naar rechts verwerkt; haakjes veranderen de volgorde.","parts":[{"m":"alle termen moeten voorkomen","t":"AND"},{"m":"minstens één term moet voorkomen","t":"OR"},{"m":"sluit resultaten met de volgende term uit (voorzichtig gebruiken)","t":"NOT"},{"m":"wordt eerst samen verwerkt","t":"( )"}],"sourceName":"SB-05-data-representation-databases.pptx","slide":50,"createdAt":1790250000875,"id":"les_0876"},{"command":"transcript* [ti]","tab":"algemeen","group":"Bio-informatica","title":"Zoeken in titel met truncatie","explanation":"Zoekveldtags tussen vierkante haken beperken de zoekopdracht tot één veld. Met * zoek je alle woorden die met dat stuk beginnen (transcript, transcription, transcriptase …).","parts":[{"m":"begin van het zoekwoord","t":"transcript"},{"m":"truncatie: gelijk welk vervolg","t":"*"},{"m":"zoek enkel in de titel","t":"[ti]"}],"sourceName":"SB-05-data-representation-databases.pptx","slide":53,"createdAt":1790250000876,"id":"les_0877"},{"command":"2014:2018 [dp]","tab":"algemeen","group":"Bio-informatica","title":"Zoeken binnen een periode","explanation":"Zoekt publicaties binnen een bereik van publicatiedatums.","parts":[{"m":"bereik van 2014 tot 2018","t":"2014:2018"},{"m":"zoekveld publicatiedatum","t":"[dp]"}],"sourceName":"SB-05-data-representation-databases.pptx","slide":53,"createdAt":1790250000877,"id":"les_0878"},{"command":"Besturingssysteem (OS)","tab":"algemeen","group":"Computer & besturingssysteem","title":"Software die je computer beheert","explanation":"Het basisprogramma dat de hardware (processor, geheugen, schijf) beheert en andere programma's laat draaien. Voorbeelden: Windows, macOS, Linux, Android.","parts":[{"m":"Operating System","t":"OS"}],"createdAt":1790244000000,"id":"alg_besturingssysteem-os"},{"command":"Kernel","tab":"algemeen","group":"Computer & besturingssysteem","title":"Het hart van het besturingssysteem","explanation":"Het centrale deel van het OS dat rechtstreeks met de hardware praat: het verdeelt processortijd en geheugen over programma's en regelt de toegang tot bestanden en apparaten. Je werkt er nooit rechtstreeks mee; je vraagt dingen via de shell of programma's.","parts":[{"m":"is strikt genomen de naam van een kernel","t":"Linux"}],"createdAt":1790244000001,"id":"alg_kernel"},{"command":"Linux","tab":"algemeen","group":"Computer & besturingssysteem","title":"Een gratis, open besturingssysteem","explanation":"Een besturingssysteem gebouwd rond de Linux-kernel. Het wordt veel gebruikt op servers en in de bio-informatica, omdat veel analyseprogramma's er (enkel) voor gemaakt zijn en alles met commando's te automatiseren is.","createdAt":1790244000002,"id":"alg_linux"},{"command":"Distributie (distro)","tab":"algemeen","group":"Computer & besturingssysteem","title":"Een 'versie' van Linux","explanation":"Een pakket van de Linux-kernel met programma's, een pakketbeheerder en een bureaublad errond. Voorbeelden: Ubuntu, Fedora, Debian. De commando's zijn grotendeels dezelfde; vooral de pakketbeheerder verschilt (apt op Ubuntu, dnf op Fedora).","parts":[{"m":"apt","t":"Ubuntu/Debian"},{"m":"dnf","t":"Fedora"}],"createdAt":1790244000003,"id":"alg_distributie-distro"},{"command":"Virtuele machine (VM)","tab":"algemeen","group":"Computer & besturingssysteem","title":"Een computer in je computer","explanation":"Software die een volledige computer nabootst, zodat je bv. Linux kan draaien binnen Windows. Wat je in de VM doet, raakt je eigen systeem niet. Programma's: VirtualBox, VMware, WSL op Windows.","createdAt":1790244000004,"id":"alg_virtuele-machine-vm"},{"command":"UNIX","tab":"algemeen","group":"Computer & besturingssysteem","title":"Voorloper van Linux","explanation":"UNIX is een besturingssysteem dat eind jaren '60 bij Bell Labs ontwikkeld werd, eenvoudig en in de taal C geschreven zodat code herbruikbaar was. Het werd veel gebruikt door grote bedrijven, maar was duur. Linux is een gratis kloon van UNIX.","sourceName":"Chapter 1 - Introduction.pptx","slide":10,"createdAt":1790250000000,"id":"les_0001"},{"command":"GNU","tab":"algemeen","group":"Computer & besturingssysteem","title":"Vrij UNIX-achtig softwareproject","explanation":"GNU ('GNU's Not UNIX') is een beweging die gratis, vrije UNIX-software aanbiedt, zoals Bash, GCC en de coreutils. Samen met de Linux-kernel vormt die software een volledig besturingssysteem.","sourceName":"Chapter 1 - Introduction.pptx","slide":11,"createdAt":1790250000001,"id":"les_0002"},{"command":"GNOME","tab":"algemeen","group":"Computer & besturingssysteem","title":"Grafische desktopomgeving van GNU","explanation":"GNOME is de GNU-desktopomgeving: de grafische gebruikersinterface (GUI) met vensters, iconen en menu's. Fedora Workstation gebruikt standaard GNOME.","sourceName":"Chapter 1 - Introduction.pptx","slide":22,"createdAt":1790250000006,"id":"les_0007"},{"command":"Fedora Workstation","tab":"algemeen","group":"Computer & besturingssysteem","title":"Linux-distributie van deze cursus","explanation":"Fedora is een gratis open-sourcedistributie van Linux, ondersteund door Red Hat. In deze cursus installeer je Fedora Workstation in een virtuele machine.","sourceName":"Chapter 1 - Introduction.pptx","slide":24,"createdAt":1790250000007,"id":"les_0008"},{"command":"ISO-bestand","tab":"algemeen","group":"Computer & besturingssysteem","title":"Installatiebestand van een besturingssysteem","explanation":"Een ISO-bestand is een kopie (image) van een installatieschijf in één bestand. Je hebt het ISO-bestand van Fedora Workstation nodig om Linux in een virtuele machine te installeren.","sourceName":"Chapter 1 - Introduction.pptx","slide":25,"createdAt":1790250000008,"id":"les_0009"},{"command":"Root (superuser)","tab":"algemeen","group":"Gebruikers","title":"De beheerder van het systeem","explanation":"De gebruiker die alles mag, ook systeembestanden aanpassen of verwijderen. Daarom werk je normaal als gewone gebruiker en gebruik je sudo alleen als het echt nodig is.","createdAt":1790244000022,"id":"alg_root-superuser"},{"command":"sudo","tab":"algemeen","group":"Gebruikers","title":"Eén commando als beheerder uitvoeren","explanation":"Zet je sudo voor een commando, dan wordt het uitgevoerd met root-rechten (na je wachtwoord). Nodig om bv. software te installeren. Wees voorzichtig: fouten met sudo kunnen het systeem beschadigen.","createdAt":1790244000023,"id":"alg_sudo"},{"command":"Multi-user omgeving","tab":"algemeen","group":"Gebruikers","title":"Meerdere gebruikers op één systeem","explanation":"Linux laat meerdere gebruikers tegelijk op één systeem werken. Daarom heeft elk bestand een eigenaar, een groep en rechten, voor privacy en veiligheid.","sourceName":"Chapter 3 - Organizing files.pptx","slide":41,"createdAt":1790250000113,"id":"les_0114"},{"command":"Octale notatie van rechten","tab":"algemeen","group":"Gebruikers","title":"Rechten als letters en getallen","explanation":"r (lezen) = 4, w (schrijven) = 2, x (uitvoeren; bij een map: binnengaan met cd) = 1. Tel ze op per gebruikersgroep: u (user), g (group), o (others). Zo is rwx = 7, rw- = 6 en r-x = 5; 755 betekent rwxr-xr-x.","sourceName":"Chapter 3 - Organizing files.pptx","slide":44,"createdAt":1790250000114,"id":"les_0115"},{"command":"stdin, stdout, stderr","tab":"algemeen","group":"In- en uitvoer","title":"De drie standaardkanalen","explanation":"Elk commando heeft standaardinvoer (stdin, meestal het toetsenbord), standaarduitvoer (stdout, gewone uitvoer) en standaardfout (stderr, foutmeldingen). Beide uitvoerkanalen verschijnen in de terminal, maar je kan ze apart doorsturen.","parts":[{"m":"stdin","t":"0"},{"m":"stdout","t":"1"},{"m":"stderr","t":"2"}],"createdAt":1790244000030,"id":"alg_stdin-stdout-stderr"},{"command":"Redirect ( > en >> )","tab":"algemeen","group":"In- en uitvoer","title":"Uitvoer naar een bestand sturen","explanation":"Met > schrijf je de uitvoer van een commando in een bestand (overschrijft), met >> voeg je toe aan het einde. Met 2> stuur je foutmeldingen apart door. Bv. ls -l > lijst.txt.","parts":[{"m":"overschrijven","t":">"},{"m":"toevoegen","t":">>"},{"m":"foutmeldingen","t":"2>"}],"createdAt":1790244000031,"id":"alg_redirect-en"},{"command":"Pipe ( | )","tab":"algemeen","group":"In- en uitvoer","title":"Commando's aan elkaar koppelen","explanation":"Stuurt de uitvoer van het ene commando als invoer naar het volgende. Bv. grep '>' seq.fasta | wc -l telt het aantal sequenties. Zo bouw je met kleine commando's een grotere analyse.","createdAt":1790244000032,"id":"alg_pipe"},{"command":"Jokerteken (wildcard)","tab":"algemeen","group":"In- en uitvoer","title":"Patroon om meerdere bestanden te kiezen","explanation":"De shell vervangt patronen door passende bestandsnamen: * = eender welke tekens, ? = precies één teken, [abc] = één van deze tekens, [!abc] = geen van deze. Bv. ls *.fasta.","parts":[{"m":"nul of meer tekens","t":"*"},{"m":"precies één teken","t":"?"}],"createdAt":1790244000033,"id":"alg_jokerteken-wildcard"},{"command":"Reguliere expressie (regex)","tab":"algemeen","group":"In- en uitvoer","title":"Zoekpatroon voor tekst","explanation":"Een krachtigere zoektaal dan jokertekens, gebruikt door grep, sed en awk. Bv. ^ATG zoekt regels die met ATG beginnen, [0-9]+ zoekt één of meer cijfers. Let op: regex en jokertekens gebruiken * en ? anders.","parts":[{"m":"begin van de regel","t":"^"},{"m":"einde van de regel","t":"$"},{"m":"eender welk teken","t":"."}],"createdAt":1790244000034,"id":"alg_reguliere-expressie-regex"},{"command":"File descriptor (0, 1, 2)","tab":"algemeen","group":"In- en uitvoer","title":"Nummer voor invoer- of uitvoerkanaal","explanation":"De shell geeft elk in- en uitvoerkanaal een nummer: 0 = standaardinvoer (stdin), 1 = standaarduitvoer (stdout), 2 = standaardfout (stderr). Met die nummers kan je ze apart omleiden, bv. 2> voor foutmeldingen.","sourceName":"Chapter 5 - Input and output.pptx","slide":13,"createdAt":1790250000184,"id":"les_0185"},{"command":"Delimiter (scheidingsteken)","tab":"algemeen","group":"In- en uitvoer","title":"Teken dat stukken tekst scheidt","explanation":"Een delimiter is een teken of reeks tekens die de verschillende stukken in een tekst van elkaar scheidt, zoals een komma, puntkomma, tab of spatie. In PHP gebruik je een delimiter bij explode() en implode().","sourceName":"4. Fundamentals of PHP.pptx","slide":87,"createdAt":1790250000604,"id":"les_0605"},{"command":"Server en client","tab":"algemeen","group":"Netwerk","title":"Wie aanbiedt en wie vraagt","explanation":"Een server is een computer (of programma) die diensten aanbiedt, zoals websites of rekenkracht. Een client vraagt die op, bv. je browser of je terminal via ssh.","createdAt":1790244000035,"id":"alg_server-en-client"},{"command":"SSH","tab":"algemeen","group":"Netwerk","title":"Veilig inloggen op een andere computer","explanation":"Secure Shell: hiermee open je een terminal op een andere computer (bv. een rekenserver van school) via het netwerk, beveiligd met versleuteling. Bv. ssh student@server.be.","createdAt":1790244000036,"id":"alg_ssh"},{"command":"SFTP","tab":"algemeen","group":"Netwerk","title":"Bestanden veilig overzetten","explanation":"(S)FTP staat voor (SSH) File Transfer Protocol: een manier om bestanden van en naar een server over te zetten, bv. met het programma FileZilla.","sourceName":"Chapter 2 - The terminal.pptx","slide":37,"createdAt":1790250000061,"id":"les_0062"},{"command":"Poort (netwerk)","tab":"algemeen","group":"Netwerk","title":"Genummerd toegangspunt voor netwerkverkeer","explanation":"Een poort is een nummer waarmee netwerkverkeer bij het juiste programma terechtkomt, bv. poort 80 voor een webserver. Met docker run --publish koppel je een poort van de host aan een poort in de container.","sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":32,"createdAt":1790250000346,"id":"les_0347"},{"command":"localhost en poort","tab":"algemeen","group":"Netwerk","title":"Je eigen computer als server","explanation":"localhost betekent: je eigen computer. Het poortnummer (bv. 8080) kies je als een 'kamer' waarin je website draait; kies een getal tussen 1024 en 65535, meestal 8000 of 8080. Zo kun je je site privé testen in de browser.","sourceName":"5. Dynamic Web Pages.pptx","slide":4,"createdAt":1790250000615,"id":"les_0616"},{"command":"Proces","tab":"algemeen","group":"Programma's & processen","title":"Een programma dat nu draait","explanation":"Elke keer dat je een programma start, maakt het besturingssysteem er een proces van met een eigen nummer (PID). Je bekijkt processen met ps of top en stopt ze met kill.","parts":[{"m":"Process ID, het nummer van het proces","t":"PID"}],"createdAt":1790244000024,"id":"alg_proces"},{"command":"Pakketbeheerder","tab":"algemeen","group":"Programma's & processen","title":"Installeert en updatet software","explanation":"Een programma dat software downloadt, installeert en up-to-date houdt, zoals een app store in de terminal. Voorbeelden: apt (Ubuntu), dnf (Fedora), conda en pip (Python/bio-informatica).","createdAt":1790244000025,"id":"alg_pakketbeheerder"},{"command":"Script","tab":"algemeen","group":"Programma's & processen","title":"Een bestand vol commando's","explanation":"Een tekstbestand (bv. analyse.sh) met commando's die na elkaar uitgevoerd worden. Handig om een analyse te herhalen of te automatiseren. Maak het uitvoerbaar met chmod +x en start het met ./analyse.sh.","createdAt":1790244000026,"id":"alg_script"},{"command":"Variabele","tab":"algemeen","group":"Programma's & processen","title":"Een naam die een waarde onthoudt","explanation":"In bash maak je een variabele met NAAM=waarde (zonder spaties rond =) en gebruik je ze met $NAAM, bv. echo $NAAM.","parts":[{"m":"variabele maken","t":"NAAM=waarde"},{"m":"waarde gebruiken","t":"$NAAM"}],"createdAt":1790244000027,"id":"alg_variabele"},{"command":"Omgevingsvariabele","tab":"algemeen","group":"Programma's & processen","title":"Instelling die programma's kunnen lezen","explanation":"Een variabele die voor alle programma's in je shell geldt, bv. $HOME (je thuismap) of $USER (je gebruikersnaam). Toon ze allemaal met env.","createdAt":1790244000028,"id":"alg_omgevingsvariabele"},{"command":"PATH","tab":"algemeen","group":"Programma's & processen","title":"Waar de shell programma's zoekt","explanation":"Een omgevingsvariabele met een lijst mappen. Typ je ls, dan zoekt de shell in die mappen naar een programma met die naam. 'command not found' betekent vaak dat het programma niet in je PATH staat of niet geïnstalleerd is.","parts":[{"m":"toon de lijst","t":"echo $PATH"}],"createdAt":1790244000029,"id":"alg_path"},{"command":"Open source","tab":"algemeen","group":"Programma's & processen","title":"Software met vrij beschikbare broncode","explanation":"Open source betekent dat de broncode van software vrij beschikbaar is: iedereen mag ze bekijken, aanpassen en verder verspreiden. Linux en de GNU-tools zijn open source.","sourceName":"Chapter 1 - Introduction.pptx","slide":11,"createdAt":1790250000002,"id":"les_0003"},{"command":"GPL (General Public License)","tab":"algemeen","group":"Programma's & processen","title":"Belangrijkste open-sourcelicentie","explanation":"De GPL is de licentie die door GNU opgesteld werd. Ze bepaalt dat je software vrij mag gebruiken, aanpassen en delen, op voorwaarde dat aangepaste versies ook onder de GPL vrij blijven.","sourceName":"Chapter 1 - Introduction.pptx","slide":11,"createdAt":1790250000003,"id":"les_0004"},{"command":"GCC (GNU C Compiler)","tab":"algemeen","group":"Programma's & processen","title":"Compiler voor broncode","explanation":"GCC is de compiler van GNU: hij zet broncode (bv. in C) om naar een programma dat de computer kan uitvoeren. Je gebruikt hem om toepassingen vanuit hun broncode te bouwen.","sourceName":"Chapter 1 - Introduction.pptx","slide":15,"createdAt":1790250000004,"id":"les_0005"},{"command":"Coreutils","tab":"algemeen","group":"Programma's & processen","title":"Basisprogramma's van GNU","explanation":"De coreutils zijn een set basisopdrachten die op elk Linux-systeem aanwezig zijn, zoals ls (inhoud van mappen tonen), cat (bestanden bekijken) en chmod (bestandsrechten wijzigen).","sourceName":"Chapter 1 - Introduction.pptx","slide":15,"createdAt":1790250000005,"id":"les_0006"},{"command":"PID (proces-ID)","tab":"algemeen","group":"Programma's & processen","title":"Uniek nummer van een proces","explanation":"Elk programma dat je start krijgt een PID: een uniek getal waarmee Linux het proces herkent. Je gebruikt de PID om een proces op te zoeken (ps) of te stoppen (kill).","sourceName":"Chapter 4 - Processes.pptx","slide":5,"createdAt":1790250000130,"id":"les_0131"},{"command":"Job","tab":"algemeen","group":"Programma's & processen","title":"Programma gestart vanuit de shell","explanation":"Een job is één of meer programma's die je als één shellcommando uitvoert. In je terminal krijgt elke job een jobnummer (bv. [1]) dat je met jobs, fg, bg en kill %nr gebruikt.","sourceName":"Chapter 4 - Processes.pptx","slide":5,"createdAt":1790250000131,"id":"les_0132"},{"command":"Batchproces","tab":"algemeen","group":"Programma's & processen","title":"Automatisch proces in een wachtrij","explanation":"Een proces dat niet vanuit een terminal gestart wordt, maar automatisch. Batchprocessen staan in een wachtrij en worden volgens het FIFO-principe (first in, first out) uitgevoerd.","sourceName":"Chapter 4 - Processes.pptx","slide":6,"createdAt":1790250000132,"id":"les_0133"},{"command":"Ouder- en kindproces","tab":"algemeen","group":"Programma's & processen","title":"Proces dat een ander proces start","explanation":"Een kindproces (child) is een proces dat door een ander proces, de ouder (parent), gestart wordt. Start je een commando in de terminal, dan is de shell de ouder en het commando het kind. Elk proces heeft een ouder, behalve init.","sourceName":"Chapter 4 - Processes.pptx","slide":6,"createdAt":1790250000133,"id":"les_0134"},{"command":"init","tab":"algemeen","group":"Programma's & processen","title":"Eerste proces van het systeem","explanation":"init is het allereerste proces dat bij het opstarten gestart wordt; het heeft als enige proces geen ouder. Het adopteert ook weesprocessen. Op moderne Fedora heet dit proces systemd (PID 1).","sourceName":"Chapter 4 - Processes.pptx","slide":6,"createdAt":1790250000134,"id":"les_0135"},{"command":"Daemon","tab":"algemeen","group":"Programma's & processen","title":"Achtergronddienst zonder terminal","explanation":"Een daemon is een serverproces dat continu op de achtergrond draait zonder terminal. Het wacht op werk en levert een dienst, bv. een maildaemon of de cron-daemon.","sourceName":"Chapter 4 - Processes.pptx","slide":7,"createdAt":1790250000135,"id":"les_0136"},{"command":"Weesproces (orphan)","tab":"algemeen","group":"Programma's & processen","title":"Proces waarvan de ouder gestopt is","explanation":"Een weesproces is een proces waarvan het ouderproces afgesloten (gekild) werd. Het blijft verder draaien en wordt overgenomen door init.","sourceName":"Chapter 4 - Processes.pptx","slide":7,"createdAt":1790250000136,"id":"les_0137"},{"command":"Zombieproces","tab":"algemeen","group":"Programma's & processen","title":"Beëindigd proces nog in procestabel","explanation":"Normaal leest het ouderproces de exitstatus van een beëindigd kindproces, waarna het uit de procestabel verdwijnt. Een zombie is al gestopt maar staat nog in de procestabel. top toont hoeveel zombies er zijn.","sourceName":"Chapter 4 - Processes.pptx","slide":8,"createdAt":1790250000137,"id":"les_0138"},{"command":"Voorgrond en achtergrond","tab":"algemeen","group":"Programma's & processen","title":"Waar een proces draait","explanation":"Een voorgrondproces 'bezet' de terminal: je kan pas verder typen als het klaar is. Een achtergrondproces (gestart met &) laat de terminal vrij; handig voor programma's die lang lopen en geen invoer nodig hebben.","sourceName":"Chapter 4 - Processes.pptx","slide":10,"createdAt":1790250000138,"id":"les_0139"},{"command":"Signaal (SIGTERM, SIGKILL …)","tab":"algemeen","group":"Programma's & processen","title":"Bericht om proces te sturen","explanation":"Met kill stuur je een signaal naar een proces. SIGTERM (15) stopt het proces netjes, SIGINT (2) onderbreekt het (kan genegeerd worden), SIGKILL (9) stopt het altijd, SIGHUP (1) laat een daemon zijn configuratie opnieuw inlezen.","sourceName":"Chapter 4 - Processes.pptx","slide":22,"createdAt":1790250000153,"id":"les_0154"},{"command":"Prioriteit (nice-waarde)","tab":"algemeen","group":"Programma's & processen","title":"Hoe voorrang een proces krijgt","explanation":"De nice-waarde bepaalt hoeveel processortijd een proces krijgt, van -20 (hoogste prioriteit) tot +19 (laagste). Standaard is ze 0. Hoe 'vriendelijker' (nicer) een proces, hoe minder voorrang het neemt.","sourceName":"Chapter 4 - Processes.pptx","slide":26,"createdAt":1790250000161,"id":"les_0162"},{"command":"Cron-daemon","tab":"algemeen","group":"Programma's & processen","title":"Voert geplande taken automatisch uit","explanation":"De cron-daemon kijkt elke minuut of er taken uitgevoerd moeten worden. Die taken staan in crontab-bestanden: elke regel is een taak die herhaald wordt, bv. dagelijks de index voor locate bijwerken.","sourceName":"Chapter 4 - Processes.pptx","slide":33,"createdAt":1790250000171,"id":"les_0172"},{"command":"RPM- en DEB-pakketten","tab":"algemeen","group":"Programma's & processen","title":"Softwarepakketten per distributie","explanation":"Welke pakketten je gebruikt, hangt af van de distributie: RPM (Red Hat Package Manager) bij Red Hat, Fedora, CentOS; DEB bij Debian en Ubuntu. Daarnaast bestaan bronpakketten (.tar.gz met broncode) die je zelf moet compileren.","sourceName":"Chapter 6 - The work environment.pptx","slide":32,"createdAt":1790250000246,"id":"les_0247"},{"command":"Container","tab":"algemeen","group":"Programma's & processen","title":"Geïsoleerde omgeving voor een programma","explanation":"Een container is een afgeschermde omgeving die binnen het besturingssysteem van de host draait en een tool met al zijn afhankelijkheden bevat. Containers zijn lichter en sneller dan virtuele machines, makkelijk over te zetten naar andere systemen en te automatiseren. Docker is het bekendste systeem, Singularity een ander.","sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":17,"createdAt":1790250000320,"id":"les_0321"},{"command":"Image (Docker)","tab":"algemeen","group":"Programma's & processen","title":"Alleen-lezen sjabloon voor containers","explanation":"Een image is een alleen-lezen sjabloon met een besturingssysteem en software. Een container is een draaiend exemplaar van een image; van één image kun je veel containers starten.","sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":19,"createdAt":1790250000322,"id":"les_0323"},{"command":"Docker registry","tab":"algemeen","group":"Programma's & processen","title":"Online opslagplaats van images","explanation":"Een registry is een online plaats waar kant-en-klare images klaarstaan om te downloaden (pull). Docker Hub is het belangrijkste publieke registry; BioContainers verzamelt images van bio-informaticatools.","sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":24,"createdAt":1790250000330,"id":"les_0331"},{"command":"Dockerfile","tab":"algemeen","group":"Programma's & processen","title":"Recept om een image te bouwen","explanation":"Een Dockerfile is een tekstbestand met instructies om een image te bouwen. Het start meestal van een basis-image (bv. ubuntu of alpine) en elke regel voegt een laag toe. Met docker build maak je er een image van.","sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":34,"createdAt":1790250000350,"id":"les_0351"},{"command":"Docker compose","tab":"algemeen","group":"Programma's & processen","title":"Meerdere containers samen beheren","explanation":"Docker compose is de volgende stap na Docker: waar Docker één container start, beheert Docker compose meerdere containers samen. De instellingen staan in een yaml-bestand (standaard docker-compose.yml).","sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":37,"createdAt":1790250000353,"id":"les_0354"},{"command":"Podman","tab":"algemeen","group":"Programma's & processen","title":"Veiliger alternatief voor Docker","explanation":"Podman is een alternatief voor Docker, gebruikt in omgevingen waar veiligheid belangrijk is. Bijna alle commando's zijn gelijk aan die van Docker, maar Podman gebruikt geen daemon op de achtergrond en vraagt geen lidmaatschap van de docker-groep of sudo.","sourceName":"Chapter 8 - Reproducible bioinformatics research in Linux_student.pptx","slide":41,"createdAt":1790250000359,"id":"les_0360"},{"command":"Lus (loop)","tab":"algemeen","group":"Programma's & processen","title":"Opdrachten herhalen","explanation":"Een lus herhaalt een reeks opdrachten: voor elk element uit een lijst (for) of zolang een voorwaarde waar is (while). Zonder stopvoorwaarde loopt een lus eindeloos door.","sourceName":"Chapter 9 - Shell scripting - student.pptx","slide":23,"createdAt":1790250000392,"id":"les_0393"},{"command":"Teksteditor (VS Code)","tab":"algemeen","group":"Programma's & processen","title":"Programma om code te schrijven","explanation":"Een teksteditor is een programma waarin je gewone tekst en code schrijft, zoals HTML-, CSS- en PHP-bestanden. In deze les gebruik je Visual Studio Code (VS Code).","sourceName":"1. Introduction.pptx","slide":7,"createdAt":1790250000409,"id":"les_0410"},{"command":"RPM-pakket (.rpm)","tab":"algemeen","group":"Programma's & processen","title":"Installatiebestand voor Fedora","explanation":"Een .rpm-bestand is een softwarepakket voor Linux-distributies zoals Fedora. Je installeert het met sudo dnf install gevolgd door de naam van het bestand.","sourceName":"1. Introduction.pptx","slide":14,"createdAt":1790250000414,"id":"les_0415"},{"command":"Scripttaal","tab":"algemeen","group":"Programma's & processen","title":"Taal voor geautomatiseerde instructies","explanation":"Een scripttaal is een programmeertaal waarmee je de computer een reeks geschreven instructies automatisch laat uitvoeren, in plaats van het werk met de hand te doen. PHP is zo'n scripttaal: je gebruikt het om data te verwerken of om dynamische webpagina's te maken.","sourceName":"4. Fundamentals of PHP.pptx","slide":3,"createdAt":1790250000531,"id":"les_0532"},{"command":"Voorwaarde (conditional)","tab":"algemeen","group":"Programma's & processen","title":"Beslissing nemen in code","explanation":"Met een voorwaarde (conditional) laat je code een beslissing nemen: het programma controleert of iets waar (true) of onwaar (false) is en voert op basis daarvan andere code uit. Bijvoorbeeld: ALS het getal even is, DAN toon \"even\", ANDERS toon \"oneven\".","sourceName":"4. Fundamentals of PHP.pptx","slide":50,"createdAt":1790250000573,"id":"les_0574"},{"command":"Terminal","tab":"algemeen","group":"Terminal & shell","title":"Het venster waarin je commando's typt","explanation":"Een programma dat een tekstvenster toont waarin je commando's intypt en de uitvoer leest. De terminal zelf voert niets uit: hij geeft wat je typt door aan de shell.","createdAt":1790244000005,"id":"alg_terminal"},{"command":"Shell","tab":"algemeen","group":"Terminal & shell","title":"Het programma dat je commando's uitvoert","explanation":"Leest wat je in de terminal typt, begrijpt het en start de juiste programma's. Het is de 'tolk' tussen jou en het besturingssysteem. Er bestaan verschillende shells: bash, zsh, fish …","createdAt":1790244000006,"id":"alg_shell"},{"command":"Bash","tab":"algemeen","group":"Terminal & shell","title":"De meest gebruikte shell op Linux","explanation":"Bourne Again SHell: de standaardshell op de meeste Linux-systemen. Naast losse commando's kan je in bash ook scripts schrijven met variabelen, lussen en voorwaarden.","parts":[{"m":"andere shell, standaard op macOS","t":"zsh"}],"createdAt":1790244000007,"id":"alg_bash"},{"command":"Prompt (in de terminal)","tab":"algemeen","group":"Terminal & shell","title":"Het tekstje dat wacht op je commando","explanation":"De tekst voor je cursor, bv. guest@fedora:~$. Die toont wie je bent (guest), op welke computer (fedora), in welke map (~ = thuismap) en eindigt op $ (gewone gebruiker) of # (root). Je typt je commando erachter.","parts":[{"m":"gebruikersnaam","t":"guest"},{"m":"naam van de computer","t":"fedora"},{"m":"huidige map","t":"~"},{"m":"klaar voor je commando","t":"$"}],"createdAt":1790244000008,"id":"alg_prompt-in-de-terminal"},{"command":"Prompt (bij AI)","tab":"algemeen","group":"Terminal & shell","title":"Een opdracht of vraag aan een AI","explanation":"Bij AI-programma's zoals Claude is een prompt de tekst die je intypt om iets te vragen. Dat is iets anders dan de prompt in de terminal, al lijken beide op 'de plek waar je iets typt'.","createdAt":1790244000009,"id":"alg_prompt-bij-ai"},{"command":"Commando","tab":"algemeen","group":"Terminal & shell","title":"Een opdracht die je in de shell typt","explanation":"Een instructie voor de computer, meestal de naam van een programma gevolgd door opties en argumenten. Bv. in 'ls -l documenten' is ls het commando.","parts":[{"m":"commando","t":"ls"},{"m":"optie","t":"-l"},{"m":"argument","t":"documenten"}],"createdAt":1790244000010,"id":"alg_commando"},{"command":"Optie (flag)","tab":"algemeen","group":"Terminal & shell","title":"Past aan hoe een commando werkt","explanation":"Begint met - of --, bv. -l of --all. Opties veranderen het gedrag: ls toont namen, ls -l toont ook details. Korte opties mag je combineren: -la is hetzelfde als -l -a.","parts":[{"m":"korte optie","t":"-a"},{"m":"lange optie, zelfde betekenis","t":"--all"}],"createdAt":1790244000011,"id":"alg_optie-flag"},{"command":"Argument","tab":"algemeen","group":"Terminal & shell","title":"Waarop het commando werkt","explanation":"De extra informatie na een commando, zoals een bestandsnaam of map. In 'cp a.txt b.txt' zijn a.txt en b.txt de argumenten.","createdAt":1790244000012,"id":"alg_argument"},{"command":"Manpage","tab":"algemeen","group":"Terminal & shell","title":"De ingebouwde handleiding","explanation":"Elke gebruikelijke Linux-opdracht heeft een handleiding die je opent met man, bv. man ls. Blader met de pijltjes, zoek met /, sluit af met q. Veel commando's tonen ook korte hulp met --help.","parts":[{"m":"handleiding van ls","t":"man ls"},{"m":"korte hulp","t":"ls --help"}],"createdAt":1790244000013,"id":"alg_manpage"},{"command":"Tab-aanvulling","tab":"algemeen","group":"Terminal & shell","title":"Laat de terminal namen afmaken","explanation":"Druk op Tab terwijl je een commando of bestandsnaam typt: de shell vult de rest aan. Twee keer Tab toont alle mogelijkheden. Scheelt typwerk en typfouten.","createdAt":1790244000014,"id":"alg_tab-aanvulling"},{"command":"GUI en CLI","tab":"algemeen","group":"Terminal & shell","title":"Grafische vs. tekstinterface","explanation":"Een GUI (graphical user interface, bv. GNOME) bedien je met muis, vensters en iconen: eerst kies je het object, dan de actie. Een CLI (command line interface, de terminal) bedien je met getypte commando's: eerst de actie, dan het object (bv. rm bestand).","sourceName":"Chapter 2 - The terminal.pptx","slide":4,"createdAt":1790250000009,"id":"les_0010"},{"command":"Virtuele console","tab":"algemeen","group":"Terminal & shell","title":"Pure terminal zonder grafische omgeving","explanation":"Een virtuele console is een volledig scherm met enkel een tekstterminal, zonder GUI. Je opent er een met Ctrl + Alt + F3 tot F6 en keert terug naar de grafische omgeving met Ctrl + Alt + F2.","sourceName":"Chapter 2 - The terminal.pptx","slide":7,"createdAt":1790250000010,"id":"les_0011"},{"command":"Ingebouwd commando (shell built-in)","tab":"algemeen","group":"Terminal & shell","title":"Commando dat deel is van Bash","explanation":"Sommige commando's, zoals cd, pwd en exit, zijn geen apart programma maar zitten ingebouwd in de shell Bash zelf. Ze werken dus zodra een terminal met Bash opstart.","sourceName":"Chapter 2 - The terminal.pptx","slide":18,"createdAt":1790250000030,"id":"les_0031"},{"command":"Exitstatus","tab":"algemeen","group":"Terminal & shell","title":"Getal na afloop van commando","explanation":"Als een commando klaar is, geeft het een getal terug aan de shell: de exitstatus. 0 betekent dat alles goed ging; een ander getal (bv. 1 of 2) wijst op een fout. De man page legt de betekenis uit onder EXIT STATUS.","sourceName":"Chapter 2 - The terminal.pptx","slide":29,"createdAt":1790250000053,"id":"les_0054"},{"command":"Configuratiebestand","tab":"algemeen","group":"Terminal & shell","title":"Bestand met instellingen","explanation":"Een tekstbestand met instellingen die een programma of de shell bij het opstarten inleest. Shellconfiguratiebestanden zijn eigenlijk scripts met shellcommando's, bv. ~/.bashrc (voor jezelf) en /etc/profile (voor het hele systeem).","sourceName":"Chapter 6 - The work environment.pptx","slide":6,"createdAt":1790250000199,"id":"les_0200"},{"command":"Soorten shellvariabelen","tab":"algemeen","group":"Terminal & shell","title":"Omgevings-, gewone en systeemvariabelen","explanation":"Linux kent 3 soorten: omgevingsvariabelen (beheerd door de shell en doorgegeven aan elke nieuwe shell, bv. $PATH), gewone variabelen (door jezelf gemaakt, enkel in je huidige shell tot je ze exporteert) en systeemvariabelen (van het systeem, bv. $OSTYPE).","sourceName":"Chapter 6 - The work environment.pptx","slide":10,"createdAt":1790250000204,"id":"les_0205"},{"command":"Subshell","tab":"algemeen","group":"Terminal & shell","title":"Shell gestart binnen een shell","explanation":"Een nieuwe shell die je vanuit je huidige shell start, bv. door bash te typen. Ze erft enkel geëxporteerde variabelen. Met exit keer je terug naar de vorige shell.","sourceName":"Chapter 6 - The work environment.pptx","slide":13,"createdAt":1790250000208,"id":"les_0209"},{"command":"Alias","tab":"algemeen","group":"Terminal & shell","title":"Korte bijnaam voor een commando","explanation":"Een alias is een korte, eigen naam voor een (lang) commando dat je vaak gebruikt, bv. ll voor ls -l. Zet je hem in ~/.bashrc, dan blijft hij bewaard.","sourceName":"Chapter 6 - The work environment.pptx","slide":21,"createdAt":1790250000230,"id":"les_0231"},{"command":"HTML","tab":"algemeen","group":"Web","title":"De structuur van een webpagina","explanation":"HyperText Markup Language: beschrijft wat er op een pagina staat (titels, tekst, afbeeldingen, links) met tags zoals <h1> en <p>. HTML is geen programmeertaal: het rekent niets uit.","createdAt":1790244000037,"id":"alg_html"},{"command":"CSS","tab":"algemeen","group":"Web","title":"De opmaak van een webpagina","explanation":"Cascading Style Sheets: bepaalt hoe HTML eruitziet, zoals kleuren, lettertypes, marges en indeling. Bv. p { color: blue; } maakt alle alinea's blauw.","parts":[{"m":"welke elementen (bv. p)","t":"selector"},{"m":"wat (bv. color)","t":"eigenschap"},{"m":"hoe (bv. blue)","t":"waarde"}],"createdAt":1790244000038,"id":"alg_css"},{"command":"JavaScript","tab":"algemeen","group":"Web","title":"Interactie op een webpagina","explanation":"Een programmeertaal die in de browser draait en pagina's laat reageren, bv. op een klik. HTML = structuur, CSS = opmaak, JavaScript = gedrag.","createdAt":1790244000039,"id":"alg_javascript"},{"command":"PHP","tab":"algemeen","group":"Web","title":"Code die op de server draait","explanation":"Een programmeertaal die op de webserver wordt uitgevoerd en HTML maakt voor die naar de browser gaat, bv. om gegevens uit een databank te tonen. De bezoeker ziet enkel het resultaat, niet de PHP-code.","createdAt":1790244000040,"id":"alg_php"},{"command":"Tag, element en attribuut","tab":"algemeen","group":"Web","title":"De bouwstenen van HTML","explanation":"Een tag staat tussen < >, bv. <a>. Een element is de openingstag, de inhoud en de sluittag samen: <a>tekst<\/a>. Een attribuut geeft extra info in de openingstag: <a href=\"pagina.html\">.","parts":[{"m":"openingstag","t":"<a>"},{"m":"sluittag","t":"<\/a>"},{"m":"attribuut","t":"href=\"…\""}],"createdAt":1790244000041,"id":"alg_tag-element-en-attribuut"},{"command":"Browser","tab":"algemeen","group":"Web","title":"Programma dat webpagina's toont","explanation":"Chrome, Firefox, Edge … lezen HTML, CSS en JavaScript en maken er een zichtbare pagina van. Met F12 open je de ontwikkelaarstools om de code van een pagina te bekijken.","createdAt":1790244000042,"id":"alg_browser"},{"command":"Statische en dynamische webpagina","tab":"algemeen","group":"Web","title":"Vaste versus veranderende webpagina","explanation":"Een statische webpagina toont altijd dezelfde inhoud en is gemaakt met HTML (en CSS voor de opmaak). Een dynamische webpagina kan haar inhoud aanpassen, bv. met PHP op de server.","sourceName":"1. Introduction.pptx","slide":4,"createdAt":1790250000408,"id":"les_0409"},{"command":"Self-closing tag","tab":"algemeen","group":"Web","title":"Tag zonder sluitingstag of inhoud","explanation":"De meeste tags hebben een openings- en sluitingstag met inhoud ertussen. Self-closing tags zoals <br>, <hr> en <img> bestaan uit één tag en bevatten geen inhoud.","sourceName":"2. Introduction to HTML.pptx","slide":7,"createdAt":1790250000416,"id":"les_0417"},{"command":"Block-level en inline elementen","tab":"algemeen","group":"Web","title":"Twee soorten elementen in body","explanation":"Een block-level element (bv. <h1>, <p>, <div>) begint op een nieuwe regel en laat niets naast zich op dezelfde regel. Een inline element (bv. <a>, <span>, <code>) laat andere inhoud op dezelfde regel staan.","sourceName":"2. Introduction to HTML.pptx","slide":18,"createdAt":1790250000426,"id":"les_0427"},{"command":"Monospaced lettertype","tab":"algemeen","group":"Web","title":"Letters allemaal even breed","explanation":"In een monospaced lettertype neemt elk teken evenveel ruimte in, zodat tekst netjes uitlijnt. Ideaal voor DNA- of eiwitsequenties; <pre> en <code> gebruiken zo'n lettertype.","sourceName":"2. Introduction to HTML.pptx","slide":23,"createdAt":1790250000431,"id":"les_0432"},{"command":"Witruimte in HTML","tab":"algemeen","group":"Web","title":"Extra spaties worden één spatie","explanation":"De browser toont meerdere spaties, tabs en regeleinden in HTML-code als één spatie. Wil je een nieuwe regel, gebruik dan <br>; wil je alle witruimte behouden, gebruik <pre>.","sourceName":"2. Introduction to HTML.pptx","slide":24,"createdAt":1790250000432,"id":"les_0433"},{"command":"Beeldverhouding (aspect ratio)","tab":"algemeen","group":"Web","title":"Verhouding breedte en hoogte","explanation":"De verhouding tussen de breedte en hoogte van een afbeelding. Pas je beide los van elkaar aan, dan kan de afbeelding vervormen; stel daarom best enkel de breedte of enkel de hoogte in.","sourceName":"2. Introduction to HTML.pptx","slide":39,"createdAt":1790250000448,"id":"les_0449"},{"command":"CSS-regel en declaratie","tab":"algemeen","group":"Web","title":"Onderdelen van CSS-code","explanation":"Een declaratie is een eigenschap met een waarde (bv. color: red;). De eigenschap zegt wat je verandert, de waarde hoe. Een CSS-regel is een selector plus een declaratieblok { … } met één of meer declaraties.","sourceName":"3. Introduction to CSS.pptx","slide":4,"createdAt":1790250000468,"id":"les_0469"},{"command":"Inline, interne en externe CSS","tab":"algemeen","group":"Web","title":"Drie manieren van CSS toepassen","explanation":"Inline CSS staat in het style-attribuut van één element. Interne CSS staat in een <style>-tag in de <head> en geldt voor die ene pagina. Externe CSS staat in een apart .css-bestand dat je met <link> aan meerdere pagina's koppelt.","sourceName":"3. Introduction to CSS.pptx","slide":5,"createdAt":1790250000469,"id":"les_0470"},{"command":"Selector (CSS)","tab":"algemeen","group":"Web","title":"Patroon dat elementen kiest","explanation":"Een selector is het deel van een CSS-regel dat aangeeft op welke HTML-elementen de stijl van toepassing is, bv. op tagnaam (p), id (#naam) of klasse (.naam).","sourceName":"3. Introduction to CSS.pptx","slide":13,"createdAt":1790250000473,"id":"les_0474"},{"command":"Ouder, kind en sibling (elementenboom)","tab":"algemeen","group":"Web","title":"Familierelaties tussen HTML-elementen","explanation":"HTML-elementen zitten in elkaar zoals een stamboom. Een element binnen een ander is een kind (direct kind als er niets tussen zit); het buitenste is de ouder of voorouder. Elementen met dezelfde ouder zijn siblings (broers/zussen). Combinator-selectors gebruiken deze relaties.","sourceName":"3. Introduction to CSS.pptx","slide":25,"createdAt":1790250000481,"id":"les_0482"},{"command":"Pseudo-klasse","tab":"algemeen","group":"Web","title":"Selectie op positie of toestand","explanation":"Een pseudo-klasse is een sleutelwoord met een dubbelepunt achter een selector (bv. :hover, :first-child). Zo geef je een stijl op basis van de positie van een element tussen zijn siblings of van zijn toestand, zoals wanneer de muis erover staat.","sourceName":"3. Introduction to CSS.pptx","slide":31,"createdAt":1790250000484,"id":"les_0485"},{"command":"Shorthand-eigenschap","tab":"algemeen","group":"Web","title":"Meerdere eigenschappen tegelijk instellen","explanation":"Een shorthand-eigenschap stelt in één keer meerdere CSS-eigenschappen in. border zet bijvoorbeeld border-width, border-style en border-color; padding zet padding-top, -right, -bottom en -left.","sourceName":"3. Introduction to CSS.pptx","slide":46,"createdAt":1790250000499,"id":"les_0500"},{"command":"CSS-eenheden (px, %, em, vw, vh)","tab":"algemeen","group":"Web","title":"Eenheden voor maten in CSS","explanation":"px is een vaste maat in pixels. % is relatief t.o.v. het ouder-element, em t.o.v. de lettergrootte (1em = huidige lettergrootte). vw en vh zijn een percentage van de breedte en hoogte van het browservenster (de viewport).","sourceName":"3. Introduction to CSS.pptx","slide":49,"createdAt":1790250000502,"id":"les_0503"},{"command":"Box model","tab":"algemeen","group":"Web","title":"Lagen rond elk element","explanation":"Een element bestaat van binnen naar buiten uit inhoud, padding, rand (border) en marge (margin). Standaard geldt width/height alleen voor de inhoud, zodat padding en rand de totale gro
